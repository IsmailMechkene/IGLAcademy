name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows: the app only ships for Windows, and better-sqlite3 has to be
    # compiled for both Node (tests) and Electron (build) on the same ABI
    # toolchain the release uses.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Drives the built app through real flows (import, playback, subtitles,
      # player panel, dialogs, practice explanations, exam resume across a
      # restart) using bundled fixtures only.
      - run: npm run test:e2e
