<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src deliberately does NOT list media:. Script never reads
         media:// responses: text previews and subtitles come over IPC (see
         the scheme registration in electron/main.ts). Subtitles play from
         blob: URLs, which media-src allows. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data: blob: file: media:; media-src 'self' file: blob: media:; frame-src media:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>IGLAcademy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
