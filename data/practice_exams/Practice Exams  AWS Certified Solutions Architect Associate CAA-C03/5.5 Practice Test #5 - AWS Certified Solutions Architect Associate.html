p><strong>The database user credentials (username and password) configured for the application are incorrect</strong></p>\n\n<p><strong>The database user credentials (username and password) configured for the application do not have the required privilege for the given database</strong></p>\n\n<p>These two options have been added as a distractor since the error mentions a \"connection timeout\" issue rather than an \"access denied\" error.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/rds-cannot-connect/\">https://aws.amazon.com/premiumsupport/knowledge-center/rds-cannot-connect/</a></p>\n","answers":["<p>The security group configuration for the database instance does not have the correct rules to allow inbound connections from the application servers</p>","<p>The database user credentials (username and password) configured for the application are incorrect</p>","<p>The security group configuration for the application servers does not have the correct rules to allow inbound connections from the database instance</p>","<p>The database user credentials (username and password) configured for the application do not have the required privilege for the given database</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"An e-commerce company uses a two-tier architecture with application servers in the public subnet and an Amazon RDS MySQL DB in a private subnet. The development team can use a bastion host in the public subnet to access the MySQL database and run queries from the bastion host. However, end-users are reporting application errors. Upon inspecting application logs, the team notices several \"could not connect to server: connection timed out\" error messages.\n\nWhich of the following options represent the root cause for this issue?","related_lectures":[]},{"_class":"assessment","id":156638717,"assessment_type":"multiple-choice","prompt":{"question":"<p>A multinational logistics company operates its shipment tracking platform from Amazon EC2 instances deployed in the AWS us-west-2 Region. The platform exposes a set of APIs over HTTPS, which are used by logistics partners and customers around the world to retrieve real-time tracking data. The company has observed that users from Europe and Asia experience latency issues and inconsistent API response times when accessing the service. As a cloud architect, you have been tasked to propose the most cost-effective solution to improve performance for these international users without migrating the application.</p>\n\n<p>Which solution should you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure AWS Global Accelerator in front of the existing HTTPS API, create one endpoint group in us-west-2 for the current application endpoint, and use the accelerator’s global edge network to improve performance for users connecting from Europe and Asia</strong></p>\n\n<p>This option is correct because AWS Global Accelerator improves the performance of globally accessed HTTPS applications without requiring the company to migrate or redeploy the existing API in multiple Regions. The shipment tracking platform already runs on Amazon EC2 in us-west-2, so Global Accelerator can be placed in front of that endpoint to provide static anycast IP addresses and route users from Europe and Asia to the nearest AWS edge location, where traffic enters the AWS global network early and then travels over the AWS backbone to us-west-2 with lower latency variation than the public internet. The option is also technically accurate because Global Accelerator endpoint groups are Regional resources, which means the correct design is to create a single endpoint group in us-west-2 for the existing application endpoint rather than separate endpoint groups for user geographies. This makes the solution more suitable than alternatives that depend on cacheable responses or require multi-Region application copies, because it improves global access performance for a real-time API while keeping the architecture simple and cost-effective.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy an Amazon CloudFront distribution in front of the API endpoint and apply the CachingOptimized managed policy to enhance caching behavior and improve content delivery efficiency</strong> - This option is incorrect because Amazon CloudFront is primarily optimized for delivering static or cacheable content, and is not well-suited for APIs that serve highly dynamic or personalized responses, such as those in a shipment tracking system. These APIs typically return user-specific or real-time data that cannot be effectively cached, even with the use of the CachingOptimized managed cache policy. As a result, most requests would result in cache misses, causing CloudFront to forward the traffic to the origin in the us-west-2 Region. This adds an extra network hop and can actually increase latency for international users rather than reduce it. Furthermore, using CloudFront in this scenario adds unnecessary complexity and incurs additional costs without delivering significant performance improvements, making it a suboptimal and non-cost-effective solution for reducing API response times.</p>\n\n<p><strong>Use Amazon Route 53 latency-based routing to direct user requests to a copy of the EC2 API deployed in each major geographic Region</strong> - Latency-based routing works well when application stacks are deployed in multiple Regions. However, this approach involves replicating the EC2-based API infrastructure across multiple Regions, significantly increasing compute, data transfer, and management overhead. This is not the most cost-effective option as requested in the scenario.</p>\n\n<p><strong>Deploy Amazon API Gateway in multiple AWS Regions and synchronize the API definitions. Use AWS Lambda as a proxy to forward requests to the EC2-hosted API in us-west-2</strong> - While deploying API Gateway in multiple Regions might help reduce DNS resolution time and provide regional endpoints, using Lambda to proxy requests back to a central Region introduces additional latency and unnecessary costs. This design offloads little from the original EC2 endpoints and does not leverage edge optimization services like CloudFront or Global Accelerator. Additionally, synchronizing API definitions and handling cross-region Lambda invocation can be complex.\nReference:</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-how-it-works.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/global-accelerator/features/#Use_cases\">https://aws.amazon.com/global-accelerator/features/#Use_cases</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-endpoint-types.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-api-endpoint-types.html</a></p>\n","answers":["<p>Deploy an Amazon CloudFront distribution in front of the API endpoint and apply the CachingOptimized managed policy to enhance caching behavior and improve content delivery efficiency</p>","<p>Configure AWS Global Accelerator in front of the existing HTTPS API, create one endpoint group in us-west-2 for the current application endpoint, and use the accelerator’s global edge network to improve performance for users connecting from Europe and Asia</p>","<p>Deploy Amazon API Gateway in multiple AWS Regions and synchronize the API definitions. Use AWS Lambda as a proxy to forward requests to the EC2-hosted API in us-west-2</p>","<p>Use Amazon Route 53 latency-based routing to direct user requests to a copy of the EC2 API deployed in each major geographic Region</p>"]},"correct_response":["b"],"section":"Design Cost-Optimized Architectures","question_plain":"A multinational logistics company operates its shipment tracking platform from Amazon EC2 instances deployed in the AWS us-west-2 Region. The platform exposes a set of APIs over HTTPS, which are used by logistics partners and customers around the world to retrieve real-time tracking data. The company has observed that users from Europe and Asia experience latency issues and inconsistent API response times when accessing the service. As a cloud architect, you have been tasked to propose the most cost-effective solution to improve performance for these international users without migrating the application.\n\nWhich solution should you recommend?","related_lectures":[]},{"_class":"assessment","id":156638721,"assessment_type":"multiple-choice","prompt":{"question":"<p>A DevOps team is tasked with enabling secure and temporary SSH access to Amazon EC2 instances for developers during deployments. The team wants to avoid distributing long-term SSH key pairs and instead prefers ephemeral access that can be audited and revoked immediately after the session ends. The team wants direct access via the AWS Management Console.</p>\n\n<p>What do you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use EC2 Instance Connect to inject a temporary public key and establish SSH access using the instance’s public IP address</strong></p>\n\n<p>Amazon EC2 Instance Connect provides a secure and auditable way to establish temporary SSH sessions to EC2 instances by injecting a one-time-use public key into the instance at connection time. When used without Session Manager, EC2 Instance Connect requires the instance to have a public IP address, and connections are made over the internet via the public IP. This setup is ideal for temporary administrative access to public instances without the need to distribute or manage long-term SSH key pairs. The session is short-lived, and logs are available via CloudTrail for auditing purposes.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use EC2 Instance Connect to inject a static SSH key and connect via the instance's private IP address directly from the internet</strong> - EC2 Instance Connect does not use static SSH keys and does not support connecting over private IPs from the internet unless paired with AWS Systems Manager Session Manager. This option incorrectly assumes that private IPs are routable from the public internet, which is not the case in VPC networking. Additionally, using a static key contradicts the security design of EC2 Instance Connect, which relies on ephemeral keys to minimize risk.</p>\n\n<p><strong>Use EC2 Instance Connect with Systems Manager Agent disabled, and connect via private IP using an internal proxy endpoint</strong> - EC2 Instance Connect does not support connecting via private IP unless integrated with Session Manager, which requires that the SSM Agent is installed and running on the instance. This option incorrectly states that you can connect via private IP without SSM Agent or Session Manager, which is technically invalid. Instance Connect without Session Manager only supports public IP-based access.</p>\n\n<p><strong>Use an EC2 Instance Connect Endpoint to reach the instances even though they already have public IP addresses, because Instance Connect requires an endpoint for all SSH sessions</strong> - EC2 Instance Connect does not require an EC2 Instance Connect Endpoint when the target instance has a public IPv4 address; in that case you can connect directly over the internet and have a temporary SSH public key injected at connection time. EC2 Instance Connect Endpoints are specifically intended to let you connect to instances in private subnets without public IPs or direct internet connectivity, providing a managed entry point within your VPC. Adding an endpoint for publicly reachable instances adds unnecessary operational overhead and cost, and it misinterprets the feature’s purpose.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-connect-methods.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-connect-methods.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-ec2-instance-connect-endpoint.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/connect-with-ec2-instance-connect-endpoint.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager.html</a></p>\n","answers":["<p>Use EC2 Instance Connect to inject a temporary public key and establish SSH access using the instance’s public IP address</p>","<p>Use EC2 Instance Connect to inject a static SSH key and connect via the instance's private IP address directly from the internet</p>","<p>Use EC2 Instance Connect with Systems Manager Agent disabled, and connect via private IP using an internal proxy endpoint</p>","<p>Use an EC2 Instance Connect Endpoint to reach the instances even though they already have public IP addresses, because Instance Connect requires an endpoint for all SSH sessions</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A DevOps team is tasked with enabling secure and temporary SSH access to Amazon EC2 instances for developers during deployments. The team wants to avoid distributing long-term SSH key pairs and instead prefers ephemeral access that can be audited and revoked immediately after the session ends. The team wants direct access via the AWS Management Console.\n\nWhat do you recommend?","related_lectures":[]},{"_class":"assessment","id":156638723,"assessment_type":"multiple-choice","prompt":{"question":"<p>A streaming service provider collects user experience feedback through embedded feedback forms in their mobile and web apps. Feedback submissions frequently spike to thousands per hour during content launches or service outages. Currently, the feedback is sent via email to the operations team for manual review. The company now wants to automate feedback collection and sentiment analysis so that insights can be generated quickly and stored for a full year for trend analysis.</p>\n\n<p>Which solution provides the most scalable and automated approach to meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Design a RESTful API with Amazon API Gateway that forwards incoming feedback data to an Amazon SQS queue. Set up an AWS Lambda function to process the queue messages, analyze sentiment using Amazon Comprehend, and store results in a DynamoDB table with a 365-day TTL configured on each item</strong></p>\n\n<p>This architecture decouples feedback ingestion from processing by using Amazon SQS as a buffer for potentially high volumes of incoming data. API Gateway handles secure and scalable API access, while Lambda automatically scales to process feedback messages asynchronously. Amazon Comprehend is specifically designed for sentiment analysis on text input. Storing results in DynamoDB offers scalable, low-latency access to structured insights, and Time to Live (TTL) ensures automatic data expiry after one year. This is a serverless, fully managed solution that scales efficiently with bursts and long-term retention.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Route all feedback submissions through Amazon Kinesis Data Streams. Use an AWS Lambda consumer to batch process incoming records, invoke Amazon Translate to detect language and convert input to English, and save the processed content in an Amazon OpenSearch Service index. Configure OpenSearch Index State Management (ISM) policies to delete documents after 12 months</strong> - This option introduces Kinesis Data Streams to handle high-throughput ingestion, which is appropriate for large-scale, real-time data capture. However, the use of Amazon Translate is misaligned with the core requirement, which is sentiment analysis, not language translation. Additionally, storing feedback data in Amazon OpenSearch Service can enable full-text search and visualization, but it adds significant operational overhead, especially for a solution that doesn't require search capabilities. Furthermore, OpenSearch is less cost-effective and scalable for basic structured storage when compared to DynamoDB for this use case.</p>\n\n<p><strong>Use Amazon EventBridge to capture feedback events and forward them to an AWS Step Functions workflow. The workflow invokes Lambda functions for validation, calls Amazon Transcribe to convert the text to audio for archival, and stores the results in an Amazon RDS database. Configure a lifecycle policy to remove records after 12 months</strong> - This option introduces unnecessary complexity and the wrong tools for the job. Amazon Transcribe is used to convert speech to text, not the other way around, and has no benefit in archiving text-based user feedback. Storing the output in Amazon RDS increases management burden and doesn’t scale as well as DynamoDB for high-velocity, write-heavy workloads. Although EventBridge and Step Functions are powerful for orchestrating workflows, this particular implementation misuses services and introduces overhead without delivering meaningful improvements.</p>\n\n<p><strong>Build a web service on Amazon EC2 that receives feedback data and stores each record in a DynamoDB table. Use the EC2 application to invoke Amazon Comprehend for sentiment detection and write results to a second table. Apply a TTL of 365 days to each table</strong> - Although technically functional, this solution uses Amazon EC2 for feedback ingestion and sentiment analysis, which introduces operational overhead, limits scalability, and requires provisioning, patching, and scaling of EC2 instances. This is not a serverless or event-driven architecture, and the use of a second DynamoDB table adds unnecessary complexity. While Amazon Comprehend is correctly applied, the solution lacks elasticity for sudden spikes and isn't the most cost-effective or scalable approach.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html\">https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/TTL.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ism.html\">https://docs.aws.amazon.com/opensearch-service/latest/developerguide/ism.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html\">https://docs.aws.amazon.com/transcribe/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/translate/latest/dg/what-is.html\">https://docs.aws.amazon.com/translate/latest/dg/what-is.html</a></p>\n","answers":["<p>Design a RESTful API with Amazon API Gateway that forwards incoming feedback data to an Amazon SQS queue. Set up an AWS Lambda function to process the queue messages, analyze sentiment using Amazon Comprehend, and store results in a DynamoDB table with a 365-day TTL configured on each item</p>","<p>Build a web service on Amazon EC2 that receives feedback data and stores each record in a DynamoDB table. Use the EC2 application to invoke Amazon Comprehend for sentiment detection and write results to a second table. Apply a TTL of 365 days to each table</p>","<p>Use Amazon EventBridge to capture feedback events and forward them to an AWS Step Functions workflow. The workflow invokes Lambda functions for validation, calls Amazon Transcribe to convert the text to audio for archival, and stores the results in an Amazon RDS database. Configure a lifecycle policy to remove records after 12 months</p>","<p>Route all feedback submissions through Amazon Kinesis Data Streams. Use an AWS Lambda consumer to batch process incoming records, invoke Amazon Translate to detect language and convert input to English, and save the processed content in an Amazon OpenSearch Service index. Configure OpenSearch Index State Management (ISM) policies to delete documents after 12 months</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A streaming service provider collects user experience feedback through embedded feedback forms in their mobile and web apps. Feedback submissions frequently spike to thousands per hour during content launches or service outages. Currently, the feedback is sent via email to the operations team for manual review. The company now wants to automate feedback collection and sentiment analysis so that insights can be generated quickly and stored for a full year for trend analysis.\n\nWhich solution provides the most scalable and automated approach to meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638725,"assessment_type":"multiple-choice","prompt":{"question":"<p>You have built an application that is deployed with Elastic Load Balancing and an Auto Scaling Group. As a Solutions Architect, you have configured aggressive Amazon CloudWatch alarms, making your Auto Scaling Group (ASG) scale in and out very quickly, renewing your fleet of Amazon EC2 instances on a daily basis. A production bug appeared two days ago, but the team is unable to SSH into the instance to debug the issue, because the instance has already been terminated by the Auto Scaling Group. The log files are saved on the Amazon EC2 instance.</p>\n\n<p>How will you resolve the issue and make sure it doesn't happen again?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Install an Amazon CloudWatch Logs agents on the Amazon EC2 instances to send logs to Amazon CloudWatch</strong></p>\n\n<p>You can use the Amazon CloudWatch Logs agent installer on an existing Amazon EC2 instance to install and configure the Amazon CloudWatch Logs agent. After installation is complete, logs automatically flow from the instance to the log stream you create while installing the agent. The agent confirms that it has started and it stays running until you disable it.</p>\n\n<p>Here, the natural and by far the easiest solution would be to use the Amazon CloudWatch Logs agents on the Amazon EC2 instances to automatically send log files into Amazon CloudWatch, so we can analyze them in the future easily should any problem arise.</p>\n\n<p>To control whether an Auto Scaling group can terminate a particular instance when scaling in, use instance scale-in protection. You can enable the instance scale-in protection setting on an Auto Scaling group or on an individual Auto Scaling instance. When the Auto Scaling group launches an instance, it inherits the instance scale-in protection setting of the Auto Scaling group. You can change the instance scale-in protection setting for an Auto Scaling group or an Auto Scaling instance at any time.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Disable the Termination from the Auto Scaling Group any time a user reports an issue</strong> - Disabling the Termination from the Auto Scaling Group would prevent our Auto Scaling Group from being Elastic and impact our costs. Therefore this option is incorrect.</p>\n\n<p><strong>Make a snapshot of the Amazon EC2 instance just before it gets terminated</strong> - Making a snapshot of the Amazon EC2 instance before it gets terminated could work but it's tedious, not elastic and very expensive, since our interest is just the log files. Therefore this option is not the best fit for the given use-case.</p>\n\n<p>You can back up the data on your Amazon EBS volumes to Amazon S3 by taking point-in-time snapshots. Snapshots are incremental backups, which means that only the blocks on the device that have changed after your most recent snapshot are saved. This minimizes the time required to create the snapshot and saves on storage costs by not duplicating data.</p>\n\n<p><strong>Use AWS Lambda to regularly SSH into the Amazon EC2 instances and copy the log files to Amazon S3</strong> - AWS Lambda lets you run code without provisioning or managing servers. It cannot be used for production-grade serverless log analytics. Using AWS Lambda would be extremely hard to use for this task. Therefore this option is not the best fit for the given use-case.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/QuickStartEC2Instance.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/QuickStartEC2Instance.html</a></p>\n","answers":["<p>Install an Amazon CloudWatch Logs agents on the Amazon EC2 instances to send logs to Amazon CloudWatch</p>","<p>Disable the Termination from the Auto Scaling Group any time a user reports an issue</p>","<p>Make a snapshot of the Amazon EC2 instance just before it gets terminated</p>","<p>Use AWS Lambda to regularly SSH into the Amazon EC2 instances and copy the log files to Amazon S3</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"You have built an application that is deployed with Elastic Load Balancing and an Auto Scaling Group. As a Solutions Architect, you have configured aggressive Amazon CloudWatch alarms, making your Auto Scaling Group (ASG) scale in and out very quickly, renewing your fleet of Amazon EC2 instances on a daily basis. A production bug appeared two days ago, but the team is unable to SSH into the instance to debug the issue, because the instance has already been terminated by the Auto Scaling Group. The log files are saved on the Amazon EC2 instance.\n\nHow will you resolve the issue and make sure it doesn't happen again?","related_lectures":[]},{"_class":"assessment","id":156638727,"assessment_type":"multi-select","prompt":{"question":"<p>A digital media company runs its content rendering service on Amazon EC2 instances that are registered with an Application Load Balancer (ALB) using IP-based target groups. The company relies on AWS Systems Manager to manage and patch these instances regularly. According to new compliance requirements, EC2 instances must be safely removed from production traffic during patching to prevent user disruption and maintain application integrity. However, during the most recent patch cycle, the operations team noticed application failures and API timeouts, even though patching succeeded on the instances. You are asked to suggest a reliable and scalable way to ensure safe patching while preserving service availability.</p>\n\n<p>Which solution will best meet the new compliance and operational requirements? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use AWS Systems Manager Automation with the AWSEC2-PatchLoadBalancerInstance document to manage patching</strong></p>\n\n<p>The AWSEC2-PatchLoadBalancerInstance Systems Manager Automation document is specifically designed for patching EC2 instances that are part of a load balancer. It automatically removes the instance from the ALB target group, waits for in-flight requests to complete, applies patches, performs reboots if needed, and then safely re-registers the instance. This workflow prevents application downtime or request failures during patching and ensures compliance with security policies.</p>\n\n<p><strong>Configure Systems Manager Maintenance Windows to coordinate patching and instance removal from the ALB during the defined window</strong></p>\n\n<p>Systems Manager Maintenance Windows can be configured to run Automation documents or Lambda functions at precise times. You can schedule a task to remove instances from the load balancer using pre-defined documents (such as AWSEC2-PatchLoadBalancerInstance) and then re-register them once patching is complete. This offers fine-grained scheduling and orchestration for controlled patching without disrupting traffic.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure a custom Lambda function triggered by an Amazon EventBridge rule that disables the EC2 instance's network interface during the patching window and re-enables it after patching completes</strong> - This is a completely impractical and risky approach. Disabling the instance's network interface during patching would sever communication with AWS Systems Manager, which relies on the SSM Agent and internet/network connectivity to manage the patching workflow. This would likely cause patching failures or leave instances in an inconsistent state. It also introduces custom automation and complexity that is neither secure nor supported by AWS best practices.</p>\n\n<p><strong>Modify the load balancer configuration to attach EC2 instances using instance ID-based target groups instead of IP-based targets, allowing Systems Manager to directly communicate with instance metadata</strong> - Switching from IP-based to instance ID-based targets does not solve the problem related to application failures during patching. The issue lies in how traffic is handled during the patching process—not in the communication between Systems Manager and the instances. Furthermore, IP-based target groups are commonly used when EC2 instances are managed through services like ECS or are deployed in different subnets or VPCs. Changing the target type could introduce compatibility or architectural issues without addressing the root cause.</p>\n\n<p><strong>Use Amazon CloudWatch Logs Insights to monitor patching success and then manually adjust ALB target group registrations before and after each patch window</strong> - While monitoring with CloudWatch Logs Insights can provide visibility into patching status, it does not automate the removal or addition of instances to/from the ALB. Manually adjusting target group registrations is not scalable, prone to human error, and does not align with the goal of automation and compliance. This option lacks operational efficiency and doesn't prevent traffic from reaching instances while they are being patched.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-awsec2-patch-load-balancer-instance.html\">https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-awsec2-patch-load-balancer-instance.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-runbook-reference.html\">https://docs.aws.amazon.com/systems-manager-automation-runbooks/latest/userguide/automation-runbook-reference.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html</a></p>\n","answers":["<p>Configure a custom Lambda function triggered by an Amazon EventBridge rule that disables the EC2 instance's network interface during the patching window and re-enables it after patching completes</p>","<p>Modify the load balancer configuration to attach EC2 instances using instance ID-based target groups instead of IP-based targets, allowing Systems Manager to directly communicate with instance metadata</p>","<p>Use AWS Systems Manager Automation with the AWSEC2-PatchLoadBalancerInstance document to manage patching</p>","<p>Use Amazon CloudWatch Logs Insights to monitor patching success and then manually adjust ALB target group registrations before and after each patch window</p>","<p>Configure Systems Manager Maintenance Windows to coordinate patching and instance removal from the ALB during the defined window</p>"]},"correct_response":["c","e"],"section":"Design Resilient Architectures","question_plain":"A digital media company runs its content rendering service on Amazon EC2 instances that are registered with an Application Load Balancer (ALB) using IP-based target groups. The company relies on AWS Systems Manager to manage and patch these instances regularly. According to new compliance requirements, EC2 instances must be safely removed from production traffic during patching to prevent user disruption and maintain application integrity. However, during the most recent patch cycle, the operations team noticed application failures and API timeouts, even though patching succeeded on the instances. You are asked to suggest a reliable and scalable way to ensure safe patching while preserving service availability.\n\nWhich solution will best meet the new compliance and operational requirements? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638729,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial services company runs its flagship web application on AWS. The application serves thousands of users during peak hours. The company needs a scalable near-real-time solution to share hundreds of thousands of financial transactions with multiple internal applications. The solution should also remove sensitive details from the transactions before storing the cleansed transactions in a document database for low-latency retrieval.</p>\n\n<p>As an AWS Certified Solutions Architect Associate, which of the following would you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Feed the streaming transactions into Amazon Kinesis Data Streams. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Stream</strong></p>\n\n<p>You can use Amazon Kinesis Data Streams to build custom applications that process or analyze streaming data for specialized needs.\nAmazon Kinesis Data Streams manages the infrastructure, storage, networking, and configuration needed to stream your data at the level of your data throughput. You don't have to worry about provisioning, deployment, or ongoing maintenance of hardware, software, or other services for your data streams.</p>\n\n<p>How Amazon Kinesis Data Streams Work:\n<img src=\"https://d1.awsstatic.com/Digital%20Marketing/House/1up/products/kinesis/Product-Page-Diagram_Amazon-Kinesis-Data-Streams.e04132af59c6aa1e9372cabf44a17749f4a81b16.png\">\nvia - <a href=\"https://aws.amazon.com/kinesis/data-streams/\">https://aws.amazon.com/kinesis/data-streams/</a></p>\n\n<p>Amazon Kinesis Data Streams Key Concepts:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q35-i1.jpg\">\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q35-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html\">https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html</a></p>\n\n<p>For the given use case, you can stream the raw financial transactions into Amazon Kinesis Data Streams, which in turn, are processed by the AWS Lambda function that is set up as one of the consumers of the data stream. The Lambda would remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can be configured as the other consumers of the data stream and ingest the raw transactions</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Batch process the raw transactions data into Amazon S3 flat files. Use S3 events to trigger an AWS Lambda function to remove sensitive data from the raw transactions in the flat file and then store the cleansed transactions in Amazon DynamoDB. Leverage DynamoDB Streams to share the transactions data with the internal applications</strong>- The use case requires a near-real-time solution for cleansing, processing and storing the transactions, so using a batch process would be incorrect.</p>\n\n<p><strong>Feed the streaming transactions into Amazon Kinesis Data Firehose. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Firehose</strong> - Amazon Kinesis Data Firehose is an extract, transform, and load (ETL) service that reliably captures, transforms, and delivers streaming data to data lakes, data stores, and analytics services.</p>\n\n<p><img src=\"https://d1.awsstatic.com/pdp-how-it-works-assets/product-page-diagram_Amazon-KDF_HIW-V2-Updated-Diagram@2x.6e531854393eabf782f5a6d6d3b63f2e74de0db4.png\">\nvia - <a href=\"https://aws.amazon.com/kinesis/data-firehose/\">https://aws.amazon.com/kinesis/data-firehose/</a></p>\n\n<p>You cannot set up multiple consumers for Amazon Kinesis Data Firehose delivery streams as it can dump data in a single data repository at a time, so this option is incorrect.</p>\n\n<p><strong>Persist the raw transactions into Amazon DynamoDB. Configure a rule in Amazon DynamoDB to update the transaction by removing sensitive data whenever any new raw transaction is written. Leverage Amazon DynamoDB Streams to share the transactions data with the internal applications</strong> - There is no such rule within Amazon DynamoDB that can auto-update every time a new item is written in a DynamoDB table. You would need to use a Amazon DynamoDB trigger to invoke an external service like a Lambda function on every new write, which can then cleanse and update the item. In addition, this process introduces inefficiency in the workflow as the same item is written and then updated for cleansing purposes. Therefore this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/kinesis/data-streams/\">https://aws.amazon.com/kinesis/data-streams/</a></p>\n\n<p><a href=\"https://aws.amazon.com/kinesis/data-firehose/\">https://aws.amazon.com/kinesis/data-firehose/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html\">https://docs.aws.amazon.com/streams/latest/dev/key-concepts.html</a></p>\n","answers":["<p>Batch process the raw transactions data into Amazon S3 flat files. Use S3 events to trigger an AWS Lambda function to remove sensitive data from the raw transactions in the flat file and then store the cleansed transactions in Amazon DynamoDB. Leverage DynamoDB Streams to share the transactions data with the internal applications</p>","<p>Feed the streaming transactions into Amazon Kinesis Data Streams. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Stream</p>","<p>Feed the streaming transactions into Amazon Kinesis Data Firehose. Leverage AWS Lambda integration to remove sensitive data from every transaction and then store the cleansed transactions in Amazon DynamoDB. The internal applications can consume the raw transactions off the Amazon Kinesis Data Firehose</p>","<p>Persist the raw transactions into Amazon DynamoDB. Configure a rule in Amazon DynamoDB to update the transaction by removing sensitive data whenever any new raw transaction is written. Leverage Amazon DynamoDB Streams to share the transactions data with the internal applications</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"A financial services company runs its flagship web application on AWS. The application serves thousands of users during peak hours. The company needs a scalable near-real-time solution to share hundreds of thousands of financial transactions with multiple internal applications. The solution should also remove sensitive details from the transactions before storing the cleansed transactions in a document database for low-latency retrieval.\n\nAs an AWS Certified Solutions Architect Associate, which of the following would you recommend?","related_lectures":[]},{"_class":"assessment","id":156638731,"assessment_type":"multiple-choice","prompt":{"question":"<p>A healthcare startup runs a lightweight reporting application on a single Amazon EC2 On-Demand instance. The application is designed to be stateless, fault-tolerant, and optimized for fast rendering of analytics dashboards. During major health events or news cycles, the team observes latency issues and occasional 5xx errors due to traffic spikes. To meet growing demand without over-provisioning resources during off-peak hours, the company wants to implement a cost-effective, scalable solution that ensures consistent performance even under unpredictable load.</p>\n\n<p>Which approach best meets the requirements while minimizing costs?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Build an Amazon Machine Image (AMI) from the existing EC2 instance and configure a launch template. Create an Auto Scaling group using the launch template with Spot Instance pricing enabled. Attach an Application Load Balancer to distribute traffic across dynamically launched instances</strong></p>\n\n<p>This approach leverages EC2 Auto Scaling to automatically scale the number of instances based on demand while using Spot Instances to minimize compute costs. The application’s stateless design is ideal for this setup. The Application Load Balancer distributes traffic across healthy instances. Using a launch template with an AMI ensures consistency across instances. This solution balances scalability with cost efficiency and aligns with AWS best practices for elastic, stateless workloads.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q36-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/which-fleet-method-to-use.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/which-fleet-method-to-use.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Clone the EC2 instance using an AMI and launch a second On-Demand instance. Register both instances with an Application Load Balancer to distribute incoming traffic evenly</strong> - While this setup provides basic load distribution and supports horizontal scaling, using multiple On-Demand instances significantly increases operational costs, especially if the application only experiences brief traffic bursts. This design lacks elasticity and automation—instances run continuously even during idle periods. It's functional but not cost-effective compared to using Auto Scaling and Spot Instances.</p>\n\n<p><strong>Configure an Amazon EventBridge rule to monitor system-level metrics from the EC2 instance. Trigger a Lambda function to re-deploy the application in a different Availability Zone when CPU utilization exceeds 70%</strong> - Although EventBridge can be used to respond to metrics, re-deploying the application to another Availability Zone in response to high CPU usage does not address scalability. This approach is reactive and inefficient, and it assumes a single-instance architecture. It also doesn't eliminate the source of the 5xx errors, which stem from overload—not instance location. Furthermore, there's no load balancing or auto-scaling involved.</p>\n\n<p><strong>Containerize the application using Amazon ECS with Fargate launch type. Deploy the container to a single Fargate task and set a CloudWatch alarm to increase memory and CPU allocation dynamically based on load</strong> - While Amazon ECS with Fargate offers a serverless way to run containers without managing infrastructure, this approach is not inherently scalable when only one task is deployed. Even with increased CPU and memory allocation triggered by a CloudWatch alarm, a single Fargate task will still remain a bottleneck under heavy load. ECS services are designed to scale horizontally by adding more tasks, not by resizing a single task. Additionally, there is no load balancing mechanism included in this setup, and it doesn’t address traffic distribution or redundancy. This configuration underutilizes the scalable nature of ECS and fails to deliver the needed elasticity.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/launch-template-spot-instances.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/launch-template-spot-instances.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/which-fleet-method-to-use.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/which-fleet-method-to-use.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-instances-from-launch-template.html#launch-templates-spot-fleet\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/launch-instances-from-launch-template.html#launch-templates-spot-fleet</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html</a></p>\n","answers":["<p>Clone the EC2 instance using an AMI and launch a second On-Demand instance. Register both instances with an Application Load Balancer to distribute incoming traffic evenly</p>","<p>Configure an Amazon EventBridge rule to monitor system-level metrics from the EC2 instance. Trigger a Lambda function to re-deploy the application in a different Availability Zone when CPU utilization exceeds 70%</p>","<p>Build an Amazon Machine Image (AMI) from the existing EC2 instance and configure a launch template. Create an Auto Scaling group using the launch template with Spot Instance pricing enabled. Attach an Application Load Balancer to distribute traffic across dynamically launched instances</p>","<p>Containerize the application using Amazon ECS with Fargate launch type. Deploy the container to a single Fargate task and set a CloudWatch alarm to increase memory and CPU allocation dynamically based on load</p>"]},"correct_response":["c"],"section":"Design Resilient Architectures","question_plain":"A healthcare startup runs a lightweight reporting application on a single Amazon EC2 On-Demand instance. The application is designed to be stateless, fault-tolerant, and optimized for fast rendering of analytics dashboards. During major health events or news cycles, the team observes latency issues and occasional 5xx errors due to traffic spikes. To meet growing demand without over-provisioning resources during off-peak hours, the company wants to implement a cost-effective, scalable solution that ensures consistent performance even under unpredictable load.\n\nWhich approach best meets the requirements while minimizing costs?","related_lectures":[]},{"_class":"assessment","id":156638733,"assessment_type":"multiple-choice","prompt":{"question":"<p>A Customer relationship management (CRM) application is facing user experience issues with users reporting frequent sign-in requests from the application. The application is currently hosted on multiple Amazon EC2 instances behind an Application Load Balancer. The engineering team has identified the root cause as unhealthy servers causing session data to be lost. The team would like to implement a distributed in-memory cache-based session management solution.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon Elasticache for distributed in-memory cache based session management</strong></p>\n\n<p>Amazon ElastiCache can be used as a distributed in-memory cache for session management. Amazon ElastiCache allows you to seamlessly set up, run, and scale popular open-Source compatible in-memory data stores in the cloud. Session stores can be set up using both Memcached or Redis for ElastiCache.</p>\n\n<p>Amazon ElastiCache for Redis is a great choice for real-time transactional and analytical processing use cases such as caching, chat/messaging, gaming leaderboards, geospatial, machine learning, media streaming, queues, real-time analytics, and session store.</p>\n\n<p>Amazon ElastiCache for Memcached is a Memcached-compatible in-memory key-value store service that can be used as a cache or a data store. Session stores are easy to create with Amazon ElastiCache for Memcached.</p>\n\n<p>How Amazon ElastiCache Works:\n<img src=\"https://d1.awsstatic.com/elasticache/EC_Use_Cases/product-page-diagram_ElastiCache_how-it-works.ec509f8b878f549b7fb8a49669bf2547878303f6.png\">\nvia - <a href=\"https://aws.amazon.com/elasticache/\">https://aws.amazon.com/elasticache/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon RDS for distributed in-memory cache based session management</strong> - Amazon Relational Database Service (Amazon RDS) makes it easy to set up, operate, and scale a relational database in the cloud. It cannot be used as a distributed in-memory cache for session management, hence this option is incorrect.</p>\n\n<p><strong>Use Amazon DynamoDB for distributed in-memory cache based session management</strong> - Amazon DynamoDB is a key-value and document database that delivers single-digit millisecond performance at any scale. Amazon DynamoDB is a NoSQL database and is not the right fit for a distributed in-memory cache-based session management solution.</p>\n\n<p><strong>Use Application Load Balancer sticky sessions</strong> - Although sticky sessions enable each user to interact with one server and one server only, however, in case of an unhealthy server, all the session data is gone as well. Therefore Amazon Elasticache powered distributed in-memory cache-based session management is a better solution.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/getting-started/hands-on/building-fast-session-caching-with-amazon-elasticache-for-redis/\">https://aws.amazon.com/getting-started/hands-on/building-fast-session-caching-with-amazon-elasticache-for-redis/</a></p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/\">https://aws.amazon.com/elasticache/</a></p>\n","answers":["<p>Use Amazon RDS for distributed in-memory cache based session management</p>","<p>Use Amazon Elasticache for distributed in-memory cache based session management</p>","<p>Use Application Load Balancer sticky sessions</p>","<p>Use Amazon DynamoDB for distributed in-memory cache based session management</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"A Customer relationship management (CRM) application is facing user experience issues with users reporting frequent sign-in requests from the application. The application is currently hosted on multiple Amazon EC2 instances behind an Application Load Balancer. The engineering team has identified the root cause as unhealthy servers causing session data to be lost. The team would like to implement a distributed in-memory cache-based session management solution.\n\nAs a solutions architect, which of the following solutions would you recommend?","related_lectures":[]},{"_class":"assessment","id":156638735,"assessment_type":"multiple-choice","prompt":{"question":"<p>A big data analytics company is using Amazon Kinesis Data Streams (KDS) to process IoT data from the field devices of an agricultural sciences company. Multiple consumer applications are using the incoming data streams and the engineers have noticed a performance lag for the data delivery speed between producers and consumers of the data streams.</p>\n\n<p>As a solutions architect, which of the following would you recommend for improving the performance for the given use-case?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Enhanced Fanout feature of Amazon Kinesis Data Streams</strong></p>\n\n<p>Amazon Kinesis Data Streams (KDS) is a massively scalable and durable real-time data streaming service. KDS can continuously capture gigabytes of data per second from hundreds of thousands of sources such as website clickstreams, database event streams, financial transactions, social media feeds, IT logs, and location-tracking events.</p>\n\n<p>By default, the 2MB/second/shard output is shared between all of the applications consuming data from the stream. You should use enhanced fan-out if you have multiple consumers retrieving data from a stream in parallel. With enhanced fan-out developers can register stream consumers to use enhanced fan-out and receive their own 2MB/second pipe of read throughput per shard, and this throughput automatically scales with the number of shards in a stream.</p>\n\n<p>Amazon Kinesis Data Streams Fanout:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q38-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/aws/kds-enhanced-fanout/\">https://aws.amazon.com/blogs/aws/kds-enhanced-fanout/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Swap out Amazon Kinesis Data Streams with Amazon Kinesis Data Firehose</strong> -  Amazon Kinesis Data Firehose is the easiest way to reliably load streaming data into data lakes, data stores, and analytics tools. It is a fully managed service that automatically scales to match the throughput of your data and requires no ongoing administration. It can also batch, compress, transform, and encrypt the data before loading it, minimizing the amount of storage used at the destination and increasing security. Amazon Kinesis Data Firehose can only write to Amazon S3, Amazon Redshift, Amazon Elasticsearch or Splunk. You can't have applications consuming data streams from Amazon Kinesis Data Firehose, that's the job of Amazon Kinesis Data Streams. Therefore this option is not correct.</p>\n\n<p><strong>Swap out Amazon Kinesis Data Streams with Amazon SQS Standard queues</strong></p>\n\n<p><strong>Swap out Amazon Kinesis Data Streams with Amazon SQS FIFO queues</strong></p>\n\n<p>Amazon Simple Queue Service (Amazon SQS) is a fully managed message queuing service that enables you to decouple and scale microservices, distributed systems, and serverless applications. Amazon SQS offers two types of message queues. Standard queues offer maximum throughput, best-effort ordering, and at-least-once delivery. Amazon SQS FIFO queues are designed to guarantee that messages are processed exactly once, in the exact order that they are sent. As multiple applications are consuming the same stream concurrently, both Amazon SQS Standard and Amazon SQS FIFO are not the right fit for the given use-case.</p>\n\n<p>Exam Alert:</p>\n\n<p>Please understand the differences between the capabilities of Amazon Kinesis Data Streams vs Amazon SQS, as you may be asked scenario-based questions on this topic in the exam.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q38-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/kinesis/data-streams/faqs/\">https://aws.amazon.com/kinesis/data-streams/faqs/</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/kds-enhanced-fanout/\">https://aws.amazon.com/blogs/aws/kds-enhanced-fanout/</a></p>\n\n<p><a href=\"https://aws.amazon.com/kinesis/data-streams/faqs/\">https://aws.amazon.com/kinesis/data-streams/faqs/</a></p>\n","answers":["<p>Swap out Amazon Kinesis Data Streams with Amazon SQS Standard queues</p>","<p>Swap out Amazon Kinesis Data Streams with Amazon SQS FIFO queues</p>","<p>Use Enhanced Fanout feature of Amazon Kinesis Data Streams</p>","<p>Swap out Amazon Kinesis Data Streams with Amazon Kinesis Data Firehose</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A big data analytics company is using Amazon Kinesis Data Streams (KDS) to process IoT data from the field devices of an agricultural sciences company. Multiple consumer applications are using the incoming data streams and the engineers have noticed a performance lag for the data delivery speed between producers and consumers of the data streams.\n\nAs a solutions architect, which of the following would you recommend for improving the performance for the given use-case?","related_lectures":[]},{"_class":"assessment","id":156638737,"assessment_type":"multiple-choice","prompt":{"question":"<p>A silicon valley based healthcare startup uses AWS Cloud for its IT infrastructure. The startup stores patient health records on Amazon Simple Storage Service (Amazon S3). The engineering team needs to implement an archival solution based on Amazon S3 Glacier to enforce regulatory and compliance controls on data access.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon S3 Glacier vault to store the sensitive archived data and then use a vault lock policy to enforce compliance controls</strong></p>\n\n<p>Amazon S3 Glacier is a secure, durable, and extremely low-cost Amazon S3 cloud storage class for data archiving and long-term backup. It is designed to deliver 99.999999999% durability, and provide comprehensive security and compliance capabilities that can help meet even the most stringent regulatory requirements.</p>\n\n<p>An Amazon S3 Glacier vault is a container for storing archives. When you create a vault, you specify a vault name and the AWS Region in which you want to create the vault. Amazon S3 Glacier Vault Lock allows you to easily deploy and enforce compliance controls for individual Amazon S3 Glacier vaults with a vault lock policy. You can specify controls such as “write once read many” (WORM) in a vault lock policy and lock the policy from future edits. Therefore, this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 lifecycle policy to enforce compliance controls</strong> - You can use lifecycle policy to define actions you want Amazon S3 to take during an object's lifetime. For example, use a lifecycle policy to transition objects to another storage class, archive them, or delete them after a specified period. It cannot be used to enforce compliance controls. Therefore, this option is incorrect.</p>\n\n<p><strong>Use Amazon S3 Glacier vault to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls</strong>- Amazon S3 access control lists (ACLs) enable you to manage access to buckets and objects. It cannot be used to enforce compliance controls. Therefore, this option is incorrect.</p>\n\n<p><strong>Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls</strong> - Amazon S3 access control lists (ACLs) enable you to manage access to buckets and objects. It cannot be used to enforce compliance controls. Therefore, this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazonglacier/latest/dev/working-with-vaults.html\">https://docs.aws.amazon.com/amazonglacier/latest/dev/working-with-vaults.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazonglacier/latest/dev/vault-lock.html\">https://docs.aws.amazon.com/amazonglacier/latest/dev/vault-lock.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/user-guide/create-lifecycle.html\">https://docs.aws.amazon.com/AmazonS3/latest/user-guide/create-lifecycle.html</a></p>\n","answers":["<p>Use Amazon S3 Glacier vault to store the sensitive archived data and then use a vault lock policy to enforce compliance controls</p>","<p>Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 lifecycle policy to enforce compliance controls</p>","<p>Use Amazon S3 Glacier vault to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls</p>","<p>Use Amazon S3 Glacier to store the sensitive archived data and then use an Amazon S3 Access Control List to enforce compliance controls</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A silicon valley based healthcare startup uses AWS Cloud for its IT infrastructure. The startup stores patient health records on Amazon Simple Storage Service (Amazon S3). The engineering team needs to implement an archival solution based on Amazon S3 Glacier to enforce regulatory and compliance controls on data access.\n\nAs a solutions architect, which of the following solutions would you recommend?","related_lectures":[]},{"_class":"assessment","id":156638739,"assessment_type":"multi-select","prompt":{"question":"<p>A pharmaceutical company is considering moving to AWS Cloud to accelerate the research and development process. Most of the daily workflows would be centered around running batch jobs on Amazon EC2 instances with storage on Amazon Elastic Block Store (Amazon EBS) volumes. The CTO is concerned about meeting HIPAA compliance norms for sensitive data stored on Amazon EBS.</p>\n\n<p>Which of the following options outline the correct capabilities of an encrypted Amazon EBS volume? (Select three)</p>\n","relatedLectureIds":"","feedbacks":["","","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Data at rest inside the volume is encrypted</strong></p>\n\n<p><strong>Any snapshot created from the volume is encrypted</strong></p>\n\n<p><strong>Data moving between the volume and the instance is encrypted</strong></p>\n\n<p>Amazon Elastic Block Store (Amazon EBS) provides block-level storage volumes for use with Amazon EC2 instances. When you create an encrypted Amazon EBS volume and attach it to a supported instance type, data stored at rest on the volume, data moving between the volume and the instance, snapshots created from the volume and volumes created from those snapshots are all encrypted. It uses AWS Key Management Service (AWS KMS) customer master keys (CMK) when creating encrypted volumes and snapshots. Encryption operations occur on the servers that host Amazon EC2 instances, ensuring the security of both data-at-rest and data-in-transit between an instance and its attached Amazon EBS storage.</p>\n\n<p>Therefore, the incorrect options are:</p>\n\n<p><strong>Data moving between the volume and the instance is NOT encrypted</strong></p>\n\n<p><strong>Any snapshot created from the volume is NOT encrypted</strong></p>\n\n<p><strong>Data at rest inside the volume is NOT encrypted</strong></p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/EBSEncryption.html</a></p>\n","answers":["<p>Data at rest inside the volume is encrypted</p>","<p>Data moving between the volume and the instance is NOT encrypted</p>","<p>Any snapshot created from the volume is encrypted</p>","<p>Any snapshot created from the volume is NOT encrypted</p>","<p>Data moving between the volume and the instance is encrypted</p>","<p>Data at rest inside the volume is NOT encrypted</p>"]},"correct_response":["a","c","e"],"section":"Design Secure Architectures","question_plain":"A pharmaceutical company is considering moving to AWS Cloud to accelerate the research and development process. Most of the daily workflows would be centered around running batch jobs on Amazon EC2 instances with storage on Amazon Elastic Block Store (Amazon EBS) volumes. The CTO is concerned about meeting HIPAA compliance norms for sensitive data stored on Amazon EBS.\n\nWhich of the following options outline the correct capabilities of an encrypted Amazon EBS volume? (Select three)","related_lectures":[]},{"_class":"assessment","id":156638741,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail company wants to establish encrypted network connectivity between its on-premises data center and AWS Cloud. The company wants to get the solution up and running in the fastest possible time and it should also support encryption in transit.</p>\n\n<p>As a solutions architect, which of the following solutions would you suggest to the company?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Site-to-Site VPN to establish encrypted network connectivity between the on-premises data center and AWS Cloud</strong></p>\n\n<p>AWS Site-to-Site VPN enables you to securely connect your on-premises network or branch office site to your Amazon Virtual Private Cloud (Amazon VPC). You can securely extend your data center or branch office network to the cloud with an AWS Site-to-Site VPN connection. A VPC VPN Connection utilizes IPSec to establish encrypted network connectivity between your on-premises network and Amazon VPC over the Internet. IPsec is a protocol suite for securing IP communications by authenticating and encrypting each IP packet in a data stream.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Direct Connect to establish encrypted network connectivity between the on-premises data center and AWS Cloud</strong> - AWS Direct Connect lets you establish a dedicated network connection between your network and one of the AWS Direct Connect locations. Using industry-standard 802.1q VLANs, this dedicated connection can be partitioned into multiple virtual interfaces. AWS Direct Connect does not encrypt your traffic that is in transit. To encrypt the data in transit that traverses AWS Direct Connect, you must use the transit encryption options for that service. As AWS Direct Connect does not support encrypted network connectivity between an on-premises data center and AWS Cloud, therefore this option is incorrect.</p>\n\n<p><strong>Use AWS Data Sync to establish encrypted network connectivity between the on-premises data center and AWS Cloud</strong> - AWS DataSync makes it simple and fast to move large amounts of data online between on-premises storage and AWS. AWS DataSync eliminates or automatically handles many of these tasks, including scripting copy jobs, scheduling, and monitoring transfers, validating data, and optimizing network utilization. As AWS Data Sync cannot be used to establish network connectivity between an on-premises data center and AWS Cloud, therefore this option is incorrect.</p>\n\n<p><strong>Use AWS Secrets Manager to establish encrypted network connectivity between the on-premises data center and AWS Cloud</strong> - AWS Secrets Manager helps you protect secrets needed to access your applications, services, and IT resources. The service enables you to easily rotate, manage, and retrieve database credentials, API keys, and other secrets throughout their lifecycle. As AWS Secrets Manager cannot be used to establish network connectivity between an on-premises data center and AWS Cloud, therefore this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/internetwork-traffic-privacy.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/internetwork-traffic-privacy.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html\">https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html</a></p>\n","answers":["<p>Use AWS Direct Connect to establish encrypted network connectivity between the on-premises data center and AWS Cloud</p>","<p>Use AWS Data Sync to establish encrypted network connectivity between the on-premises data center and AWS Cloud</p>","<p>Use AWS Secrets Manager to establish encrypted network connectivity between the on-premises data center and AWS Cloud</p>","<p>Use AWS Site-to-Site VPN to establish encrypted network connectivity between the on-premises data center and AWS Cloud</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A retail company wants to establish encrypted network connectivity between its on-premises data center and AWS Cloud. The company wants to get the solution up and running in the fastest possible time and it should also support encryption in transit.\n\nAs a solutions architect, which of the following solutions would you suggest to the company?","related_lectures":[]},{"_class":"assessment","id":156638743,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at a retail company manages 3 Amazon EC2 instances that make read-heavy database requests to the Amazon RDS for the PostgreSQL database instance. As an AWS Certified Solutions Architect - Associate, you have been tasked to make the database instance resilient from a disaster recovery perspective.</p>\n\n<p>Which of the following features will help you in disaster recovery of the database? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use cross-Region Read Replicas</strong></p>\n\n<p>In addition to using Read Replicas to reduce the load on your source database instance, you can also use Read Replicas to implement a DR solution for your production DB environment. If the source DB instance fails, you can promote your Read Replica to a standalone source server. Read Replicas can also be created in a different Region than the source database. Using a cross-Region Read Replica can help ensure that you get back up and running if you experience a regional availability issue.</p>\n\n<p><strong>Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups across multiple Regions</strong></p>\n\n<p>Amazon RDS provides high availability and failover support for database instances using Multi-AZ deployments. Amazon RDS uses several different technologies to provide failover support. Multi-AZ deployments for MariaDB, MySQL, Oracle, and PostgreSQL DB instances use Amazon's failover technology.</p>\n\n<p>The automated backup feature of Amazon RDS enables point-in-time recovery for your database instance. Amazon RDS will back up your database and transaction logs and store both for a user-specified retention period. If it’s a Multi-AZ configuration, backups occur on standby to reduce the I/O impact on the primary. Amazon RDS supports Cross-Region Automated Backups. Manual snapshots and Read Replicas are also supported across multiple Regions.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups in a single AWS Region</strong> - This is an incorrect statement. Automated backups can be created across AWS Regions.</p>\n\n<p><strong>Use Amazon RDS Provisioned IOPS (SSD) Storage in place of General Purpose (SSD) Storage</strong> - Amazon RDS Provisioned IOPS Storage is an SSD-backed storage option designed to deliver fast, predictable, and consistent I/O performance. This storage type enhances the performance of the RDS database, but this isn't a disaster recovery option.</p>\n\n<p><strong>Use the database cloning feature of the Amazon RDS Database cluster</strong> - This option has been added as a distractor. Database cloning is only available for Amazon Aurora and not for Amazon RDS.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/\">https://aws.amazon.com/rds/features/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/database/implementing-a-disaster-recovery-strategy-with-amazon-rds/\">https://aws.amazon.com/blogs/database/implementing-a-disaster-recovery-strategy-with-amazon-rds/</a></p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/whats-new/2021/07/amazon-rds-cross-region-automated-backups-regional-expansion/\">https://aws.amazon.com/about-aws/whats-new/2021/07/amazon-rds-cross-region-automated-backups-regional-expansion/</a></p>\n","answers":["<p>Use cross-Region Read Replicas</p>","<p>Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups across multiple Regions</p>","<p>Use Amazon RDS Provisioned IOPS (SSD) Storage in place of General Purpose (SSD) Storage</p>","<p>Enable the automated backup feature of Amazon RDS in a multi-AZ deployment that creates backups in a single AWS Region</p>","<p>Use the database cloning feature of the Amazon RDS Database cluster</p>"]},"correct_response":["a","b"],"section":"Design Resilient Architectures","question_plain":"The engineering team at a retail company manages 3 Amazon EC2 instances that make read-heavy database requests to the Amazon RDS for the PostgreSQL database instance. As an AWS Certified Solutions Architect - Associate, you have been tasked to make the database instance resilient from a disaster recovery perspective.\n\nWhich of the following features will help you in disaster recovery of the database? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638747,"assessment_type":"multiple-choice","prompt":{"question":"<p>Computer vision researchers at a university are trying to optimize the I/O bound processes for a proprietary algorithm running on Amazon EC2 instances. The ideal storage would facilitate high-performance IOPS when doing file processing in a temporary storage space before uploading the results back into Amazon S3.</p>\n\n<p>As a solutions architect, which of the following AWS storage options would you recommend as the MOST performant as well as cost-optimal?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon EC2 instances with Instance Store as the storage option</strong></p>\n\n<p>An instance store provides temporary block-level storage for your instance. This storage is located on disks that are physically attached to the host computer. Instance store is ideal for the temporary storage of information that changes frequently, such as buffers, caches, scratch data, and other temporary content, or for data that is replicated across a fleet of instances, such as a load-balanced pool of web servers. Some instance types use NVMe or SATA-based solid-state drives (SSD) to deliver high random I/O performance. This is a good option when you need storage with very low latency, but you don't need the data to persist when the instance terminates or you can take advantage of fault-tolerant architectures.</p>\n\n<p>As Instance Store delivers high random I/O performance, it can act as a temporary storage space, and these volumes are included as part of the instance's usage cost, therefore this is the correct option.</p>\n\n<p>Amazon EC2 Instance Store:\n<img src=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/images/instance_storage.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon EC2 instances with Amazon EBS General Purpose SSD (gp2) as the storage option</strong> - General Purpose SSD (gp2) volumes offer cost-effective storage that is ideal for a broad range of workloads. These volumes deliver single-digit millisecond latencies and the ability to burst to 3,000 IOPS for extended periods. Between a minimum of 100 IOPS (at 33.33 GiB and below) and a maximum of 16,000 IOPS (at 5,334 GiB and above), baseline performance scales linearly at 3 IOPS per GiB of volume size. AWS designs gp2 volumes to deliver its provisioned performance 99% of the time. A gp2 volume can range in size from 1 GiB to 16 TiB.\nAmazon EBS gp2 is persistent storage and costlier than Instance Stores (the cost of the storage volume is in addition to that of the Amazon EC2 instance), therefore this option is not correct.</p>\n\n<p><strong>Use Amazon EC2 instances with Amazon EBS Provisioned IOPS SSD (io1) as the storage option</strong> - Provisioned IOPS SSD (io1) volumes are designed to meet the needs of I/O-intensive workloads, particularly database workloads, that are sensitive to storage performance and consistency. Unlike gp2, which uses a bucket and credit model to calculate performance, an io1 volume allows you to specify a consistent IOPS rate when you create the volume, and Amazon EBS delivers the provisioned performance 99.9 percent of the time.\nAmazon EBS io1 is persistent storage and costlier than Instance Stores (the cost of the storage volume is in addition to that of the Amazon EC2 instance), therefore this option is not correct.</p>\n\n<p><strong>Use Amazon EC2 instances with Amazon EBS Throughput Optimized HDD (st1) as the storage option</strong> - Throughput Optimized HDD (st1) are low-cost HDD volumes designed for frequently accessed, throughput-intensive workloads such as Big data and Data warehouses. Amazon EBS st1 is persistent storage and costlier than Instance Stores (the cost of the storage volume is in addition to that of the Amazon EC2 instance), therefore this option is not correct.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n","answers":["<p>Use Amazon EC2 instances with Instance Store as the storage option</p>","<p>Use Amazon EC2 instances with Amazon EBS General Purpose SSD (gp2) as the storage option</p>","<p>Use Amazon EC2 instances with Amazon EBS Provisioned IOPS SSD (io1) as the storage option</p>","<p>Use Amazon EC2 instances with Amazon EBS Throughput Optimized HDD (st1) as the storage option</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"Computer vision researchers at a university are trying to optimize the I/O bound processes for a proprietary algorithm running on Amazon EC2 instances. The ideal storage would facilitate high-performance IOPS when doing file processing in a temporary storage space before uploading the results back into Amazon S3.\n\nAs a solutions architect, which of the following AWS storage options would you recommend as the MOST performant as well as cost-optimal?","related_lectures":[]},{"_class":"assessment","id":156638773,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce company uses Amazon Simple Queue Service (Amazon SQS) queues to decouple their application architecture. The engineering team has observed message processing failures for some customer orders.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend for handling such message failures?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use a dead-letter queue to handle message processing failures</strong></p>\n\n<p>Dead-letter queues can be used by other queues (source queues) as a target for messages that can't be processed (consumed) successfully. Dead-lette
