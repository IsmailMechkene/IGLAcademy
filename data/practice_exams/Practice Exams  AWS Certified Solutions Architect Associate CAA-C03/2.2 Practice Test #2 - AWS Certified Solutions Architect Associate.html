ch also has longer setup and initialization times and typically requires more configuration and compute environment management. Using EC2-based compute environments increases operational overhead.</p>\n\n<p><strong>Create a container image for each script. Use AWS Step Functions to define a workflow for all scheduled tasks. Use a Wait state to delay execution and run tasks using Step Functions’ RunTask integration with ECS Fargate</strong> - AWS Step Functions can schedule tasks using Wait states, but this approach introduces unnecessary orchestration complexity for simple cron workloads. Step Functions are best suited for multi-step workflows, not individual recurring jobs.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html\">https://docs.aws.amazon.com/scheduler/latest/UserGuide/what-is-scheduler.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html\">https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/connect-ecs.html\">https://docs.aws.amazon.com/step-functions/latest/dg/connect-ecs.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html\">https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html</a></p>\n","answers":["<p>Convert each script into a Lambda function and package it in a zip archive. Use Amazon EventBridge Scheduler to run the functions on a fixed schedule. Use Amazon S3 to store function outputs and logs</p>","<p>Package the scripts into a container image. Use Amazon EventBridge Scheduler to define cron-based recurring schedules. Configure EventBridge Scheduler to invoke AWS Fargate tasks using Amazon ECS</p>","<p>Package the scripts into a container image. Deploy the image to AWS Batch with a managed compute environment on Amazon EC2. Define scheduling policies in AWS Batch to trigger jobs according to cron expressions</p>","<p>Create a container image for each script. Use AWS Step Functions to define a workflow for all scheduled tasks. Use a Wait state to delay execution and run tasks using Step Functions’ RunTask integration with ECS Fargate</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"A manufacturing analytics company has a large collection of automated scripts that perform data cleanup, validation, and system integration tasks. These scripts are currently run by a local Linux cron scheduler and have an execution time of up to 30 minutes. The company wants to migrate these scripts to AWS without significant changes, and would prefer a containerized, serverless architecture that automatically scales and can respond to event-based triggers in the future. The solution must minimize infrastructure management.\n\nWhich solution will best meet these requirements with minimal refactoring and operational overhead?","related_lectures":[]},{"_class":"assessment","id":157033871,"assessment_type":"multi-select","prompt":{"question":"<p>A silicon valley based startup has a two-tier architecture using Amazon EC2 instances for its flagship application. The web servers (listening on port 443), which have been assigned security group A, are in public subnets across two Availability Zones (AZs) and the MSSQL based database instances (listening on port 1433), which have been assigned security group B, are in two private subnets across two Availability Zones (AZs). The DevOps team wants to review the security configurations of the application architecture.</p>\n\n<p>As a solutions architect, which of the following options would you select as the MOST secure configuration? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 1433</strong></p>\n\n<p><strong>For security group B: Add an inbound rule that allows traffic only from security group A on port 1433</strong></p>\n\n<p>A security group acts as a virtual firewall that controls the traffic for one or more instances. When you launch an instance, you can specify one or more security groups; otherwise, we use the default security group. You can add rules to each security group that allows traffic to or from its associated instances. You can modify the rules for a security group at any time; the new rules are automatically applied to all instances that are associated with the security group. When we decide whether to allow traffic to reach an instance, we evaluate all the rules from all the security groups that are associated with the instance.</p>\n\n<p>The following are the characteristics of security group rules:</p>\n\n<p>By default, security groups allow all outbound traffic.</p>\n\n<p>Security group rules are always permissive; you can't create rules that deny access.</p>\n\n<p>Security groups are stateful</p>\n\n<p>The MOST secure configuration for the given use case is:</p>\n\n<p>For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 1433</p>\n\n<p>The above rules make sure that web servers are listening for traffic on all sources on the HTTPS protocol on port 443. The web servers only allow outbound traffic to MSSQL servers in Security Group B on port 1433.</p>\n\n<p>For security group B: Add an inbound rule that allows traffic only from security group A on port 1433.\nThe above rule makes sure that the MSSQL servers only accept traffic from web servers in security group A on port 1433.</p>\n\n<p>Therefore, both of these options are correct.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 443</strong> - As the MSSQL based database instances are listening on port 1433, therefore for security group A, the outbound rule should be added on port 443 with the destination as security group B.</p>\n\n<p><strong>For security group B: Add an inbound rule that allows traffic only from all sources on port 1433</strong> - The inbound rule should allow traffic only from security group A on port 1433. Allowing traffic from all sources will compromise security.</p>\n\n<p><strong>For security group B: Add an inbound rule that allows traffic only from security group A on port 443</strong> -  The inbound rule should allow traffic only from security group A on port 1433 because the MSSQL based database instances are listening on port 1433.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html</a></p>\n","answers":["<p>For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 443</p>","<p>For security group B: Add an inbound rule that allows traffic only from all sources on port 1433</p>","<p>For security group B: Add an inbound rule that allows traffic only from security group A on port 443</p>","<p>For security group A: Add an inbound rule that allows traffic from all sources on port 443. Add an outbound rule with the destination as security group B on port 1433</p>","<p>For security group B: Add an inbound rule that allows traffic only from security group A on port 1433</p>"]},"correct_response":["d","e"],"section":"Design Secure Architectures","question_plain":"A silicon valley based startup has a two-tier architecture using Amazon EC2 instances for its flagship application. The web servers (listening on port 443), which have been assigned security group A, are in public subnets across two Availability Zones (AZs) and the MSSQL based database instances (listening on port 1433), which have been assigned security group B, are in two private subnets across two Availability Zones (AZs). The DevOps team wants to review the security configurations of the application architecture.\n\nAs a solutions architect, which of the following options would you select as the MOST secure configuration? (Select two)","related_lectures":[]},{"_class":"assessment","id":157033887,"assessment_type":"multi-select","prompt":{"question":"<p>A startup has just developed a video backup service hosted on a fleet of Amazon EC2 instances. The Amazon EC2 instances are behind an Application Load Balancer and the instances are using Amazon Elastic Block Store (Amazon EBS) Volumes for storage. The service provides authenticated users the ability to upload videos that are then saved on the EBS volume attached to a given instance. On the first day of the beta launch, users start complaining that they can see only some of the videos in their uploaded videos backup. Every time the users log into the website, they claim to see a different subset of their uploaded videos.</p>\n\n<p>Which of the following is the MOST optimal solution to make sure that users can view all the uploaded videos? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 and then modify the application to use Amazon S3 standard for storing the videos</strong></p>\n\n<p><strong>Mount Amazon Elastic File System (Amazon EFS) on all Amazon EC2 instances. Write a one time job to copy the videos from all Amazon EBS volumes to Amazon EFS. Modify the application to use Amazon EFS for storing the videos</strong></p>\n\n<p>Amazon Elastic Block Store (EBS) is an easy to use, high-performance block storage service designed for use with Amazon Elastic Compute Cloud (EC2) for both throughput and transaction-intensive workloads at any scale.</p>\n\n<p>Amazon Elastic File System (Amazon EFS) provides a simple, scalable, fully managed elastic NFS file system for use with AWS Cloud services and on-premises resources. It is built to scale on-demand to petabytes without disrupting applications, growing and shrinking automatically as you add and remove files, eliminating the need to provision and manage capacity to accommodate growth.</p>\n\n<p>Amazon Simple Storage Service (Amazon S3) is an object storage service that offers industry-leading scalability, data availability, security, and performance.</p>\n\n<p>As Amazon EBS volumes are attached locally to the Amazon EC2 instances, therefore the uploaded videos are tied to specific Amazon EC2 instances. Every time the user logs in, they are directed to a different instance and therefore their videos get dispersed across multiple EBS volumes. The correct solution is to use either Amazon S3 or Amazon EFS to store the user videos.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 Glacier Deep Archive and then modify the application to use Amazon S3 Glacier Deep Archive for storing the videos</strong> - Amazon S3 Glacier Deep Archive is meant to be used for long term data archival. It cannot be used to serve static content such as videos or images via a web application. So this option is incorrect.</p>\n\n<p><strong>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon RDS and then modify the application to use Amazon RDS for storing the videos</strong> - Amazon RDS is a relational database and not the right candidate for storing videos.</p>\n\n<p><strong>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon DynamoDB and then modify the application to use Amazon DynamoDB for storing the videos</strong> - Amazon DynamoDB is a NoSQL database and not the right candidate for storing videos.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/ebs/\">https://aws.amazon.com/ebs/</a></p>\n","answers":["<p>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 Glacier Deep Archive and then modify the application to use Amazon S3 Glacier Deep Archive for storing the videos</p>","<p>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon S3 and then modify the application to use Amazon S3 standard for storing the videos</p>","<p>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon RDS and then modify the application to use Amazon RDS for storing the videos</p>","<p>Mount Amazon Elastic File System (Amazon EFS) on all Amazon EC2 instances. Write a one time job to copy the videos from all Amazon EBS volumes to Amazon EFS. Modify the application to use Amazon EFS for storing the videos</p>","<p>Write a one time job to copy the videos from all Amazon EBS volumes to Amazon DynamoDB and then modify the application to use Amazon DynamoDB for storing the videos</p>"]},"correct_response":["b","d"],"section":"Design Resilient Architectures","question_plain":"A startup has just developed a video backup service hosted on a fleet of Amazon EC2 instances. The Amazon EC2 instances are behind an Application Load Balancer and the instances are using Amazon Elastic Block Store (Amazon EBS) Volumes for storage. The service provides authenticated users the ability to upload videos that are then saved on the EBS volume attached to a given instance. On the first day of the beta launch, users start complaining that they can see only some of the videos in their uploaded videos backup. Every time the users log into the website, they claim to see a different subset of their uploaded videos.\n\nWhich of the following is the MOST optimal solution to make sure that users can view all the uploaded videos? (Select two)","related_lectures":[]},{"_class":"assessment","id":157033973,"assessment_type":"multiple-choice","prompt":{"question":"<p>To improve the performance and security of the application, the engineering team at a company has created an Amazon CloudFront distribution with an Application Load Balancer as the custom origin. The team has also set up an AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution. The security team at the company has noticed a surge in malicious attacks from a specific IP address to steal sensitive data stored on the Amazon EC2 instances.</p>\n\n<p>As a solutions architect, which of the following actions would you recommend to stop the attacks?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an IP match condition in the AWS WAF to block the malicious IP address</strong></p>\n\n<p>AWS WAF is a web application firewall that helps protect your web applications or APIs against common web exploits that may affect availability, compromise security, or consume excessive resources. AWS WAF gives you control over how traffic reaches your applications by enabling you to create security rules that block common attack patterns, such as SQL injection or cross-site scripting, and rules that filter out specific traffic patterns you define.</p>\n\n<p>How AWS WAF Works:\n<img src=\"https://d1.awsstatic.com/products/WAF/product-page-diagram_AWS-WAF_How-it-Works@2x.452efa12b06cb5c87f07550286a771e20ca430b9.png\">\nvia - <a href=\"https://aws.amazon.com/waf/\">https://aws.amazon.com/waf/</a></p>\n\n<p>If you want to allow or block web requests based on the IP addresses that the requests originate from, create one or more IP match conditions. An IP match condition lists up to 10,000 IP addresses or IP address ranges that your requests originate from. So, this option is correct.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a deny rule for the malicious IP in the network access control list (network ACL) associated with each of the instances</strong> - Network access control list (network ACL) are not associated with instances. So this option is also ruled out.</p>\n\n<p><strong>Create a deny rule for the malicious IP in the Security Groups associated with each of the instances</strong> - You cannot deny rules in Security Groups. So this option is ruled out.</p>\n\n<p><strong>Create a ticket with AWS support to take action against the malicious IP</strong> - Managing the security of your application is your responsibility, not that of AWS, so you cannot raise a ticket for this issue.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/classic-web-acl-ip-conditions.html\">https://docs.aws.amazon.com/waf/latest/developerguide/classic-web-acl-ip-conditions.html</a></p>\n","answers":["<p>Create a deny rule for the malicious IP in the network access control list (network ACL) associated with each of the instances</p>","<p>Create a deny rule for the malicious IP in the Security Groups associated with each of the instances</p>","<p>Create an IP match condition in the AWS WAF to block the malicious IP address</p>","<p>Create a ticket with AWS support to take action against the malicious IP</p>"]},"correct_response":["c"],"section":"Design Secure Architectures","question_plain":"To improve the performance and security of the application, the engineering team at a company has created an Amazon CloudFront distribution with an Application Load Balancer as the custom origin. The team has also set up an AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution. The security team at the company has noticed a surge in malicious attacks from a specific IP address to steal sensitive data stored on the Amazon EC2 instances.\n\nAs a solutions architect, which of the following actions would you recommend to stop the attacks?","related_lectures":[]},{"_class":"assessment","id":157033867,"assessment_type":"multiple-choice","prompt":{"question":"<p>An application is currently hosted on four Amazon EC2 instances (behind Application Load Balancer) deployed in a single Availability Zone (AZ). To maintain an acceptable level of end-user experience, the application needs at least 4 instances to be always available.</p>\n\n<p>As a solutions architect, which of the following would you recommend so that the application achieves high availability with MINIMUM cost?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Deploy the instances in three Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)</strong></p>\n\n<p>The correct option is to deploy the instances in three Availability Zones (AZs) and launch two instances in each Availability Zone (AZ). Even if one of the AZs goes out of service, still we shall have 4 instances available and the application can maintain an acceptable level of end-user experience. Therefore, we can achieve high availability with just 6 instances in this case.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy the instances in two Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)</strong> - When we launch two instances in two AZs, we run the risk of falling below the minimum acceptable threshold of 4 instances if one of the AZs fails. So this option is ruled out.</p>\n\n<p><strong>Deploy the instances in two Availability Zones (AZs). Launch four instances in each Availability Zone (AZ)</strong> - When we launch four instances in two AZs, we have to bear costs for 8 instances which is NOT cost-optimal. So this option is ruled out.</p>\n\n<p><strong>Deploy the instances in one Availability Zones. Launch two instances in the Availability Zone (AZ)</strong> - We can't have just two instances in a single AZ as that is below the minimum acceptable threshold of 4 instances.</p>\n","answers":["<p>Deploy the instances in three Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)</p>","<p>Deploy the instances in two Availability Zones (AZs). Launch two instances in each Availability Zone (AZ)</p>","<p>Deploy the instances in two Availability Zones (AZs). Launch four instances in each Availability Zone (AZ)</p>","<p>Deploy the instances in one Availability Zones. Launch two instances in the Availability Zone (AZ)</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"An application is currently hosted on four Amazon EC2 instances (behind Application Load Balancer) deployed in a single Availability Zone (AZ). To maintain an acceptable level of end-user experience, the application needs at least 4 instances to be always available.\n\nAs a solutions architect, which of the following would you recommend so that the application achieves high availability with MINIMUM cost?","related_lectures":[]},{"_class":"assessment","id":157033883,"assessment_type":"multiple-choice","prompt":{"question":"<p>A SaaS company is modernizing one of its legacy web applications by migrating it to AWS. The company aims to improve the availability of the application during both normal and peak traffic periods. Additionally, the company wants to implement protection against common web exploits and malicious traffic. The architecture must be scalable and integrate AWS WAF to secure incoming traffic.</p>\n\n<p>Which solution will best meet these requirements with high availability and minimal configuration complexity?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Deploy the application on multiple Amazon EC2 instances in an Auto Scaling group that spans two Availability Zones. Place an Application Load Balancer (ALB) in front of the group. Associate AWS WAF with the ALB</strong></p>\n\n<p>This solution provides a highly available, scalable, and secure architecture with minimal operational complexity. By using an Auto Scaling group across multiple Availability Zones, the application can automatically scale out during high traffic and maintain fault tolerance in case one AZ fails. Placing an Application Load Balancer (ALB) in front of the EC2 instances distributes incoming requests evenly and supports layer 7 routing, which is necessary for web application traffic. Most importantly, AWS WAF integrates directly with ALB, allowing the company to define and enforce web access control rules that protect against common threats such as SQL injection and cross-site scripting. This setup ensures that the application is resilient, responsive to load, and protected from malicious web activity, all while minimizing ongoing management overhead.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Launch EC2 instances in a single Availability Zone and configure AWS Global Accelerator to route traffic to the instances. Attach AWS WAF to Global Accelerator for application protection</strong> - While AWS Global Accelerator supports integration with AWS WAF and can reduce global latency, this solution does not address high availability adequately because it deploys EC2 instances in a single Availability Zone. This creates a single point of failure and doesn't offer automatic scaling. Moreover, Global Accelerator is best suited for global user performance optimization, not for replacing the load balancing and scaling functionality of ALB and Auto Scaling groups.</p>\n\n<p><strong>Launch two EC2 instances in separate Availability Zones and register them as targets of an Application Load Balancer. Associate the ALB with AWS WAF to filter incoming traffic</strong> - While this setup does provide some availability by using two Availability Zones and integrates WAF correctly via ALB, it lacks scalability. Without an Auto Scaling group, the system cannot respond to traffic spikes or recover automatically from instance failure. Manual instance management increases operational overhead and limits elasticity.</p>\n\n<p><strong>Create an Auto Scaling group with EC2 instances in multiple Availability Zones. Attach a Network Load Balancer (NLB) to distribute incoming traffic. Integrate AWS WAF directly with the Auto Scaling group for traffic filtering</strong> - While this solution achieves high availability and scalability, AWS WAF cannot be directly associated with an Auto Scaling group or a Network Load Balancer. WAF only supports integration with Application Load Balancer (ALB), API Gateway, App Runner, CloudFront, and Global Accelerator. Since NLB operates at Layer 4 and AWS WAF protects Layer 7, this design fails to implement WAF protection, which is a core requirement.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html\">https://docs.aws.amazon.com/waf/latest/developerguide/how-aws-waf-works.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html</a></p>\n","answers":["<p>Launch EC2 instances in a single Availability Zone and configure AWS Global Accelerator to route traffic to the instances. Attach AWS WAF to Global Accelerator for application protection</p>","<p>Deploy the application on multiple Amazon EC2 instances in an Auto Scaling group that spans two Availability Zones. Place an Application Load Balancer (ALB) in front of the group. Associate AWS WAF with the ALB</p>","<p>Launch two EC2 instances in separate Availability Zones and register them as targets of an Application Load Balancer. Associate the ALB with AWS WAF to filter incoming traffic</p>","<p>Create an Auto Scaling group with EC2 instances in multiple Availability Zones. Attach a Network Load Balancer (NLB) to distribute incoming traffic. Integrate AWS WAF directly with the Auto Scaling group for traffic filtering</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A SaaS company is modernizing one of its legacy web applications by migrating it to AWS. The company aims to improve the availability of the application during both normal and peak traffic periods. Additionally, the company wants to implement protection against common web exploits and malicious traffic. The architecture must be scalable and integrate AWS WAF to secure incoming traffic.\n\nWhich solution will best meet these requirements with high availability and minimal configuration complexity?","related_lectures":[]},{"_class":"assessment","id":157033957,"assessment_type":"multiple-choice","prompt":{"question":"<p>An application runs big data workloads on Amazon Elastic Compute Cloud (Amazon EC2) instances. The application runs 24x7 all round the year and needs at least 20 instances to maintain a minimum acceptable performance threshold and the application needs 300 instances to handle spikes in the workload. Based on historical workloads processed by the application, it needs 80 instances 80% of the time.</p>\n\n<p>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution so that it can meet the workload demand in a steady state?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Purchase 80 reserved instances (RIs). Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)</strong></p>\n\n<p>As the steady-state workload demand is 80 instances, we can save on costs by purchasing 80 reserved instances. Based on additional workload demand, we can specify a mix of on-demand and spot instances using Application Load Balancer with a launch template to provision the mix of on-demand and spot instances.</p>\n\n<p>Please see this detailed overview of various types of Amazon EC2 instances from a pricing perspective:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q33-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Purchase 20 on-demand instances. Use Auto Scaling Group to provision the remaining instances as spot instances per the workload demand</strong> - Provisioning 20 on-demand instances implies that there would be a shortfall of 60 instances 80% of the time. Provisioning all of these 60 instances as spot instances is highly risky as there is no guarantee regarding the availability of the spot instances, which means we may not even meet the steady-state requirement for the workload, so this option is incorrect.</p>\n\n<p><strong>Purchase 80 on-demand instances. Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)</strong> - Provisioning 80 on-demand instances would end up costlier than the option where we provision 80 reserved instances. So this option is ruled out.</p>\n\n<p><strong>Purchase 80 spot instances. Use Auto Scaling Group to provision the remaining instances as on-demand instances per the workload demand</strong> - The option to purchase 80 spot instances is incorrect, as there is no guarantee regarding the availability of the spot instances, which means we may not even meet the steady-state workload.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n","answers":["<p>Purchase 80 reserved instances (RIs). Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)</p>","<p>Purchase 20 on-demand instances. Use Auto Scaling Group to provision the remaining instances as spot instances per the workload demand</p>","<p>Purchase 80 spot instances. Use Auto Scaling Group to provision the remaining instances as on-demand instances per the workload demand</p>","<p>Purchase 80 on-demand instances. Provision additional on-demand and spot instances per the workload demand (Use Auto Scaling Group with launch template to provision the mix of on-demand and spot instances)</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"An application runs big data workloads on Amazon Elastic Compute Cloud (Amazon EC2) instances. The application runs 24x7 all round the year and needs at least 20 instances to maintain a minimum acceptable performance threshold and the application needs 300 instances to handle spikes in the workload. Based on historical workloads processed by the application, it needs 80 instances 80% of the time.\n\nAs a solutions architect, which of the following would you recommend as the MOST cost-optimal solution so that it can meet the workload demand in a steady state?","related_lectures":[]},{"_class":"assessment","id":157033895,"assessment_type":"multi-select","prompt":{"question":"<p>A big data consulting firm needs to set up a data lake on Amazon S3 for a Health-Care client. The data lake is split in raw and refined zones. For compliance reasons, the source data needs to be kept for a minimum of 5 years. The source data arrives in the raw zone and is then processed via an AWS Glue based extract, transform, and load (ETL) job into the refined zone. The business analysts run ad-hoc queries only on the data in the refined zone using Amazon Athena. The team is concerned about the cost of data storage in both the raw and refined zones as the data is increasing at a rate of 1 terabyte daily in each zone.</p>\n\n<p>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Setup a lifecycle policy to transition the raw zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation</strong></p>\n\n<p>You can manage your objects so that they are stored cost-effectively throughout their lifecycle by configuring their Amazon S3 Lifecycle. An S3 Lifecycle configuration is a set of rules that define actions that Amazon S3 applies to a group of objects. For example, you might choose to transition objects to the Amazon S3 Standard-IA storage class 30 days after you created them, or archive objects to the Amazon S3 Glacier storage class one year after creating them.</p>\n\n<p>For the given use-case, the raw zone consists of the source data, so it cannot be deleted due to compliance reasons. Therefore, you should use a lifecycle policy to transition the raw zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation.</p>\n\n<p>Please read more about Amazon S3 Object Lifecycle Management:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q34-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html</a></p>\n\n<p><strong>Use AWS Glue ETL job to write the transformed data in the refined zone using a compressed file format</strong></p>\n\n<p>AWS Glue is a fully managed extract, transform, and load (ETL) service that makes it easy for customers to prepare and load their data for analytics.\nYou cannot transition the refined zone data into Amazon S3 Glacier Deep Archive because it is used by the business analysts for ad-hoc querying. Therefore, the best optimization is to have the refined zone data stored in a compressed format via the Glue job. The compressed data would reduce the storage cost incurred on the data in the refined zone.</p>\n\n<p>Please see this example for a AWS Glue ETL Pipeline:\n<img src=\"https://d1.awsstatic.com/Products/product-name/diagrams/product-page-diagram_Glue_Event-driven-ETL-Pipelines.e24d59bb79a9e24cdba7f43ffd234ec0482a60e2.png\">\nvia - <a href=\"https://aws.amazon.com/glue/\">https://aws.amazon.com/glue/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an AWS Lambda function based job to delete the raw zone data after 1 day</strong> - As mentioned in the use-case, the source data needs to be kept for a minimum of 5 years for compliance reasons. Therefore the data in the raw zone cannot be deleted after 1 day.</p>\n\n<p><strong>Setup a lifecycle policy to transition the refined zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation</strong> - You cannot transition the refined zone data into Amazon S3 Glacier Deep Archive because it is used by the business analysts for ad-hoc querying. Hence this option is incorrect.</p>\n\n<p><strong>Use AWS Glue ETL job to write the transformed data in the refined zone using CSV format</strong> - It is cost-optimal to write the data in the refined zone using a compressed format instead of CSV format. The compressed data would reduce the storage cost incurred on the data in the refined zone. So, this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/object-lifecycle-mgmt.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/glue/\">https://aws.amazon.com/glue/</a></p>\n","answers":["<p>Setup a lifecycle policy to transition the raw zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation</p>","<p>Create an AWS Lambda function based job to delete the raw zone data after 1 day</p>","<p>Setup a lifecycle policy to transition the refined zone data into Amazon S3 Glacier Deep Archive after 1 day of object creation</p>","<p>Use AWS Glue ETL job to write the transformed data in the refined zone using CSV format</p>","<p>Use AWS Glue ETL job to write the transformed data in the refined zone using a compressed file format</p>"]},"correct_response":["a","e"],"section":"Design High-Performing Architectures","question_plain":"A big data consulting firm needs to set up a data lake on Amazon S3 for a Health-Care client. The data lake is split in raw and refined zones. For compliance reasons, the source data needs to be kept for a minimum of 5 years. The source data arrives in the raw zone and is then processed via an AWS Glue based extract, transform, and load (ETL) job into the refined zone. The business analysts run ad-hoc queries only on the data in the refined zone using Amazon Athena. The team is concerned about the cost of data storage in both the raw and refined zones as the data is increasing at a rate of 1 terabyte daily in each zone.\n\nAs a solutions architect, which of the following would you recommend as the MOST cost-optimal solution? (Select two)","related_lectures":[]},{"_class":"assessment","id":157033913,"assessment_type":"multiple-choice","prompt":{"question":"<p>An IT company wants to optimize the costs incurred on its fleet of 100 Amazon EC2 instances for the next year. Based on historical analyses, the engineering team observed that 70 of these instances handle the compute services of its flagship application and need to be always available. The other 30 instances are used to handle batch jobs that can afford a delay in processing.</p>\n\n<p>As a solutions architect, which of the following would you recommend as the MOST cost-optimal solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Purchase 70 reserved instances (RIs) and 30 spot instances</strong></p>\n\n<p>As 70 instances need to be always available, these can be purchased as reserved instances for a one-year duration.\nThe other 30 instances responsible for the batch job can be purchased as spot instances. Even if some of the spot instances are interrupted, other spot instances can continue with the job.</p>\n\n<p>Please see this detailed overview of various types of Amazon EC2 instances from a pricing perspective:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q35-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Purchase 70 on-demand instances and 30 spot instances</strong></p>\n\n<p><strong>Purchase 70 on-demand instances and 30 reserved instances</strong></p>\n\n<p>Purchasing 70 on-demand instances would be costlier than 70 reserved instances, so these two options are ruled out.</p>\n\n<p><strong>Purchase 70 reserved instances and 30 on-demand instances</strong> - Purchasing 30 instances as on-demand instances to handle the batch jobs would not be cost-optimal as these instances don't need to be always available. Spot instances are better at handling such batch jobs. So this option is not correct.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n","answers":["<p>Purchase 70 reserved instances (RIs) and 30 spot instances</p>","<p>Purchase 70 on-demand instances and 30 spot instances</p>","<p>Purchase 70 reserved instances and 30 on-demand instances</p>","<p>Purchase 70 on-demand instances and 30 reserved instances</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"An IT company wants to optimize the costs incurred on its fleet of 100 Amazon EC2 instances for the next year. Based on historical analyses, the engineering team observed that 70 of these instances handle the compute services of its flagship application and need to be always available. The other 30 instances are used to handle batch jobs that can afford a delay in processing.\n\nAs a solutions architect, which of the following would you recommend as the MOST cost-optimal solution?","related_lectures":[]},{"_class":"assessment","id":157033949,"assessment_type":"multiple-choice","prompt":{"question":"<p>You have multiple AWS accounts within a single AWS Region managed by AWS Organizations and you would like to ensure all Amazon EC2 instances in all these accounts can communicate privately. Which of the following solutions provides the capability at the CHEAPEST cost?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a virtual private cloud (VPC) in an account and share one or more of its subnets with the other accounts using Resource Access Manager</strong></p>\n\n<p>AWS Resource Access Manager (RAM) is a service that enables you to easily and securely share AWS resources with any AWS account or within your AWS Organization. You can share AWS Transit Gateways, Subnets, AWS License Manager configurations, and Amazon Route 53 Resolver rules resources with RAM. RAM eliminates the need to create duplicate resources in multiple accounts, reducing the operational overhead of managing those resources in every single account you own. You can create resources centrally in a multi-account environment, and use RAM to share those resources across accounts in three simple steps: create a Resource Share, specify resources, and specify accounts. RAM is available to you at no additional charge.</p>\n\n<p>The correct solution is to share the subnet(s) within a VPC using RAM. This will allow all Amazon EC2 instances to be deployed in the same VPC (although from different accounts) and easily communicate with one another.</p>\n\n<p>How AWS Resource Access Manager (AWS RAM) Works:\n<img src=\"https://d1.awsstatic.com/products/RAM/product-page-diagram_AWS-Resource-Access-Manager(1).379df75d48a8e2cc6160859b7ca3626a9b9be0c1.png\">\nvia - <a href=\"https://aws.amazon.com/ram/\">https://aws.amazon.com/ram/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a Private Link between all the Amazon EC2 instances</strong> - AWS PrivateLink simplifies the security of data shared with cloud-based applications by eliminating the exposure of data to the public Internet. AWS PrivateLink provides private connectivity between VPCs, AWS services, and on-premises applications, securely on the Amazon network.\nPrivate Link is a distractor in this question. Private Link is leveraged to create a private connection between an application that is fronted by an NLB in an account, and an Elastic Network Interface (ENI) in another account, without the need of VPC peering and allowing the connections between the two to remain within the AWS network.</p>\n\n<p><strong>Create a VPC peering connection between all virtual private cloud (VPCs)</strong> - A VPC peering connection is a networking connection between two VPCs that enables you to route traffic between them using private IPv4 addresses or IPv6 addresses. Instances in either VPC can communicate with each other as if they are within the same network. You can create a VPC peering connection between your VPCs, or with a VPC in another AWS account. The VPCs can be in different regions (also known as an inter-region VPC peering connection).\nVPC peering connections will work, but won't efficiently scale if you add more accounts (you'll have to create many connections).</p>\n\n<p><strong>Create an AWS Transit Gateway and link all the virtual private cloud (VPCs) in all the accounts together</strong> - AWS Transit Gateway is a service that enables customers to connect their Amazon Virtual Private Clouds (VPCs) and their on-premises networks to a single gateway.\nA Transit Gateway will work but will be an expensive solution. Here we want to minimize cost.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/ram/\">https://aws.amazon.com/ram/</a></p>\n\n<p><a href=\"https://aws.amazon.com/privatelink/\">https://aws.amazon.com/privatelink/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html\">https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/transit-gateway/\">https://aws.amazon.com/transit-gateway/</a></p>\n","answers":["<p>Create a virtual private cloud (VPC) in an account and share one or more of its subnets with the other accounts using Resource Access Manager</p>","<p>Create an AWS Transit Gateway and link all the virtual private cloud (VPCs) in all the accounts together</p>","<p>Create a VPC peering connection between all virtual private cloud (VPCs)</p>","<p>Create a Private Link between all the Amazon EC2 instances</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"You have multiple AWS accounts within a single AWS Region managed by AWS Organizations and you would like to ensure all Amazon EC2 instances in all these accounts can communicate privately. Which of the following solutions provides the capability at the CHEAPEST cost?","related_lectures":[]},{"_class":"assessment","id":157033979,"assessment_type":"multiple-choice","prompt":{"question":"<p>What does this IAM policy do?</p>\n\n<pre><code>{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"Mystery Policy\",\n      \"Action\": [\n        \"ec2:RunInstances\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"IpAddress\": {\n          \"aws:SourceIp\": \"34.50.31.0/24\"\n        }\n      }\n    }\n  ]\n}\n</code></pre>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>It allows starting an Amazon EC2 instance only when the IP where the call originates is within the <code>34.50.31.0/24</code> CIDR block</strong></p>\n\n<p>You manage access in AWS by creating policies and attaching them to IAM identities (users, groups of users, or roles) or AWS resources. A policy is an object in AWS that, when associated with an identity or resource, defines their permissions. AWS evaluates these policies when an IAM principal (user or role) makes a request. Permissions in the policies determine whether the request is allowed or denied. Most policies are stored in AWS as JSON documents. AWS supports six types of policies: identity-based policies, resource-based policies, permissions boundaries, Organizations service control policy (SCPs), access control lists (ACLs), and session policies.</p>\n\n<p>Consider the following snippet from the given policy document:</p>\n\n<pre><code>      \"Condition\": {\n        \"IpAddress\": {\n          \"aws:SourceIp\": \"34.50.31.0/24\"\n        }\n      }\n</code></pre>\n\n<p>The <code>aws:SourceIP</code> in this condition always represents the IP of the caller of the API. That is very helpful if you want to restrict access to certain AWS API for example from the public IP of your on-premises infrastructure.</p>\n\n<p>Please see this overview of Elastic vs Public vs Private IP addresses:</p>\n\n<p>elastic IP address (EIP) - An elastic IP address (EIP) is a static IPv4 address designed for dynamic cloud computing. An Elastic IP address is associated with your AWS account. With an Elastic IP address, you can mask the failure of an instance or software by rapidly remapping the address to another instance in your account.</p>\n\n<p>Private IP address - A private IPv4 address is an IP address that's not reachable over the Internet. You can use private IPv4 addresses for communication between instances in the same VPC.</p>\n\n<p>Public IP address - A public IP address is an IPv4 address that's reachable from the Internet. You can use public addresses for communication between your instances and the Internet.</p>\n\n<p>Please note <code>34.50.31.0/24</code> is a public IP range, not a private IP range. Private IP ranges are:\n192.168.0.0 - 192.168.255.255 (65,536 IP addresses)\n172.16.0.0 - 172.31.255.255 (1,048,576 IP addresses)\n10.0.0.0 - 10.255.255.255 (16,777,216 IP addresses)</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>It allows starting an Amazon EC2 instance only when they have a Public IP within the <code>34.50.31.0/24</code> CIDR block</strong></p>\n\n<p><strong>It allows starting an Amazon EC2 instance only when they have an Elastic IP within the <code>34.50.31.0/24</code> CIDR block</strong></p>\n\n<p><strong>It allows starting an Amazon EC2 instance only when they have a Private IP within the <code>34.50.31.0/24</code> CIDR block</strong></p>\n\n<p>Each of these three options suggests that the IP addresses of the Amazon EC2 instances must belong to the <code>34.50.31.0/24</code> CIDR block for the EC2 instances to start. Actually, the policy states that the AMazon EC2 instance should start only when the IP where the call originates is within the <code>34.50.31.0/24</code> CIDR block. Hence these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/iam-restrict-calls-ip-addresses/\">https://aws.amazon.com/premiumsupport/knowledge-center/iam-restrict-calls-ip-addresses/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-instance-addressing.html</a></p>\n","answers":["<p>It allows starting an Amazon EC2 instance only when the IP where the call originates is within the <code>34.50.31.0/24</code> CIDR block</p>","<p>It allows starting an Amazon EC2 instance only when they have a Public IP within the <code>34.50.31.0/24</code> CIDR block</p>","<p>It allows starting an Amazon EC2 instance only when they have an Elastic IP within the <code>34.50.31.0/24</code> CIDR block</p>","<p>It allows starting an Amazon EC2 instance only when they have a Private IP within the <code>34.50.31.0/24</code> CIDR block</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"What does this IAM policy do?\n\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"Mystery Policy\",\n      \"Action\": [\n        \"ec2:RunInstances\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"IpAddress\": {\n          \"aws:SourceIp\": \"34.50.31.0/24\"\n        }\n      }\n    }\n  ]\n}","related_lectures":[]},{"_class":"assessment","id":157033897,"assessment_type":"multiple-choice","prompt":{"question":"<p>What does this IAM policy do?</p>\n\n<pre><code>{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"Mystery Policy\",\n      \"Action\": [\n        \"ec2:RunInstances\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"aws:RequestedRegion\": \"eu-west-1\"\n        }\n      }\n    }\n  ]\n}\n</code></pre>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>It allows running Amazon EC2 instances only in the <code>eu-west-1</code> region, and the API call can be made from anywhere in the world</strong></p>\n\n<p>You manage access in AWS by creating policies and attaching them to IAM identities (users, groups of users, or roles) or AWS resources. A policy is an object in AWS that, when associated with an identity or resource, defines their permissions. AWS evaluates these policies when an IAM principal (user or role) makes a request. Permissions in the policies determine whether the request is allowed or denied. Most policies are stored in AWS as JSON documents. AWS supports six types of policies: identity-based policies, resource-based policies, permissions boundaries, Organizations service control policy (SCPs), access control lists (ACLs), and session policies.</p>\n\n<p>You can use the <code>aws:RequestedRegion</code> key to compare the AWS Region that was called in the request with the Region that you specify in the policy. You can use this global condition key to control which Regions can be requested.</p>\n\n<p><code>aws:RequestedRegion</code> represents the target of the API call. So in this example, we can only launch an Amazon EC2 instance in <code>eu-west-1</code>, and we can do this API call from anywhere.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>It allows running Amazon EC2 instances anywhere but in the <code>eu-west-1</code> region</strong></p>\n\n<p><strong>It allows running Amazon EC2 instances in any region when the API call is originating from the <code>eu-west-1</code> region</strong></p>\n\n<p><strong>It allows running Amazon EC2 instances in the <code>eu-west-1</code> region, when the API call is made from the <code>eu-west-1</code> region</strong></p>\n\n<p>These three options contradict the earlier details provided in the explanation. To summarize, <code>aws:RequestedRegion</code> represents the target of the API call. So, we can only launch an Amazon EC2 instance in <code>eu-west-1</code> region and we can do this API call from anywhere. Hence these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_condition-keys.html</a></p>\n","answers":["<p>It allows running Amazon EC2 instances only in the <code>eu-west-1</code> region, and the API call can be made from anywhere in the world</p>","<p>It allows running Amazon EC2 instances anywhere but in the <code>eu-west-1</code> region</p>","<p>It allows running Amazon EC2 instances in any region when the API call is originating from the <code>eu-west-1</code> region</p>","<p>It allows running Amazon EC2 instances in the <code>eu-west-1</code> region, when the API call is made from the <code>eu-west-1</code> region</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"What does this IAM policy do?\n\n{\n  \"Version\": \"2012-10-17\",\n  \"Statement\": [\n    {\n      \"Sid\": \"Mystery Policy\",\n      \"Action\": [\n        \"ec2:RunInstances\"\n      ],\n      \"Effect\": \"Allow\",\n      \"Resource\": \"*\",\n      \"Condition\": {\n        \"StringEquals\": {\n          \"aws:RequestedRegion\": \"eu-west-1\"\n        }\n      }\n    }\n  ]\n}","related_lectures":[]},{"_class":"assessment","id":157033945,"assessment_type":"multiple-choice","prompt":{"question":"<p>You have a team of developers in your company, and you would like to ensure they can quickly experiment with AWS Managed Policies by attaching them to their accounts, but you would like to prevent them from doing an escalation of privileges, by granting themselves the <code>AdministratorAccess</code> managed policy. How should you proceed?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>For each developer, define an IAM permission boundary that will restrict the managed policies they can attach to themselves</strong></p>\n\n<p>AWS supports permissions boundaries for IAM entities (users or roles). A permissions boundary is an advanced feature for using a managed policy to set the maximum permissions that an identity-based policy can grant to an IAM entity. An entity's permissions boundary allows it to perform only the actions that are allowed by both its identity-based policies and its permissions boundaries.\nHere we have to use an IAM permission boundary. They can only be applied to roles or users, not IAM groups.</p>\n\n<p>Permissions boundaries for IAM entities:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q39-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a Service Control Policy (SCP) on your AWS account that restricts developers from attaching themselves the <code>AdministratorAccess</code> policy</strong> - Service control policy (SCP) is one type of policy that you can use to manage your organization. SCPs offer central control over the maximum available permissions for all accounts in your organization, allowing you to ensure your accounts stay within your organization’s access control guidelines. SCPs are available only in an organization that has all features enabled. SCPs aren't available if your organization has enabled only the consolidated billing features. Attaching an SCP to an AWS Organizations entity (root, OU, or account) defines a guardrail for what actions the principals can perform.\nIf you consider this option, since AWS Organizations is not mentioned in this question, so we can't apply an SCP.</p>\n\n<p><strong>Attach an IAM policy to your developers, that prevents them from attaching the <code>AdministratorAccess</code> policy</strong> - This option is incorrect as the developers can remove this policy from themselves and escalate their privileges.</p>\n\n<p><strong>Put the developers into an IAM group, and then define an IAM permission boundary on the group that will restrict the managed policies they can attach to themselves</strong> - IAM permission boundary can only be applied to roles or users, not IAM groups. Hence this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scp.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scp.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html</a></p>\n","answers":["<p>For each developer, define an IAM permission boundary that will restrict the managed policies they can attach to themselves</p>","<p>Put the developers into an IAM group, and then define an IAM permission boundary on the group that will restrict the managed policies they can attach to themselves</p>","<p>Create a Service Control Policy (SCP) on your AWS account that restricts developers from attaching themselves the <code>AdministratorAccess</code> policy</p>","<p>Attach an IAM policy to your developers, that prevents them from attaching the <code>AdministratorAccess</code> policy</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"You have a team of developers in your company, and you would like to ensure they can quickly experiment with AWS Managed Policies by attaching them to their accounts, but you would like to prevent them from doing an escalation of privileges, by granting themselves the AdministratorAccess managed policy. How should you proceed?","related_lectures":[]},{"_class":"assessment","id":157033935,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial institution is transitioning its critical back-office systems to AWS. These systems currently rely on Microsoft SQL Server databases hosted on on-premises infrastructure. The data is highly sensitive and subject to regulatory compliance. The organization wants to enhance security and minimize database management tasks as part of the migration.</p>\n\n<p>Which solution will best meet these goals with the least operational burden?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Migrate the SQL Server databases to a Multi-AZ Amazon RDS for SQL Server deployment. Enable encryption at rest by using an AWS Key Management Service (AWS KMS) managed key</strong></p>\n\n<p>Amazon RDS for SQL Server is a fully managed relational database service, which significantly reduces operational overhead by automating backups, patching, high availability, and monitoring. A Multi-AZ deployment ensures high availability and failover support, which is crucial for critical financial workloads. With RDS, encryption at rest using AWS KMS managed keys can be enabled easily for compliance and security. This architecture provides a secure, resilient, and low-maintenance solution for running SQL Server in the cloud.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Migrate the SQL Server databases to Amazon EC2 instances with encrypted EBS volumes. Use an AWS KMS customer managed key to enable encryption</strong> - While hosting SQL Server on EC2 with encrypted Amazon EBS volumes provides control over database configuration, it also significantly increases operational overhead. The organization would need to manage OS-level patching, SQL Server updates, backups, scaling, and high availability. Even though encryption with a KMS CMK enhances security, this approach lacks the automation and ease of management that a managed service like Amazon RDS offers, making it less suitable for reducing operational tasks.</p>\n\n<p><strong>Export the SQL Server databases to CSV format and store them in Amazon S3 with S3 bucket policies for access control. Use AWS Backup for data protection</strong> - While storing data in Amazon S3 can be secure and cost-effective, this solution does not replicate the functionality of a relational database and introduces limitations around querying, indexing, and transactional consistency. Additionally, converting the data to CSV and storing it in S3 loses the relational structure, making this unsuitable for migrating a live, critical system that relies on SQL Server's features. This setup also does not offer real-time access to an operational database.</p>\n\n<p><strong>Move the SQL Server data into Amazon Timestream to gain time series insights. Use AWS CloudTrail to monitor access to the data</strong> - Amazon Timestream is designed for time series data such as telemetry and metrics, not general-purpose relational database workloads like those used in financial systems. It does not support SQL Server features like stored procedures, triggers, or complex joins. Also, using CloudTrail to monitor access logs does not provide the granular security mechanisms required for database-level access control and compliance in this use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_SQLServer.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html</a></p>\n","answers":["<p>Migrate the SQL Server databases to a Multi-AZ Amazon RDS for SQL Server deployment. Enable encryption at rest by using an AWS Key Management Service (AWS KMS) managed key</p>","<p>Migrate the SQL Server databases to Amazon EC2 instances with encrypted EBS volumes. Use an AWS KMS customer managed key to enable encryption</p>","<p>Export the SQL Server databases to CSV format and store them in Amazon S3 with S3 bucket policies for access control. Use AWS Backup for data protection</p>","<p>Move the SQL Server data into Amazon Timestream to gain time series insights. Use AWS CloudTrail to monitor access to the data</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A financial institution is transitioning its critical back-office systems to AWS. These systems currently rely on Microsoft SQL Server databases hosted on on-premises infrastructure. The data is highly sensitive and subject to regulatory compliance. The organization wants to enhance security and minimize database management tasks as part of the migration.\n\nWhich solution will best meet these goals with the least operational burden?","related_lectures":[]},{"_class":"assessment","id":157033875,"assessment_type":"multiple-choice","prompt":{"question":"<p>You would like to use AWS Snowball to move on-premises backups into a long term archival tier on AWS. Which solution provides the MOST cost savings?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier Deep Archive on the same day</strong></p>\n\n<p>AWS Snowball, a part of the AWS Snow Family, is a data migration and edge computing device that comes in two options. Snowball Edge Storage Optimized devices provide both block storage and Amazon S3-compatible object storage, and 40 vCPUs. They are well suited for local storage and large scale data transfer. AWS Snowball Edge Compute Optimized devices provide 52 vCPUs, block and object storage, and an optional GPU for use cases like advanced machine learning and full-motion video analysis in disconnected environments.</p>\n\n<p>AWS Snowball Edge Storage Optimized is the optimal choice if you need to securely and quickly transfer dozens of terabytes to petabytes of data to AWS. It provides up to 80 terabytes of usable HDD storage, 40 vCPUs, 1 terabyte of SATA SSD storage, and up to 40 gigabytes network connectivity to address large scale data transfer and pre-processing use cases.</p>\n\n<p>The original AWS Snowball devices were transitioned out of service and AWS Snowball Edge Storage Optimized are now the primary devices used for data transfer. You may see the AWS Snowball device on the exam, just remember that the original AWS Snowball device had 80 terabytes of storage space.</p>\n\n<p>For this scenario, you will want to minimize the time spent in Amazon S3 Standard for all files to avoid unintended Amazon S3 Standard storage charges. To do this, AWS recommends using a zero-day lifecycle policy. From a cost perspective, when using a zero-day lifecycle policy, you are only charged Amazon S3 Glacier Deep Archive rates. When billed, the lifecycle policy is accounted for first, and if the destination is Amazon S3 Glacier Deep Archive, you are charged Amazon S3 Glacier Deep Archive rates for the transferred files.</p>\n\n<p>You can't move data directly from AWS Snowball into Amazon S3 Glacier, you need to go through Amazon S3 first, and then use a lifecycle policy. So this option is correct.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an AWS Snowball job and target a Amazon S3 Glacier Vault</strong></p>\n\n<p><strong>Create a AWS Snowball job and target an Amazon S3 Glacier Deep Archive Vault</strong></p>\n\n<p>Amazon S3 Glacier and S3 Glacier Deep Archive are a secure, durable, and extremely low-cost Amazon S3 cloud storage classes for data archiving and long-term backup. They are designed to deliver 99.999999999% durability and provide comprehensive security and compliance capabilities that can help meet even the most stringent regulatory requirements.\nFinally, Amazon S3 Glacier Deep Archive provides more cost savings than Amazon S3 Glacier.</p>\n\n<p>Both these options are incorrect as you can't move data directly from AWS Snowball into a Amazon S3 Glacier Vault or a Glacier Deep Archive Vault. You need to go through Amazon S3 first and then use a lifecycle policy.</p>\n\n<p><strong>Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier on the same day</strong> - As Amazon S3 Glacier Deep Archive provides more cost savings than Amazon S3 Glacier, you should use Amazon S3 Glacier Deep Archive for long term archival for this use-case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/snowball/features/\">https://aws.amazon.com/snowball/features/</a></p>\n\n<p><a href=\"https://aws.amazon.com/glacier/\">https://aws.amazon.com/glacier/</a></p>\n","answers":["<p>Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier Deep Archive on the same day</p>","<p>Create an AWS Snowball job and target a Amazon S3 Glacier Vault</p>","<p>Create an AWS Snowball job and target an Amazon S3 bucket. Create a lifecycle policy to transition this data to Amazon S3 Glacier on the same day</p>","<p>Create a AWS Snowball job and target an Amazon S3 Glacier Deep Archive Vault</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"You would like to use AWS Snowball to move on-premises backups into a long term archival tier on AWS. Which solution provides the MOST cost savings?","related_lectures":[]},{"_class":"assessment","id":157033905,"assessment_type":"multiple-choice","prompt":{"question":"<p>You are establishing a monitoring solution for desktop systems, that will be sending telemetry data into AWS every 1 minute. Data for each system must be processed in order, independently, and you would like to scale the number of consumers to be possibly equal to the number of desktop systems that are being monitored.</p>\n\n<p>What do you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and make sure the telemetry data is sent with a Group ID attribute representing the value of the Desktop ID</strong></p>\n\n<p>Amazon Simple Queue Service (SQS) is a fully managed message queuing service that enables you to decouple and scale microservices, distributed systems, and serverless applications. SQS offers two types of message queues. Standard queues offer maximum throughput, best-effort ordering, and at-least-once delivery. SQS FIFO queues are designed to guarantee that messages are processed exactly once, in the exact order that they are sent.</p>\n\n<p>We, therefore, need to use an SQS FIFO queue. If we don't specify a GroupID, then all the messages are in absolute order, but we can only have 1 consumer at most.\nTo allow for multiple consumers to read data for each Desktop application, and to scale the number of consumers, we should use the \"Group ID\" attribute. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and send the telemetry data as is</strong> - This is incorrect because if we send the telemetry data as is then we will not be able to scale the number of consumers to be equal to the number of desktop systems. In this case, each message will have its consumer. So we should use the \"Group ID\" attribute so that multiple consumers can read data for each Desktop application.</p>\n\n<p><strong>Use an Amazon Simple Queue Service (Amazon SQS) standard queue, and send the telemetry data as is</strong> - An Amazon SQS standard queue has no ordering capability so that's ruled out.</p>\n\n<p><strong>Use an Amazon Kinesis Data Stream, and send the telemetry data with a Partition ID that uses the value of the Desktop ID</strong> - Amazon Kinesis Data Streams (KDS) is a massively scalable and durable real-time data streaming service. KDS can continuously capture gigabytes of data per second from hundreds of thousands of sources such as website clickstreams, database event streams, financial transactions, social media feeds, IT logs, and location-tracking events.\nA Kinesis Data Stream would work and would give us the data for each desktop application within shards, but we can only have as many consumers as shards in Kinesis (which is in practice, much less than the number of producers).</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/compute/solving-complex-ordering-challenges-with-amazon-sqs-fifo-queues/\">https://aws.amazon.com/blogs/compute/solving-complex-ordering-challenges-with-amazon-sqs-fifo-queues/</a></p>\n\n<p><a href=\"https://aws.amazon.com/sqs/faqs/\">https://aws.amazon.com/sqs/faqs/</a></p>\n\n<p><a href=\"https://aws.amazon.com/kinesis/data-streams/faqs/\">https://aws.amazon.com/kinesis/data-streams/faqs/</a></p>\n","answers":["<p>Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and make sure the telemetry data is sent with a Group ID attribute representing the value of the Desktop ID</p>","<p>Use an Amazon Simple Queue Service (Amazon SQS) FIFO (First-In-First-Out) queue, and send the telemetry data as is</p>","<p>Use an Amazon Simple Queue Service (Amazon SQS) standard queue, and send the telemetry data as is</p>","<p>Use an Amazon Kinesis Data Stream, and send the telemetry data with a Partition ID that uses the value of the Desktop ID</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"You are establishing a monitoring solution for desktop systems, that will be sending telemetry data into AWS every 1 minute. Data for each system must be processed in order, independently, and you would like to scale the number of consumers to be possibly equal to the number of desktop systems that are being monitored.\n\nWhat do you recommend?","related_lectures":[]},{"_class":"assessment","id":157033959,"assessment_type":"multiple-choice","prompt":{"question":"<p>A security consultant is designing a solution for a company that wants to provide developers with individual AWS accounts through AWS Organizations, while also maintaining standard security controls. Since the individual developers will have AWS account root user-level access to their own accounts, the consultant wants to ensure that the mandatory AWS CloudTrail configuration that is applied to new developer accounts is not modified.</p>\n\n<p>Which of the following actions meets the given requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up a service control policy (SCP) that prohibits changes to AWS CloudTrail, and attach it to the developer accounts</strong></p>\n\n<p>Service control policy (SCP) is a type of organization policy that you can use to manage permissions in your organization. SCPs offer central control over the maximum available permissions for all accounts in your organization. SCPs help you to ensure your accounts stay within your organization’s access control guidelines.</p>\n\n<p>An SCP restricts permissions for IAM users and roles in member accounts, including the member account's root user. Any account has only those permissions permitted by every parent above it. If a permission is blocked at any level above the account, either implicitly (by not being included in an Allow policy statement) or explicitly (by being included in a Deny policy statement), a user or role in the affected account can't use that permission, even if the account administrator attaches the AdministratorAccess IAM policy with <em>/</em> permissions to the user.</p>\n\n<p>SCPs don't affect users or roles in the management account. They affect only the member accounts in your organization.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure a new trail in AWS CloudTrail from within the developer accounts with the organization trails option enabled</strong> - Configuring each developer account individually is not a viable solution to start with. In addition, any configuration changes can be undone by the user once they are logged into their individual accounts as root users.</p>\n\n<p><strong>Set up an IAM policy that prohibits changes to AWS CloudTrail and attach it to the root user</strong> - The root user can modify this IAM policy itself, so this option is not correct.</p>\n\n<p><strong>Set up a service-linked role for AWS CloudTrail with a policy condition that allows changes only from an Amazon Resource Name (ARN) in the master account</strong> - A service-linked role is a unique type of IAM role that is linked directly to an AWS service. Service-linked roles are predefined by the service and include all the permissions that the service requires to call other AWS services on your behalf. The linked service also defines how you create, modify, and delete a service-linked role.</p>\n\n<p>The linked service defines the permissions of its service-linked roles, and unless defined otherwise, only that service can assume the roles. The defined permissions include the trust policy and the permissions policy, and that permissions policy cannot be attached to any other entity such as the ARN in the master account.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html</a></p>\n","answers":["<p>Configure a new trail in AWS CloudTrail from within the developer accounts with the organization trails option enabled</p>","<p>Set up a service control policy (SCP) that prohibits changes to AWS CloudTrail, and attach it to the developer accounts</p>","<p>Set up an IAM policy that prohibits changes to AWS CloudTrail and attach it to the root user</p>","<p>Set up a service-linked role for AWS CloudTrail with a policy condition that allows changes only from an Amazon Resource Name (ARN) in the master account</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A security consultant is designing a solution for a company that wants to provide developers with individual AWS accounts through AWS Organizations, while also maintaining standard security controls. Since the individual developers will have AWS account root user-level access to their own accounts, the consultant wants to ensure that the mandatory AWS CloudTrail configuration that is applied to new developer accounts is not modified.\n\nWhich of the following actions meets the given requirements?","related_lectures":[]},{"_class":"assessment","id":157033965,"assessment_type":"multiple-choice","prompt":{"question":"<p>\"An enterprise organization is expanding its cloud footprint and needs to centralize its security event data from various AWS accounts and services. The goal is to evaluate security posture across all environments and improve threat detection and response — without requiring significant custom code or manual integration.</p>\n\n<p>Which solution will fulfill these needs with the least development effort?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon Security Lake to create a centralized data lake that automatically collects security-related logs and events from AWS services and third-party sources. Store the data in an Amazon S3 bucket managed by Security Lake</strong></p>\n\n<p>Amazon Security Lake is a fully managed, purpose-built service designed to automatically collect, normalize, and centralize security-related data from various AWS accounts, Regions, services, and even third-party sources. It stores this data in Amazon S3 buckets and formats it using the Open Cybersecurity Schema Framework (OCSF), which enhances compatibility with multiple analytics tools. Security Lake eliminates the need to build custom ETL pipelines or configure cross-service log ingestion manually, significantly reducing development effort. It also integrates natively with AWS services like CloudTrail, VPC Flow Logs, GuardDuty, and AWS Config, providing a single authoritative view of security data across the organization. With built-in support for log partitioning, retention, and access management, it delivers both centralization and scalability with minimal operational overhead. The managed nature of Security Lake means there's minimal setup or custom
