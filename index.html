<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- connect-src must list media: as well: text, markdown and subtitle
         resources are previewed by fetching them from the custom protocol,
         and without it default-src 'self' silently blocked every preview. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' media:; img-src 'self' data: blob: file: media:; media-src 'self' file: blob: media:; frame-src media:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>IsmaLearn</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
