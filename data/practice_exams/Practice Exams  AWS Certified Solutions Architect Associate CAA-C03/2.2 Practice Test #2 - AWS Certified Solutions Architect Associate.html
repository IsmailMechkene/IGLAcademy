coding, making it the lowest-effort and most scalable solution.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q44-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html\">https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy a custom Lambda function to aggregate security logs from multiple AWS accounts. Format the data into CSV files and upload them to a central S3 bucket for analysis</strong> - While this approach centralizes the logs, it requires considerable custom development and maintenance, including cross-account access setup, log parsing logic, error handling, and consistent formatting. Additionally, storing data in CSV format makes automated analytics and threat detection more difficult, and there's no inherent support for schema standardization or normalization. This option does not meet the requirement for minimal development effort.</p>\n\n<p><strong>Use Amazon Athena with predefined SQL queries to scan security logs stored in multiple S3 buckets. Visualize the findings by exporting results to an Amazon QuickSight dashboard</strong> - Although Athena and QuickSight can be useful for analysis, this solution does not address centralized log collection or normalization. The organization would still need to manage the log ingestion, parsing, and schema management manually, often across multiple S3 buckets. This setup increases operational burden and lacks out-of-the-box security-specific integrations and formatting. It also fails to provide proactive threat detection or standardized data aggregation.</p>\n\n<p><strong>Set up a data lake using AWS Lake Formation to collect and organize security event logs. Use AWS Glue to perform ETL operations and standardize the log formats for centralized analysis</strong> - While AWS Lake Formation is a powerful service for building and securing data lakes, it is primarily designed for structured and semi-structured business data, not for native ingestion and normalization of security event logs. Using Lake Formation in this context would require custom pipelines, ETL jobs, and log parsers, all of which significantly increase the development and operational overhead. Unlike Amazon Security Lake, which provides native support for ingesting logs from AWS security services (e.g., CloudTrail, GuardDuty, VPC Flow Logs) and automatically standardizes them into OCSF format, Lake Formation does not offer purpose-built features for centralized security data management.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html\">https://docs.aws.amazon.com/security-lake/latest/userguide/what-is-security-lake.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html\">https://docs.aws.amazon.com/lake-formation/latest/dg/what-is-lake-formation.html</a></p>\n","answers":["<p>Use Amazon Security Lake to create a centralized data lake that automatically collects security-related logs and events from AWS services and third-party sources. Store the data in an Amazon S3 bucket managed by Security Lake</p>","<p>Deploy a custom Lambda function to aggregate security logs from multiple AWS accounts. Format the data into CSV files and upload them to a central S3 bucket for analysis</p>","<p>Use Amazon Athena with predefined SQL queries to scan security logs stored in multiple S3 buckets. Visualize the findings by exporting results to an Amazon QuickSight dashboard</p>","<p>Set up a data lake using AWS Lake Formation to collect and organize security event logs. Use AWS Glue to perform ETL operations and standardize the log formats for centralized analysis</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"\"An enterprise organization is expanding its cloud footprint and needs to centralize its security event data from various AWS accounts and services. The goal is to evaluate security posture across all environments and improve threat detection and response — without requiring significant custom code or manual integration.\n\nWhich solution will fulfill these needs with the least development effort?","related_lectures":[]},{"_class":"assessment","id":157033923,"assessment_type":"multiple-choice","prompt":{"question":"<p>Upon a security review of your AWS account, an AWS consultant has found that a few Amazon RDS databases are unencrypted. As a Solutions Architect, what steps must be taken to encrypt the Amazon RDS databases?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Take a snapshot of the database, copy it as an encrypted snapshot, and restore a database from the encrypted snapshot. Terminate the previous database</strong></p>\n\n<p>Amazon Relational Database Service (Amazon RDS) makes it easy to set up, operate, and scale a relational database in the cloud. It provides cost-efficient and resizable capacity while automating time-consuming administration tasks such as hardware provisioning, database setup, patching and backups.</p>\n\n<p>You can encrypt your Amazon RDS DB instances and snapshots at rest by enabling the encryption option for your Amazon RDS DB instances. Data that is encrypted at rest includes the underlying storage for DB instances, its automated backups, read replicas, and snapshots.</p>\n\n<p>You can only enable encryption for an Amazon RDS DB instance when you create it, not after the DB instance is created. However, because you can encrypt a copy of an unencrypted DB snapshot, you can effectively add encryption to an unencrypted DB instance. That is, you can create a snapshot of your DB instance, and then create an encrypted copy of that snapshot. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a Read Replica of the database, and encrypt the read replica. Promote the read replica as a standalone database, and terminate the previous database</strong> - If the master is not encrypted, the read replicas cannot be encrypted. So this option is incorrect.</p>\n\n<p><strong>Enable Multi-AZ for the database, and make sure the standby instance is encrypted. Stop the main database to that the standby database kicks in, then disable Multi-AZ</strong> - Multi-AZ is to help with High Availability, not encryption. So this option is incorrect.</p>\n\n<p><strong>Enable encryption on the Amazon RDS database using the AWS Console</strong> - There is no direct option to encrypt an Amazon RDS database using the AWS Console.</p>\n\n<p>Steps to encrypt an un-encrypted RDS database:\n1. Create a snapshot of the un-encrypted database\n2. Copy the snapshot and enable encryption for the snapshot\n3. Restore the database from the encrypted snapshot\n4. Migrate applications to the new database, and delete the old database</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.Encryption.html</a></p>\n","answers":["<p>Take a snapshot of the database, copy it as an encrypted snapshot, and restore a database from the encrypted snapshot. Terminate the previous database</p>","<p>Create a Read Replica of the database, and encrypt the read replica. Promote the read replica as a standalone database, and terminate the previous database</p>","<p>Enable Multi-AZ for the database, and make sure the standby instance is encrypted. Stop the main database to that the standby database kicks in, then disable Multi-AZ</p>","<p>Enable encryption on the Amazon RDS database using the AWS Console</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"Upon a security review of your AWS account, an AWS consultant has found that a few Amazon RDS databases are unencrypted. As a Solutions Architect, what steps must be taken to encrypt the Amazon RDS databases?","related_lectures":[]},{"_class":"assessment","id":157033877,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company has historically operated only in the <code>us-east-1</code> region and stores encrypted data in Amazon S3 using SSE-KMS. As part of enhancing its security posture as well as improving the backup and recovery architecture, the company wants to store the encrypted data in Amazon S3 that is replicated into the <code>us-west-1</code> AWS region. The security policies mandate that the data must be encrypted and decrypted using the same key in both AWS regions.</p>\n\n<p>Which of the following represents the best solution to address these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a new Amazon S3 bucket in the <code>us-east-1</code> region with replication enabled from this new bucket into another bucket in <code>us-west-1</code> region. Enable SSE-KMS encryption on the new bucket in <code>us-east-1</code> region by using an AWS KMS multi-region key. Copy the existing data from the current Amazon S3 bucket in <code>us-east-1</code> region into this new Amazon S3 bucket in <code>us-east-1</code> region</strong></p>\n\n<p>AWS KMS supports multi-region keys, which are AWS KMS keys in different AWS regions that can be used interchangeably – as though you had the same key in multiple regions. Each set of related multi-region keys has the same key material and key ID, so you can encrypt data in one AWS region and decrypt it in a different AWS region without re-encrypting or making a cross-region call to AWS KMS.</p>\n\n<p>You can use multi-region AWS KMS keys in Amazon S3. However, Amazon S3 currently treats multi-region keys as though they were single-region keys, and does not use the multi-region features of the key.</p>\n\n<p>Multi-region AWS KMS keys:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q46-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\">https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html</a></p>\n\n<p>For the given use case, you must create a new bucket in the <code>us-east-1</code> region with replication enabled from this new bucket into another bucket in <code>us-west-1</code> region. This would ensure that the data is available in another region for backup and recovery purposes. You should also enable SSE-KMS encryption on the new bucket in <code>us-east-1</code> region by using an AWS KMS multi-region key so that the data can be encrypted and decrypted using the same key in both AWS regions. Since the existing data in the current bucket was encrypted using the AWS KMS key restricted to the <code>us-east-1</code> region, so data must be copied to the new bucket in <code>us-east-1</code> region for replication as well as multi-region KMS key based encryption to kick-in.</p>\n\n<p>To require server-side encryption of all objects in a particular Amazon S3 bucket, you can use a policy. For example, the following bucket policy denies the upload object (s3:PutObject) permission to everyone if the request does not include the x-amz-server-side-encryption header requesting server-side encryption with SSE-KMS.</p>\n\n<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Id\":\"PutObjectPolicy\",\n   \"Statement\":[{\n         \"Sid\":\"DenyUnEncryptedObjectUploads\",\n         \"Effect\":\"Deny\",\n         \"Principal\":\"*\",\n         \"Action\":\"s3:PutObject\",\n         \"Resource\":\"arn:aws:s3:::DOC-EXAMPLE-BUCKET1/*\",\n         \"Condition\":{\n            \"StringNotEquals\":{\n               \"s3:x-amz-server-side-encryption\":\"aws:kms\"\n            }\n         }\n      }\n   ]\n}\n</code></pre>\n\n<p>The following example IAM policies show statements for using AWS KMS server-side encryption with replication.</p>\n\n<p>In this example, the encryption context is the object ARN. If you use SSE-KMS with an Amazon S3 Bucket Key enabled, you must use the bucket ARN as the encryption context.</p>\n\n<pre><code>{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [{\n            \"Action\": [\"kms:Decrypt\"],\n            \"Effect\": \"Allow\",\n            \"Resource\": \"List of AWS KMS key ARNs used to encrypt source objects.\",\n            \"Condition\": {\n                \"StringLike\": {\n                    \"kms:ViaService\": \"s3.source-bucket-region.amazonaws.com\",\n                    \"kms:EncryptionContext:aws:s3:arn\": \"arn:aws:s3:::source-bucket-name/key-prefix1/*\"\n                }\n            }\n        },\n\n        {\n            \"Action\": [\"kms:Encrypt\"],\n            \"Effect\": \"Allow\",\n            \"Resource\": \"AWS KMS key ARNs (for the AWS Region of the destination bucket 1). Used to encrypt object replicas created in destination bucket 1.\",\n            \"Condition\": {\n                \"StringLike\": {\n                    \"kms:ViaService\": \"s3.destination-bucket-1-region.amazonaws.com\",\n                    \"kms:EncryptionContext:aws:s3:arn\": \"arn:aws:s3:::destination-bucket-name-1/key-prefix1/*\"\n                }\n            }\n        },\n        {\n            \"Action\": [\"kms:Encrypt\"],\n            \"Effect\": \"Allow\",\n            \"Resource\": \"AWS KMS key ARNs (for the AWS Region of destination bucket 2). Used to encrypt object replicas created in destination bucket 2.\",\n            \"Condition\": {\n                \"StringLike\": {\n                    \"kms:ViaService\": \"s3.destination-bucket-2-region.amazonaws.com\",\n                    \"kms:EncryptionContext:aws:s3:arn\": \"arn:aws:s3:::destination-bucket-2-name/key-prefix1*\"\n                }\n            }\n        }\n    ]\n}\n</code></pre>\n\n<p>Incorrect options:</p>\n\n<p><strong>Change the AWS KMS single region key used for the current Amazon S3 bucket into an AWS KMS multi-region key. Enable Amazon S3 batch replication for the existing data in the current bucket in <code>us-east-1</code> region into another bucket in <code>us-west-1</code> region</strong> - Amazon S3 batch replication can certainly be used to replicate the existing data in the current bucket in <code>us-east-1</code> region into another bucket in <code>us-west-1</code> region.</p>\n\n<p>However, you cannot convert an existing single-Region key to a multi-Region key. This design ensures that all data protected with existing single-Region keys maintain the same data residency and data sovereignty properties. So this option is incorrect.</p>\n\n<p><strong>Enable replication for the current bucket in <code>us-east-1</code> region into another bucket in <code>us-west-1</code> region. Share the existing AWS KMS key from <code>us-east-1</code> region to <code>us-west-1</code> region</strong> - You cannot share an AWS KMS key to another region, so this option is incorrect.</p>\n\n<p><strong>Create an Amazon CloudWatch scheduled rule to invoke an AWS Lambda function to copy the daily data from the source bucket in <code>us-east-1</code> region to the destination bucket in <code>us-west-1</code> region. Provide AWS KMS key access to the AWS Lambda function for encryption and decryption operations on the data in the source and destination Amazon S3 buckets</strong> - This option is a distractor as the daily frequency of data replication would result in significant data loss in case of a disaster. In addition, this option involves significant development effort to create the functionality to reliably replicate the data from source to destination buckets. So this option is not the best fit for the given use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\">https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication-config-for-kms-objects.html</a></p>\n","answers":["<p>Create an Amazon CloudWatch scheduled rule to invoke an AWS Lambda function to copy the daily data from the source bucket in <code>us-east-1</code> region to the destination bucket in <code>us-west-1</code> region. Provide AWS KMS key access to the AWS Lambda function for encryption and decryption operations on the data in the source and destination Amazon S3 buckets</p>","<p>Create a new Amazon S3 bucket in the <code>us-east-1</code> region with replication enabled from this new bucket into another bucket in <code>us-west-1</code> region. Enable SSE-KMS encryption on the new bucket in <code>us-east-1</code> region by using an AWS KMS multi-region key. Copy the existing data from the current Amazon S3 bucket in <code>us-east-1</code> region into this new Amazon S3 bucket in <code>us-east-1</code> region</p>","<p>Change the AWS KMS single region key used for the current Amazon S3 bucket into an AWS KMS multi-region key. Enable Amazon S3 batch replication for the existing data in the current bucket in <code>us-east-1</code> region into another bucket in <code>us-west-1</code> region</p>","<p>Enable replication for the current bucket in <code>us-east-1</code> region into another bucket in <code>us-west-1</code> region. Share the existing AWS KMS key from <code>us-east-1</code> region to <code>us-west-1</code> region</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A company has historically operated only in the us-east-1 region and stores encrypted data in Amazon S3 using SSE-KMS. As part of enhancing its security posture as well as improving the backup and recovery architecture, the company wants to store the encrypted data in Amazon S3 that is replicated into the us-west-1 AWS region. The security policies mandate that the data must be encrypted and decrypted using the same key in both AWS regions.\n\nWhich of the following represents the best solution to address these requirements?","related_lectures":[]},{"_class":"assessment","id":157033925,"assessment_type":"multiple-choice","prompt":{"question":"<p>A wildlife research organization uses IoT-based motion sensors attached to thousands of migrating animals to monitor their movement across regions. Every few minutes, a sensor checks for significant movement and sends updated location data to a backend application running on Amazon EC2 instances spread across multiple Availability Zones in a single AWS Region. Recently, an unexpected surge in motion data overwhelmed the application, leading to lost location records with no mechanism to replay missed data. A solutions architect must redesign the ingestion mechanism to prevent future data loss and to minimize operational overhead.</p>\n\n<p>What should the solutions architect do to meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an Amazon Simple Queue Service (Amazon SQS) queue to buffer the incoming location data. Configure the backend application to poll the queue and process messages</strong></p>\n\n<p>Using Amazon Simple Queue Service (Amazon SQS) is the most appropriate and cost-effective solution for this scenario because it introduces a buffering layer between data ingestion and processing, which helps prevent data loss during traffic spikes. When the sensor detects movement and sends data, the message is stored in the SQS queue, allowing the backend EC2 application to process the data at its own pace. This asynchronous decoupling ensures high availability and scalability while significantly reducing the risk of dropped messages. SQS automatically scales to handle large volumes of messages and provides at-least-once delivery, making it resilient even during processing delays. Because SQS is a fully managed serverless service, it requires minimal operational overhead—no need to provision or manage servers, and built-in retry and dead-letter queue capabilities improve reliability further.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q47-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a containerized service using Amazon ECS with an internal queue built into the application layer. Configure the motion sensors to send location updates directly to the container endpoints</strong> - While using Amazon ECS with a custom-built queue may offer control, this solution introduces unnecessary complexity and operational overhead. The internal queue would need to handle scalability, durability, and retry logic, all of which are natively handled by AWS messaging services like SQS. Additionally, receiving traffic directly from thousands of sensors could overload the container endpoints, making this design less resilient to traffic bursts.</p>\n\n<p><strong>Deploy an Amazon Data Firehose delivery stream to collect the motion data. Configure it to deliver data to an S3 bucket where the application scans and processes the files periodically</strong> - Amazon Data Firehose is well-suited for streaming analytics and data lake ingestion but is not optimized for event-by-event processing with immediate responsiveness. Delivering data to Amazon S3 and then scanning it introduces latency and complexity in managing the processing loop. It also lacks a built-in retry mechanism for per-event failures unless additional services like Lambda are introduced, which increases operational overhead.</p>\n\n<p><strong>Implement an AWS IoT Core rule to route location updates directly from each sensor to Amazon SNS. Configure the application to poll the SNS topic for new messages</strong> - While AWS IoT Core is a suitable service for handling device-to-cloud communication, routing messages through Amazon SNS introduces architectural limitations for this use case. SNS is designed for push-based, fan-out notification patterns—not for buffering or decoupled message processing. Moreover, applications cannot poll an SNS topic, as SNS pushes messages to subscribers rather than allowing pull-based consumption. Attempting to use SNS as a message queue violates its design pattern, increasing the likelihood of message loss if the subscriber application is overwhelmed or unavailable.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\">https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/iot/latest/developerguide/iot-rules.html\">https://docs.aws.amazon.com/iot/latest/developerguide/iot-rules.html</a></p>\n","answers":["<p>Create an Amazon Simple Queue Service (Amazon SQS) queue to buffer the incoming location data. Configure the backend application to poll the queue and process messages</p>","<p>Set up a containerized service using Amazon ECS with an internal queue built into the application layer. Configure the motion sensors to send location updates directly to the container endpoints</p>","<p>Deploy an Amazon Data Firehose delivery stream to collect the motion data. Configure it to deliver data to an S3 bucket where the application scans and processes the files periodically</p>","<p>Implement an AWS IoT Core rule to route location updates directly from each sensor to Amazon SNS. Configure the application to poll the SNS topic for new messages</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A wildlife research organization uses IoT-based motion sensors attached to thousands of migrating animals to monitor their movement across regions. Every few minutes, a sensor checks for significant movement and sends updated location data to a backend application running on Amazon EC2 instances spread across multiple Availability Zones in a single AWS Region. Recently, an unexpected surge in motion data overwhelmed the application, leading to lost location records with no mechanism to replay missed data. A solutions architect must redesign the ingestion mechanism to prevent future data loss and to minimize operational overhead.\n\nWhat should the solutions architect do to meet these requirements?","related_lectures":[]},{"_class":"assessment","id":157033977,"assessment_type":"multiple-choice","prompt":{"question":"<p>Consider the following policy associated with an IAM group containing several users:</p>\n\n<pre><code>{\n    \"Version\":\"2012-10-17\",\n    \"Id\":\"EC2TerminationPolicy\",\n    \"Statement\":[\n        {\n            \"Effect\":\"Deny\",\n            \"Action\":\"ec2:*\",\n            \"Resource\":\"*\",\n            \"Condition\":{\n                \"StringNotEquals\":{\n                    \"ec2:Region\":\"us-west-1\"\n                }\n            }\n        },\n        {\n            \"Effect\":\"Allow\",\n            \"Action\":\"ec2:TerminateInstances\",\n            \"Resource\":\"*\",\n            \"Condition\":{\n                \"IpAddress\":{\n                    \"aws:SourceIp\":\"10.200.200.0/24\"\n                }\n            }\n        }\n    ]\n}\n</code></pre>\n\n<p>Which of the following options is correct?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Users belonging to the IAM user group can terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</strong></p>\n\n<p>The given policy denies all EC2 specification actions on all resources when the region of the underlying resource is not <code>us-west-1</code>. The policy allows the terminate EC2 action on all resources when the source IP address is in the CIDR range 10.200.200.0/24, therefore it would allow the user with the source IP 10.200.200.200 to terminate the Amazon EC2 instance.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Users belonging to the IAM user group cannot terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</strong></p>\n\n<p><strong>Users belonging to the IAM user group can terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the EC2 instance's IP address is 10.200.200.200</strong></p>\n\n<p><strong>Users belonging to the IAM user group can terminate an Amazon EC2 instance belonging to any region except the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/reference_policies_evaluation-logic.html</a></p>\n","answers":["<p>Users belonging to the IAM user group can terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</p>","<p>Users belonging to the IAM user group cannot terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</p>","<p>Users belonging to the IAM user group can terminate an Amazon EC2 instance in the <code>us-west-1</code> region when the EC2 instance's IP address is 10.200.200.200</p>","<p>Users belonging to the IAM user group can terminate an Amazon EC2 instance belonging to any region except the <code>us-west-1</code> region when the user's source IP is 10.200.200.200</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"Consider the following policy associated with an IAM group containing several users:\n\n{\n    \"Version\":\"2012-10-17\",\n    \"Id\":\"EC2TerminationPolicy\",\n    \"Statement\":[\n        {\n            \"Effect\":\"Deny\",\n            \"Action\":\"ec2:*\",\n            \"Resource\":\"*\",\n            \"Condition\":{\n                \"StringNotEquals\":{\n                    \"ec2:Region\":\"us-west-1\"\n                }\n            }\n        },\n        {\n            \"Effect\":\"Allow\",\n            \"Action\":\"ec2:TerminateInstances\",\n            \"Resource\":\"*\",\n            \"Condition\":{\n                \"IpAddress\":{\n                    \"aws:SourceIp\":\"10.200.200.0/24\"\n                }\n            }\n        }\n    ]\n}\n\n\nWhich of the following options is correct?","related_lectures":[]},{"_class":"assessment","id":157033919,"assessment_type":"multiple-choice","prompt":{"question":"<p>Your company has a monthly big data workload, running for about 2 hours, which can be efficiently distributed across multiple servers of various sizes, with a variable number of CPUs. The solution for the workload should be able to withstand server failures.</p>\n\n<p>Which is the MOST cost-optimal solution for this workload?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Run the workload on a Spot Fleet</strong></p>\n\n<p>The Spot Fleet selects the Spot Instance pools that meet your needs and launches Spot Instances to meet the target capacity for the fleet. By default, Spot Fleets are set to maintain target capacity by launching replacement instances after Spot Instances in the fleet are terminated.</p>\n\n<p>A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price. Spot Instances provide great cost efficiency, but we need to select an instance type in advance. In this case, we want to use the most cost-optimal option and leave the selection of the cheapest spot instance to a Spot Fleet request, which can be optimized with the <code>lowestPrice</code> strategy. So this is the correct option.</p>\n\n<p>Key Spot Instance Concepts:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q49-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Run the workload on Spot Instances</strong> - A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price. Because Spot Instances enable you to request unused Amazon EC2 instances at steep discounts, you can lower your Amazon EC2 costs significantly. The hourly price for a Spot Instance is called a Spot price. Only spot fleets can maintain target capacity by launching replacement instances after Spot Instances in the fleet are terminated, so spot instances, by themselves, are not the right fit for this use-case.</p>\n\n<p><strong>Run the workload on Reserved Instances (RI)</strong> -  Reserved Instances are less cost-optimized than Spot Instances, and most efficient when used continuously. Here the workload is once a month, so this is not efficient.</p>\n\n<p><strong>Run the workload on Dedicated Hosts</strong> - Amazon EC2 Dedicated Hosts allow you to use your eligible software licenses from vendors such as Microsoft and Oracle on Amazon EC2 so that you get the flexibility and cost-effectiveness of using your licenses, but with the resiliency, simplicity, and elasticity of AWS. An Amazon EC2 Dedicated Host is a physical server fully dedicated for your use, so you can help address corporate compliance requirement. They're not particularly cost-efficient. So this option is not correct.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-fleet.html#spot-fleet-allocation-strategy\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-fleet.html#spot-fleet-allocation-strategy</a></p>\n","answers":["<p>Run the workload on a Spot Fleet</p>","<p>Run the workload on Spot Instances</p>","<p>Run the workload on Reserved Instances (RI)</p>","<p>Run the workload on Dedicated Hosts</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"Your company has a monthly big data workload, running for about 2 hours, which can be efficiently distributed across multiple servers of various sizes, with a variable number of CPUs. The solution for the workload should be able to withstand server failures.\n\nWhich is the MOST cost-optimal solution for this workload?","related_lectures":[]},{"_class":"assessment","id":157033955,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial services company wants to store confidential data in Amazon S3 and it needs to meet the following data security and compliance norms:</p>\n\n<ol>\n<li>Encryption key usage must be logged for auditing purposes</li>\n<li>Encryption Keys must be rotated every year</li>\n<li>The data must be encrypted at rest</li>\n</ol>\n\n<p>Which is the MOST operationally efficient solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with automatic key rotation</strong></p>\n\n<p>Server-side encryption is the encryption of data at its destination by the application or service that receives it. Amazon S3 encrypts your data at the object level as it writes it to disks in its data centers and decrypts it for you when you access it.</p>\n\n<p>Amazon S3 now applies server-side encryption with Amazon S3 managed keys (SSE-S3) as the base level of encryption for every bucket in Amazon S3. Starting January 5, 2023, all new object uploads to Amazon S3 are automatically encrypted at no additional cost and with no impact on performance.</p>\n\n<p>Amazon S3 server-side encryption\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q50-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html</a></p>\n\n<p>AWS KMS is a service that combines secure, highly available hardware and software to provide a key management system scaled for the cloud. Amazon S3 uses server-side encryption with AWS KMS (SSE-KMS) to encrypt your S3 object data. Also, when SSE-KMS is requested for the object, the S3 checksum as part of the object's metadata, is stored in encrypted form.</p>\n\n<p>If you use KMS keys, you can use AWS KMS through the AWS Management Console or the AWS KMS API to do the following:</p>\n\n<ol>\n<li><p>Centrally create, view, edit, monitor, enable or disable, rotate, and schedule deletion of KMS keys.</p></li>\n<li><p>Define the policies that control how and by whom KMS keys can be used.</p></li>\n<li><p>Audit their usage to prove that they are being used correctly. Auditing is supported by the AWS KMS API, but not by the AWS KMSAWS Management Console.</p></li>\n</ol>\n\n<p>When you enable automatic key rotation for a KMS key, AWS KMS generates new cryptographic material for the KMS key every year.</p>\n\n<p>AWS KMS keys:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q50-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html\">https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html</a></p>\n\n<p>For the given use case, you can set up server-side encryption with AWS KMS Keys (SSE-KMS) with automatic key rotation.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with manual key rotation</strong> - Although it is possible to manually rotate the AWS KMS key, it is not the best fit solution as it is not operationally efficient.</p>\n\n<p><strong>Server-side encryption (SSE-S3) with automatic key rotation</strong> - When you use Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3), each object is encrypted with a unique key. As an additional safeguard, it encrypts the key itself with a root key that it regularly rotates. However, with SSE-S3, you cannot log the usage of the encryption key for auditing purposes. So this option is incorrect.</p>\n\n<p><strong>Server-side encryption with customer-provided keys (SSE-C) with automatic key rotation</strong> - It is possible to automatically rotate the customer-provided keys but you will need to develop the underlying solution to automate the key rotation. Therefore, this option is not operationally efficient.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#master_keys\">https://docs.aws.amazon.com/kms/latest/developerguide/concepts.html#master_keys</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html\">https://docs.aws.amazon.com/kms/latest/developerguide/rotate-keys.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html</a></p>\n","answers":["<p>Server-side encryption (SSE-S3) with automatic key rotation</p>","<p>Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with automatic key rotation</p>","<p>Server-side encryption with AWS Key Management Service (AWS KMS) keys (SSE-KMS) with manual key rotation</p>","<p>Server-side encryption with customer-provided keys (SSE-C) with automatic key rotation</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A financial services company wants to store confidential data in Amazon S3 and it needs to meet the following data security and compliance norms:\n\n\nEncryption key usage must be logged for auditing purposes\nEncryption Keys must be rotated every year\nThe data must be encrypted at rest\n\n\nWhich is the MOST operationally efficient solution?","related_lectures":[]},{"_class":"assessment","id":157033983,"assessment_type":"multiple-choice","prompt":{"question":"<p>A Machine Learning research group uses a proprietary computer vision application hosted on an Amazon EC2 instance. Every time the instance needs to be stopped and started again, the application takes about 3 minutes to start as some auxiliary software programs need to be executed so that the application can function. The research group would like to minimize the application boostrap time whenever the system needs to be stopped and then started at a later point in time.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend for this use-case?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon EC2 Instance Hibernate</strong></p>\n\n<p>When you hibernate an instance, AWS signals the operating system to perform hibernation (suspend-to-disk). Hibernation saves the contents from the instance memory (RAM) to your Amazon EBS root volume. AWS then persists the instance's Amazon EBS root volume and any attached Amazon EBS data volumes.</p>\n\n<p>When you start your instance:</p>\n\n<p>The Amazon EBS root volume is restored to its previous state</p>\n\n<p>The RAM contents are reloaded</p>\n\n<p>The processes that were previously running on the instance are resumed</p>\n\n<p>Previously attached data volumes are reattached and the instance retains its instance ID</p>\n\n<p>Overview of Amazon EC2 hibernation:\n<img src=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/images/hibernation-flow.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html</a></p>\n\n<p>By using Amazon EC2 hibernate, we have the capability to resume it at any point of time, with the application already launched, thus helping us cut the 3 minutes start time.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon EC2 User-Data</strong> - Amazon EC2 instance user data is the data that you specified in the form of a configuration script while launching your instance. Here, the problem is that the application takes 3 minutes to launch, no matter what. EC2 user data won't help us because it's just here to help us execute a list of commands, not speed them up.</p>\n\n<p><strong>Use Amazon EC2 Meta-Data</strong> - Amazon EC2 instance metadata is data about your instance that you can use to configure or manage the running instance. Instance metadata is divided into categories, for example, host name, events, and security groups. The EC2 meta-data is a distractor and can only help us determine some metadata attributes on our EC2 instances.</p>\n\n<p><strong>Create an Amazon Machine Image (AMI) and launch your Amazon EC2 instances from that</strong> - An Amazon Machine Image (AMI) provides the information required to launch an instance. You must specify an AMI when you launch an instance. You can launch multiple instances from a single AMI when you need multiple instances with the same configuration. You can use different AMIs to launch instances when you need instances with different configurations.</p>\n\n<p>Creating an AMI may help with all the system dependencies, but it won't help us with speeding up the application start time.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Hibernate.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-instance-metadata.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AMIs.html</a></p>\n","answers":["<p>Use Amazon EC2 Instance Hibernate</p>","<p>Use Amazon EC2 User-Data</p>","<p>Use Amazon EC2 Meta-Data</p>","<p>Create an Amazon Machine Image (AMI) and launch your Amazon EC2 instances from that</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A Machine Learning research group uses a proprietary computer vision application hosted on an Amazon EC2 instance. Every time the instance needs to be stopped and started again, the application takes about 3 minutes to start as some auxiliary software programs need to be executed so that the application can function. The research group would like to minimize the application boostrap time whenever the system needs to be stopped and then started at a later point in time.\n\nAs a solutions architect, which of the following solutions would you recommend for this use-case?","related_lectures":[]},{"_class":"assessment","id":157033933,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media company is migrating its flagship application from its on-premises data center to AWS for improving the application's read-scaling capability as well as its availability. The existing architecture leverages a Microsoft SQL Server database that sees a heavy read load. The engineering team does a full copy of the production database at the start of the business day to populate a dev database. During this period, application users face high latency leading to a bad user experience.</p>\n\n<p>The company is looking at alternate database options and migrating database engines if required. What would you suggest?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and create the dev database by restoring from the automated backups of Amazon Aurora</strong></p>\n\n<p>Amazon Aurora (Aurora) is a fully managed relational database engine that's compatible with MySQL and PostgreSQL. An Amazon Aurora DB cluster consists of one or more DB instances and a cluster volume that manages the data for those DB instances. An Aurora cluster volume is a virtual database storage volume that spans multiple Availability Zones (AZs), with each Availability Zone (AZ) having a copy of the Amazon Aurora DB cluster data. Aurora supports Multi-AZ Aurora Replicas that improve the application's read-scaling and availability.</p>\n\n<p>Amazon Aurora Overview:\n<img src=\"https://d1.awsstatic.com/Product-Page-Diagram_Amazon-Aurora_How-it-Works.b1c2b37e7548757780b195c6dcceb58511de5b1d.png\">\nvia - <a href=\"https://aws.amazon.com/rds/aurora/\">https://aws.amazon.com/rds/aurora/</a></p>\n\n<p>Aurora backs up your cluster volume automatically and retains restore data for the length of the backup retention period. Aurora backups are continuous and incremental so you can quickly restore to any point within the backup retention period. No performance impact or interruption of database service occurs as backup data is being written.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q52-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html</a></p>\n\n<p>Automated backups occur daily during the preferred backup window. If the backup requires more time than allotted to the backup window, the backup continues after the window ends, until it finishes. The backup window can't overlap with the weekly maintenance window for the DB cluster. Aurora backups are continuous and incremental, but the backup window is used to create a daily system backup that is preserved within the backup retention period. The latest restorable time for a DB cluster is the most recent point at which you can restore your DB cluster, typically within 5 minutes of the current time.</p>\n\n<p>For the given use case, you can create the dev database by restoring from the automated backups of Amazon Aurora.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and restore the dev database via mysqldump</strong> - Restoring the dev database via mysqldump would still result in a significant load on the primary DB, so this option fails to address the given requirement.</p>\n\n<p><strong>Leverage Amazon RDS for MySQL with a Multi-AZ deployment and use the standby instance as the dev database</strong> - The standby is there just for handling failover in a Multi-AZ deployment. You cannot access the standby instance and use it as a dev database. Hence this option is incorrect.</p>\n\n<p><strong>Leverage Amazon RDS for SQL server with a Multi-AZ deployment and read replicas. Use the read replica as the dev database</strong> - Amazon RDS supports Multi-AZ deployments for Microsoft SQL Server by using either SQL Server Database Mirroring (DBM) or Always On Availability Groups (AGs). Amazon RDS monitors and maintains the health of your Multi-AZ deployment.</p>\n\n<p>Multi-AZ deployments provide increased availability, data durability, and fault tolerance for DB instances. In the event of planned database maintenance or unplanned service disruption, Amazon RDS automatically fails over to the up-to-date secondary DB instance. For SQL Server, I/O activity is suspended briefly during backup for Multi-AZ deployments.</p>\n\n<p>A read replica is only meant to serve read traffic. The primary purpose of the read replica is to replicate the data in the primary DB instance. A read replica cannot be used as a dev database because it does not allow any database write operations.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Managing.Backups.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.ReadReplicas.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/SQLServer.ReadReplicas.html</a></p>\n","answers":["<p>Leverage Amazon RDS for MySQL with a Multi-AZ deployment and use the standby instance as the dev database</p>","<p>Leverage Amazon RDS for SQL server with a Multi-AZ deployment and read replicas. Use the read replica as the dev database</p>","<p>Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and create the dev database by restoring from the automated backups of Amazon Aurora</p>","<p>Leverage Amazon Aurora MySQL with Multi-AZ Aurora Replicas and restore the dev database via mysqldump</p>"]},"correct_response":["c"],"section":"Design Resilient Architectures","question_plain":"A media company is migrating its flagship application from its on-premises data center to AWS for improving the application's read-scaling capability as well as its availability. The existing architecture leverages a Microsoft SQL Server database that sees a heavy read load. The engineering team does a full copy of the production database at the start of the business day to populate a dev database. During this period, application users face high latency leading to a bad user experience.\n\nThe company is looking at alternate database options and migrating database engines if required. What would you suggest?","related_lectures":[]},{"_class":"assessment","id":157033881,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media publishing company is migrating its legacy content management application to AWS. Currently, the application and its MySQL database run on a single on-premises virtual machine, which creates a single point of failure and limits scalability. As traffic has increased due to growing reader engagement and video uploads, the company needs to redesign the solution to ensure automatic scaling, high availability, and separation of application and database layers. The company wants to continue using a MySQL-compatible engine and needs a cost-effective, managed solution that minimizes operational overhead.</p>\n\n<p>Which AWS architecture will best fulfill these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Migrate the application to Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Use Amazon Aurora Serverless v2 for MySQL to manage the database layer with auto-scaling and built-in high availability</strong></p>\n\n<p>This architecture provides automatic horizontal scaling for the application via an Auto Scaling group and managed, serverless scaling for the database layer with Amazon Aurora Serverless v2 for MySQL. Aurora Serverless v2 automatically adjusts capacity based on workload, and offers multi-AZ high availability, backups, and failover—all without requiring the company to manage the underlying database servers. It supports MySQL compatibility and is a cost-effective alternative to provisioned RDS when workloads are variable.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q53-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy the application to EC2 instances registered in a Network Load Balancer target group. Use Amazon ElastiCache for Redis as the database and configure it with Redis Streams for persistent storage</strong> - ElastiCache is a key-value store designed for caching, not as a replacement for a relational MySQL database. Redis does not support relational joins, transactions, or ACID compliance in the way MySQL does. Using it as a persistent store for structured application data would require significant re-architecture and compromises consistency.</p>\n\n<p><strong>Containerize the application and deploy it to Amazon ECS with EC2 launch type behind an Application Load Balancer. Use Amazon Neptune to store structured relational data with SQL-like queries</strong> - Amazon Neptune is a graph database designed for workloads that require graph models like social networks, recommendation engines, and knowledge graphs. It does not support SQL or relational schemas and is not compatible with MySQL. Using Neptune in place of a MySQL database would require entirely rearchitecting the data model and application queries.</p>\n\n<p><strong>Host the application on EC2 instances that are part of a target group for an Application Load Balancer. Create an Amazon RDS for MySQL Multi-AZ DB instance to provide high availability and automatic failover for the database</strong> - While Amazon RDS for MySQL with Multi-AZ offers high availability, it does not support automatic compute scaling for the database layer. If the workload grows, manual intervention is required to resize the instance or configure read replicas for performance. Also, RDS Multi-AZ provides failover, but not the instantaneous, granular auto-scaling offered by Aurora Serverless v2.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-serverless-v2.how-it-works.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/database/read-scalability-with-amazon-aurora-serverless-v2/\">https://aws.amazon.com/blogs/database/read-scalability-with-amazon-aurora-serverless-v2/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/database/introducing-scaling-to-0-capacity-with-amazon-aurora-serverless-v2/\">https://aws.amazon.com/blogs/database/introducing-scaling-to-0-capacity-with-amazon-aurora-serverless-v2/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/neptune/latest/userguide/intro.html\">https://docs.aws.amazon.com/neptune/latest/userguide/intro.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html\">https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/WhatIs.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_MySQL.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/CHAP_MySQL.html</a></p>\n","answers":["<p>Migrate the application to Amazon EC2 instances in an Auto Scaling group behind an Application Load Balancer. Use Amazon Aurora Serverless v2 for MySQL to manage the database layer with auto-scaling and built-in high availability</p>","<p>Deploy the application to EC2 instances registered in a Network Load Balancer target group. Use Amazon ElastiCache for Redis as the database and configure it with Redis Streams for persistent storage</p>","<p>Containerize the application and deploy it to Amazon ECS with EC2 launch type behind an Application Load Balancer. Use Amazon Neptune to store structured relational data with SQL-like queries</p>","<p>Host the application on EC2 instances that are part of a target group for an Application Load Balancer. Create an Amazon RDS for MySQL Multi-AZ DB instance to provide high availability and automatic failover for the database</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A media publishing company is migrating its legacy content management application to AWS. Currently, the application and its MySQL database run on a single on-premises virtual machine, which creates a single point of failure and limits scalability. As traffic has increased due to growing reader engagement and video uploads, the company needs to redesign the solution to ensure automatic scaling, high availability, and separation of application and database layers. The company wants to continue using a MySQL-compatible engine and needs a cost-effective, managed solution that minimizes operational overhead.\n\nWhich AWS architecture will best fulfill these requirements?","related_lectures":[]},{"_class":"assessment","id":157033969,"assessment_type":"multiple-choice","prompt":{"question":"<p>Which of the following IAM policies provides read-only access to the Amazon S3 bucket <code>mybucket</code> and its content?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      },\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      }\n   ]\n}\n</code></pre>\n\n<p>You manage access in AWS by creating policies and attaching them to IAM identities (users, groups of users, or roles) or AWS resources. A policy is an object in AWS that, when associated with an identity or resource, defines their permissions. AWS evaluates these policies when an IAM principal (user or role) makes a request. Permissions in the policies determine whether the request is allowed or denied. Most policies are stored in AWS as JSON documents. AWS supports six types of policies: identity-based policies, resource-based policies, permissions boundaries, service control policy (SCP)of AWS Organizations, access control list (ACL), and session policies.</p>\n\n<p><code>s3:ListBucket</code> is applied to buckets, so the ARN is in the form  <code>\"Resource\":\"arn:aws:s3:::mybucket\"</code>, without a trailing <code>/</code>\n<code>s3:GetObject</code> is applied to objects within the bucket, so the ARN is in the form <code>\"Resource\":\"arn:aws:s3:::mybucket/*\"</code>, with a trailing <code>/*</code> to indicate all objects within the bucket <code>mybucket</code></p>\n\n<p>Therefore, this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\",\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      }\n   ]\n}\n</code></pre>\n\n<p>This option is incorrect as it provides read-only access only to the bucket, not its contents.</p>\n\n<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\",\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      }\n   ]\n}\n</code></pre>\n\n<p>This option is incorrect as it provides read-only access only to the objects within the bucket and it does not provide listBucket permissions to the bucket itself.</p>\n\n<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      },\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      }\n   ]\n}\n</code></pre>\n\n<p>This option is incorrect as it provides listing access only to the bucket contents.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/security/writing-iam-policies-how-to-grant-access-to-an-amazon-s3-bucket/\">https://aws.amazon.com/blogs/security/writing-iam-policies-how-to-grant-access-to-an-amazon-s3-bucket/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html</a></p>\n","answers":["<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      },\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      }\n   ]\n}\n</code></pre>","<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\",\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      }\n   ]\n}\n</code></pre>","<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\",\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      }\n   ]\n}\n</code></pre>","<pre><code>{\n   \"Version\":\"2012-10-17\",\n   \"Statement\":[\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:ListBucket\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket/*\"\n      },\n      {\n         \"Effect\":\"Allow\",\n         \"Action\":[\n            \"s3:GetObject\"\n         ],\n         \"Resource\":\"arn:aws:s3:::mybucket\"\n      }\n   ]\n}\n</code></pre>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"Which of the following IAM policies provides read-only access to the Amazon S3 bucket mybucket and its content?","related_lectures":[]},{"_class":"assessment","id":157033873,"assessment_type":"multi-select","prompt":{"question":"<p>An HTTP application is deployed on an Auto Scaling Group, is accessible from an Application Load Balancer (ALB) that provides HTTPS termination, and accesses a PostgreSQL database managed by Amazon RDS.</p>\n\n<p>How should you configure the security groups? (Select three)</p>\n","relatedLectureIds":"","feedbacks":["","","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 5432</strong></p>\n\n<p><strong>The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Application Load Balancer on port 80</strong></p>\n\n<p><strong>The security group of the Application Load Balancer should have an inbound rule from anywhere on port 443</strong></p>\n\n<p>A security group acts as a virtual firewall that controls the traffic for one or more instances. When you launch an instance, you can specify one or more security groups; otherwise, we use the default security group. You can add rules to each security group that allows traffic to or from its associated instances. You can modify the rules for a security group at any time; the new rules are automatically applied to all instances that are associated with the security group. When we decide whether to allow traffic to reach an instance, we evaluate all the rules from all the security groups that are associated with the instance.</p>\n\n<p>The following are the characteristics of security group rules:\n1. By default, security groups allow all outbound traffic.\n2. Security group rules are always permissive; you can't create rules that deny access.\n3. Security groups are stateful</p>\n\n<p>PostgreSQL port = 5432\nHTTP port = 80\nHTTPS port = 443</p>\n\n<p>The traffic goes like this :\nThe client sends an HTTPS request to ALB on port 443. This is handled by the rule - \"The security group of the Application Load Balancer should have an inbound rule from anywhere on port 443\"</p>\n\n<p>The Application Load Balancer then forwards the request to one of the Amazon EC2 instances. This is handled by the rule - \"The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Application Load Balancer on port 80\"</p>\n\n<p>The Amazon EC2 instance further accesses the PostgreSQL database managed by Amazon RDS on port 5432. This is handled by the rule - \"The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 5432\"</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The security group of the Application Load Balancer should have an inbound rule from anywhere on port 80</strong> - The client sends an HTTPS request to ALB on port 443 and not on port 80, so this is incorrect.</p>\n\n<p><strong>The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Amazon RDS database on port 5432</strong> - The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Application Load Balancer and not from the security group of the Amazon RDS database, so this option is incorrect.</p>\n\n<p><strong>The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 80</strong> - The Amazon EC2 instance further accesses the PostgreSQL database managed by Amazon RDS on port 5432 and not on port 80, so this option is incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html</a></p>\n","answers":["<p>The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 5432</p>","<p>The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Application Load Balancer on port 80</p>","<p>The security group of the Application Load Balancer should have an inbound rule from anywhere on port 443</p>","<p>The security group of the Application Load Balancer should have an inbound rule from anywhere on port 80</p>","<p>The security group of the Amazon EC2 instances should have an inbound rule from the security group of the Amazon RDS database on port 5432</p>","<p>The security group of Amazon RDS should have an inbound rule from the security group of the Amazon EC2 instances in the Auto Scaling group on port 80</p>"]},"correct_response":["a","b","c"],"section":"Design Secure Architectures","question_plain":"An HTTP application is deployed on an Auto Scaling Group, is accessible from an Application Load Balancer (ALB) that provides HTTPS termination, and accesses a PostgreSQL database managed by Amazon RDS.\n\nHow should you configure the security groups? (Select three)","related_lectures":[]},{"_class":"assessment","id":157033989,"assessment_type":"multiple-choice","prompt":{"question":"<p>Your company has an on-premises Distributed File System Replication (DFSR) service to keep files synchronized on multiple Windows servers, and would like to migrate to AWS cloud.</p>\n\n<p>What do you recommend as a replacement for the DFSR?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon FSx for Windows File Server</strong></p>\n\n<p>Amazon FSx for Windows File Server provides fully managed, highly reliable file storage that is accessible over the industry-standard Service Message Block (SMB) protocol.  It is built on Windows Server, delivering a wide range of administrative features such as user quotas, end-user file restore, and Microsoft Active Directory (AD) integration.\nThe Distributed File System Replication (DFSR) service is a new multi-master replication engine that is used to keep folders synchronized on multiple servers. Amazon FSx supports the use of Microsoft’s Distributed File System (DFS) to organize shares into a single folder structure up to hundreds of PB in size.</p>\n\n<p>Amazon FSx for Windows is a perfect distributed file system, with replication capability, and can be mounted on Windows.</p>\n\n<p>How Amazon FSx for Windows Works:\n<img src=\"https://d1.awsstatic.com/r2018/b/FSx-Windows/FSx_Windows_File_Server_How-it-Works.9396055e727c3903de991e7f3052ec295c86f274.png\">\nvia - <a href=\"https://aws.amazon.com/fsx/windows/\">https://aws.amazon.com/fsx/windows/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon FSx for Lustre</strong> - Amazon FSx for Lustre makes it easy and cost-effective to launch and run the world’s most popular high-performance file system. It is used for workloads such as machine learning, high-performance computing (HPC), video processing, and financial modeling. The open-source Lustre file system is designed for applications that require fast storage – where you want your storage to keep up with your compute. Amazon FSx enables you to use Lustre file systems for any workload where storage speed matters. FSx for Lustre integrates with Amazon S3, making it easy to process data sets with the Lustre file system. Amazon FSx for Lustre is for Linux only, so this option is incorrect.</p>\n\n<p><strong>Amazon Elastic File System (Amazon EFS)</strong> - Amazon Elastic File System (Amazon EFS) provides a simple, scalable, fully managed elastic NFS file system for use with AWS Cloud services and on-premises resources. It is built to scale on-demand to petabytes without disrupting applications, growing and shrinking automatically as you add and remove files, eliminating the need to provision and manage capacity to accommodate growth. Amazon EFS is a network file system but for Linux only, so this option is incorrect.</p>\n\n<p><strong>Amazon Simple Storage Service (Amazon S3)</strong> - Amazon Simple Storage Service (Amazon S3) is an object storage service that offers industry-leading scalability, data availability, security, and performance. Amazon S3 cannot be mounted as a file system on Windows, so this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.microsoft.com/en-us/previous-versions/windows/desktop/dfsr/dfsr-overview\">https://docs.microsoft.com/en-us/previous-versions/windows/desktop/dfsr/dfsr-overview</a></p>\n\n<p><a href=\"https://aws.amazon.com/fsx/windows/\">https://aws.amazon.com/fsx/windows/</a></p>\n\n<p><a href=\"https://aws.amazon.com/fsx/lustre/\">https://aws.amazon.com/fsx/lustre/</a></p>\n","answers":["<p>Amazon FSx for Windows File Server</p>","<p>Amazon FSx for Lustre</p>","<p>Amazon Elastic File System (Amazon EFS)</p>","<p>Amazon Simple Storage Service (Amazon S3)</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"Your company has an on-premises Distributed File System Replication (DFSR) service to keep files synchronized on multiple Windows servers, and would like to migrate to AWS cloud.\n\nWhat do you recommend as a replacement for the DFSR?","related_lectures":[]},{"_class":"assessment","id":157033987,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail company wants to share sensitive accounting data that is stored in an Amazon RDS database instance with an external auditor. The auditor has its own AWS account and needs its own copy of the database.</p>\n\n<p>Which of the following would you recommend to securely share the database with the auditor?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an encrypted snapshot of the database, share the snapshot, and allow access to the AWS Key Management Service (AWS KMS) encryption key</strong></p>\n\n<p>You can share the AWS Key Management Service (AWS KMS) key that was used to encrypt the snapshot with any accounts that you want to be able to access the snapshot. You can share AWS KMS Key with another AWS account by adding the other account to the AWS KMS key policy.</p>\n\n<p>Making an encrypted snapshot of the database will give the auditor a copy of the database, as required for the given use case.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a snapshot of the database in Amazon S3 and assign an IAM role to the auditor to grant access to the object in that bucket</strong> - Amazon RDS stores the DB snapshots in the Amazon S3 bucket belonging to the same AWS region where the Amazon RDS instance is located. Amazon RDS stores these on your behalf and you do not have direct access to these snapshots in Amazon S3, so it's not possible to grant access to the snapshot objects in Amazon S3.</p>\n\n<p><strong>Export the database contents to text files, store the files in Amazon S3, and create a new IAM user for the auditor with access to that bucket</strong> - This solution is feasible though not optimal. It requires a lot of unnecessary work and is difficult to audit when such bulk data is exported into text files.</p>\n\n<p><strong>Set up a read replica of the database and configure IAM standard database authentication to grant the auditor access</strong> - Read Replicas make it easy to elastically scale out beyond the capacity constraints of a single DB instance for read-heavy database workloads. Creating Read Replicas for audit purposes is overkill. Also, the question mentions that the auditor needs to have their own copy of the database, which is not possible with replicas.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ShareSnapshot.html</a></p>\n","answers":["<p>Create an encrypted snapshot of the database, share the snapshot, and allow access to the AWS Key Management Service (AWS KMS) encryption key</p>","<p>Create a snapshot of the database in Amazon S3 and assign an IAM role to the auditor to grant access to the object in that bucket</p>","<p>Export the database contents to text files, store the files in Amazon S3, and create a new IAM user for the auditor with access to that bucket</p>","<p>Set up a read replica of the database and configure IAM standard database authentication to grant the auditor access</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A retail company wants to share sensitive accounting data that is stored in an Amazon RDS database instance with an external auditor. The auditor has its own AWS account and needs its own copy of the database.\n\nWhich of the following would you recommend to securely share the database with the auditor?","related_lectures":[]},{"_class":"assessment","id":157033907,"assessment_type":"multiple-choice","prompt":{"question":"<p>An enterprise is building a secure business intelligence API using Amazon API Gateway to serve internal users with confidential analytics data. The API must be accessible only from a set of trusted IP addresses that are part of the organization's internal network ranges. No external IP traffic should be able to invoke the API. A solutions architect must design this access control mechanism with the least operational complexity.</p>\n\n<p>What should the architect do to meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a resource policy for the API Gateway API that explicitly denies access to all IP addresses except those listed in an allow list</strong></p>\n\n<p>This is the most appropriate and secure solution to restrict access to an Amazon API Gateway endpoint based on IP addresses. API Gateway supports resource policies, which are IAM-style JSON policies that you attach directly to your REST or HTTP APIs. These policies can use IpAddress and NotIpAddress conditions to enforce fine-grained network controls. By configuring a policy that explicitly denies all IPs except for the trusted internal IP ranges, the company can ensure that only requests originating from its internal network are allowed to invoke the API. This approach provides centralized, declarative access control without the need for additional infrastructure changes, and it aligns with AWS best practices for managing access to public APIs that carry sensitive data.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy the API Gateway as a regional API in a public subnet and associate the subnet with a security group that permits inbound traffic only from trusted IP ranges</strong> - API Gateway is a fully managed service and does not run inside user-created subnets — public or private — so you cannot associate it with a subnet or a security group. Security groups are used for Amazon VPC-based resources such as EC2 instances, not API Gateway endpoints. While you can use regional APIs to serve clients directly, IP-based access control must be implemented using API Gateway resource policies, not VPC security groups or subnet-level controls. This makes the solution invalid for restricting access to specific IPs.</p>\n\n<p><strong>Deploy the API Gateway resource to an on-premises server using AWS Outposts. Apply host-based firewall rules to filter allowed IPs</strong> - Deploying the API to an on-premises server via AWS Outposts is not only unnecessary but also misaligned with the use of API Gateway, which is a fully managed AWS service that resides in the cloud. Using Outposts would dramatically increase cost and operational complexity and would not apply to the native API Gateway access control mechanisms such as resource policies or usage plans.</p>\n\n<p><strong>Modify the security group that is attached to API Gateway to allow only traffic from specific IP addresses</strong> - API Gateway does not use security groups because it is a managed service that is not deployed into a VPC by default. Security groups apply to resources like EC2 instances, RDS databases, or Lambda functions within a VPC. Therefore, this option is not valid for controlling inbound access to an API Gateway endpoint.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-resource-policies.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-resource-policies.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html\">https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html</a></p>\n","answers":["<p>Create a resource policy for the API Gateway API that explicitly denies access to all IP addresses except those listed in an allow list</p>","<p>Deploy the API Gateway as a regional API in a public subnet and associate the subnet with a security group that permits inbound traffic only from trusted IP ranges</p>","<p>Deploy the API Gateway resource to an on-premises server using AWS Outposts. Apply host-based firewall rules to filter allowed IPs</p>","<p>Modify the security group that is attached to API Gateway to allow only traffic from specific IP addresses</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"An enterprise is building a secure business intelligence API using Amazon API Gateway to serve internal users with confidential analytics data. The API must be accessible only from a set of trusted IP addresses that are part of the organization's internal network ranges. No external IP traffic should be able to invoke the API. A solutions architect must design this access control mechanism with the least operational complexity.\n\nWhat should the architect do to meet these requirements?","related_lectures":[]},{"_clas
