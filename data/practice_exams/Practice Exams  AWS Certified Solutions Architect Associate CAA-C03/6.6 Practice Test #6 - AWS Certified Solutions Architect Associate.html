ons are incorrect.</p>\n\n<p><strong>Create one Amazon SQS standard queue. Set the visibility timeout of the pro photos to zero. Set up Amazon EC2 instances to prioritize visibility settings so pro photos are processed first</strong> - To prevent other consumers from processing the message again, Amazon SQS sets a visibility timeout, a period of time during which Amazon SQS prevents other consumers from receiving and processing the message. The default visibility timeout for a message is 30 seconds. The minimum is 0 seconds. The maximum is 12 hours. Setting visibility timeout to zero can result in the same pro photo being processed by more than one consumer. This does not help in prioritizing the processing of pro photos over the lite photos.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/images/sqs-visibility-timeout-diagram.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/sqs/features/\">https://aws.amazon.com/sqs/features/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-visibility-timeout.html</a></p>\n","answers":["<p>Create two Amazon SQS standard queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling</p>","<p>Create two Amazon SQS standard queues: one for pro and one for lite. Set up Amazon EC2 instances to prioritize polling for the pro queue over the lite queue</p>","<p>Create two Amazon SQS FIFO queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling</p>","<p>Create one Amazon SQS standard queue. Set the visibility timeout of the pro photos to zero. Set up Amazon EC2 instances to prioritize visibility settings so pro photos are processed first</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A social media application lets users upload photos and perform image editing operations. The application offers two classes of service: pro and lite. The product team wants the photos submitted by pro users to be processed before those submitted by lite users. Photos are uploaded to Amazon S3 and the job information is sent to Amazon SQS.\n\nAs a solutions architect, which of the following solutions would you recommend?","related_lectures":[]},{"_class":"assessment","id":130168975,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial services company is looking to move its on-premises IT infrastructure to AWS Cloud. The company has multiple long-term server bound licenses across the application stack and the CTO wants to continue to utilize those licenses while moving to AWS.</p>\n\n<p>As a solutions architect, which of the following would you recommend as the MOST cost-effective solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon EC2 dedicated hosts</strong></p>\n\n<p>You can use Dedicated Hosts to launch Amazon EC2 instances on physical servers that are dedicated for your use. Dedicated Hosts give you additional visibility and control over how instances are placed on a physical server, and you can reliably use the same physical server over time. As a result, Dedicated Hosts enable you to use your existing server-bound software licenses like Windows Server and address corporate compliance and regulatory requirements.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon EC2 dedicated instances</strong> - Dedicated instances are Amazon EC2 instances that run in a VPC on hardware that's dedicated to a single customer. Your dedicated instances are physically isolated at the host hardware level from instances that belong to other AWS accounts. Dedicated instances may share hardware with other instances from the same AWS account that are not dedicated instances. Dedicated instances cannot be used for existing server-bound software licenses.</p>\n\n<p><strong>Use Amazon EC2 on-demand instances</strong></p>\n\n<p><strong>Use Amazon EC2 reserved instances (RI)</strong></p>\n\n<p>Amazon EC2 presents a virtual computing environment, allowing you to use web service interfaces to launch instances with a variety of operating systems, load them with your custom application environment, manage your network’s access permissions, and run your image using as many or few systems as you desire.</p>\n\n<p>Amazon EC2 provides the following purchasing options to enable you to optimize your costs based on your needs:</p>\n\n<p>On-Demand Instances – Pay, by the second, for the instances that you launch.</p>\n\n<p>Reserved Instances (RI) – Reduce your Amazon EC2 costs by making a commitment to a consistent instance configuration, including instance type and Region, for a term of 1 or 3 years.</p>\n\n<p>Neither on-demand instances nor reserved instances can be used for existing server-bound software licenses.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/ec2/dedicated-hosts/\">https://aws.amazon.com/ec2/dedicated-hosts/</a></p>\n\n<p><a href=\"https://aws.amazon.com/ec2/dedicated-hosts/faqs/\">https://aws.amazon.com/ec2/dedicated-hosts/faqs/</a></p>\n\n<p><a href=\"https://aws.amazon.com/ec2/pricing/dedicated-instances/\">https://aws.amazon.com/ec2/pricing/dedicated-instances/</a></p>\n","answers":["<p>Use Amazon EC2 on-demand instances</p>","<p>Use Amazon EC2 reserved instances (RI)</p>","<p>Use Amazon EC2 dedicated instances</p>","<p>Use Amazon EC2 dedicated hosts</p>"]},"correct_response":["d"],"section":"Design Cost-Optimized Architectures","question_plain":"A financial services company is looking to move its on-premises IT infrastructure to AWS Cloud. The company has multiple long-term server bound licenses across the application stack and the CTO wants to continue to utilize those licenses while moving to AWS.\n\nAs a solutions architect, which of the following would you recommend as the MOST cost-effective solution?","related_lectures":[]},{"_class":"assessment","id":130168977,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media company has its corporate headquarters in Los Angeles with an on-premises data center using an AWS Direct Connect connection to the AWS VPC. The branch offices in San Francisco and Miami use AWS Site-to-Site VPN connections to connect to the AWS VPC. The company is looking for a solution to have the branch offices send and receive data with each other as well as with their corporate headquarters.</p>\n\n<p>As a solutions architect, which of the following AWS services would you recommend addressing this use-case?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>AWS VPN CloudHub</strong></p>\n\n<p>If you have multiple AWS Site-to-Site VPN connections, you can provide secure communication between sites using the AWS VPN CloudHub. This enables your remote sites to communicate with each other, and not just with the VPC. Sites that use AWS Direct Connect connections to the virtual private gateway can also be part of the AWS VPN CloudHub. The VPN CloudHub operates on a simple hub-and-spoke model that you can use with or without a VPC. This design is suitable if you have multiple branch offices and existing internet connections and would like to implement a convenient, potentially low-cost hub-and-spoke model for primary or backup connectivity between these remote offices.</p>\n\n<p>Per the given use-case, the corporate headquarters has an AWS Direct Connect connection to the VPC and the branch offices have Site-to-Site VPN connections to the VPC. Therefore using the AWS VPN CloudHub, branch offices can send and receive data with each other as well as with their corporate headquarters.</p>\n\n<p>AWS VPN CloudHub:\n<img src=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/images/AWS_VPN_CloudHub-diagram.png\">\nvia - <a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPN_CloudHub.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/VPN_CloudHub.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>VPC Endpoint</strong> - A VPC endpoint enables you to privately connect your VPC to supported AWS services and VPC endpoint services powered by AWS PrivateLink without requiring an internet gateway, NAT device, VPN connection, or AWS Direct Connect connection. Instances in your VPC do not require public IP addresses to communicate with resources in the service. AWS PrivateLink simplifies the security of data shared with cloud-based applications by eliminating the exposure of data to the public Internet.\nWhen you use VPC endpoint, the traffic between your VPC and the other AWS service does not leave the Amazon network, therefore this option cannot be used to send and receive data between the remote branch offices of the company.</p>\n\n<p><strong>VPC Peering connection</strong> - A VPC peering connection is a networking connection between two VPCs that enables you to route traffic between them using private IPv4 addresses or IPv6 addresses. Instances in either VPC can communicate with each other as if they are within the same network.\nVPC peering facilitates a connection between two VPCs within the AWS network, therefore this option cannot be used to send and receive data between the remote branch offices of the company.</p>\n\n<p><strong>Software VPN</strong> - Amazon VPC offers you the flexibility to fully manage both sides of your Amazon VPC connectivity by creating a VPN connection between your remote network and a software VPN appliance running in your Amazon VPC network. Since Software VPN just handles connectivity between the remote network and Amazon VPC, therefore it cannot be used to send and receive data between the remote branch offices of the company.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/aws-vpn-cloudhub-network-to-amazon.html\">https://docs.aws.amazon.com/whitepapers/latest/aws-vpc-connectivity-options/aws-vpn-cloudhub-network-to-amazon.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPN_CloudHub.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/VPN_CloudHub.html</a></p>\n","answers":["<p>VPC Peering connection</p>","<p>AWS VPN CloudHub</p>","<p>Software VPN</p>","<p>VPC Endpoint</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A media company has its corporate headquarters in Los Angeles with an on-premises data center using an AWS Direct Connect connection to the AWS VPC. The branch offices in San Francisco and Miami use AWS Site-to-Site VPN connections to connect to the AWS VPC. The company is looking for a solution to have the branch offices send and receive data with each other as well as with their corporate headquarters.\n\nAs a solutions architect, which of the following AWS services would you recommend addressing this use-case?","related_lectures":[]},{"_class":"assessment","id":130168979,"assessment_type":"multi-select","prompt":{"question":"<p>A company's real-time streaming application is running on AWS. As the data is ingested, a job runs on the data and takes 30 minutes to complete. The workload frequently experiences high latency due to large amounts of incoming data. A solutions architect needs to design a scalable and serverless solution to enhance performance.</p>\n\n<p>Which combination of steps should the solutions architect take? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Set up Amazon Kinesis Data Streams to ingest the data</strong></p>\n\n<p><strong>Set up AWS Fargate with Amazon ECS to process the data</strong></p>\n\n<p>Amazon Kinesis Data Streams (KDS) is a massively scalable and durable real-time data streaming service. KDS can continuously capture gigabytes of data per second from hundreds of thousands of sources such as website clickstreams, database event streams, financial transactions, social media feeds, IT logs, and location-tracking events. The data collected is available in milliseconds to enable real-time analytics use cases such as real-time dashboards, real-time anomaly detection, dynamic pricing, and more.</p>\n\n<p>AWS Fargate is a serverless compute engine for containers that works with both Amazon Elastic Container Service (ECS) and Amazon Elastic Kubernetes Service (EKS). Fargate makes it easy for you to focus on building your applications. Fargate removes the need to provision and manage servers, lets you specify and pay for resources per application, and improves security through application isolation by design.</p>\n\n<p>For the given use case, we can use Kinesis Data Streams as the ingestion layer and the containerized ECS application on AWS Fargate as the processing layer. Both these components are serverless and can scale to offer the desired performance.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up AWS Database Migration Service (AWS DMS) to ingest the data</strong> - AWS Database Migration Service helps you migrate databases to AWS quickly and securely. DMS cannot be used for real-time data ingestion. Hence, this option is incorrect.</p>\n\n<p><strong>Set up AWS Lambda with AWS Step Functions to process the data</strong> - The maximum timeout value for any AWS Lambda function is 15 minutes. When the specified timeout is reached, AWS Lambda terminates the execution of your Lambda function. Since the use case talks about a job that runs for 30 minutes, Lambda is not an option here.</p>\n\n<p><strong>Provision Amazon EC2 instances in an Auto Scaling group to process the data</strong> - The given requirement is for a serverless solution to process the data. Hence, provisioning an Amazon EC2 instance is clearly not the right solution.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/big-data/building-a-scalable-streaming-data-processor-with-amazon-kinesis-data-streams-on-aws-fargate/\">https://aws.amazon.com/blogs/big-data/building-a-scalable-streaming-data-processor-with-amazon-kinesis-data-streams-on-aws-fargate/</a></p>\n","answers":["<p>Set up AWS Database Migration Service (AWS DMS) to ingest the data</p>","<p>Set up AWS Lambda with AWS Step Functions to process the data</p>","<p>Set up Amazon Kinesis Data Streams to ingest the data</p>","<p>Provision Amazon EC2 instances in an Auto Scaling group to process the data</p>","<p>Set up AWS Fargate with Amazon ECS to process the data</p>"]},"correct_response":["c","e"],"section":"Design High-Performing Architectures","question_plain":"A company's real-time streaming application is running on AWS. As the data is ingested, a job runs on the data and takes 30 minutes to complete. The workload frequently experiences high latency due to large amounts of incoming data. A solutions architect needs to design a scalable and serverless solution to enhance performance.\n\nWhich combination of steps should the solutions architect take? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168981,"assessment_type":"multiple-choice","prompt":{"question":"<p>A biotechnology company has multiple High Performance Computing (HPC) workflows that quickly and accurately process and analyze genomes for hereditary diseases. The company is looking to migrate these workflows from their on-premises infrastructure to AWS Cloud.</p>\n\n<p>As a solutions architect, which of the following networking components would you recommend on the Amazon EC2 instances running these HPC workflows?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Elastic Fabric Adapter (EFA)</strong></p>\n\n<p>An Elastic Fabric Adapter (EFA) is a network device that you can attach to your Amazon EC2 instance to accelerate High Performance Computing (HPC) and machine learning applications. It enhances the performance of inter-instance communication that is critical for scaling HPC and machine learning applications. EFA devices provide all Elastic Network Adapter (ENA) devices functionalities plus a new OS bypass hardware interface that allows user-space applications to communicate directly with the hardware-provided reliable transport functionality.</p>\n\n<p>How Elastic Fabric Adapter Works:\n<img src=\"https://d1.awsstatic.com/Product-Page-Diagram_Elastic-Fabric-Adapter_How-it-Works_updated.2a51303e17a203eb094ab098ebc31a61dab66365.png\">\nvia - <a href=\"https://aws.amazon.com/hpc/efa/\">https://aws.amazon.com/hpc/efa/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Elastic Network Interface (ENI)</strong> - An Elastic Network Interface (ENI) is a logical networking component in a VPC that represents a virtual network card. You can create a network interface, attach it to an instance, detach it from an instance, and attach it to another instance. The ENI is the simplest networking component available on AWS and is insufficient for HPC workflows.</p>\n\n<p><strong>Elastic Network Adapter (ENA)</strong> - Elastic Network Adapter (ENA) devices support enhanced networking via single root I/O virtualization (SR-IOV) to provide high-performance networking capabilities. Although enhanced networking provides higher bandwidth, higher packet per second (PPS) performance, and consistently lower inter-instance latencies, still EFA is a better fit for the given use-case because the EFA device provides all the functionality of an ENA device, plus hardware support for applications to communicate directly with the EFA device without involving the instance kernel (OS-bypass communication) using an extended programming interface.</p>\n\n<p><strong>Elastic IP Address (EIP)</strong> - An Elastic IP address (EIP) is a static IPv4 address associated with your AWS account. An Elastic IP address is a public IPv4 address, which is reachable from the internet. It is not a networking device that can be used to facilitate HPC workflows.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/efa.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/efa.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/hpc/efa/\">https://aws.amazon.com/hpc/efa/</a></p>\n","answers":["<p>Elastic Fabric Adapter (EFA)</p>","<p>Elastic Network Interface (ENI)</p>","<p>Elastic Network Adapter (ENA)</p>","<p>Elastic IP Address (EIP)</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A biotechnology company has multiple High Performance Computing (HPC) workflows that quickly and accurately process and analyze genomes for hereditary diseases. The company is looking to migrate these workflows from their on-premises infrastructure to AWS Cloud.\n\nAs a solutions architect, which of the following networking components would you recommend on the Amazon EC2 instances running these HPC workflows?","related_lectures":[]},{"_class":"assessment","id":130168983,"assessment_type":"multiple-choice","prompt":{"question":"<p>An IT company is using Amazon Simple Queue Service (Amazon SQS) queues for decoupling the various components of application architecture. As the consuming components need additional time to process Amazon Simple Queue Service (Amazon SQS) messages, the company wants to postpone the delivery of new messages to the queue for a few seconds.</p>\n\n<p>As a solutions architect, which of the following solutions would you suggest to the company?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use delay queues to postpone the delivery of new messages to the queue for a few seconds</strong></p>\n\n<p>Amazon Simple Queue Service (SQS) is a fully managed message queuing service that enables you to decouple and scale microservices, distributed systems, and serverless applications. Amazon SQS offers two types of message queues. Standard queues offer maximum throughput, best-effort ordering, and at-least-once delivery. Amazon SQS FIFO queues are designed to guarantee that messages are processed exactly once, in the exact order that they are sent.</p>\n\n<p>Delay queues let you postpone the delivery of new messages to a queue for several seconds, for example, when your consumer application needs additional time to process messages. If you create a delay queue, any messages that you send to the queue remain invisible to consumers for the duration of the delay period. The default (minimum) delay for a queue is 0 seconds. The maximum is 15 minutes.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/images/sqs-delay-queues-diagram.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-delay-queues.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-delay-queues.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon SQS FIFO queues to postpone the delivery of new messages to the queue for a few seconds</strong> - Amazon SQS FIFO (First-In-First-Out) queues are designed to guarantee that messages are processed exactly once, in the exact order that they are sent. You cannot use Amazon SQS FIFO queues to postpone the delivery of new messages to the queue for a few seconds.</p>\n\n<p><strong>Use dead-letter queues to postpone the delivery of new messages to the queue for a few seconds</strong> - Dead-letter queues can be used by other queues (source queues) as a target for messages that can't be processed (consumed) successfully. Dead-letter queues are useful for debugging your application or messaging system because they let you isolate problematic messages to determine why their processing doesn't succeed. You cannot use dead-letter queues to postpone the delivery of new messages to the queue for a few seconds.</p>\n\n<p><strong>Use visibility timeout to postpone the delivery of new messages to the queue for a few seconds</strong> - Visibility timeout is a period during which Amazon SQS prevents other consumers from receiving and processing a given message. The default visibility timeout for a message is 30 seconds. The minimum is 0 seconds. The maximum is 12 hours. You cannot use visibility timeout to postpone the delivery of new messages to the queue for a few seconds.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-delay-queues.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-delay-queues.html</a></p>\n","answers":["<p>Use Amazon SQS FIFO queues to postpone the delivery of new messages to the queue for a few seconds</p>","<p>Use dead-letter queues to postpone the delivery of new messages to the queue for a few seconds</p>","<p>Use visibility timeout to postpone the delivery of new messages to the queue for a few seconds</p>","<p>Use delay queues to postpone the delivery of new messages to the queue for a few seconds</p>"]},"correct_response":["d"],"section":"Design Resilient Architectures","question_plain":"An IT company is using Amazon Simple Queue Service (Amazon SQS) queues for decoupling the various components of application architecture. As the consuming components need additional time to process Amazon Simple Queue Service (Amazon SQS) messages, the company wants to postpone the delivery of new messages to the queue for a few seconds.\n\nAs a solutions architect, which of the following solutions would you suggest to the company?","related_lectures":[]},{"_class":"assessment","id":130168985,"assessment_type":"multi-select","prompt":{"question":"<p>A technology startup has stabilized its cloud infrastructure after a successful product launch. The backend services are now running at a predictable rate with minimal scaling events. The application architecture includes workloads running on Amazon EC2, AWS Lambda functions for asynchronous processing, container workloads on AWS Fargate, and machine learning inference models deployed with Amazon SageMaker. The company is now focusing on reducing long-term operational expenses without redesigning its architecture. The company wants to apply long-term pricing discounts with the least administrative overhead and the broadest service coverage possible using the fewest number of savings plans.</p>\n\n<p>Which combination of savings plans will satisfy these requirements? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Purchase a Compute Savings Plan that provides cost savings for usage across EC2, Fargate, and Lambda services</strong></p>\n\n<p>The Compute Savings Plan is the most flexible type of Savings Plan offered by AWS, and it applies to a broad range of compute services—including Amazon EC2, AWS Fargate, and AWS Lambda. Unlike EC2 Instance Savings Plans, Compute Savings Plans are not tied to a specific instance family or Region, making them ideal for organizations with varied or evolving compute needs. In this scenario, since the company is using EC2, Fargate, and Lambda in a steady state, a Compute Savings Plan provides a unified way to reduce costs across all three services with minimal administrative effort. It allows the company to maintain its existing architecture without modification while achieving long-term cost savings.</p>\n\n<p><strong>Purchase a SageMaker Savings Plan that applies discounted pricing to SageMaker training, inference, and notebook instances</strong></p>\n\n<p>Amazon SageMaker is not included under Compute Savings Plans, so workloads running on SageMaker require a SageMaker-specific Savings Plan for cost optimization. The SageMaker Savings Plan provides flexible discounts for various SageMaker components including training jobs, real-time inference, batch transform, and SageMaker Studio notebooks. By committing to a one- or three-year usage plan, companies can achieve significant cost reductions—up to 64%—compared to On-Demand pricing. In this use case, since SageMaker is used for inference workloads that are stable and predictable, a dedicated SageMaker Savings Plan is the most efficient and operationally simple approach to reduce costs.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a Reserved Instance for each EC2 instance and subscribe to AWS Support to monitor Reserved Instance utilization monthly</strong> - While Reserved Instances can offer discounts for EC2, they are less flexible than Savings Plans and do not cover services like Fargate, Lambda, or SageMaker. Additionally, subscribing to AWS Support does not contribute to cost savings.</p>\n\n<p><strong>Subscribe to a hybrid deployment discount plan that includes discounts for both AWS and on-premises Kubernetes workloads</strong> - No such hybrid deployment savings plan currently exists that combines AWS native compute resources with on-premises services. This option is not technically valid and does not address the company's AWS-only workload requirements.</p>\n\n<p><strong>Purchase an EC2 Instance Savings Plan that covers EC2 and containerized tasks on Amazon ECS running with Fargate launch type</strong> - EC2 Instance Savings Plans apply only to EC2 instance families and do not apply to Fargate workloads. Fargate usage requires Compute Savings Plans for cost optimization.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html\">https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/savingsplans/ml-pricing/\">https://aws.amazon.com/savingsplans/ml-pricing/</a></p>\n","answers":["<p>Create a Reserved Instance for each EC2 instance and subscribe to AWS Support to monitor Reserved Instance utilization monthly</p>","<p>Subscribe to a hybrid deployment discount plan that includes discounts for both AWS and on-premises Kubernetes workloads</p>","<p>Purchase an EC2 Instance Savings Plan that covers EC2 and containerized tasks on Amazon ECS running with Fargate launch type</p>","<p>Purchase a Compute Savings Plan that provides cost savings for usage across EC2, Fargate, and Lambda services</p>","<p>Purchase a SageMaker Savings Plan that applies discounted pricing to SageMaker training, inference, and notebook instances</p>"]},"correct_response":["d","e"],"section":"Design Cost-Optimized Architectures","question_plain":"A technology startup has stabilized its cloud infrastructure after a successful product launch. The backend services are now running at a predictable rate with minimal scaling events. The application architecture includes workloads running on Amazon EC2, AWS Lambda functions for asynchronous processing, container workloads on AWS Fargate, and machine learning inference models deployed with Amazon SageMaker. The company is now focusing on reducing long-term operational expenses without redesigning its architecture. The company wants to apply long-term pricing discounts with the least administrative overhead and the broadest service coverage possible using the fewest number of savings plans.\n\nWhich combination of savings plans will satisfy these requirements? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168987,"assessment_type":"multiple-choice","prompt":{"question":"<p>A big data analytics company is looking to archive the on-premises data into a POSIX compliant file storage system on AWS Cloud. The archived data would be accessed for just about a week in a year.</p>\n\n<p>As a solutions architect, which of the following AWS services would you recommend as the MOST cost-optimal solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon EFS Infrequent Access</strong></p>\n\n<p>Amazon Elastic File System (Amazon EFS) provides a simple, scalable, fully managed, elastic, NFS file system for use with AWS Cloud services and on-premises resources. Amazon EFS Infrequent Access (EFS IA) is a storage class that provides price/performance that is cost-optimized for files not accessed every day, with storage prices up to 92% lower compared to Amazon EFS Standard. The EFS IA storage class costs only $0.025/GB-month. To get started with EFS IA, simply enable EFS Lifecycle Management for your file system by selecting a lifecycle policy that matches your needs.</p>\n\n<p>How Amazon EFS Infrequent Access Works:\n<img src=\"https://d1.awsstatic.com/EFS/product-page-diagram-Amazon-EFS-Infrequent-Access-How-It-Works.83f88e30a40c27f38abae1ff157712a336dd1320.png\">\nvia - <a href=\"https://aws.amazon.com/efs/features/infrequent-access/\">https://aws.amazon.com/efs/features/infrequent-access/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon EFS Standard</strong> - Amazon EFS Infrequent Access is more cost-effective than EFS Standard for the given use-case, therefore this option is incorrect.</p>\n\n<p><strong>Amazon S3 Standard</strong></p>\n\n<p><strong>Amazon S3 Standard-IA</strong></p>\n\n<p>Both these options are object-based storage, whereas the given use-case requires a POSIX compliant file storage solution. Hence these two options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/efs/features/infrequent-access/\">https://aws.amazon.com/efs/features/infrequent-access/</a></p>\n","answers":["<p>Amazon EFS Infrequent Access</p>","<p>Amazon EFS Standard</p>","<p>Amazon S3 Standard</p>","<p>Amazon S3 Standard-IA</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"A big data analytics company is looking to archive the on-premises data into a POSIX compliant file storage system on AWS Cloud. The archived data would be accessed for just about a week in a year.\n\nAs a solutions architect, which of the following AWS services would you recommend as the MOST cost-optimal solution?","related_lectures":[]},{"_class":"assessment","id":130168989,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global enterprise has onboarded multiple departments into isolated AWS accounts that are part of a unified AWS Organizations structure. Recently, a critical operational alert was missed because it was delivered to the root user’s email address of an account, which is only monitored intermittently. The enterprise wants to redesign its notification handling process to ensure that future communications - categorized by billing, security, and operational relevance - are received promptly by the appropriate teams. The solution should align with AWS security best practices and offer centralized oversight without depending on individual users.</p>\n\n<p>Which solution meets these requirements in the most secure and scalable way?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure each AWS account’s root user to use an alias that redirects messages to a centralized mailbox monitored by platform administrators. Then assign alternate contacts for each account using company-managed distribution lists for billing, security, and operations to handle service-specific notifications</strong></p>\n\n<p>This option outlines a secure and scalable approach by combining two AWS best practices: centralized root email aliasing and the use of alternate contacts. By configuring each AWS account’s root user email as an alias that redirects to a centrally monitored mailbox, the organization maintains control over critical notifications without relying on individual users. This ensures availability, continuity, and a clear audit trail. Simultaneously, assigning AWS alternate contacts with team-based distribution lists for billing, security, and operations enables role-specific alerts to reach the appropriate teams directly. This approach prevents alert fatigue, improves response time, and aligns with AWS-recommended practices for separating duties and minimizing root user reliance. Overall, it ensures that notifications are handled efficiently, securely, and in a way that scales with organizational growth.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Change each AWS account’s root email to a unique departmental email list and configure IAM notification settings to send alerts based on service type. Do not use AWS alternate contacts since notifications are already routed by service in the IAM console</strong> - While routing messages through departmental distribution lists may appear beneficial, AWS does not allow IAM settings to route operational alerts by service type. Critical AWS notifications such as billing suspension alerts and security findings are sent only to the root email or the alternate contacts, not through IAM configurations. Moreover, ignoring the alternate contacts feature misses the opportunity to use AWS-native role-based routing.</p>\n\n<p><strong>Set up a centralized email forwarding service with rules that inspect notification content and forward emails to the appropriate team based on keywords such as “billing,” “security,” or “operations.” Keep the current root email addresses as they are, and rely on this service to triage alerts</strong> - This option depends on keyword-based filtering and a custom forwarding solution, which introduces operational overhead, potential delays, and risk of misrouting critical notifications. It also retains reliance on root email addresses without formally assigning alternate contacts in AWS, meaning AWS service notifications (e.g., billing alerts) may still go only to the root email. This violates the principle of using AWS-native contact configuration mechanisms for high-assurance routing.</p>\n\n<p><strong>Assign each AWS account’s root user email to a single designated member of the respective department (e.g., security lead or billing analyst). Encourage these individuals to monitor the email accounts regularly. Also configure alternate contacts with the same individual email addresses</strong> - This solution introduces significant risk by binding critical communications to individuals. It creates a single point of failure—if the individual is unavailable, on leave, or leaves the company, essential alerts might be missed. It also makes auditing and account recovery more difficult. This setup does not scale well and violates security best practices for root account usage, which should be strictly limited.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/aws-startup-security-baseline/acct-01.html\">https://docs.aws.amazon.com/prescriptive-guidance/latest/aws-startup-security-baseline/acct-01.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_best-practices.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_best-practices.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/accounts/latest/reference/accounts-welcome.html\">https://docs.aws.amazon.com/accounts/latest/reference/accounts-welcome.html</a></p>\n","answers":["<p>Configure each AWS account’s root user to use an alias that redirects messages to a centralized mailbox monitored by platform administrators. Then assign alternate contacts for each account using company-managed distribution lists for billing, security, and operations to handle service-specific notifications</p>","<p>Change each AWS account’s root email to a unique departmental email list and configure IAM notification settings to send alerts based on service type. Do not use AWS alternate contacts since notifications are already routed by service in the IAM console</p>","<p>Set up a centralized email forwarding service with rules that inspect notification content and forward emails to the appropriate team based on keywords such as “billing,” “security,” or “operations.” Keep the current root email addresses as they are, and rely on this service to triage alerts</p>","<p>Assign each AWS account’s root user email to a single designated member of the respective department (e.g., security lead or billing analyst). Encourage these individuals to monitor the email accounts regularly. Also configure alternate contacts with the same individual email addresses</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A global enterprise has onboarded multiple departments into isolated AWS accounts that are part of a unified AWS Organizations structure. Recently, a critical operational alert was missed because it was delivered to the root user’s email address of an account, which is only monitored intermittently. The enterprise wants to redesign its notification handling process to ensure that future communications - categorized by billing, security, and operational relevance - are received promptly by the appropriate teams. The solution should align with AWS security best practices and offer centralized oversight without depending on individual users.\n\nWhich solution meets these requirements in the most secure and scalable way?","related_lectures":[]},{"_class":"assessment","id":130168991,"assessment_type":"multiple-choice","prompt":{"question":"<p>A digital media firm is scaling its cloud footprint and wants to isolate development, testing, and production workloads using separate AWS accounts. It also wants a centralized approach to managing networking infrastructure such as subnets and gateways, without repeating configurations in every account. Additionally, the solution must enforce security best practices—like mandatory logging and guardrails—when new accounts are created. The firm prefers a low-maintenance, governance-driven setup.</p>\n\n<p>Which solution best meets these goals while minimizing operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Control Tower to create and govern accounts. Deploy a centralized VPC in a shared networking account and share its subnets across workload accounts using AWS Resource Access Manager (AWS RAM)</strong></p>\n\n<p>This approach aligns perfectly with AWS multi-account best practices. AWS Control Tower handles account creation and governance while applying automatic guardrails such as Service Control Policies (SCPs), AWS Config rules, and CloudTrail logging. A centralized VPC in a separate networking account can host shared resources, and subnets can be shared across accounts using AWS RAM. This design centralizes NAT gateways, internet access, and routing configuration—reducing duplication and cost. It provides isolation, control, and compliance—all with minimal administrative burden.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q41-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html\">https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Organizations to create new accounts and a shared networking account with a central VPC. Share the VPC subnets via AWS RAM and rely on service control policies (SCPs) to enforce guardrails manually</strong> - While using AWS Organizations and RAM to share a centralized VPC is technically valid, this option lacks automation and governance features like those provided by AWS Control Tower. SCPs can be used to enforce some guardrails, but applying them manually introduces operational overhead and increases the risk of misconfiguration. Control Tower automates these tasks, including audit logging, baseline configuration, and landing zone deployment, making it the better fit for minimal effort.</p>\n\n<p><strong>Use AWS Control Tower to launch accounts. Deploy separate VPCs in each workload account and centralize security inspection by using Gateway Load Balancers to route traffic through a shared security appliance</strong> - Although Gateway Load Balancer (GWLB) is an advanced solution for centralized traffic inspection (e.g., for firewalls), this architecture significantly increases complexity. Managing and maintaining GWLB across multiple workload VPCs, setting up route tables, and integrating third-party appliances require deep networking expertise and ongoing effort. While Control Tower simplifies account creation, it doesn’t mitigate the operational burden introduced by deploying and managing distributed VPCs and inspection paths. This is over-engineered for the given use case, which prioritizes low operational overhead.</p>\n\n<p><strong>Use AWS Service Catalog to define pre-approved VPC templates. Launch one VPC per workload account from the catalog, and enforce networking guardrails using AWS Config conformance packs</strong> - While AWS Service Catalog and Config conformance packs offer strong governance, this approach requires each workload account to maintain its own VPC. This leads to duplicated NAT gateways, internet gateways, and routing policies, which increase cost and management effort. Additionally, Service Catalog lacks native account provisioning or centralized logging — both of which are automatically handled by Control Tower. This solution introduces more complexity than necessary for the stated goal of central networking with guardrails.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html\">https://docs.aws.amazon.com/controltower/latest/userguide/what-is-control-tower.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html\">https://docs.aws.amazon.com/ram/latest/userguide/getting-started-sharing.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-sharing.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html\">https://docs.aws.amazon.com/servicecatalog/latest/adminguide/introduction.html</a></p>\n","answers":["<p>Use AWS Control Tower to create and govern accounts. Deploy a centralized VPC in a shared networking account and share its subnets across workload accounts using AWS Resource Access Manager (AWS RAM)</p>","<p>Use AWS Organizations to create new accounts and a shared networking account with a central VPC. Share the VPC subnets via AWS RAM and rely on service control policies (SCPs) to enforce guardrails manually</p>","<p>Use AWS Control Tower to launch accounts. Deploy separate VPCs in each workload account and centralize security inspection by using Gateway Load Balancers to route traffic through a shared security appliance</p>","<p>Use AWS Service Catalog to define pre-approved VPC templates. Launch one VPC per workload account from the catalog, and enforce networking guardrails using AWS Config conformance packs</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A digital media firm is scaling its cloud footprint and wants to isolate development, testing, and production workloads using separate AWS accounts. It also wants a centralized approach to managing networking infrastructure such as subnets and gateways, without repeating configurations in every account. Additionally, the solution must enforce security best practices—like mandatory logging and guardrails—when new accounts are created. The firm prefers a low-maintenance, governance-driven setup.\n\nWhich solution best meets these goals while minimizing operational overhead?","related_lectures":[]},{"_class":"assessment","id":130168993,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at a startup is evaluating the most optimal block storage volume type for the Amazon EC2 instances hosting its flagship application. The storage volume should support very low latency but it does not need to persist the data when the instance terminates. As a solutions architect, you have proposed using Instance Store volumes to meet these requirements.</p>\n\n<p>Which of the following would you identify as the key characteristics of the Instance Store volumes? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>You can't detach an instance store volume from one instance and attach it to a different instance</strong></p>\n\n<p>You can specify instance store volumes for an instance only when you launch it. You can't detach an instance store volume from one instance and attach it to a different instance. The data in an instance store persists only during the lifetime of its associated instance. If an instance reboots (intentionally or unintentionally), data in the instance store persists.</p>\n\n<p><strong>If you create an Amazon Machine Image (AMI) from an instance, the data on its instance store volumes isn't preserved</strong></p>\n\n<p>If you create an AMI from an instance, the data on its instance store volumes isn't preserved and isn't present on the instance store volumes of the instances that you launch from the AMI.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Instance store is reset when you stop or terminate an instance. Instance store data is preserved during hibernation</strong> - When you stop, hibernate, or terminate an instance, every block of storage in the instance store is reset. Therefore, this option is incorrect.</p>\n\n<p><strong>You can specify instance store volumes for an instance when you launch or restart it</strong> - You can specify instance store volumes for an instance only when you launch it.</p>\n\n<p><strong>An instance store is a network storage type</strong> - An instance store provides temporary block-level storage for your instance. This storage is located on disks that are physically attached to the host computer.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html</a></p>\n","answers":["<p>You can't detach an instance store volume from one instance and attach it to a different instance</p>","<p>Instance store is reset when you stop or terminate an instance. Instance store data is preserved during hibernation</p>","<p>You can specify instance store volumes for an instance when you launch or restart it</p>","<p>An instance store is a network storage type</p>","<p>If you create an Amazon Machine Image (AMI) from an instance, the data on its instance store volumes isn't preserved</p>"]},"correct_response":["a","e"],"section":"Design High-Performing Architectures","question_plain":"The engineering team at a startup is evaluating the most optimal block storage volume type for the Amazon EC2 instances hosting its flagship application. The storage volume should support very low latency but it does not need to persist the data when the instance terminates. As a solutions architect, you have proposed using Instance Store volumes to meet these requirements.\n\nWhich of the following would you identify as the key characteristics of the Instance Store volumes? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168995,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company is deploying a publicly accessible web application. To accomplish this, the engineering team has designed the VPC with a public subnet and a private subnet. The application will be hosted on several Amazon EC2 instances in an Auto Scaling group. The team also wants Transport Layer Security (TLS) termination to be offloaded from the Amazon EC2 instances.</p>\n\n<p>Which solution should a solutions architect implement to address these requirements in the most secure manner?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer</strong></p>\n\n<p>A load balancer serves as the single point of contact for clients. The load balancer distributes incoming traffic across multiple targets, such as Amazon EC2 instances. This increases the availability of your application. You add one or more listeners to your load balancer.</p>\n\n<p>With a Network Load Balancer, you can offload the decryption/encryption of Transport Layer Security (TLS) traffic from your application servers to the Network Load Balancer, which helps you optimize the performance of your backend application servers while keeping your workloads secure. Additionally, Network Load Balancers preserve the source IP of the clients to the back-end applications, while terminating Transport Layer Security (TLS) on the load balancer.</p>\n\n<p>An Auto Scaling group contains a collection of Amazon EC2 instances that are treated as a logical grouping for the purposes of automatic scaling and management. An Auto Scaling group also enables you to use Amazon EC2 Auto Scaling features such as health check replacements and scaling policies. Both maintaining the number of instances in an Auto Scaling group and automatic scaling are the core functionality of the Amazon EC2 Auto Scaling service.</p>\n\n<p>The NLB has to be accessible over the internet and hence has to be in a public subnet and will act as a single point-of-contact for all incoming traffic. NLB will forward the incoming traffic to the Amazon EC2 instances managed by the ASG in the private subnet.</p>\n\n<p>Exam Alert:</p>\n\n<p>You should note that the Application Load Balancer also supports Transport Layer Security (TLS) offloading. The Classic Load Balancer supports SSL offloading.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer</strong> - The Auto Scaling group with its target EC2 instances should be in the private subnet to avoid access to EC2 instances over the public internet. Having EC2 instances in the public subnet would weaken the security posture of the application. Hence, this option is incorrect.</p>\n\n<p><strong>Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer</strong></p>\n\n<p><strong>Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer</strong></p>\n\n<p>NLB should be in the public subnet as it represents the internet-facing component of the web tier. Therefore, both these options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/new-tls-termination-for-network-load-balancers/\">https://aws.amazon.com/blogs/aws/new-tls-termination-for-network-load-balancers/</a></p>\n","answers":["<p>Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer</p>","<p>Set up a Network Load Balancer in the public subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer</p>","<p>Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the public subnet and associate it with the Network Load Balancer</p>","<p>Set up a Network Load Balancer in the private subnet. Create an Auto Scaling group in the private subnet and associate it with the Network Load Balancer</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A company is deploying a publicly accessible web application. To accomplish this, the engineering team has designed the VPC with a public subnet and a private subnet. The application will be hosted on several Amazon EC2 instances in an Auto Scaling group. The team also wants Transport Layer Security (TLS) termination to be offloaded from the Amazon EC2 instances.\n\nWhich solution should a solutions architect implement to address these requirements in the most secure manner?","related_lectures":[]},{"_class":"assessment","id":130168997,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company needs an Active Directory service to run directory-aware workloads in the AWS Cloud and it should also support configuring a trust relationship with any existing on-premises Microsoft Active Directory.</p>\n\n<p>Which AWS Directory Service is the best fit for this requirement?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)</strong></p>\n\n<p>AWS Directory Service lets you run Microsoft Active Directory (AD) as a managed service. AWS Directory Service for Microsoft Active Directory, also referred to as AWS Managed Microsoft AD, is powered by Windows Server 2012 R2. When you select and launch this directory type, it is created as a highly available pair of domain controllers connected to your virtual private cloud (VPC).</p>\n\n<p>With AWS Managed Microsoft AD, you can run directory-aware workloads in the AWS Cloud, including Microsoft SharePoint and custom .NET and SQL Server-based applications. You can also configure a trust relationship between AWS Managed Microsoft AD in the AWS Cloud and your existing on-premises Microsoft Active Directory, providing users and groups with access to resources in either domain, using single sign-on (SSO).</p>\n\n<p>AWS Managed Microsoft AD is your best choice if you need actual Active Directory features to support AWS applications or Windows workloads, including Amazon Relational Database Service for Microsoft SQL Server. It's also best if you want a standalone AD in the AWS Cloud that supports Office 365 or you need an LDAP directory to support your Linux applications.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Active Directory Connector</strong> - AD Connector is a directory gateway with which you can redirect directory requests to your on-premises Microsoft Active Directory without caching any information in the cloud. AD Connector is your best choice when you want to use your existing on-premises directory with compatible AWS services.</p>\n\n<p><strong>Simple Active Directory (Simple AD)</strong> - Simple AD is a standalone directory in the cloud, where you create and manage user identities and manage access to applications. Simple AD provides a subset of the features offered by AWS Managed Microsoft AD. However, note that Simple AD does not support features such as multi-factor authentication (MFA), trust relationships with other domains, Active Directory Administrative Center, PowerShell support, Active Directory recycle bin, group managed service accounts, and schema extensions for POSIX and Microsoft applications.</p>\n\n<p><strong>AWS Transit Gateway</strong> - AWS Transit Gateway connects VPCs and on-premises networks through a central hub. Transit Gateway is not an Active Directory service.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/what_is.html\">https://docs.aws.amazon.com/directoryservice/latest/admin-guide/what_is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_simple_ad.html\">https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_simple_ad.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_ad_connector.html\">https://docs.aws.amazon.com/directoryservice/latest/admin-guide/directory_ad_connector.html</a></p>\n","answers":["<p>Active Directory Connector</p>","<p>Simple Active Directory (Simple AD)</p>","<p>AWS Transit Gateway</p>","<p>AWS Directory Service for Microsoft Active Directory (AWS Managed Microsoft AD)</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A company needs an Active Directory service to run directory-aware workloads in the AWS Cloud and it should also support configuring a trust relationship with any existing on-premises Microsoft Active Directory.\n\nWhich AWS Directory Service is the best fit for this requirement?","related_lectures":[]},{"_class":"assessment","id":130168935,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global enterprise maintains a hybrid cloud environment and wants to transfer large volumes of data between its on-premises data center and Amazon S3 for backup and analytics workflows. The company has already established a Direct Connect (DX) connection to AWS and wants to ensure high-bandwidth, low-latency, and secure private connectivity without traversing the public internet. The architecture must be designed to access Amazon S3 directly from on-premises systems using this DX connection.</p>\n\n<p>Which configuration should the network engineering team implement to allow direct access to Amazon S3 from the on-premises data center using Direct Connect?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Provision a Public Virtual Interface (Public VIF) on the Direct Connect connection to access Amazon S3 public IP addresses from the on-premises data center</strong></p>\n\n<p>To access Amazon S3 from an on-premises data center using AWS Direct Connect, the correct approach is to configure a Public Virtual Interface (Public VIF). A Public VIF allows your on-premises router to access public AWS services, such as Amazon S3 and DynamoDB, over the dedicated Direct Connect connection rather than the public internet. When you establish a Public VIF, AWS advertises a set of public IP prefixes corresponding to its services, including Amazon S3. This allows your data center to communicate with these services using public IPs routed privately over Direct Connect, delivering improved performance, lower latency, and enhanced security. Public VIFs are specifically designed for scenarios where you want to connect on-premises infrastructure to AWS public endpoints over private, high-bandwidth links.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q45-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html\">https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use a Private Virtual Interface (Private VIF) on the Direct Connect connection and create a VPC endpoint to route traffic to S3 over the private network</strong> - A Private Virtual Interface (Private VIF) is used to connect an on-premises network to VPC resources, such as EC2 instances or RDS databases, over private IP space. However, Amazon S3 is a public AWS service, and Private VIFs cannot natively route traffic to public S3 endpoints. While S3 access via interface VPC endpoints is possible from within the VPC, it does not extend to on-premises access over Private VIF. Therefore, Private VIF is not suitable for directly accessing S3 from on-prem.</p>\n\n<p><strong>Configure a VPN connection over the public internet to AWS and route S3 traffic through the tunnel instead of using Direct Connect</strong> - Using a VPN connection over the public internet to route traffic to S3 bypasses the benefits of Direct Connect, such as low latency, dedicated bandwidth, and private connectivity. VPN traffic traverses the public internet and therefore violates the requirements of the given use case.</p>\n\n<p><strong>Use a Transit Gateway with Direct Connect Gateway to route on-premises traffic through a VPC and then to Amazon S3 using private IP addressing</strong> - While Transit Gateway with Direct Connect Gateway is a valid solution for routing on-premises traffic to multiple VPCs over a private Direct Connect connection, it does not enable direct private IP access to Amazon S3, because S3 is a public AWS service with public IP addresses. Even if you configure interface VPC endpoints (AWS PrivateLink) to S3 in a connected VPC, the traffic remains local to that VPC and is not extended to the on-premises network via Transit Gateway. To access S3 from on-premises using Direct Connect, you must provision a Public Virtual Interface, which advertises AWS public service IP ranges to your data center.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html\">https://docs.aws.amazon.com/directconnect/latest/UserGuide/Welcome.html</a></p>\n","answers":["<p>Use a Private Virtual Interface (Private VIF) on the Direct Connect connection and create a VPC endpoint to route traffic to S3 over the private network</p>","<p>Configure a VPN connection over the public internet to AWS and route S3 traffic through the tunnel instead of using Direct Connect</p>","<p>Provision a Public Virtual Interface (Public VIF) on the Direct Connect connection to access Amazon S3 public IP addresses from the on-premises data center</p>","<p>Use a Transit Gateway with Direct Connect Gateway to route on-premises traffic through a VPC and then to Amazon S3 using private IP addressing</p>"]},"correct_response":["c"],"section":"Design Secure Architectures","question_plain":"A global enterprise maintains a hybrid cloud environment and wants to transfer large volumes of data between its on-premises data center and Amazon S3 for backup and analytics workflows. The company has already established a Direct Connect (DX) connection to AWS and wants to ensure high-bandwidth, low-latency, and secure private connectivity without traversing the public internet. The architecture must be designed to access Amazon S3 directly from on-premises systems using this DX connection.\n\nWhich configuration should the network engineering team implement to allow direct access to Amazon S3 from the on-premises data center using Direct Connect?","related_lectures":[]},{"_class":"assessment","id":130168915,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce company uses Amazon RDS MySQL DB to store the data. The analytics department at the company runs its reports on the same database. The engineering team has noticed sluggish performance on the database when the analytics reporting process is in progress.</p>\n\n<p>As an AWS Certified Solutions Architect - Associate, which of the following would you suggest as the MOST cost-optimal solution to improve the performance?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a read-replica with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the read replica</strong></p>\n\n<p>Amazon RDS uses the MariaDB, Microsoft SQL Server, MySQL, Oracle, and PostgreSQL DB engines' built-in replication functionality to create a special type of database instance called a read replica from a source database instance. The source database instance becomes the primary database instance. Updates made to the primary database instance are asynchronously copied to the read replica. You can reduce the load on your primary DB instance by routing read queries from your applications to the read replica.</p>\n\n<p>Amazon RDS Read Replicas:\n<img src=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/images/read-replica.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a></p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q46-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a></p>\n\n<p>You can use read replicas to improve the performance of your Amazon RDS MySQL DB by handling business reporting or data warehousing scenarios where you might want business reporting queries to run against your read replica, rather than your production database instance.</p>\n\n<p>You can create up to five read replicas from one DB instance. For replication to operate effectively, each read replica should have the same amount of compute and storage resources as the source database instance. If you scale the source database instance, also scale the read replicas.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q46-i2.jpg\">\nvia - <a href=\"https://docs.amazonaws.cn/en_us/AmazonRDS/latest/UserGuide/USER_MySQL.Replication.ReadReplicas.html\">https://docs.amazonaws.cn/en_us/AmazonRDS/latest/UserGuide/USER_MySQL.Replication.ReadReplicas.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a read-replica with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the read replica</strong> - As mentioned in the explanation above, you should create a read-replica with the same compute capacity and the same storage capacity as the primary.</p>\n\n<p><strong>Create a standby instance in a multi-AZ configuration with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the standby instance</strong></p>\n\n<p><strong>Create a standby instance in a multi-AZ configuration with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the standby instance</strong></p>\n\n<p>Multi-AZ deployments are not a read scaling solution, so you cannot use a standby to serve read traffic. The standby is there just for failover. Hence both these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.html</a></p>\n\n<p><a href=\"https://docs.amazonaws.cn/en_us/AmazonRDS/latest/UserGuide/USER_MySQL.Replication.ReadReplicas.html\">https://docs.amazonaws.cn/en_us/AmazonRDS/latest/UserGuide/USER_MySQL.Replication.ReadReplicas.html</a></p>\n","answers":["<p>Create a read-replica with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the read replica</p>","<p>Create a read-replica with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the read replica</p>","<p>Create a standby instance in a multi-AZ configuration with the same compute capacity and the same storage capacity as the primary. Point the reporting queries to run against the standby instance</p>","<p>Create a standby instance in a multi-AZ configuration with half compute capacity and half storage capacity as the primary. Point the reporting queries to run against the standby instance</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"An e-commerce company uses Amazon RDS MySQL DB to store the data. The analytics department at the company runs its reports on the same database. The engineering team has noticed sluggish performance on the database when the analytics reporting process is in progress.\n\nAs an AWS Certified Solutions Architect - Associate, which of the following would you suggest as the MOST cost-optimal solution to improve the performance?","related_lectures":[]},{"_class":"assessment","id":130168917,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce application uses a relational database that runs several queries that perform joins on multiple tables. The development team has found that these queries are slow and expensive, therefore these are a good candidate for caching. The application needs to use a caching service that supports multi-threading.</p>\n\n<p>As a solutions architect, which of the following services would you recommend for the given use case?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon ElastiCache for Memcached</strong></p>\n\n<p>Amazon ElastiCache is a web service that makes it easy to deploy, operate, and scale an in-memory data store and cache in the cloud. The service improves the performance of web applications by allowing you to retrieve information from fast, managed, in-memory data stores, instead of relying entirely on slower disk-based databases.</p>\n\n<p>Memcached is an open-source, distributed, in-memory key-value store that can retrieve data in milliseconds. Caching site information with Memcached can help you improve the performance and scalability of your site while controlling cost.</p>\n\n<p>Choose Memcached if the following apply to you:</p>\n\n<p>You need the simplest model possible.</p>\n\n<p>You need to run large nodes with multiple cores or threads (support for multi-threading).</p>\n\n<p>You need the ability to scale out and in, adding and removing nodes as demand on your system increases and decreases.</p>\n\n<p>You need to cache objects.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q47-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/elasticache/redis-vs-memcached/\">https://aws.amazon.com/elasticache/redis-vs-memcached/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon ElastiCache for Redis</strong> - Redis, which stands for Remote Dictionary Server, is a fast, open-source, in-memory key-value data store for use as a database, cache, message broker, and queue. Redis now delivers sub-millisecond response times enabling millions of requests per second for real-time applications in Gaming, Ad-Tech, Financial Services, Healthcare, and IoT. Redis is a popular choice for caching, session management, gaming, leaderboards, real-time analytics, geospatial, ride-hailing, chat/messaging, media streaming, and pub/sub apps.</p>\n\n<p>Redis does not support multi-threading, so this option is not the right fit for the given use case.</p>\n\n<p><strong>Amazon DynamoDB Accelerator (DAX)</strong> - Amazon DynamoDB Accelerator (DAX) is a fully managed, highly available, in-memory cache for Amazon DynamoDB. DAX does not support relational databases.</p>\n\n<p><strong>AWS Global Accelerator</strong> - AWS Global Accelerator is a networking service that helps you improve the availability and performance of the applications that you offer to your global users. This option has been added as a distractor, it has nothing to do with database caching.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/caching/aws-caching/\">https://aws.amazon.com/caching/aws-caching/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonElastiCache/latest/mem-ug/elasticache-use-cases.html\">https://docs.aws.amazon.com/AmazonElastiCache/latest/mem-ug/elasticache-use-cases.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/redis-vs-memcached/\">https://aws.amazon.com/elasticache/redis-vs-memcached/</a></p>\n","answers":["<p>Amazon ElastiCache for Redis</p>","<p>Amazon DynamoDB Accelerator (DAX)</p>","<p>AWS Global Accelerator</p>","<p>Amazon ElastiCache for Memcached</p>"]},"correct_response":["d"],"section":"Design Resilient Architectures","question_plain":"An e-commerce application uses a relational database that runs several queries that perform joins on multiple tables. The development team has found that these queries are slow and expensive, therefore these are a good candidate for caching. The application needs to use a caching service that supports multi-threading.\n\nAs a solutions architect, which of the following services would you recommend for the given use case?","related_lectures":[]},{"_class":"assessment","id":130168919,"assessment_type":"multi-select","prompt":{"question":"<p>A global logistics provider operates several legacy applications on virtual machines (VMs) within a private data center. Due to accelerated business growth and limited capacity in its existing infrastructure, the provider decides to migrate select applications to AWS. The company opts for a lift-and-shift strategy for its non-mission-critical systems to meet tight migration deadlines. The solution must support rapid migration without requiring extensive application refactoring.</p>\n\n<p>Which combination of actions will best support this migration approach? (Select three)</p>\n","relatedLectureIds":"","feedbacks":["","","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use AWS Application Migration Service (MGN). Install the AWS Replication Agent on the source VMs</strong></p>\n\n<p>AWS Application Migration Service (MGN) is a highly automated lift-and-shift (rehost) solution that simplifies, expedites, and reduces the cost of migrating applications to AWS. It allows companies to lift-and-shift a large number of physical, virtual, or cloud servers without compatibility issues, performance disruption, or long cutover windows. Application Migration Service replicates source servers into your AWS account.</p>\n\n<p>AWS Application Migration Service (MGN) is the recommended AWS tool for lift-and-shift VM migrations. It supports real-time replication of on-premises workloads to AWS with minimal disruption. The Replication Agent is installed on each source VM to handle continuous data transfer. This eliminates the need for image creation or application rewrites, making it ideal for quick, large-scale migrations.</p>\n\n<p><strong>Perform the initial replication. Launch test instances in AWS to validate the migrated VMs before final cutover</strong></p>\n\n<p>This reflects a standard step in AWS MGN migration workflows. After the initial sync is complete, test instances are launched to validate the integrity and functionality of the migrated VMs. This is critical for quality assurance before moving workloads into production and helps reduce the risk of failure after cutover.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q48-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/mgn/latest/ug/migration-workflow-gs.html\">https://docs.aws.amazon.com/mgn/latest/ug/migration-workflow-gs.html</a></p>\n\n<p><strong>Launch a cutover instance after completing testing and confirming that replication is up-to-date</strong></p>\n\n<p>This represents the final step in AWS MGN migrations. After validation testing and a final sync of changes from the on-premises environment, a cutover instance is launched to go live in production. The original VM can be decommissioned once the EC2 instance is confirmed to be working as intended.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS CloudEndure Disaster Recovery to continuously replicate the VMs to AWS and then promote the target instances for production use</strong> - While CloudEndure Disaster Recovery provides continuous replication and rapid failover to AWS, it is intended primarily for disaster recovery scenarios, not one-time lift-and-shift migrations. It lacks the account structure, automation, and built-in testing workflows offered by AWS Application Migration Service (MGN), which is optimized specifically for migration use cases. Choosing this option adds unnecessary operational complexity and misuses the DR tooling for a migration task.</p>\n\n<p><strong>Use Amazon EC2 Auto Scaling to automatically re-create the VMs in AWS by launching replacement instances with matching configurations</strong> - Amazon EC2 Auto Scaling is designed for horizontal scaling of stateless applications based on performance metrics like CPU or memory usage. It does not support importing or replicating on-premises VMs, nor does it facilitate image migration or workload conversion. Attempting to use Auto Scaling as a migration mechanism would require manual image creation and deep customization, defeating the purpose of a rapid, low-effort lift-and-shift.</p>\n\n<p><strong>Shut down the source virtual machines and immediately provision EC2 replacement instances using manual AMI creation</strong> - Manually shutting down VMs and creating Amazon Machine Images (AMIs) adds significant risk and overhead. This approach introduces downtime, requires manual reconfiguration, and increases the chance of misalignment between source and target systems. Moreover, it contradicts the benefit of non-disruptive, live migration provided by AWS MGN. This method is not suited for time-sensitive lift-and-shift efforts.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html\">https://docs.aws.amazon.com/mgn/latest/ug/what-is-application-migration-service.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/mgn/latest/ug/migration-workflow-gs.html\">https://docs.aws.amazon.com/mgn/latest/ug/migration-workflow-gs.html</a></p>\n","answers":["<p>Use AWS CloudEndure Disaster Recovery to continuously replicate the VMs to AWS and then promote the target instances for production use</p>","<p>Use Amazon EC2 Auto Scaling to automatical
