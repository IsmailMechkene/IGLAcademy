name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Windows: the app only ships for Windows, and better-sqlite3 has to be
    # compiled for both Node (tests) and Electron (build) on the same ABI
    # toolchain the release uses.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # npm run test:e2e is not run here: it downloads sample videos and reads
      # a local practice-exam folder. Run it locally before releasing.
