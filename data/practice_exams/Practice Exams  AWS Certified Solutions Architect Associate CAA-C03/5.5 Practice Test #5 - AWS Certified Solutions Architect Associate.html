PC component that allows communication between instances in your VPC and the internet. It, therefore, imposes no availability risks or bandwidth constraints on your network traffic. You cannot use an internet gateway to interconnect your VPCs and on-premises networks, hence this option is incorrect.</p>\n\n<p><strong>Use a VPC endpoint to interconnect the VPCs</strong> - A VPC endpoint enables you to privately connect your VPC to supported AWS services and VPC endpoint services powered by AWS PrivateLink without requiring an internet gateway, NAT device, VPN connection, or AWS Direct Connect connection. You cannot use a VPC endpoint to interconnect your VPCs and on-premises networks, hence this option is incorrect.</p>\n\n<p><strong>Establish VPC peering connections between all VPCs</strong> - Establishing VPC peering between all VPCs is an inelegant and clumsy way to establish connectivity between all VPCs. Instead, you should use a Transit Gateway that acts as a network transit hub to interconnect your VPCs and on-premises networks.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html\">https://docs.aws.amazon.com/vpc/latest/peering/what-is-vpc-peering.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html\">https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html</a></p>\n","answers":["<p>Establish VPC peering connections between all VPCs</p>","<p>Use AWS transit gateway to interconnect the VPCs</p>","<p>Use an internet gateway to interconnect the VPCs</p>","<p>Use a VPC endpoint to interconnect the VPCs</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"The infrastructure team at a company maintains 5 different VPCs (let's call these VPCs A, B, C, D, E) for resource isolation. Due to the changed organizational structure, the team wants to interconnect all VPCs together. To facilitate this, the team has set up VPC peering connection between VPC A and all other VPCs in a hub and spoke model with VPC A at the center. However, the team has still failed to establish connectivity between all VPCs.\n\nAs a solutions architect, which of the following would you recommend as the MOST resource-efficient and scalable solution?","related_lectures":[]},{"_class":"assessment","id":156638719,"assessment_type":"multi-select","prompt":{"question":"<p>A media company operates a web application that enables users to upload photos. These uploads are stored in an Amazon S3 bucket located in the eu-west-2 Region. To enhance performance and provide secure access under a custom domain name, the company wants to integrate Amazon CloudFront for uploads to the S3 bucket. The architecture must support secure HTTPS connections using a custom domain, and the upload process must ensure optimal speed and security.</p>\n\n<p>Which combination of actions will fulfill these requirements? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Request a public certificate from AWS Certificate Manager (ACM) in the us-east-1 Region and associate it with the CloudFront distribution</strong></p>\n\n<p>CloudFront only supports ACM certificates that are created in the us-east-1 (N. Virginia) Region. Even if the content resides in a different Region (like eu-west-2), a public certificate for HTTPS on a custom domain name must originate from us-east-1. This certificate is used to secure content access through CloudFront over HTTPS.</p>\n\n<p><strong>Set up Amazon S3 to accept uploads from CloudFront by enabling origin access control (OAC)</strong></p>\n\n<p>Origin Access Control (OAC) is the recommended method for granting CloudFront permission to upload to (write into) an S3 bucket securely. OAC supersedes the older Origin Access Identity (OAI) approach and supports both read and write operations. This allows you to restrict direct access to the S3 bucket and ensure that only CloudFront can act as a secure intermediary for uploads.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q15-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a CloudFront distribution with an S3 static website endpoint as the origin and enable upload operations</strong> - This is incorrect because S3 static website endpoints only support GET and HEAD requests and are intended for public read access. They do not support PUT/POST operations required for user uploads. Therefore, they are not suitable for the secure upload workflow described.</p>\n\n<p><strong>Set up a custom origin request policy in CloudFront that includes all viewer headers and query strings. Enable S3 Object Ownership to allow CloudFront to assume control of uploaded files via a signed URL</strong> - While customizing origin request policies and enabling S3 Object Ownership might help with some access controls, they do not provide a mechanism to upload content directly via CloudFront. Additionally, signed URLs are primarily used for download access, not for file uploads via CloudFront.</p>\n\n<p><strong>Request a public certificate from AWS Certificate Manager (ACM) in the eu-west-2 Region and associate it with the CloudFront distribution</strong> - This option is incorrect because CloudFront cannot use ACM public certificates that are created in any Region other than us-east-1. If a certificate is created in eu-west-2, it won’t be attachable to the CloudFront distribution.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html\">https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html</a></p>\n","answers":["<p>Create a CloudFront distribution with an S3 static website endpoint as the origin and enable upload operations</p>","<p>Set up a custom origin request policy in CloudFront that includes all viewer headers and query strings. Enable S3 Object Ownership to allow CloudFront to assume control of uploaded files via a signed URL</p>","<p>Request a public certificate from AWS Certificate Manager (ACM) in the us-east-1 Region and associate it with the CloudFront distribution</p>","<p>Request a public certificate from AWS Certificate Manager (ACM) in the eu-west-2 Region and associate it with the CloudFront distribution</p>","<p>Set up Amazon S3 to accept uploads from CloudFront by enabling origin access control (OAC)</p>"]},"correct_response":["c","e"],"section":"Design Secure Architectures","question_plain":"A media company operates a web application that enables users to upload photos. These uploads are stored in an Amazon S3 bucket located in the eu-west-2 Region. To enhance performance and provide secure access under a custom domain name, the company wants to integrate Amazon CloudFront for uploads to the S3 bucket. The architecture must support secure HTTPS connections using a custom domain, and the upload process must ensure optimal speed and security.\n\nWhich combination of actions will fulfill these requirements? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638803,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company hosts a Microsoft SQL Server database on Amazon EC2 instances with attached Amazon EBS volumes. The operations team takes daily snapshots of these EBS volumes as backups. However, a recent incident occurred in which an automated script designed to clean up expired snapshots accidentally deleted all available snapshots, leading to potential data loss. The company wants to improve the backup strategy to avoid permanent data loss while still ensuring that old snapshots are eventually removed to optimize cost. A solutions architect needs to implement a mechanism that prevents immediate and irreversible deletion of snapshots.</p>\n\n<p>Which solution will best meet these requirements with the least development effort?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up a 7-day EBS snapshot retention rule in Recycle Bin and apply the rule for all snapshots</strong></p>\n\n<p>The Amazon EBS Snapshot Recycle Bin allows organizations to retain deleted snapshots for a fixed duration before they are permanently deleted. By configuring a 7-day retention rule, snapshots that are deleted by mistake (e.g., through a faulty script) can still be recovered within the defined period. This provides protection from accidental deletion and satisfies the requirement to eventually remove old snapshots—thus balancing safety and cost. It requires minimal setup and no significant development effort.</p>\n\n<p>Incorrect Options:</p>\n\n<p><strong>Implement a Lambda-based backup automation workflow that archives snapshot metadata in DynamoDB and stores backups in Amazon S3 Glacier Deep Archive for long-term recovery</strong> - This approach adds significant development effort and does not natively prevent snapshot deletion. So, it is incorrect.</p>\n\n<p><strong>Enable AWS Backup Vault Lock on the backup vault and store EBS snapshots in that vault to enforce deletion protection</strong> - This option appears secure by referencing Vault Lock, which can enforce write-once, read-many (WORM) policies for backups. However, EBS snapshots are not directly stored in AWS Backup vaults unless they are created through AWS Backup, and the original setup is using manual or script-driven EBS snapshot creation. Additionally, Vault Lock applies only to backups managed by AWS Backup, not to independently created snapshots through Amazon EC2 or custom scripts. Therefore, while it introduces a secure mechanism, it does not address the current architecture or snapshot process, making it an unsuitable solution without significant re-architecture.</p>\n\n<p><strong>Set up the IAM policy of the user to deny EBS snapshot deletion</strong> - While denying deletion can prevent accidental loss, it also completely blocks all snapshot deletions, including those that are genuinely expired or no longer needed. This violates the requirement to avoid indefinite snapshot retention, leading to storage bloat and increased cost.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin.html\">https://docs.aws.amazon.com/ebs/latest/userguide/recycle-bin.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html\">https://docs.aws.amazon.com/aws-backup/latest/devguide/vault-lock.html</a></p>\n","answers":["<p>Enable AWS Backup Vault Lock on the backup vault and store EBS snapshots in that vault to enforce deletion protection</p>","<p>Set up a 7-day EBS snapshot retention rule in Recycle Bin and apply the rule for all snapshots</p>","<p>Implement a Lambda-based backup automation workflow that archives snapshot metadata in DynamoDB and stores backups in Amazon S3 Glacier Deep Archive for long-term recovery</p>","<p>Set up the IAM policy of the user to deny EBS snapshot deletion</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A company hosts a Microsoft SQL Server database on Amazon EC2 instances with attached Amazon EBS volumes. The operations team takes daily snapshots of these EBS volumes as backups. However, a recent incident occurred in which an automated script designed to clean up expired snapshots accidentally deleted all available snapshots, leading to potential data loss. The company wants to improve the backup strategy to avoid permanent data loss while still ensuring that old snapshots are eventually removed to optimize cost. A solutions architect needs to implement a mechanism that prevents immediate and irreversible deletion of snapshots.\n\nWhich solution will best meet these requirements with the least development effort?","related_lectures":[]},{"_class":"assessment","id":156638805,"assessment_type":"multiple-choice","prompt":{"question":"<p>A fintech company recently conducted a security audit and discovered that some IAM roles and Amazon S3 buckets might be unintentionally shared with external accounts or publicly accessible. The security team wants to identify these overly permissive resources and ensure that only intended principals (within their AWS Organization or specific AWS accounts) have access. They need a solution that can analyze IAM policies and resource policies to detect unintended access paths to AWS resources such as S3 buckets, IAM roles, KMS keys, and SNS topics.</p>\n\n<p>Which solution should the team use to meet this requirement?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Identity and Access Management (IAM) Access Analyzer to evaluate resource-based and identity-based policies and identify resources shared outside the account or organization</strong></p>\n\n<p>AWS IAM Access Analyzer helps identify resources shared with external entities by analyzing resource-based policies (e.g., S3 buckets, KMS keys, SNS topics, IAM roles) and detecting unintended access. It uses automated reasoning to evaluate the effects of policies and determines if a resource is accessible from outside the account or organization. Access Analyzer also supports policy validation, helping administrators craft secure and compliant access policies. It’s purpose-built for detecting and auditing external access paths to resources.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use IAM Access Advisor to get detailed access analysis of S3 bucket policies and determine which principals outside the organization have access</strong> - IAM Access Advisor shows the last accessed information for AWS services used by IAM users and roles, but it does not evaluate resource-based policies or determine if resources are shared externally. It is designed to help with least privilege enforcement by identifying unused permissions, not external access analysis. It cannot detect whether S3 buckets or IAM roles are publicly accessible or shared with specific accounts.</p>\n\n<p><strong>Use AWS Config to track configuration changes and infer resource-sharing behavior by analyzing compliance rules</strong> - AWS Config is used to record configuration changes and evaluate resource compliance against custom or managed rules. While it can track policy changes or detect public S3 access if configured properly, it does not natively reason over policy semantics to determine whether a policy grants external access. Config works best when used in conjunction with Access Analyzer for a comprehensive compliance and access strategy but does not replace Access Analyzer’s policy evaluation capabilities.</p>\n\n<p><strong>Use Amazon Inspector to detect over-permissive IAM policies and access paths across the environment</strong> - Amazon Inspector is primarily a vulnerability assessment tool focused on EC2 instances, container images, and Lambda functions. It checks for software vulnerabilities and security best practices, but it does not evaluate IAM policies or analyze whether resources like S3 buckets or roles are accessible to external accounts. It is not designed for access path analysis or policy-level visibility.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/security/set-permission-guardrails-using-iam-access-advisor-analyze-service-last-accessed-information-aws-organization/\">https://aws.amazon.com/blogs/security/set-permission-guardrails-using-iam-access-advisor-analyze-service-last-accessed-information-aws-organization/</a></p>\n","answers":["<p>Use IAM Access Advisor to get detailed access analysis of S3 bucket policies and determine which principals outside the organization have access</p>","<p>Use AWS Config to track configuration changes and infer resource-sharing behavior by analyzing compliance rules</p>","<p>Use Amazon Inspector to detect over-permissive IAM policies and access paths across the environment</p>","<p>Use AWS Identity and Access Management (IAM) Access Analyzer to evaluate resource-based and identity-based policies and identify resources shared outside the account or organization</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A fintech company recently conducted a security audit and discovered that some IAM roles and Amazon S3 buckets might be unintentionally shared with external accounts or publicly accessible. The security team wants to identify these overly permissive resources and ensure that only intended principals (within their AWS Organization or specific AWS accounts) have access. They need a solution that can analyze IAM policies and resource policies to detect unintended access paths to AWS resources such as S3 buckets, IAM roles, KMS keys, and SNS topics.\n\nWhich solution should the team use to meet this requirement?","related_lectures":[]},{"_class":"assessment","id":156638807,"assessment_type":"multi-select","prompt":{"question":"<p>An enterprise is developing an internal compliance framework for its cloud infrastructure hosted on AWS. The enterprise uses AWS Organizations to group accounts under various organizational units (OUs) based on departmental function. As part of its governance controls, the security team mandates that all Amazon EC2 instances must be tagged to indicate the level of data classification — either 'confidential' or 'public'. Additionally, the organization must ensure that IAM users cannot launch EC2 instances without assigning a classification tag, nor should they be able to remove the tag from running instances. A solutions architect must design a solution to meet these compliance controls while minimizing operational overhead.</p>\n\n<p>Which combination of steps will meet these requirements? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Define a tag policy in AWS Organizations that enforces the <code>dataClassification</code> key and restricts values to 'confidential' and 'public'. Attach this tag policy to the applicable organizational unit (OU) to enforce uniform tagging behavior across accounts</strong></p>\n\n<p>AWS Tag Policies, managed through AWS Organizations, allow administrators to define rules for tag keys and values. These policies do not directly prevent resource creation, but they help enforce tag consistency and visibility by flagging noncompliant resources.</p>\n\n<p>In this case, the solutions architect creates a tag policy that requires the <code>dataClassification</code> key and restricts its values to 'confidential' and 'public'. By attaching this policy to the relevant Organizational Unit (OU), the tag rules automatically apply to all member accounts. Tag policies work across AWS services that support tagging compliance checks. While they don’t block actions like RunInstances, they play a governance and auditing role, helping organizations monitor and enforce consistent tagging.</p>\n\n<p><strong>Create a service control policy (SCP) that denies the <code>ec2:RunInstances</code> API action unless the required tag key is present in the request. Create a second SCP that denies the <code>ec2:DeleteTags</code> action for EC2 resources. Attach both SCPs to the relevant OU in AWS Organizations</strong></p>\n\n<p>Service Control Policies (SCPs) allow you to centrally govern permissions for accounts in AWS Organizations. An SCP defines the maximum set of permissions available to IAM users and roles in an account. When combined with condition keys, SCPs can enforce fine-grained controls on specific operations.</p>\n\n<p>To meet the requirements - one SCP is created to deny the <code>ec2:RunInstances</code> action unless the request includes a <code>dataClassification</code> tag key and a second SCP explicitly denies the <code>ec2:DeleteTags</code> action on EC2 resources to ensure tags cannot be removed. These SCPs are then attached to the OU, thereby applying the policies to all member accounts. This ensures that - EC2 instances cannot be launched without the required tag and tags like <code>dataClassification</code> cannot be deleted, preserving compliance integrity.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q18-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_tagging.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_tagging.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a tag enforcement Lambda function that runs on a schedule to identify EC2 instances without the required tag. The function sends a notification to administrators and optionally shuts down noncompliant resources</strong> - This reactive approach relies on periodic audits rather than enforcing tagging at the time of resource creation. It increases operational overhead and cannot guarantee immediate compliance, especially for short-lived resources.</p>\n\n<p><strong>Use AWS Identity and Access Management (IAM) permission boundaries to restrict EC2-related actions unless the <code>dataClassification</code> tag is present. Apply these boundaries to all IAM roles used for EC2 provisioning</strong> - While IAM permission boundaries can restrict actions within a boundary, they are not designed to enforce tag-based controls across all users or to prevent tag deletion. SCPs and tag policies are more appropriate at the organizational level.</p>\n\n<p><strong>Enable AWS Config rules to detect noncompliant EC2 instances. Trigger an AWS Systems Manager Automation runbook to reapply missing tags automatically when noncompliance is detected</strong> - AWS Config and automation runbooks offer remediation, but do not prevent noncompliant resources from being created in the first place. This violates the requirement for proactive enforcement and minimal public exposure of misclassified data.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_tag-policies.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_tagging.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps_examples_tagging.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies_boundaries.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html\">https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html</a></p>\n","answers":["<p>Create a tag enforcement Lambda function that runs on a schedule to identify EC2 instances without the required tag. The function sends a notification to administrators and optionally shuts down noncompliant resources</p>","<p>Use AWS Identity and Access Management (IAM) permission boundaries to restrict EC2-related actions unless the <code>dataClassification</code> tag is present. Apply these boundaries to all IAM roles used for EC2 provisioning</p>","<p>Define a tag policy in AWS Organizations that enforces the <code>dataClassification</code> key and restricts values to 'confidential' and 'public'. Attach this tag policy to the applicable organizational unit (OU) to enforce uniform tagging behavior across accounts</p>","<p>Enable AWS Config rules to detect noncompliant EC2 instances. Trigger an AWS Systems Manager Automation runbook to reapply missing tags automatically when noncompliance is detected</p>","<p>Create a service control policy (SCP) that denies the <code>ec2:RunInstances</code> API action unless the required tag key is present in the request. Create a second SCP that denies the <code>ec2:DeleteTags</code> action for EC2 resources. Attach both SCPs to the relevant OU in AWS Organizations</p>"]},"correct_response":["c","e"],"section":"Design Secure Architectures","question_plain":"An enterprise is developing an internal compliance framework for its cloud infrastructure hosted on AWS. The enterprise uses AWS Organizations to group accounts under various organizational units (OUs) based on departmental function. As part of its governance controls, the security team mandates that all Amazon EC2 instances must be tagged to indicate the level of data classification — either 'confidential' or 'public'. Additionally, the organization must ensure that IAM users cannot launch EC2 instances without assigning a classification tag, nor should they be able to remove the tag from running instances. A solutions architect must design a solution to meet these compliance controls while minimizing operational overhead.\n\nWhich combination of steps will meet these requirements? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638809,"assessment_type":"multiple-choice","prompt":{"question":"<p>A medium-sized business has a taxi dispatch application deployed on an Amazon EC2 instance. Because of an unknown bug, the application causes the instance to freeze regularly. Then, the instance has to be manually restarted via the AWS management console.</p>\n\n<p>Which of the following is the MOST cost-optimal and resource-efficient way to implement an automated solution until a permanent fix is delivered by the development team?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, an EC2 Reboot CloudWatch Alarm Action can be used to reboot the instance</strong></p>\n\n<p>Using Amazon CloudWatch alarm actions, you can create alarms that automatically stop, terminate, reboot, or recover your Amazon EC2 instances. You can use the stop or terminate actions to help you save money when you no longer need an instance to be running. You can use the reboot and recover actions to automatically reboot those instances or recover them onto new hardware if a system impairment occurs.</p>\n\n<p>You can create an Amazon CloudWatch alarm that monitors an Amazon EC2 instance and automatically reboots the instance. The reboot alarm action is recommended for Instance Health Check failures (as opposed to the recover alarm action, which is suited for System Health Check failures).</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, Amazon CloudWatch Alarm can publish to an Amazon Simple Notification Service (Amazon SNS) event which can then trigger an AWS lambda function. The AWS lambda function can use Amazon EC2 API to reboot the instance</strong></p>\n\n<p><strong>Use Amazon EventBridge events to trigger an AWS Lambda function to check the instance status every 5 minutes. In the case of Instance Health Check failure, the AWS lambda function can use Amazon EC2 API to reboot the instance</strong></p>\n\n<p><strong>Use Amazon EventBridge events to trigger an AWS Lambda function to reboot the instance status every 5 minutes</strong></p>\n\n<p>Using Amazon EventBridge event or Amazon CloudWatch alarm to trigger an AWS lambda function, directly or indirectly, is wasteful of resources. You should just use the EC2 Reboot CloudWatch Alarm Action to reboot the instance. So all the options that trigger the AWS lambda function are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/UsingAlarmActions.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/UsingAlarmActions.html</a></p>\n","answers":["<p>Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, Amazon CloudWatch Alarm can publish to an Amazon Simple Notification Service (Amazon SNS) event which can then trigger an AWS lambda function. The AWS lambda function can use Amazon EC2 API to reboot the instance</p>","<p>Use Amazon EventBridge events to trigger an AWS Lambda function to check the instance status every 5 minutes. In the case of Instance Health Check failure, the AWS lambda function can use Amazon EC2 API to reboot the instance</p>","<p>Setup an Amazon CloudWatch alarm to monitor the health status of the instance. In case of an Instance Health Check failure, an EC2 Reboot CloudWatch Alarm Action can be used to reboot the instance</p>","<p>Use Amazon EventBridge events to trigger an AWS Lambda function to reboot the instance status every 5 minutes</p>"]},"correct_response":["c"],"section":"Design Cost-Optimized Architectures","question_plain":"A medium-sized business has a taxi dispatch application deployed on an Amazon EC2 instance. Because of an unknown bug, the application causes the instance to freeze regularly. Then, the instance has to be manually restarted via the AWS management console.\n\nWhich of the following is the MOST cost-optimal and resource-efficient way to implement an automated solution until a permanent fix is delivered by the development team?","related_lectures":[]},{"_class":"assessment","id":156638811,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media streaming company expects a major increase in user activity during the launch of a highly anticipated live event. The streaming platform is deployed on AWS and uses Amazon EC2 instances for the application layer and Amazon RDS for persistent storage. The operations team needs to proactively monitor system performance to ensure a smooth user experience during the event. Their monitoring setup must provide data visibility with intervals of no more than 2 minutes, and the team prefers a solution that is quick to implement and low-maintenance.</p>\n\n<p>Which solution should the team implement?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Enable detailed monitoring on all EC2 instances and use Amazon CloudWatch metrics to track performance</strong></p>\n\n<p>By default, EC2 instances publish CloudWatch metrics at 5-minute intervals. Enabling detailed monitoring changes this to 1-minute intervals, allowing the team to observe system performance with the necessary granularity. CloudWatch metrics provide native integration with EC2 and are the most efficient way to analyze CPU, network, and disk utilization without complex setups.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q20-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-basic-detailed.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-basic-detailed.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon EventBridge to collect EC2 state changes and publish them to Amazon SNS. Subscribe a monitoring dashboard to the SNS topic to visualize metrics</strong> - EventBridge and SNS are designed for event-driven architectures and alerting—not for performance monitoring or detailed metric analysis. This approach would not provide the continuous, granular data the company needs to evaluate real-time performance trends. Moreover, SNS is not built to directly support monitoring dashboards.</p>\n\n<p><strong>Stream EC2 system logs to an Amazon OpenSearch Service domain for real-time indexing and visualization. Use OpenSearch Dashboards to monitor CPU and memory metrics</strong> - While Amazon OpenSearch Service is excellent for log indexing and search, it does not natively collect EC2 performance metrics like CPU utilization or disk I/O. To make this work, the company would need to implement custom log collection and parsing, which adds unnecessary complexity compared to using CloudWatch.</p>\n\n<p><strong>Install the CloudWatch agent on all EC2 instances. Configure the agent to collect high-resolution custom metrics and stream them to CloudWatch Logs for analysis via Amazon Athena</strong> - Although this setup could support fine-grained metric collection, it introduces significant operational overhead. It requires manual agent installation, configuration, and maintenance across all instances. Analyzing logs via Athena also introduces query latency, which is not ideal for real-time performance tracking.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-basic-detailed.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/cloudwatch-metrics-basic-detailed.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Install-CloudWatch-Agent.html\">https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/Install-CloudWatch-Agent.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html\">https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html</a></p>\n","answers":["<p>Use Amazon EventBridge to collect EC2 state changes and publish them to Amazon SNS. Subscribe a monitoring dashboard to the SNS topic to visualize metrics</p>","<p>Enable detailed monitoring on all EC2 instances and use Amazon CloudWatch metrics to track performance</p>","<p>Stream EC2 system logs to an Amazon OpenSearch Service domain for real-time indexing and visualization. Use OpenSearch Dashboards to monitor CPU and memory metrics</p>","<p>Install the CloudWatch agent on all EC2 instances. Configure the agent to collect high-resolution custom metrics and stream them to CloudWatch Logs for analysis via Amazon Athena</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A media streaming company expects a major increase in user activity during the launch of a highly anticipated live event. The streaming platform is deployed on AWS and uses Amazon EC2 instances for the application layer and Amazon RDS for persistent storage. The operations team needs to proactively monitor system performance to ensure a smooth user experience during the event. Their monitoring setup must provide data visibility with intervals of no more than 2 minutes, and the team prefers a solution that is quick to implement and low-maintenance.\n\nWhich solution should the team implement?","related_lectures":[]},{"_class":"assessment","id":156638813,"assessment_type":"multi-select","prompt":{"question":"<p>Reporters at a news agency upload/download video files (about 500 megabytes each) to/from an Amazon S3 bucket as part of their daily work. As the agency has started offices in remote locations, it has resulted in poor latency for uploading and accessing data to/from the given Amazon S3 bucket. The agency wants to continue using a serverless storage solution such as Amazon S3 but wants to improve the performance.</p>\n\n<p>As a solutions architect, which of the following solutions do you propose to address this issue? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use Amazon CloudFront distribution with origin as the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files</strong></p>\n\n<p>Amazon CloudFront is a fast content delivery network (CDN) service that securely delivers data, videos, applications, and APIs to customers globally with low latency, high transfer speeds, within a developer-friendly environment.\nWhen an object from Amazon S3 that is set up with Amazon CloudFront CDN is requested, the request would come through the Edge Location transfer paths only for the first request. Thereafter, it would be served from the nearest edge location to the users until it expires. So in this way, you can speed up uploads as well as downloads for the video files.</p>\n\n<p>Following is a good reference blog for a deep-dive:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/amazon-cloudfront-content-uploads-post-put-other-methods/\">https://aws.amazon.com/blogs/aws/amazon-cloudfront-content-uploads-post-put-other-methods/</a></p>\n\n<p><strong>Enable Amazon S3 Transfer Acceleration (Amazon S3TA) for the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files</strong></p>\n\n<p>Amazon S3 Transfer Acceleration (Amazon S3TA) can speed up content transfers to and from Amazon S3 by as much as 50-500% for long-distance transfer of larger objects. Transfer Acceleration takes advantage of Amazon CloudFront’s globally distributed edge locations. As the data arrives at an edge location, data is routed to Amazon S3 over an optimized network path. So this option is also correct.</p>\n\n<p>Amazon S3TA:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q21-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/s3/transfer-acceleration/\">https://aws.amazon.com/s3/transfer-acceleration/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create new Amazon S3 buckets in every region where the agency has a remote office, so that each office can maintain its storage for the media assets</strong> - Creating new Amazon S3 buckets in every region is not an option, since the agency maintains centralized storage. Hence this option is incorrect.</p>\n\n<p><strong>Move Amazon S3 data into Amazon Elastic File System (Amazon EFS) created in a US region, connect to Amazon EFS file system from Amazon EC2 instances in other AWS regions using an inter-region VPC peering connection</strong></p>\n\n<p><strong>Spin up Amazon EC2 instances in each region where the agency has a remote office. Create a daily job to transfer Amazon S3 data into Amazon EBS volumes attached to the Amazon EC2 instances</strong></p>\n\n<p>Both these options using Amazon EC2 instances are not correct for the given use-case, as the agency wants a serverless storage solution.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistS3AndCustomOrigins.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistS3AndCustomOrigins.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/transfer-acceleration.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/s3/transfer-acceleration/\">https://aws.amazon.com/s3/transfer-acceleration/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/amazon-cloudfront-content-uploads-post-put-other-methods/\">https://aws.amazon.com/blogs/aws/amazon-cloudfront-content-uploads-post-put-other-methods/</a></p>\n","answers":["<p>Create new Amazon S3 buckets in every region where the agency has a remote office, so that each office can maintain its storage for the media assets</p>","<p>Move Amazon S3 data into Amazon Elastic File System (Amazon EFS) created in a US region, connect to Amazon EFS file system from Amazon EC2 instances in other AWS regions using an inter-region VPC peering connection</p>","<p>Use Amazon CloudFront distribution with origin as the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files</p>","<p>Enable Amazon S3 Transfer Acceleration (Amazon S3TA) for the Amazon S3 bucket. This would speed up uploads as well as downloads for the video files</p>","<p>Spin up Amazon EC2 instances in each region where the agency has a remote office. Create a daily job to transfer Amazon S3 data into Amazon EBS volumes attached to the Amazon EC2 instances</p>"]},"correct_response":["c","d"],"section":"Design High-Performing Architectures","question_plain":"Reporters at a news agency upload/download video files (about 500 megabytes each) to/from an Amazon S3 bucket as part of their daily work. As the agency has started offices in remote locations, it has resulted in poor latency for uploading and accessing data to/from the given Amazon S3 bucket. The agency wants to continue using a serverless storage solution such as Amazon S3 but wants to improve the performance.\n\nAs a solutions architect, which of the following solutions do you propose to address this issue? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638815,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company needs a massive PostgreSQL database and the engineering team would like to retain control over managing the patches, version upgrades for the database, and consistent performance with high IOPS. The team wants to install the database on an Amazon EC2 instance with the optimal storage type on the attached Amazon EBS volume.</p>\n\n<p>As a solutions architect, which of the following configurations would you suggest to the engineering team?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon EC2 with Amazon EBS volume of Provisioned IOPS SSD (io1) type</strong></p>\n\n<p>Amazon EBS provides the following volume types, which differ in performance characteristics and price so that you can tailor your storage performance and cost to the needs of your applications.</p>\n\n<p>The volumes types fall into two categories:</p>\n\n<p>SSD-backed volumes optimized for transactional workloads involving frequent read/write operations with small I/O size, where the dominant performance attribute is IOPS</p>\n\n<p>HDD-backed volumes optimized for large streaming workloads where throughput (measured in MiB/s) is a better performance measure than IOPS</p>\n\n<p>Provision IOPS type supports critical business applications that require sustained IOPS performance, or more than 16,000 IOPS or 250 MiB/s of throughput per volume. Examples are large database workloads, such as:\nMongoDB\nCassandra\nMicrosoft SQL Server\nMySQL\nPostgreSQL\nOracle</p>\n\n<p>Therefore, Amazon EC2 with Amazon EBS volume of Provisioned IOPS SSD (io1) type is the right fit for the given use-case.</p>\n\n<p>Please see this detailed overview of the volume types for Amazon EBS volumes.\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q22-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon EC2 with Amazon EBS volume of General Purpose SSD (gp2) type</strong></p>\n\n<p><strong>Amazon EC2 with Amazon EBS volume of Throughput Optimized HDD (st1) type</strong></p>\n\n<p><strong>Amazon EC2 with Amazon EBS volume of cold HDD (sc1) type</strong></p>\n\n<p>Per the explanation in the detailed overview provided above, these three options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n","answers":["<p>Amazon EC2 with Amazon EBS volume of General Purpose SSD (gp2) type</p>","<p>Amazon EC2 with Amazon EBS volume of Provisioned IOPS SSD (io1) type</p>","<p>Amazon EC2 with Amazon EBS volume of Throughput Optimized HDD (st1) type</p>","<p>Amazon EC2 with Amazon EBS volume of cold HDD (sc1) type</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"A company needs a massive PostgreSQL database and the engineering team would like to retain control over managing the patches, version upgrades for the database, and consistent performance with high IOPS. The team wants to install the database on an Amazon EC2 instance with the optimal storage type on the attached Amazon EBS volume.\n\nAs a solutions architect, which of the following configurations would you suggest to the engineering team?","related_lectures":[]},{"_class":"assessment","id":156638817,"assessment_type":"multiple-choice","prompt":{"question":"<p>A digital media startup allows users to submit images through its web portal. These images are uploaded directly into an Amazon S3 bucket. On average, around 200 images are uploaded daily. The company wants to automatically generate a smaller preview version (thumbnail) of each new image and store the resulting thumbnails in a separate Amazon S3 bucket. The team prefers a design that is low-cost, requires minimal infrastructure management, and automatically reacts to new uploads.</p>\n\n<p>Which solution will meet these requirements MOST cost-effectively?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure the S3 bucket to send an event notification to an AWS Lambda function each time a new image is uploaded. Use the Lambda function to process the image, create a thumbnail, and store the thumbnail in the second S3 bucket</strong></p>\n\n<p>This approach follows a serverless, event-driven architecture that is highly cost-effective, scalable, and operationally efficient. The solution involves configuring Amazon S3 to send an event notification to an AWS Lambda function each time a new photo is uploaded to the primary S3 bucket. When triggered, the Lambda function processes the uploaded image, generates a thumbnail and stores it in a separate S3 bucket. This event-driven architecture ensures near real-time processing with minimal operational overhead. Because AWS Lambda is a fully managed, serverless compute service, it runs only when invoked and scales automatically, making it highly cost-effective for handling approximately 200 uploads per day. Additionally, S3 event notifications are natively supported and integrate seamlessly with Lambda, eliminating the need for persistent infrastructure or scheduled jobs. This solution provides scalability, low latency, and cost efficiency while ensuring clean separation of original images and their thumbnails.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a step-based processing workflow using AWS Glue jobs triggered on a regular interval. Use the jobs to scan the primary S3 bucket for new files and generate thumbnails for any that lack them. Write the thumbnails to a second S3 bucket</strong> - AWS Glue is designed for ETL (Extract, Transform, Load) operations on structured and semi-structured data, not real-time image processing. Running Glue jobs on a schedule for this use case introduces unnecessary complexity and cost.</p>\n\n<p><strong>Deploy a containerized application on AWS Fargate that polls the S3 bucket every minute to detect new uploads. Configure the container to generate thumbnails and save them in the second bucket</strong> - While Fargate is serverless, continuously polling the S3 bucket is inefficient and incurs costs even when no new images are present. It also adds operational complexity compared to event-driven processing.</p>\n\n<p><strong>Enable Amazon S3 Access Analyzer and configure it to call an AWS Lambda function whenever a new image is added. Use the Lambda function to generate and store the thumbnail</strong> - S3 Access Analyzer is used for auditing and security analysis, not event-driven processing or triggering Lambda functions. It cannot be used to detect object uploads or initiate thumbnail generation.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-s3.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-analyzer.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-analyzer.html</a></p>\n","answers":["<p>Set up a step-based processing workflow using AWS Glue jobs triggered on a regular interval. Use the jobs to scan the primary S3 bucket for new files and generate thumbnails for any that lack them. Write the thumbnails to a second S3 bucket</p>","<p>Deploy a containerized application on AWS Fargate that polls the S3 bucket every minute to detect new uploads. Configure the container to generate thumbnails and save them in the second bucket</p>","<p>Enable Amazon S3 Access Analyzer and configure it to call an AWS Lambda function whenever a new image is added. Use the Lambda function to generate and store the thumbnail</p>","<p>Configure the S3 bucket to send an event notification to an AWS Lambda function each time a new image is uploaded. Use the Lambda function to process the image, create a thumbnail, and store the thumbnail in the second S3 bucket</p>"]},"correct_response":["d"],"section":"Design High-Performing Architectures","question_plain":"A digital media startup allows users to submit images through its web portal. These images are uploaded directly into an Amazon S3 bucket. On average, around 200 images are uploaded daily. The company wants to automatically generate a smaller preview version (thumbnail) of each new image and store the resulting thumbnails in a separate Amazon S3 bucket. The team prefers a design that is low-cost, requires minimal infrastructure management, and automatically reacts to new uploads.\n\nWhich solution will meet these requirements MOST cost-effectively?","related_lectures":[]},{"_class":"assessment","id":156638819,"assessment_type":"multiple-choice","prompt":{"question":"<p>An organization operates a legacy reporting tool hosted on an Amazon EC2 instance located within a public subnet of a VPC. This tool aggregates scanned PDF reports from field devices and temporarily stores them on an attached Amazon EBS volume. At the end of each day, the tool transfers the accumulated files to an Amazon S3 bucket for archival. A solutions architect identifies that the files are being uploaded over the internet using S3's public endpoint. To improve security and avoid exposing data traffic to the public internet, the architect needs to reconfigure the setup so that uploads to Amazon S3 occur privately without using the public S3 endpoint.</p>\n\n<p>Which solution will fulfill these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a gateway VPC endpoint for Amazon S3 in the VPC. Ensure that the EC2 instance’s subnet route table is updated to route S3 traffic through the endpoint. Confirm that appropriate IAM policies are in place to permit access via the VPC endpoint</strong></p>\n\n<p>A gateway VPC endpoint for Amazon S3 enables private connectivity between your Amazon VPC and S3 without routing traffic over the public internet. By creating a gateway VPC endpoint, the EC2 instance uploads data to S3 over AWS's internal network, ensuring the traffic remains entirely within the AWS infrastructure. This approach satisfies the requirement to avoid using the public endpoint, enhances security, and minimizes exposure to external threats. Additionally, route table entries in the public subnet can be updated to direct all S3-bound traffic through the VPC endpoint, and IAM or bucket policies can further restrict access to only traffic coming from the VPC endpoint. This solution requires no application changes and involves minimal operational overhead, making it both secure and efficient.</p>\n\n<p>There is no additional charge for using gateway endpoints. Amazon S3 supports both gateway endpoints and interface endpoints. With a gateway endpoint, you can access Amazon S3 from your VPC, without requiring an internet gateway or NAT device for your VPC, and with no additional cost. However, gateway endpoints do not allow access from on-premises networks, from peered VPCs in other AWS Regions, or through a transit gateway.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an S3 access point within the same Region and attach a policy that grants the EC2 instance access. Update the application to use the access point alias to upload data</strong> - While Amazon S3 access points simplify managing access to shared buckets across many applications or teams, they do not change the network path used to reach Amazon S3. Without a VPC endpoint, traffic using an access point still flows over the public internet. This option does not meet the requirement to avoid using S3’s public endpoint.</p>\n\n<p><strong>Set up a NAT gateway in the public subnet and modify the route table of the EC2 instance's subnet to direct Amazon S3 traffic through the NAT gateway</strong> - Although NAT gateways can route traffic to the internet, they do not provide private access to S3. Traffic sent through a NAT gateway to S3 still uses public endpoints and incurs data transfer charges. This does not satisfy the requirement to avoid public endpoint usage.</p>\n\n<p><strong>Provision a dedicated AWS Direct Connect link to route traffic from the VPC to Amazon S3 privately</strong> - Direct Connect is ideal for high-throughput, low-latency, hybrid workloads where traffic flows from on-premises to AWS. However, it is unnecessary for this use case, which involves internal traffic between EC2 and S3 within AWS.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html</a></p>\n","answers":["<p>Create a gateway VPC endpoint for Amazon S3 in the VPC. Ensure that the EC2 instance’s subnet route table is updated to route S3 traffic through the endpoint. Confirm that appropriate IAM policies are in place to permit access via the VPC endpoint</p>","<p>Create an S3 access point within the same Region and attach a policy that grants the EC2 instance access. Update the application to use the access point alias to upload data</p>","<p>Set up a NAT gateway in the public subnet and modify the route table of the EC2 instance's subnet to direct Amazon S3 traffic through the NAT gateway</p>","<p>Provision a dedicated AWS Direct Connect link to route traffic from the VPC to Amazon S3 privately</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"An organization operates a legacy reporting tool hosted on an Amazon EC2 instance located within a public subnet of a VPC. This tool aggregates scanned PDF reports from field devices and temporarily stores them on an attached Amazon EBS volume. At the end of each day, the tool transfers the accumulated files to an Amazon S3 bucket for archival. A solutions architect identifies that the files are being uploaded over the internet using S3's public endpoint. To improve security and avoid exposing data traffic to the public internet, the architect needs to reconfigure the setup so that uploads to Amazon S3 occur privately without using the public S3 endpoint.\n\nWhich solution will fulfill these requirements?","related_lectures":[]},{"_class":"assessment","id":156638821,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company wants to ensure high availability for its Amazon RDS database. The development team wants to opt for Multi-AZ deployment and they would like to understand what happens when the primary instance of the Multi-AZ configuration goes down.</p>\n\n<p>As a Solutions Architect, which of the following will you identify as the outcome of the scenario?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>The CNAME record will be updated to point to the standby database</strong></p>\n\n<p>Amazon RDS provides high availability and failover support for DB instances using Multi-AZ deployments. Amazon RDS uses several different technologies to provide failover support. Multi-AZ deployments for MariaDB, MySQL, Oracle, and PostgreSQL DB instances use Amazon's failover technology. SQL Server DB instances use SQL Server Database Mirroring (DBM) or Always On Availability Groups (AGs).</p>\n\n<p>In a Multi-AZ deployment, Amazon RDS automatically provisions and maintains a synchronous standby replica in a different Availability Zone. The primary DB instance is synchronously replicated across Availability Zones to a standby replica to provide data redundancy, eliminate I/O freezes, and minimize latency spikes during system backups. Running a DB instance with high availability can enhance availability during planned system maintenance, and help protect your databases against DB instance failure and Availability Zone disruption.</p>\n\n<p>Failover is automatically handled by Amazon RDS so that you can resume database operations as quickly as possible without administrative intervention. When failing over, Amazon RDS simply flips the canonical name record (CNAME) for your DB instance to point at the standby, which is in turn promoted to become the new primary. Multi-AZ means the URL is the same, the failover is automated, and the CNAME will automatically be updated to point to the standby database.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The URL to access the database will change to the standby database</strong> - As discussed above, URL remains the same.</p>\n\n<p><strong>An email will be sent to the System Administrator asking for manual intervention</strong> - This option is incorrect and it has been added as a distractor.</p>\n\n<p><strong>The application will be down until the primary database has recovered itself</strong> - This option is incorrect and it has been added as a distractor.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.MultiAZ.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/faqs/\">https://aws.amazon.com/rds/faqs/</a></p>\n","answers":["<p>An email will be sent to the System Administrator asking for manual intervention</p>","<p>The CNAME record will be updated to point to the standby database</p>","<p>The URL to access the database will change to the standby database</p>","<p>The application will be down until the primary database has recovered itself</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A company wants to ensure high availability for its Amazon RDS database. The development team wants to opt for Multi-AZ deployment and they would like to understand what happens when the primary instance of the Multi-AZ configuration goes down.\n\nAs a Solutions Architect, which of the following will you identify as the outcome of the scenario?","related_lectures":[]},{"_class":"assessment","id":156638823,"assessment_type":"multiple-choice","prompt":{"question":"<p>A logistics company runs a two-step job handling process on AWS. The first step quickly receives job submissions from clients, while the second step requires longer processing time to complete each job. Currently, both steps run on separate Amazon EC2 Auto Scaling groups. However, during high-demand hours, the job processing stage falls behind, and there is concern that jobs may be lost due to instance termination during scaling events. A solutions architect needs to design a more scalable and reliable architecture that preserves job data and accommodates fluctuating demand in both stages.</p>\n\n<p>Which solution will meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on number of messages in each queue</strong></p>\n\n<p>This solution effectively addresses both the need for scalability and the requirement to avoid data loss. By introducing Amazon SQS queues between the two processing stages (order collection and order fulfillment), the architecture becomes decoupled and resilient. One queue buffers incoming orders, while the second queue holds orders awaiting fulfillment, ensuring no data is lost even when processing slows during peak traffic. Each group of EC2 instances polls its respective queue for work, and Auto Scaling policies can be configured based on the number of messages in each queue. This allows the system to dynamically scale based on real-time demand, ensuring responsiveness without over-provisioning resources. This approach minimizes latency for order intake while allowing asynchronous processing of order fulfillment, leading to a highly available and cost-efficient solution.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a single Amazon SQS queue for both the job intake and job processing stages. Assign the SQS queue to collect incoming jobs as well as processing jobs. Configure all EC2 instances to poll this queue. Scale the Auto Scaling groups based on number of messages in the queue</strong> - This option is incorrect because using a single Amazon SQS queue for both job intake and job processing introduces ambiguity and tight coupling between two logically distinct stages—order collection and order fulfillment. In this architecture, the order intake is fast, while order fulfillment is slower and more resource-intensive. By combining both types of messages into a single SQS queue, there’s no way to prioritize, distinguish, or independently scale resources for each task. For example, the fulfillment EC2 instances might mistakenly process intake-type messages or vice versa unless complex custom filtering logic is implemented, which increases operational complexity and risk.</p>\n\n<p><strong>Configure each Auto Scaling group to maintain its maximum expected size during peak hours by setting a fixed minimum capacity. Monitor CPUUtilization through Amazon CloudWatch to ensure consistent scaling behavior</strong> - This approach pre-provisions the infrastructure for peak traffic, using CPUUtilization as a general metric. While this reduces the risk of lag due to insufficient instances, it lacks flexibility and may result in over-provisioning, leading to unnecessary costs. It also does not guarantee data persistence if instances terminate unexpectedly during processing, since there’s no queue-based buffering.</p>\n\n<p><strong>Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on notifications from each queue</strong> - While this solution correctly suggests decoupling the order collection and order fulfillment processes using Amazon SQS queues, it proposes using notifications from the queues to trigger scaling. This acts as a distractor, since SQS queues do not support sending notifications. Notifications (e.g., using Amazon SNS) are not the most effective mechanism for dynamic and responsive scaling. The more reliable and recommended approach is to scale based on the number of pending messages in each queue.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html</a></p>\n","answers":["<p>Set up a single Amazon SQS queue for both the job intake and job processing stages. Assign the SQS queue to collect incoming jobs as well as processing jobs. Configure all EC2 instances to poll this queue. Scale the Auto Scaling groups based on number of messages in the queue</p>","<p>Configure each Auto Scaling group to maintain its maximum expected size during peak hours by setting a fixed minimum capacity. Monitor CPUUtilization through Amazon CloudWatch to ensure consistent scaling behavior</p>","<p>Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on notifications from each queue</p>","<p>Set up two Amazon SQS queues to decouple the job intake and job processing stages respectively. Assign one SQS queue to collect incoming jobs, and another to queue them for processing. Configure the EC2 instances to poll the relevant queue. Scale the Auto Scaling groups based on number of messages in each queue</p>"]},"correct_response":["d"],"section":"Design Resilient Architectures","question_plain":"A logistics company runs a two-step job handling process on AWS. The first step quickly receives job submissions from clients, while the second step requires longer processing time to complete each job. Currently, both steps run on separate Amazon EC2 Auto Scaling groups. However, during high-demand hours, the job processing stage falls behind, and there is concern that jobs may be lost due to instance termination during scaling events. A solutions architect needs to design a more scalable and reliable architecture that preserves job data and accommodates fluctuating demand in both stages.\n\nWhich solution will meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638825,"assessment_type":"multiple-choice","prompt":{"question":"<p>A mobile-based e-learning platform is migrating its backend storage layer to Amazon DynamoDB to support a rapidly increasing number of student users and learning transactions. The platform must ensure seamless availability and minimal disruption for a global user base. The DynamoDB design must provide low-latency performance, high availability, and automatic fault tolerance across geographies with the lowest possible operational overhead and cost.</p>\n\n<p>Which solution will fulfill these needs in the most cost-efficient manner?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use DynamoDB global tables for automatic multi-Region replication. Enable provisioned capacity mode with auto scaling to optimize cost and ensure consistent availability</strong></p>\n\n<p>DynamoDB global tables offer a native, multi-Region solution that provides high availability and resiliency by replicating data automatically across AWS Regions. This ensures users around the world experience low-latency read and write operations. By using provisioned capacity mode with auto scaling, the company can optimize cost based on actual throughput requirements rather than overprovisioning resources. This approach eliminates the need for manual replication or custom logic, and it ensures continuous availability in the event of a Regional disruption.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Enable DynamoDB Accelerator (DAX) to reduce response time for read operations. Deploy DAX in one Region, and use scheduled Lambda functions to replicate data to other Regions</strong> - DAX improves read performance through in-memory caching, but it does not help with write scalability, cross-Region replication, or resiliency. Scheduled Lambda functions for replication are not real-time, can fail under high load, and add complexity to the architecture. This setup does not fulfill the requirement for continuous availability and resilience for a global user base.</p>\n\n<p><strong>Deploy separate DynamoDB tables in each required AWS Region using on-demand capacity mode. Implement a custom cross-Region replication mechanism by streaming data changes with DynamoDB Streams and processing them through AWS Lambda functions</strong> - While DynamoDB Streams can capture real-time data modifications in a table, using them for manual cross-Region replication requires building and maintaining custom replication logic—typically with AWS Lambda functions or AWS Glue jobs. This approach introduces significant complexity, potential latency, and increased operational burden. It also lacks automated conflict resolution, version control, and automatic failover capabilities. Additionally, this setup doesn't guarantee strong consistency across Regions, and managing data conflicts or write ordering becomes challenging.</p>\n\n<p><strong>Create separate DynamoDB tables in multiple Regions. Use AWS Data Pipeline to synchronize data periodically between Regions to maintain availability</strong> - Manually managing multiple DynamoDB tables across Regions using AWS Data Pipeline introduces significant operational complexity and replication delays. This method does not ensure real-time synchronization or automatic failover, making it unsuitable for high-throughput, latency-sensitive applications like online gaming. It also requires custom conflict resolution and lacks the seamless integration offered by global tables.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/V2globaltables_HowItWorks.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Streams.html</a></p>\n","answers":["<p>Use DynamoDB global tables for automatic multi-Region replication. Enable provisioned capacity mode with auto scaling to optimize cost and ensure consistent availability</p>","<p>Enable DynamoDB Accelerator (DAX) to reduce response time for read operations. Deploy DAX in one Region, and use scheduled Lambda functions to replicate data to other Regions</p>","<p>Deploy separate DynamoDB tables in each required AWS Region using on-demand capacity mode. Implement a custom cross-Region replication mechanism by streaming data changes with DynamoDB Streams and processing them through AWS Lambda functions</p>","<p>Create separate DynamoDB tables in multiple Regions. Use AWS Data Pipeline to synchronize data periodically between Regions to maintain availability</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A mobile-based e-learning platform is migrating its backend storage layer to Amazon DynamoDB to support a rapidly increasing number of student users and learning transactions. The platform must ensure seamless availability and minimal disruption for a global user base. The DynamoDB design must provide low-latency performance, high availability, and automatic fault tolerance across geographies with the lowest possible operational overhead and cost.\n\nWhich solution will fulfill these needs in the most cost-efficient manner?","related_lectures":[]},{"_class":"assessment","id":156638827,"assessment_type":"multiple-choice","prompt":{"question":"<p>A digital content production company has transitioned all of its media assets to Amazon S3 in an effort to reduce storage costs. However, the rendering engine used in production continues to run in an on-premises data center and requires frequent and low-latency access to large media files. The company wants to implement a storage solution that maintains application performance while keeping costs low.</p>\n\n<p>Which approach should the company choose to meet these requirements in the most cost-effective way?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up an Amazon S3 File Gateway to provide storage for the on-premises application</strong></p>\n\n<p>Amazon S3 File Gateway is designed specifically for on-premises applications that need low-latency access to S3 data. It caches frequently accessed data locally and exposes the S3 bucket as an NFS or SMB file share, making it ideal for performance-sensitive workloads like rendering. It is also cost-effective as the majority of data remains in S3.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q28-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html\">https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy an Amazon FSx for Lustre file system and sync media data from Amazon S3 into it using DataSync. Mount the FSx file system on the on-premises render servers using a VPN tunnel</strong> - While Amazon FSx for Lustre is a high-performance file system suited for HPC and rendering workloads, it incurs higher costs than simpler alternatives and is typically optimized for cloud-based compute rather than on-premises usage. Additionally, the use of AWS DataSync and VPN tunneling introduces complexity and potential performance bottlenecks for consistent two-way file access.</p>\n\n<p><strong>Use Mountpoint for Amazon S3 on the on-premises rendering servers to facilitate low-latency access to the S3 bucket</strong> - Mountpoint for Amazon S3 is an open source file client that makes it easy for your file-aware Linux applications to connect directly to Amazon S3 buckets. It can also be installed on your existing on-premises systems, with access to S3 either directly or over an AWS Direct Connect connection via AWS PrivateLink for Amazon S3. It is not POSIX compliant. It is not intended for low-latency or local caching use-cases from on-premises environments.</p>\n\n<p><strong>Set up a dedicated on-premises storage array that periodically fetches data from Amazon S3 using a custom-built application. Mount this storage volume on the rendering servers as their primary working directory</strong> - This solution requires developing and maintaining a custom integration layer to periodically download files from S3 and sync with local storage. It increases operational burden and introduces latency and consistency issues. Additionally, the costs of maintaining on-premises hardware negate the cost benefits of moving to S3 in the first place.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html\">https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/mountpoint-for-amazon-s3-generally-available-and-ready-for-production-workloads/\">https://aws.amazon.com/blogs/aws/mountpoint-for-amazon-s3-generally-available-and-ready-for-production-workloads/</a></p>\n","answers":["<p>Use Mountpoint for Amazon S3 on the on-premises rendering servers to facilitate low-latency access to the S3 bucket</p>","<p>Set up an Amazon S3 File Gateway to provide storage for the on-premises application</p>","<p>Set up a dedicated on-premises storage array that periodically fetches data from Amazon S3 using a custom-built application. Mount this storage volume on the rendering servers as their primary working directory</p>","<p>Deploy an Amazon FSx for Lustre file system and sync media data from Amazon S3 into it using DataSync. Mount the FSx file system on the on-premises render servers using a VPN tunnel</p>"]},"correct_response":["b"],"section":"Design Cost-Optimized Architectures","question_plain":"A digital content production company has transitioned all of its media assets to Amazon S3 in an effort to reduce storage costs. However, the rendering engine used in production continues to run in an on-premises data center and requires frequent and low-latency access to large media files. The company wants to implement a storage solution that maintains application performance while keeping costs low.\n\nWhich approach should the company choose to meet these requirements in the most cost-effective way?","related_lectures":[]},{"_class":"assessment","id":156638771,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce company uses a two-tier architecture with application servers in the public subnet and an Amazon RDS MySQL DB in a private subnet. The development team can use a bastion host in the public subnet to access the MySQL database and run queries from the bastion host. However, end-users are reporting application errors. Upon inspecting application logs, the team notices several \"could not connect to server: connection timed out\" error messages.</p>\n\n<p>Which of the following options represent the root cause for this issue?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>The security group configuration for the database instance does not have the correct rules to allow inbound connections from the application servers</strong></p>\n\n<p>You should use security groups to control the inbound and outbound traffic for your database instance. For your application servers, create a security group with inbound rules that use the IP addresses of the client application as the source. This security group allows your client application to connect to your application servers. Then create a second security group for your database instance and create a new rule by specifying the security group that you created earlier as the source for this database-specific security group.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q29-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Overview.RDSSecurityGroups.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The security group configuration for the application servers does not have the correct rules to allow inbound connections from the database instance</strong> - As mentioned in the explanation above, the application servers don't need inbound connections from the database instance, rather the database instance needs the correct inbound rule with application servers' security group as the source.</p>\n\n<
