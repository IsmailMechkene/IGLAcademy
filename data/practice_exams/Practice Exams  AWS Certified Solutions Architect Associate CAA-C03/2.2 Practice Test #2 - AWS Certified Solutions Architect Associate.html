pplication. To enable SMB access, you would need to set up a file system manually on the connected server and configure SMB sharing at the OS level, essentially turning the application server into a self-managed file server. This not only increases administrative overhead but also places the burden of maintenance, backups, and patching on the user, which contradicts the requirement of a low-maintenance solution. Additionally, Volume Gateway is best suited for hybrid on-premises-to-cloud block storage use cases, not fully cloud-based file sharing with SMB.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html\">https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/storagegateway/latest/vgw/WhatIsStorageGateway.html\">https://docs.aws.amazon.com/storagegateway/latest/vgw/WhatIsStorageGateway.html</a></p>\n","answers":["<p>Use Amazon S3 with Transfer Acceleration enabled. Configure the application to upload and download files over HTTPS using signed URLs</p>","<p>Launch an Amazon EC2 Windows instance and manually configure a Windows file share. Use this instance to serve SMB access to application clients</p>","<p>Provision an Amazon FSx for Windows File Server file system. Mount the file system using the SMB protocol on the media servers</p>","<p>Set up an AWS Storage Gateway Volume Gateway in cached volume mode. Attach the volume as an iSCSI device to the application server and configure a file system with SMB sharing enabled</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A media production studio is building a content rendering and editing platform on AWS. The editing workstations and rendering tools require access to shared files over the SMB (Server Message Block) protocol. The studio wants a managed storage solution that is simple to set up, integrates easily with SMB clients, and minimizes ongoing operational tasks.\n\nWhich solution will best meet the requirements with the LEAST administrative overhead?","related_lectures":[]},{"_class":"assessment","id":157033885,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce application uses an Amazon Aurora Multi-AZ deployment for its database. While analyzing the performance metrics, the engineering team has found that the database reads are causing high input/output (I/O) and adding latency to the write requests against the database.</p>\n\n<p>As an AWS Certified Solutions Architect Associate, what would you recommend to separate the read requests from the write requests?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up a read replica and modify the application to use the appropriate endpoint</strong></p>\n\n<p>An Amazon Aurora DB cluster consists of one or more DB instances and a cluster volume that manages the data for those DB instances. An Aurora cluster volume is a virtual database storage volume that spans multiple Availability Zones (AZs), with each Availability Zone (AZ) having a copy of the DB cluster data. Two types of DB instances make up an Aurora DB cluster:</p>\n\n<p>Primary DB instance – Supports read and write operations, and performs all of the data modifications to the cluster volume. Each Aurora DB cluster has one primary DB instance.</p>\n\n<p>Aurora Replica – Connects to the same storage volume as the primary DB instance and supports only read operations. Each Aurora DB cluster can have up to 15 Aurora Replicas in addition to the primary DB instance. Aurora automatically fails over to an Aurora Replica in case the primary DB instance becomes unavailable. You can specify the failover priority for Aurora Replicas. Aurora Replicas can also offload read workloads from the primary DB instance.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/images/AuroraArch001.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html</a></p>\n\n<p>Aurora Replicas have two main purposes. You can issue queries to them to scale the read operations for your application. You typically do so by connecting to the reader endpoint of the cluster. That way, Aurora can spread the load for read-only connections across as many Aurora Replicas as you have in the cluster. Aurora Replicas also help to increase availability. If the writer instance in a cluster becomes unavailable, Aurora automatically promotes one of the reader instances to take its place as the new writer.</p>\n\n<p>While setting up a Multi-AZ deployment for Aurora, you create an Aurora replica or reader node in a different Availability Zone (AZ).</p>\n\n<p>Multi-AZ for Aurora:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q13-i1.jpg\"></p>\n\n<p>You use the reader endpoint for read-only connections for your Aurora cluster. This endpoint uses a load-balancing mechanism to help your cluster handle a query-intensive workload. The reader endpoint is the endpoint that you supply to applications that do reporting or other read-only operations on the cluster. The reader endpoint load-balances connections to available Aurora Replicas in an Aurora DB cluster.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q13-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Provision another Amazon Aurora database and link it to the primary database as a read replica</strong> - You cannot provision another Aurora database and then link it as a read-replica for the primary database. This option is ruled out.</p>\n\n<p><strong>Configure the application to read from the Multi-AZ standby instance</strong> - This option has been added as a distractor as Aurora does not have any entity called standby instance. You create a standby instance while setting up a Multi-AZ deployment for Amazon RDS and NOT for Aurora.</p>\n\n<p>Multi-AZ for Amazon RDS:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q13-i3.jpg\"></p>\n\n<p><strong>Activate read-through caching on the Amazon Aurora database</strong> - Amazon Aurora does not have built-in support for read-through caching, so this option just serves as a distractor. To implement caching, you will need to integrate something like Amazon ElastiCache and that would need code changes for the application.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Overview.Endpoints.html</a></p>\n","answers":["<p>Provision another Amazon Aurora database and link it to the primary database as a read replica</p>","<p>Set up a read replica and modify the application to use the appropriate endpoint</p>","<p>Configure the application to read from the Multi-AZ standby instance</p>","<p>Activate read-through caching on the Amazon Aurora database</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"An e-commerce application uses an Amazon Aurora Multi-AZ deployment for its database. While analyzing the performance metrics, the engineering team has found that the database reads are causing high input/output (I/O) and adding latency to the write requests against the database.\n\nAs an AWS Certified Solutions Architect Associate, what would you recommend to separate the read requests from the write requests?","related_lectures":[]},{"_class":"assessment","id":157033917,"assessment_type":"multiple-choice","prompt":{"question":"<p>A mobile app allows users to submit photos, which are stored in an Amazon S3 bucket. Currently, a batch of Amazon EC2 Spot Instances is launched nightly to process all the day’s uploads. Each photo requires approximately 3 minutes and 512 MB of memory to process. To improve responsiveness and minimize costs, the company wants to shift to near real-time image processing that begins as soon as an image is uploaded.</p>\n\n<p>Which solution will provide the MOST cost-effective and scalable architecture to meet these new requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure Amazon S3 to send event notifications to an Amazon SQS queue each time a photo is uploaded. Set up an AWS Lambda function to poll the queue and process images asynchronously</strong></p>\n\n<p>This is the most cost-effective solution with a serverless approach for near real-time processing. S3 event notifications can be configured to send metadata about each uploaded object to Amazon SQS, which acts as a durable buffer. AWS Lambda functions are triggered by new messages in the queue and provide a pay-per-use model, which aligns perfectly with sporadic workloads. Since each image requires only 512 MB and 2 minutes of processing, it easily fits within Lambda’s runtime and memory limits. This solution eliminates the need for managing EC2 instances, greatly reducing operational overhead.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up Amazon S3 to push events to an Amazon SQS queue. Launch a single EC2 Reserved Instance that continuously polls the queue and processes each image upon receipt</strong> - While this approach does support real-time processing, it relies on a long-running EC2 instance, which introduces ongoing compute costs even during idle periods. A Reserved Instance offers cost savings over On-Demand, but it is not event-driven or elastic, and the instance may still be underutilized or overwhelmed depending on image upload rates. Compared to Lambda’s on-demand scaling and granular billing, this solution incurs higher costs and more administrative overhead.</p>\n\n<p><strong>Enable S3 event notifications to invoke an Amazon EventBridge rule. Configure an AWS Step Functions workflow to initiate an Fargate task in Amazon ECS to process the image</strong> - While technically feasible, this solution is more complex and expensive than needed. Step Functions and Fargate tasks introduce multiple managed components, which adds to operational complexity and cost. This design may be better suited for multi-step processing workflows or heavier compute tasks. For lightweight and short-lived operations like these, Lambda offers simpler orchestration and lower cost without requiring container orchestration or task definition management.</p>\n\n<p><strong>Configure S3 to trigger an AWS App Runner service directly. Deploy a containerized image-processing application to App Runner to automatically process each upload</strong> - AWS App Runner is a good fit for container-based web services, but it is not designed for direct, event-driven invocation from Amazon S3. While you can deploy stateless apps easily, you’d need an intermediate component like SQS or EventBridge to bridge the event and container invocation. Additionally, App Runner is less cost-efficient for short-lived background tasks, as it keeps container instances warm for performance, leading to unnecessary compute charges for infrequent workloads.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/EventNotifications.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html\">https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/with-s3-example.html\">https://docs.aws.amazon.com/lambda/latest/dg/with-s3-example.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apprunner/latest/dg/what-is-apprunner.html\">https://docs.aws.amazon.com/apprunner/latest/dg/what-is-apprunner.html</a></p>\n","answers":["<p>Configure Amazon S3 to send event notifications to an Amazon SQS queue each time a photo is uploaded. Set up an AWS Lambda function to poll the queue and process images asynchronously</p>","<p>Set up Amazon S3 to push events to an Amazon SQS queue. Launch a single EC2 Reserved Instance that continuously polls the queue and processes each image upon receipt</p>","<p>Enable S3 event notifications to invoke an Amazon EventBridge rule. Configure an AWS Step Functions workflow to initiate an Fargate task in Amazon ECS to process the image</p>","<p>Configure S3 to trigger an AWS App Runner service directly. Deploy a containerized image-processing application to App Runner to automatically process each upload</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"A mobile app allows users to submit photos, which are stored in an Amazon S3 bucket. Currently, a batch of Amazon EC2 Spot Instances is launched nightly to process all the day’s uploads. Each photo requires approximately 3 minutes and 512 MB of memory to process. To improve responsiveness and minimize costs, the company wants to shift to near real-time image processing that begins as soon as an image is uploaded.\n\nWhich solution will provide the MOST cost-effective and scalable architecture to meet these new requirements?","related_lectures":[]},{"_class":"assessment","id":157033921,"assessment_type":"multiple-choice","prompt":{"question":"<p>An IT company has built a solution wherein an Amazon Redshift cluster writes data to an Amazon S3 bucket belonging to a different AWS account. However, it is found that the files created in the Amazon S3 bucket using the UNLOAD command from the Amazon Redshift cluster are not even accessible to the Amazon S3 bucket owner.</p>\n\n<p>What could be the reason for this denial of permission for the bucket owner?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>By default, an Amazon S3 object is owned by the AWS account that uploaded it. So the Amazon S3 bucket owner will not implicitly have access to the objects written by the Amazon Redshift cluster</strong> - By default, an Amazon S3 object is owned by the AWS account that uploaded it. This is true even when the bucket is owned by another account. Because the Amazon Redshift data files from the UNLOAD command were put into your bucket by another account, you (the bucket owner) don't have default permission to access those files.</p>\n\n<p>To get access to the data files, an AWS Identity and Access Management (IAM) role with cross-account permissions must run the UNLOAD command again. Follow these steps to set up the Amazon Redshift cluster with cross-account permissions to the bucket:</p>\n\n<ol>\n<li><p>From the account of the Amazon S3 bucket, create an IAM role (Bucket Role) with permissions to the bucket.</p></li>\n<li><p>From the account of the Amazon Redshift cluster, create another IAM role (Cluster Role) with permissions to assume the Bucket Role.</p></li>\n<li><p>Update the Bucket Role to grant bucket access and create a trust relationship with the Cluster Role.</p></li>\n<li><p>From the Amazon Redshift cluster, run the UNLOAD command using the Cluster Role and Bucket Role.</p></li>\n</ol>\n\n<p>This solution doesn't apply to Amazon Redshift clusters or Amazon S3 buckets that use server-side encryption with AWS Key Management Service (AWS KMS).</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>When objects are uploaded to Amazon S3 bucket from a different AWS account, the S3 bucket owner will get implicit permissions to access these objects. This issue seems to be due to an upload error that can be fixed by providing manual access from AWS console</strong> - By default, an Amazon S3 object is owned by the AWS account that uploaded it. So, the bucket owner will not have any default permissions on the objects. Therefore, this option is incorrect.</p>\n\n<p><strong>The owner of an Amazon S3 bucket has implicit access to all objects in his bucket. Permissions are set on objects after they are completely copied to the target location. Since the owner is unable to access the uploaded files, the write operation may be still in progress</strong> - This is an incorrect statement, given only as a distractor.</p>\n\n<p><strong>When two different AWS accounts are accessing an Amazon S3 bucket, both the accounts must share the bucket policies. An erroneous policy can lead to such permission failures</strong> - This is an incorrect statement, given only as a distractor.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/s3-access-denied-redshift-unload/\">https://aws.amazon.com/premiumsupport/knowledge-center/s3-access-denied-redshift-unload/</a></p>\n","answers":["<p>When objects are uploaded to Amazon S3 bucket from a different AWS account, the S3 bucket owner will get implicit permissions to access these objects. This issue seems to be due to an upload error that can be fixed by providing manual access from AWS console</p>","<p>The owner of an Amazon S3 bucket has implicit access to all objects in his bucket. Permissions are set on objects after they are completely copied to the target location. Since the owner is unable to access the uploaded files, the write operation may be still in progress</p>","<p>When two different AWS accounts are accessing an Amazon S3 bucket, both the accounts must share the bucket policies. An erroneous policy can lead to such permission failures</p>","<p>By default, an Amazon S3 object is owned by the AWS account that uploaded it. So the Amazon S3 bucket owner will not implicitly have access to the objects written by the Amazon Redshift cluster</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"An IT company has built a solution wherein an Amazon Redshift cluster writes data to an Amazon S3 bucket belonging to a different AWS account. However, it is found that the files created in the Amazon S3 bucket using the UNLOAD command from the Amazon Redshift cluster are not even accessible to the Amazon S3 bucket owner.\n\nWhat could be the reason for this denial of permission for the bucket owner?","related_lectures":[]},{"_class":"assessment","id":157033863,"assessment_type":"multiple-choice","prompt":{"question":"<p>A developer needs to implement an AWS Lambda function in AWS account A that accesses an Amazon Simple Storage Service (Amazon S3) bucket in AWS account B.</p>\n\n<p>As a Solutions Architect, which of the following will you recommend to meet this requirement?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the AWS Lambda function's execution role. Make sure that the bucket policy also grants access to the AWS Lambda function's execution role</strong></p>\n\n<p>If the IAM role that you create for the Lambda function is in the same AWS account as the bucket, then you don't need to grant Amazon S3 permissions on both the IAM role and the bucket policy. Instead, you can grant the permissions on the IAM role and then verify that the bucket policy doesn't explicitly deny access to the Lambda function role. If the IAM role and the bucket are in different accounts, then you need to grant Amazon S3 permissions on both the IAM role and the bucket policy. Therefore, this is the right way of giving access to AWS Lambda for the given use-case.</p>\n\n<p>Complete list of steps to be followed:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q16-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/lambda-execution-role-s3-bucket/\">https://aws.amazon.com/premiumsupport/knowledge-center/lambda-execution-role-s3-bucket/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>AWS Lambda cannot access resources across AWS accounts. Use Identity federation to work around this limitation of Lambda</strong> - This is an incorrect statement, used only as a distractor.</p>\n\n<p><strong>Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the Lambda function's execution role and that would give the AWS Lambda function cross-account access to the Amazon S3 bucket</strong> - When the execution role of AWS Lambda and Amazon S3 bucket to be accessed are from different accounts, then you need to grant Amazon S3 bucket access permissions to the IAM role and also ensure that the bucket policy grants access to the AWS Lambda function's execution role.</p>\n\n<p><strong>The Amazon S3 bucket owner should make the bucket public so that it can be accessed by the AWS Lambda function in the other AWS account</strong> - Making the Amazon S3 bucket public for the given use-case will be considered as a security bad practice. It's usually done for very few use-cases such as hosting a website on Amazon S3. Therefore this option is incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/lambda-execution-role-s3-bucket/\">https://aws.amazon.com/premiumsupport/knowledge-center/lambda-execution-role-s3-bucket/</a></p>\n","answers":["<p>Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the AWS Lambda function's execution role. Make sure that the bucket policy also grants access to the AWS Lambda function's execution role</p>","<p>AWS Lambda cannot access resources across AWS accounts. Use Identity federation to work around this limitation of Lambda</p>","<p>Create an IAM role for the AWS Lambda function that grants access to the Amazon S3 bucket. Set the IAM role as the Lambda function's execution role and that would give the AWS Lambda function cross-account access to the Amazon S3 bucket</p>","<p>The Amazon S3 bucket owner should make the bucket public so that it can be accessed by the AWS Lambda function in the other AWS account</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A developer needs to implement an AWS Lambda function in AWS account A that accesses an Amazon Simple Storage Service (Amazon S3) bucket in AWS account B.\n\nAs a Solutions Architect, which of the following will you recommend to meet this requirement?","related_lectures":[]},{"_class":"assessment","id":157033903,"assessment_type":"multiple-choice","prompt":{"question":"<p>A social media application is hosted on an Amazon EC2 fleet running behind an Application Load Balancer. The application traffic is fronted by an Amazon CloudFront distribution. The engineering team wants to decouple the user authentication process for the application, so that the application servers can just focus on the business logic.</p>\n\n<p>As a Solutions Architect, which of the following solutions would you recommend to the development team so that it requires minimal development effort?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon Cognito Authentication via Cognito User Pools for your Application Load Balancer</strong></p>\n\n<p>Application Load Balancer can be used to securely authenticate users for accessing your applications. This enables you to offload the work of authenticating users to your load balancer so that your applications can focus on their business logic. You can use Cognito User Pools to authenticate users through well-known social IdPs, such as Amazon, Facebook, or Google, through the user pools supported by Amazon Cognito or through corporate identities, using SAML, LDAP, or Microsoft AD, through the user pools supported by Amazon Cognito. You configure user authentication by creating an authenticate action for one or more listener rules.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q17-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html</a></p>\n\n<p>Exam Alert:</p>\n\n<p>Please review the following note to understand the differences between Amazon Cognito User Pools and Amazon Cognito Identity Pools:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q17-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Cognito Authentication via Cognito Identity Pools for your Application Load Balancer</strong> - There is no such thing as using Amazon Cognito Authentication via Cognito Identity Pools for managing user authentication for the application. Application-specific user authentication can be provided via Cognito User Pools. Amazon Cognito identity pools provide temporary AWS credentials for users who are guests (unauthenticated) and for users who have been authenticated and received a token.</p>\n\n<p><strong>Use Amazon Cognito Authentication via Cognito User Pools for your Amazon CloudFront distribution</strong> - You cannot directly integrate Cognito User Pools with CloudFront distribution as you have to create a separate AWS Lambda@Edge function to accomplish the authentication via Cognito User Pools. This involves additional development effort, so this option is not the best fit for the given use-case.</p>\n\n<p><strong>Use Amazon Cognito Authentication via Cognito Identity Pools for your Amazon CloudFront distribution</strong> - You cannot use Cognito Identity Pools for managing user authentication, so this option is not correct.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/listener-authenticate-users.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/authorizationedge-using-cookies-protect-your-amazon-cloudfront-content-from-being-downloaded-by-unauthenticated-users/\">https://aws.amazon.com/blogs/networking-and-content-delivery/authorizationedge-using-cookies-protect-your-amazon-cloudfront-content-from-being-downloaded-by-unauthenticated-users/</a></p>\n","answers":["<p>Use Amazon Cognito Authentication via Cognito User Pools for your Application Load Balancer</p>","<p>Use Amazon Cognito Authentication via Cognito Identity Pools for your Application Load Balancer</p>","<p>Use Amazon Cognito Authentication via Cognito User Pools for your Amazon CloudFront distribution</p>","<p>Use Amazon Cognito Authentication via Cognito Identity Pools for your Amazon CloudFront distribution</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A social media application is hosted on an Amazon EC2 fleet running behind an Application Load Balancer. The application traffic is fronted by an Amazon CloudFront distribution. The engineering team wants to decouple the user authentication process for the application, so that the application servers can just focus on the business logic.\n\nAs a Solutions Architect, which of the following solutions would you recommend to the development team so that it requires minimal development effort?","related_lectures":[]},{"_class":"assessment","id":157033961,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at a logistics company has noticed that the Auto Scaling group (ASG) is not terminating an unhealthy Amazon EC2 instance.</p>\n\n<p>As a Solutions Architect, which of the following options would you suggest to troubleshoot the issue? (Select three)</p>\n","relatedLectureIds":"","feedbacks":["","","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>The health check grace period for the instance has not expired</strong></p>\n\n<p>Amazon EC2 Auto Scaling doesn't terminate an instance that came into service based on Amazon EC2 status checks and Elastic Load Balancing (ELB) health checks until the health check grace period expires.</p>\n\n<p>More on Health check grace period:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q18-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/healthcheck.html#health-check-grace-period\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/healthcheck.html#health-check-grace-period</a></p>\n\n<p><strong>The instance maybe in Impaired status</strong></p>\n\n<p>Amazon EC2 Auto Scaling does not immediately terminate instances with an Impaired status. Instead, Amazon EC2 Auto Scaling waits a few minutes for the instance to recover. Amazon EC2 Auto Scaling might also delay or not terminate instances that fail to report data for status checks. This usually happens when there is insufficient data for the status check metrics in Amazon CloudWatch.</p>\n\n<p><strong>The instance has failed the Elastic Load Balancing (ELB) health check status</strong></p>\n\n<p>By default, Amazon EC2 Auto Scaling doesn't use the results of ELB health checks to determine an instance's health status when the group's health check configuration is set to EC2. As a result, Amazon EC2 Auto Scaling doesn't terminate instances that fail ELB health checks. If an instance's status is OutofService on the ELB console, but the instance's status is Healthy on the Amazon EC2 Auto Scaling console, confirm that the health check type is set to ELB.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The Amazon EC2 instance could be a spot instance type, which cannot be terminated by the Auto Scaling group (ASG)</strong> - This is an incorrect statement. Amazon EC2 Auto Scaling terminates Spot instances when capacity is no longer available or the Spot price exceeds your maximum price.</p>\n\n<p><strong>A user might have updated the configuration of the Auto Scaling group (ASG) and increased the minimum number of instances forcing ASG to keep all instances alive</strong> - This statement is incorrect. If the configuration is updated and ASG needs more number of instances, ASG will launch new, healthy instances and does not keep unhealthy ones alive.</p>\n\n<p><strong>A custom health check might have failed. The Auto Scaling group (ASG) does not terminate instances that are set unhealthy by custom checks</strong> - This statement is incorrect. You can define custom health checks in Amazon EC2 Auto Scaling. When a custom health check determines that an instance is unhealthy, the check manually triggers SetInstanceHealth and then sets the instance's state to Unhealthy. Amazon EC2 Auto Scaling then terminates the unhealthy instance.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/auto-scaling-terminate-instance/\">https://aws.amazon.com/premiumsupport/knowledge-center/auto-scaling-terminate-instance/</a></p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/auto-scaling-instance-how-terminated/\">https://aws.amazon.com/premiumsupport/knowledge-center/auto-scaling-instance-how-terminated/</a></p>\n","answers":["<p>A user might have updated the configuration of the Auto Scaling group (ASG) and increased the minimum number of instances forcing ASG to keep all instances alive</p>","<p>The Amazon EC2 instance could be a spot instance type, which cannot be terminated by the Auto Scaling group (ASG)</p>","<p>The health check grace period for the instance has not expired</p>","<p>The instance maybe in Impaired status</p>","<p>The instance has failed the Elastic Load Balancing (ELB) health check status</p>","<p>A custom health check might have failed. The Auto Scaling group (ASG) does not terminate instances that are set unhealthy by custom checks</p>"]},"correct_response":["c","d","e"],"section":"Design Resilient Architectures","question_plain":"The engineering team at a logistics company has noticed that the Auto Scaling group (ASG) is not terminating an unhealthy Amazon EC2 instance.\n\nAs a Solutions Architect, which of the following options would you suggest to troubleshoot the issue? (Select three)","related_lectures":[]},{"_class":"assessment","id":157033909,"assessment_type":"multi-select","prompt":{"question":"<p>An engineering team wants to examine the feasibility of the <code>user data</code> feature of Amazon EC2 for an upcoming project.</p>\n\n<p>Which of the following are true about the Amazon EC2 user data configuration? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p>User Data is generally used to perform common automated configuration tasks and even run scripts after the instance starts. When you launch an instance in Amazon EC2, you can pass two types of user data - shell scripts and cloud-init directives. You can also pass this data into the launch wizard as plain text or as a file.</p>\n\n<p><strong>By default, scripts entered as user data are executed with root user privileges</strong></p>\n\n<p>Scripts entered as user data are executed as the root user, hence do not need the sudo command in the script. Any files you create will be owned by root; if you need non-root users to have file access, you should modify the permissions accordingly in the script.</p>\n\n<p><strong>By default, user data runs only during the boot cycle when you first launch an instance</strong></p>\n\n<p>By default, user data scripts and cloud-init directives run only during the boot cycle when you first launch an instance. You can update your configuration to ensure that your user data scripts and cloud-init directives run every time you restart your instance.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>By default, user data is executed every time an Amazon EC2 instance is re-started</strong> - As discussed above, this is not a default configuration of the system. But, can be achieved by explicitly configuring the instance.</p>\n\n<p><strong>When an instance is running, you can update user data by using root user credentials</strong> - You can't change the user data if the instance is running (even by using root user credentials), but you can view it.</p>\n\n<p><strong>By default, scripts entered as user data do not have root user privileges for executing</strong> - Scripts entered as user data are executed as the root user, hence do not need the sudo command in the script.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/user-data.html</a></p>\n","answers":["<p>By default, user data is executed every time an Amazon EC2 instance is re-started</p>","<p>When an instance is running, you can update user data by using root user credentials</p>","<p>By default, scripts entered as user data are executed with root user privileges</p>","<p>By default, user data runs only during the boot cycle when you first launch an instance</p>","<p>By default, scripts entered as user data do not have root user privileges for executing</p>"]},"correct_response":["c","d"],"section":"Design High-Performing Architectures","question_plain":"An engineering team wants to examine the feasibility of the user data feature of Amazon EC2 for an upcoming project.\n\nWhich of the following are true about the Amazon EC2 user data configuration? (Select two)","related_lectures":[]},{"_class":"assessment","id":157033927,"assessment_type":"multiple-choice","prompt":{"question":"<p>A systems administrator has created a private hosted zone and associated it with a Virtual Private Cloud (VPC). However, the Domain Name System (DNS) queries for the private hosted zone remain unresolved.</p>\n\n<p>As a Solutions Architect, can you identify the Amazon Virtual Private Cloud (Amazon VPC) options to be configured in order to get the private hosted zone to work?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Enable DNS hostnames and DNS resolution for private hosted zones</strong></p>\n\n<p>DNS hostnames and DNS resolution are required settings for private hosted zones. DNS queries for private hosted zones can be resolved by the Amazon-provided VPC DNS server only. As a result, these options must be enabled for your private hosted zone to work.</p>\n\n<p>DNS hostnames: For non-default virtual private clouds that aren't created using the Amazon VPC wizard, this option is disabled by default. If you create a private hosted zone for a domain and create records in the zone without enabling DNS hostnames, private hosted zones aren't enabled. To use a private hosted zone, this option must be enabled.</p>\n\n<p>DNS resolution: Private hosted zones accept DNS queries only from a VPC DNS server. The IP address of the VPC DNS server is the reserved IP address at the base of the VPC IPv4 network range plus two. Enabling DNS resolution allows you to use the VPC DNS server as a Resolver for performing DNS resolution. Keep this option disabled if you're using a custom DNS server in the DHCP Options set, and you're not using a private hosted zone.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Remove any overlapping namespaces for the private and public hosted zones</strong> - If you have private and public hosted zones that have overlapping namespaces, such as example.com and accounting.example.com, then the Resolver routes traffic based on the most specific match. It won't result in unresolved queries, hence this option is wrong.</p>\n\n<p><strong>Fix the Name server (NS) record and Start Of Authority (SOA) records that may have been created with wrong configurations</strong> - When you create a hosted zone, Amazon Route 53 automatically creates a name server (NS) record and a start of authority (SOA) record for the zone for public hosted zone. However, this issue is about the private hosted zone, hence this is an incorrect option.</p>\n\n<p><strong>Fix conflicts between your private hosted zone and any Resolver rule that routes traffic to your network for the same domain name, as it results in ambiguity over the route to be taken</strong> - If you have a private hosted zone (example.com) and a Resolver rule that routes traffic to your network for the same domain name, the Resolver rule takes precedence. It won't result in unresolved queries.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/vpc-enable-private-hosted-zone/\">https://aws.amazon.com/premiumsupport/knowledge-center/vpc-enable-private-hosted-zone/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-considerations.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-public-considerations.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-public-considerations.html</a></p>\n","answers":["<p>Remove any overlapping namespaces for the private and public hosted zones</p>","<p>Fix the Name server (NS) record and Start Of Authority (SOA) records that may have been created with wrong configurations</p>","<p>Fix conflicts between your private hosted zone and any Resolver rule that routes traffic to your network for the same domain name, as it results in ambiguity over the route to be taken</p>","<p>Enable DNS hostnames and DNS resolution for private hosted zones</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A systems administrator has created a private hosted zone and associated it with a Virtual Private Cloud (VPC). However, the Domain Name System (DNS) queries for the private hosted zone remain unresolved.\n\nAs a Solutions Architect, can you identify the Amazon Virtual Private Cloud (Amazon VPC) options to be configured in order to get the private hosted zone to work?","related_lectures":[]},{"_class":"assessment","id":157033899,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce company operates multiple AWS accounts and has interconnected these accounts in a hub-and-spoke style using the AWS Transit Gateway. Amazon Virtual Private Cloud (Amazon VPCs) have been provisioned across these AWS accounts to facilitate network isolation.</p>\n\n<p>Which of the following solutions would reduce both the administrative overhead and the costs while providing shared access to services required by workloads in each of the VPCs?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Build a shared services Amazon Virtual Private Cloud (Amazon VPC)</strong></p>\n\n<p>Consider an organization that has built a hub-and-spoke network with AWS Transit Gateway. VPCs have been provisioned into multiple AWS accounts, perhaps to facilitate network isolation or to enable delegated network administration. When deploying distributed architectures such as this, a popular approach is to build a \"shared services VPC, which provides access to services required by workloads in each of the VPCs. This might include directory services or VPC endpoints. Sharing resources from a central location instead of building them in each VPC may reduce administrative overhead and cost.</p>\n\n<p>Centralized VPC Endpoints (multiple VPCs):\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q21-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/architecture/reduce-cost-and-increase-security-with-amazon-vpc-endpoints/\">https://aws.amazon.com/blogs/architecture/reduce-cost-and-increase-security-with-amazon-vpc-endpoints/</a></p>\n\n<p>A VPC endpoint allows you to privately connect your VPC to supported AWS services without requiring an Internet gateway, NAT device, VPN connection, or AWS Direct Connect connection. Endpoints are virtual devices that are horizontally scaled, redundant, and highly available VPC components. They allow communication between instances in your VPC and services without imposing availability risks or bandwidth constraints on your network traffic.</p>\n\n<p>VPC endpoints enable you to reduce data transfer charges resulting from network communication between private VPC resources (such as Amazon Elastic Cloud Compute—or EC2—instances) and AWS Services (such as Amazon Quantum Ledger Database, or QLDB). Without VPC endpoints configured, communications that originate from within a VPC destined for public AWS services must egress AWS to the public Internet in order to access AWS services. This network path incurs outbound data transfer charges. Data transfer charges for traffic egressing from Amazon EC2 to the Internet vary based on volume. With VPC endpoints configured, communication between your VPC and the associated AWS service does not leave the Amazon network. If your workload requires you to transfer significant volumes of data between your VPC and AWS, you can reduce costs by leveraging VPC endpoints.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Transit VPC to reduce cost and share the resources across Amazon Virtual Private Cloud (Amazon VPCs)</strong> - Transit VPC uses customer-managed Amazon Elastic Compute Cloud (Amazon EC2) VPN instances in a dedicated transit VPC with an Internet gateway. This design requires the customer to deploy, configure, and manage EC2-based VPN appliances, which will result in additional EC2, and potentially third-party product and licensing charges. Note that this design will generate additional data transfer charges for traffic traversing the transit VPC: data is charged when it is sent from a spoke VPC to the transit VPC, and again from the transit VPC to the on-premises network or a different AWS Region. Transit VPC is not the right choice here.</p>\n\n<p>More on Transit VPC:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q21-i2.jpg\">\nvia - <a href=\"https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf\">https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf</a></p>\n\n<p><strong>Use Fully meshed VPC Peering connection</strong> - This approach creates multiple peering connections to facilitate the sharing of information between resources in different VPCs. This design connects multiple VPCs in a fully meshed configuration, with peering connections between each pair of VPCs. With this configuration, each VPC has access to the resources in all other VPCs. Each peering connection requires modifications to all the other VPCs’ route tables and, as the number of VPCs grows, this can be difficult to maintain. And keep in mind that AWS recommends a maximum of 125 peering connections per VPC. It's complex to manage and isn't a right fit for the current scenario.</p>\n\n<p>More on Fully meshed VPC Peers:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q21-i3.jpg\">\nvia - <a href=\"https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf\">https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf</a></p>\n\n<p><strong>Use VPCs connected with AWS Direct Connect</strong> - This approach is a good alternative for customers who need to connect a high number of VPCs to a central VPC or on-premises resources, or who already have an AWS Direct Connect connection in place. This design also offers customers the ability to incorporate transitive routing into their network design. For example, if VPC A and VPC B are both connected to an on-premises network using AWS Direct Connect connections, then the two VPCs can be connected to each other via AWS Direct Connect. AWS Direct Connect requires physical cables and takes about a month for setting up, this is not an ideal solution for the given scenario.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/architecture/reduce-cost-and-increase-security-with-amazon-vpc-endpoints/\">https://aws.amazon.com/blogs/architecture/reduce-cost-and-increase-security-with-amazon-vpc-endpoints/</a></p>\n\n<p><a href=\"https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf\">https://d0.awsstatic.com/aws-answers/AWS_Single_Region_Multi_VPC_Connectivity.pdf</a></p>\n","answers":["<p>Build a shared services Amazon Virtual Private Cloud (Amazon VPC)</p>","<p>Use Transit VPC to reduce cost and share the resources across Amazon Virtual Private Cloud (Amazon VPCs)</p>","<p>Use Fully meshed VPC Peering connection</p>","<p>Use VPCs connected with AWS Direct Connect</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"An e-commerce company operates multiple AWS accounts and has interconnected these accounts in a hub-and-spoke style using the AWS Transit Gateway. Amazon Virtual Private Cloud (Amazon VPCs) have been provisioned across these AWS accounts to facilitate network isolation.\n\nWhich of the following solutions would reduce both the administrative overhead and the costs while providing shared access to services required by workloads in each of the VPCs?","related_lectures":[]},{"_class":"assessment","id":157033893,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail company wants to rollout and test a blue-green deployment for its global application in the next 48 hours. Most of the customers use mobile phones which are prone to Domain Name System (DNS) caching. The company has only two days left for the annual Thanksgiving sale to commence.</p>\n\n<p>As a Solutions Architect, which of the following options would you recommend to test the deployment on as many users as possible in the given time frame?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p>Blue/green deployment is a technique for releasing applications by shifting traffic between two identical environments running different versions of the application: \"Blue\" is the currently running version and \"green\" the new version. This type of deployment allows you to test features in the green environment without impacting the currently running version of your application. When you’re satisfied that the green version is working properly, you can gradually reroute the traffic from the old blue environment to the new green environment. Blue/green deployments can mitigate common risks associated with deploying software, such as downtime and rollback capability.</p>\n\n<p><strong>Use AWS Global Accelerator to distribute a portion of traffic to a particular deployment</strong></p>\n\n<p>AWS Global Accelerator is a network layer service that directs traffic to optimal endpoints over the AWS global network, this improves the availability and performance of your internet applications. It provides two static anycast IP addresses that act as a fixed entry point to your application endpoints in a single or multiple AWS Regions, such as your Application Load Balancers, Network Load Balancers, Elastic IP addresses or Amazon EC2 instances, in a single or in multiple AWS regions.</p>\n\n<p>AWS Global Accelerator uses endpoint weights to determine the proportion of traffic that is directed to endpoints in an endpoint group, and traffic dials to control the percentage of traffic that is directed to an endpoint group (an AWS region where your application is deployed).</p>\n\n<p>While relying on the DNS service is a great option for blue/green deployments, it may not fit use-cases that require a fast and controlled transition of the traffic. Some client devices and internet resolvers cache DNS answers for long periods; this DNS feature improves the efficiency of the DNS service as it reduces the DNS traffic across the Internet, and serves as a resiliency technique by preventing authoritative name-server overloads. The downside of this in blue/green deployments is that you don’t know how long it will take before all of your users receive updated IP addresses when you update a record, change your routing preference or when there is an application failure.</p>\n\n<p>With AWS Global Accelerator, you can shift traffic gradually or all at once between the blue and the green environment and vice-versa without being subject to DNS caching on client devices and internet resolvers, traffic dials and endpoint weights changes are effective within seconds.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Route 53 weighted routing to spread traffic across different deployments</strong> - Weighted routing lets you associate multiple resources with a single domain name (example.com) or subdomain name (acme.example.com) and choose how much traffic is routed to each resource. This can be useful for a variety of purposes, including load balancing and testing new versions of the software. As discussed earlier, DNS caching is a negative behavior for this use case and hence Amazon Route 53 is not a good option.</p>\n\n<p><strong>Use Elastic Load Balancing (ELB) to distribute traffic across deployments</strong> - Elastic Load Balancing (ELB) can distribute traffic across healthy instances. You can also use the Application Load Balancers weighted target groups feature for blue/green deployments as it does not rely on the DNS service. In addition you don’t need to create new ALBs for the green environment. As the use-case refers to a global application, so this option cannot be used for a multi-Region solution which is needed for the given requirement.</p>\n\n<p><strong>Use AWS CodeDeploy deployment options to choose the right deployment</strong> - In AWS CodeDeploy, a deployment is the process, and the components involved in the process, of installing content on one or more instances. This content can consist of code, web and configuration files, executables, packages, scripts, and so on. AWS CodeDeploy deploys content that is stored in a source repository, according to the configuration rules you specify. Blue/Green deployment is one of the deployment types that CodeDeploy supports. CodeDeploy is not meant to distribute traffic across instances, so this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/networking-and-content-delivery/using-aws-global-accelerator-to-achieve-blue-green-deployments\">https://aws.amazon.com/blogs/networking-and-content-delivery/using-aws-global-accelerator-to-achieve-blue-green-deployments</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments.html\">https://docs.aws.amazon.com/codedeploy/latest/userguide/deployments.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html#routing-policy-weighted\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/routing-policy.html#routing-policy-weighted</a></p>\n","answers":["<p>Use Amazon Route 53 weighted routing to spread traffic across different deployments</p>","<p>Use AWS Global Accelerator to distribute a portion of traffic to a particular deployment</p>","<p>Use Elastic Load Balancing (ELB) to distribute traffic across deployments</p>","<p>Use AWS CodeDeploy deployment options to choose the right deployment</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A retail company wants to rollout and test a blue-green deployment for its global application in the next 48 hours. Most of the customers use mobile phones which are prone to Domain Name System (DNS) caching. The company has only two days left for the annual Thanksgiving sale to commence.\n\nAs a Solutions Architect, which of the following options would you recommend to test the deployment on as many users as possible in the given time frame?","related_lectures":[]},{"_class":"assessment","id":157033967,"assessment_type":"multiple-choice","prompt":{"question":"<p>A health-care solutions company wants to run their applications on single-tenant hardware to meet regulatory guidelines.</p>\n\n<p>Which of the following is the MOST cost-effective way of isolating their Amazon Elastic Compute Cloud (Amazon EC2)instances to a single tenant?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Dedicated Instances</strong></p>\n\n<p>Dedicated Instances are Amazon EC2 instances that run in a virtual private cloud (VPC) on hardware that's dedicated to a single customer. Dedicated Instances that belong to different AWS accounts are physically isolated at a hardware level, even if those accounts are linked to a single-payer account. However, Dedicated Instances may share hardware with other instances from the same AWS account that are not Dedicated Instances.</p>\n\n<p>A Dedicated Host is also a physical server that's dedicated for your use. With a Dedicated Host, you have visibility and control over how instances are placed on the server.</p>\n\n<p>Differences between Dedicated Hosts and Dedicated Instances:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q23-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html#dedicated-hosts-dedicated-instances\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html#dedicated-hosts-dedicated-instances</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Spot Instances</strong> -  A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price.  Your Spot Instance runs whenever capacity is available and the maximum price per hour for your request exceeds the Spot price. Any instance present with unused capacity will be allocated. Even though this is cost-effective, it does not fulfill the single-tenant hardware requirement of the client and hence is not the correct option.</p>\n\n<p><strong>Dedicated Hosts</strong> - An Amazon EC2 Dedicated Host is a physical server with EC2 instance capacity fully dedicated to your use. Dedicated Hosts allow you to use your existing software licenses on EC2 instances. With a Dedicated Host, you have visibility and control over how instances are placed on the server. This option is costlier than the Dedicated Instance and hence is not the right choice for the current requirement.</p>\n\n<p><strong>On-Demand Instances</strong> - With On-Demand Instances, you pay for compute capacity by the second with no long-term commitments. You have full control over its lifecycle—you decide when to launch, stop, hibernate, start, reboot, or terminate it. Hardware isolation is not possible and on-demand has one of the costliest instance charges and hence is not the correct answer for current requirements.</p>\n\n<p>High Level Overview of Amazon EC2 Instance Purchase Options:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q23-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html</a></p>\n","answers":["<p>Dedicated Instances</p>","<p>Spot Instances</p>","<p>Dedicated Hosts</p>","<p>On-Demand Instances</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A health-care solutions company wants to run their applications on single-tenant hardware to meet regulatory guidelines.\n\nWhich of the following is the MOST cost-effective way of isolating their Amazon Elastic Compute Cloud (Amazon EC2)instances to a single tenant?","related_lectures":[]},{"_class":"assessment","id":157033943,"assessment_type":"multiple-choice","prompt":{"question":"<p>An enterprise uses a centralized Amazon S3 bucket to store logs and reports generated by multiple analytics services. Each service writes to and reads from a dedicated prefix (folder path) in the bucket. The company wants to enforce fine-grained access control so that each service can access only its own prefix, without being able to see or modify other services' data. The solution must support scalable and maintainable permissions management with minimal operational overhead.</p>\n\n<p>Which approach will best meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure individual S3 access points for each analytics service. Attach access point policies that restrict access to only the relevant prefix in the S3 bucket</strong></p>\n\n<p>Amazon S3 Access Points provide a scalable, manageable solution for managing permissions on shared buckets. By creating a dedicated access point for each service, and setting access point-level policies that scope access down to specific prefixes within the bucket, the company can enforce fine-grained, isolated access per application. This approach avoids complexity in the bucket policy and eliminates the need for per-object permissions management. Access points are ideal for environments with multiple applications or teams sharing a common S3 bucket.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q24-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/\">https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/</a></p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q24-i3.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/\">https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create separate IAM users for each service. Manually assign inline IAM policies to grant read/write permissions to the S3 bucket. Reference specific object names in the policy for each user</strong> - While IAM policies can restrict access to certain prefixes within an S3 bucket, using inline policies tied to IAM users introduces high operational complexity. Over time, as object names change or services evolve, these policies would require constant manual updates. Moreover, hardcoding object names reduces scalability and violates best practices for managing data access at scale. This method lacks the flexibility and maintainability that access points offer.</p>\n\n<p><strong>Deploy Amazon Macie to classify the objects in the bucket by prefix and apply automated object-level access policies to each object based on service tags</strong> - Amazon Macie is designed for data discovery and classification, especially for identifying sensitive data like PII—not for managing object-level access controls. While Macie can label data and notify users of risks, it cannot automatically enforce S3 permissions or assign per-prefix policies. Using Macie for this purpose would introduce unnecessary cost and complexity without addressing the core access isolation requirement.</p>\n\n<p><strong>Create a single S3 bucket policy that lists all object ARNs under each prefix and grants permissions accordingly. Use resource-level permissions to restrict access to individual services</strong> - Although it is possible to use a single S3 bucket policy with resource-level permissions, this approach does not scale well. As the number of objects and services grows, maintaining a flat bucket policy that enumerates specific ARNs becomes cumbersome and error-prone. Any change to the policy would require full redeployment, making this solution difficult to manage over time. In contrast, access points offer isolated, easily maintainable policy boundaries per service.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-points.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/\">https://aws.amazon.com/blogs/storage/securing-data-in-a-virtual-private-cloud-using-amazon-s3-access-points/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html\">https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html</a></p>\n","answers":["<p>Create separate IAM users for each service. Manually assign inline IAM policies to grant read/write permissions to the S3 bucket. Reference specific object names in the policy for each user</p>","<p>Configure individual S3 access points for each analytics service. Attach access point policies that restrict access to only the relevant prefix in the S3 bucket</p>","<p>Deploy Amazon Macie to classify the objects in the bucket by prefix and apply automated object-level access policies to each object based on service tags</p>","<p>Create a single S3 bucket policy that lists all object ARNs under each prefix and grants permissions accordingly. Use resource-level permissions to restrict access to individual services</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"An enterprise uses a centralized Amazon S3 bucket to store logs and reports generated by multiple analytics services. Each service writes to and reads from a dedicated prefix (folder path) in the bucket. The company wants to enforce fine-grained access control so that each service can access only its own prefix, without being able to see or modify other services' data. The solution must support scalable and maintainable permissions management with minimal operational overhead.\n\nWhich approach will best meet these requirements?","related_lectures":[]},{"_class":"assessment","id":157033915,"assessment_type":"multiple-choice","prompt":{"question":"<p>The DevOps team at a major financial services company uses Multi-Availability Zone (Multi-AZ) deployment for its MySQL Amazon RDS database in order to automate its database replication and augment data durability. The DevOps team has scheduled a maintenance window for a database engine level upgrade for the coming weekend.</p>\n\n<p>Which of the following is the correct outcome during the maintenance window?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. This causes downtime until the upgrade is complete</strong></p>\n\n<p>Amazon Relational Database Service (Amazon RDS) makes it easy to set up, operate, and scale a relational database in the cloud. It provides cost-efficient and resizable capacity while automating time-consuming administration tasks such as hardware provisioning, database setup, patching, and backups.</p>\n\n<p>Upgrades to the database engine level require downtime. Even if your Amazon RDS DB instance uses a Multi-AZ deployment, both the primary and standby DB instances are upgraded at the same time. This causes downtime until the upgrade is complete, and the duration of the downtime varies based on the size of your database instance.</p>\n\n<p>Amazon RDS DB Engine Maintenance:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q8-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/rds-required-maintenance/\">https://aws.amazon.com/premiumsupport/knowledge-center/rds-required-maintenance/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. However, this does not cause any downtime until the upgrade is complete</strong> - For Amazon RDS database engine level upgrade, primary and standby database instances are upgraded at the same time and it causes downtime until the upgrade is complete, hence this option is incorrect.</p>\n\n<p><strong>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the standby database instance to be upgraded which is then followed by the upgrade of the primary database instance. This does not cause any downtime for the duration of the upgrade</strong> - For Amazon RDS database engine level upgrade, primary and standby database instances are upgraded at the same time and it causes downtime until the upgrade is complete, hence this option is incorrect.</p>\n\n<p><strong>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the primary database instance to be upgraded which is then followed by the upgrade of the standby database instance. This does not cause any downtime for the duration of the upgrade</strong> - For Amazon RDS database engine level upgrade, primary and standby database instances are upgraded at the same time and it causes downtime until the upgrade is complete, hence this option is incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/rds-required-maintenance/\">https://aws.amazon.com/premiumsupport/knowledge-center/rds-required-maintenance/</a></p>\n","answers":["<p>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. However, this does not cause any downtime until the upgrade is complete</p>","<p>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the standby database instance to be upgraded which is then followed by the upgrade of the primary database instance. This does not cause any downtime for the duration of the upgrade</p>","<p>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers the primary database instance to be upgraded which is then followed by the upgrade of the standby database instance. This does not cause any downtime for the duration of the upgrade</p>","<p>Any database engine level upgrade for an Amazon RDS database instance with Multi-AZ deployment triggers both the primary and standby database instances to be upgraded at the same time. This causes downtime until the upgrade is complete</p>"]},"correct_response":["d"],"section":"Design Resilient Architectures","question_plain":"The DevOps team at a major financial services company uses Multi-Availability Zone (Multi-AZ) deployment for its MySQL Amazon RDS database in order to automate its database replication and augment data durability. The DevOps team has scheduled a maintenance window for a database engine level upgrade for the coming weekend.\n\nWhich of the following is the correct outcome during the maintenance window?","related_lectures":[]},{"_class":"assessment","id":157033911,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global media agency is developing a cultural analysis project to explore how major sports stories have evolved over the last five years. The team has collected thousands of archived news bulletins and magazine spreads stored in PDF format. These documents are rich in unstructured text and come from various sources with differing layouts and font styles. The agency wants to better understand how public tone and narrative have shifted over time. The team has chosen to use Amazon Textract for its ability to accurately extract printed and scanned text from complex PDF layouts. They need a solution that can then analyze the emotional tone and subject matter of the extracted text with the least possible operational burden, using fully managed AWS services where possible.</p>\n\n<p>Which solution will best meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Send the extracted text to Amazon Comprehend for entity detection and sentiment analysis. Store the results in Amazon S3 for further access or visualization.</strong></p>\n\n<p>This solution offers the least operational overhead and leverages fully managed services. Amazon Textract efficiently extracts structured and unstructured text from complex PDF documents. The extracted content is then passed to Amazon Comprehend, which provides pre-trained NLP models capable of performing sentiment analysis, entity recognition, and topic classification. There is no need to build or train custom models. The results can be stored in Amazon S3, making them easily accessible for downstream processing or reporting. This approach is serverless, scalable, and ideal for unstructured data.</p>\n\n<p>Amazon Textract with Amazon Comprehend:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt2-q26-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/machine-learning/extracting-custom-entities-from-documents-with-amazon-textract-and-amazon-comprehend/\">https://aws.amazon.com/blogs/machine-learning/extracting-custom-entities-from-documents-with-amazon-textract-and-amazon-comprehend/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon SageMaker to train a custom sentiment analysis model. Store the model outputs in Amazon DynamoDB for structured querying by analysts</strong> - Although SageMaker provides a powerful platform for building custom ML models, using it here adds unnecessary complexity and overhead. You would need to collect training data, develop a sentiment model, and manage training infrastructure, which contradicts the requirement for low operational overhead. Also, DynamoDB is not optimized for full-text analysis, making it an awkward choice for storing sentiment-rich textual data.</p>\n\n<p><strong>Process the extracted output with AWS Lambda to convert the text into CSV format. Query the data using Amazon Athena and visualize it using Amazon QuickSight.</strong> - This solution involves multiple processing steps and intermediate transformations. Converting text to CSV via Lambda and querying it using Athena adds operational complexity. Additionally, Athena is not built for sentiment analysis—it’s a query engine for structured data. QuickSight provides visualization, but without prior NLP processing (e.g., through Comprehend), it cannot extract sentiment insights from plain text.</p>\n\n<p><strong>Ingest the extracted data into Amazon Redshift using AWS Glue, and use Amazon Rekognition to analyze the tone of the document layouts for sentiment classification.</strong> - This architecture includes components (e.g., Amazon Rekognition) that are not suitable for text or sentiment analysis. Rekognition is a computer vision service, designed to analyze images and videos—not the emotional tone of text. Loading textual data into Redshift via AWS Glue also involves multiple ETL steps and schema management, which increases overhead without improving the sentiment analysis capabilities.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/textract/latest/dg/what-is.html\">https://docs.aws.amazon.com/textract/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html\">https://docs.aws.amazon.com/comprehend/latest/dg/what-is.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/machine-learning/extracting-custom-entities-from-documents-with-amazon-textract-and-amazon-comprehend/\">https://aws.amazon.com/blogs/machine-learning/extracting-custom-entities-from-documents-with-amazon-textract-and-amazon-comprehend/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html\">https://docs.aws.amazon.com/sagemaker/latest/dg/whatis.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/athena/latest/ug/what-is.html\">https://docs.aws.amazon.com/athena/latest/ug/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html\">https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html</a></p>\n","answers":["<p>Use Amazon SageMaker to train a custom sentiment analysis model. Store the model outputs in Amazon DynamoDB for structured querying by analysts</p>","<p>Process the extracted output with AWS Lambda to convert the text into CSV format. Query the data using Amazon Athena and visualize it using Amazon QuickSight.</p>","<p>Ingest the extracted data into Amazon Redshift using AWS Glue, and use Amazon Rekognition to analyze the tone of the document layouts for sentiment classification.</p>","<p>Send the extracted text to Amazon Comprehend for entity detection and sentiment analysis. Store the results in Amazon S3 for further access or visualization.</p>"]},"correct_response":["d"],"section":"Design High-Performing Architectures","question_plain":"A global media agency is developing a cultural analysis project to explore how major sports stories have evolved over the last five years. The team has collected thousands of archived news bulletins and magazine spreads stored in PDF format. These documents are rich in unstructured text and come from various sources with differing layouts and font styles. The agency wants to better understand how public tone and narrative have shifted over time. The team has chosen to use Amazon Textract for its ability to accurately extract printed and scanned text from complex PDF layouts. They need a solution that can then analyze the emotional tone and subject matter of the extracted text with the least possible operational burden, using fully managed AWS services where possible.\n\nWhich solution will best meet these requirements?","related_lectures":[]},{"_class":"assessment","id":157033865,"assessment_type":"multiple-choice","prompt":{"question":"<p>A manufacturing analytics company has a large collection of automated scripts that perform data cleanup, validation, and system integration tasks. These scripts are currently run by a local Linux cron scheduler and have an execution time of up to 30 minutes. The company wants to migrate these scripts to AWS without significant changes, and would prefer a containerized, serverless architecture that automatically scales and can respond to event-based triggers in the future. The solution must minimize infrastructure management.</p>\n\n<p>Which solution will best meet these requirements with minimal refactoring and operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Package the scripts into a container image. Use Amazon EventBridge Scheduler to define cron-based recurring schedules. Configure EventBridge Scheduler to invoke AWS Fargate tasks using Amazon ECS</strong></p>\n\n<p>This solution best meets all the requirements. Amazon EventBridge Scheduler is a fully managed, serverless scheduler that allows you to define high-scale cron and rate-based jobs without maintaining any scheduling infrastructure. By packaging the legacy cron scripts as containers and running them as ECS Fargate tasks, the company avoids the need to provision EC2 instances or manage runtime environments. The solution is serverless, scalable, and compatible with future event-based triggers using EventBridge’s native integration.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Convert each script into a Lambda function and package it in a zip archive. Use Amazon EventBridge Scheduler to run the functions on a fixed schedule. Use Amazon S3 to store function outputs and logs</strong> - While AWS Lambda integrates well with EventBridge Scheduler, Lambda functions have a hard timeout of 15 minutes. This makes them unsuitable for cron jobs that run up to 30 minutes, as stated in the scenario. Additionally, refactoring each script into a separate Lambda function would require significant code and dependency changes, violating the requirement for minimal refactoring.</p>\n\n<p><strong>Package the scripts into a container image. Deploy the image to AWS Batch with a managed compute environment on Amazon EC2. Define scheduling policies in AWS Batch to trigger jobs according to cron expressions</strong> - AWS Batch supports long-running jobs and scheduling, but it’s designed for batch compute jobs with queues and dependency management, not for lightweight, cron-like container jobs. Bat
