.amazon.com/AmazonCloudFront/latest/DeveloperGuide/distribution-web-awswaf.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/distribution-web-awswaf.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/about-aws/whats-new/2017/12/introducing-field-level-encryption-on-amazon-cloudfront/\">https://aws.amazon.com/about-aws/whats-new/2017/12/introducing-field-level-encryption-on-amazon-cloudfront/</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Security","question_plain":"A pharmaceutical company uses Amazon EC2 instances for application hosting and Amazon CloudFront for content delivery. A new research paper with critical findings has to be shared with a research team that is spread across the world.\n\nWhich of the following represents the most optimal solution to address this requirement without compromising the security of the content?","related_lectures":[]},{"_class":"assessment","id":129582371,"assessment_type":"multi-select","prompt":{"relatedLectureIds":"","answers":["<p>When you create a signer, the public key is with CloudFront and private key is used to sign a portion of URL</p>","<p>When you use the root user to manage CloudFront key pairs, you can only have up to two active CloudFront key pairs per AWS account</p>","<p>You can also use AWS Identity and Access Management (IAM) permissions policies to restrict what the root user can do with CloudFront key pairs</p>","<p>CloudFront key pairs can be created with any account that has administrative permissions and full access to CloudFront resources</p>","<p>Both the signers (trusted key groups and CloudFront key pairs) can be managed using the CloudFront APIs</p>"],"question":"<p>A developer is defining the signers that can create signed URLs for their Amazon CloudFront distributions.</p>\n\n<p>Which of the following statements should the developer consider while defining the signers? (Select two)</p>\n","explanation":"<p>Correct options:</p>\n\n<p><strong>When you create a signer, the public key is with CloudFront and private key is used to sign a portion of URL</strong> - Each signer that you use to create CloudFront signed URLs or signed cookies must have a public–private key pair. The signer uses its private key to sign the URL or cookies, and CloudFront uses the public key to verify the signature.</p>\n\n<p>When you create signed URLs or signed cookies, you use the private key from the signer’s key pair to sign a portion of the URL or the cookie. When someone requests a restricted file, CloudFront compares the signature in the URL or cookie with the unsigned URL or cookie, to verify that it hasn’t been tampered with. CloudFront also verifies that the URL or cookie is valid, meaning, for example, that the expiration date and time haven’t passed.</p>\n\n<p><strong>When you use the root user to manage CloudFront key pairs, you can only have up to two active CloudFront key pairs per AWS account</strong> - When you use the root user to manage CloudFront key pairs, you can only have up to two active CloudFront key pairs per AWS account.</p>\n\n<p>Whereas, with CloudFront key groups, you can associate a higher number of public keys with your CloudFront distribution, giving you more flexibility in how you use and manage the public keys. By default, you can associate up to four key groups with a single distribution, and you can have up to five public keys in a key group.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>You can also use AWS Identity and Access Management (IAM) permissions policies to restrict what the root user can do with CloudFront key pairs</strong> - When you use the AWS account root user to manage CloudFront key pairs, you can’t restrict what the root user can do or the conditions in which it can do them. You can’t apply IAM permissions policies to the root user, which is one reason why AWS best practices recommend against using the root user.</p>\n\n<p><strong>CloudFront key pairs can be created with any account that has administrative permissions and full access to CloudFront resources</strong> - CloudFront key pairs can only be created using the root user account and hence is not a best practice to create CloudFront key pairs as signers.</p>\n\n<p><strong>Both the signers (trusted key groups and CloudFront key pairs) can be managed using the CloudFront APIs</strong> - With CloudFront key groups, you can manage public keys, key groups, and trusted signers using the CloudFront API. You can use the API to automate key creation and key rotation. When you use the AWS root user, you have to use the AWS Management Console to manage CloudFront key pairs, so you can’t automate the process.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-trusted-signers.html</a></p>\n","feedbacks":["","","","",""]},"correct_response":["a","b"],"section":"Security","question_plain":"A developer is defining the signers that can create signed URLs for their Amazon CloudFront distributions.\n\nWhich of the following statements should the developer consider while defining the signers? (Select two)","related_lectures":[]},{"_class":"assessment","id":129582397,"assessment_type":"multi-select","prompt":{"question":"<p>A business hosts its website on Amazon EC2 instances and employs Auto Scaling to adjust its resources according to traffic spikes. However, users globally report slow loading times because static content hosted on the EC2 instances takes too long to load, even outside of busy periods.</p>\n\n<p>What pair of actions should be taken to improve the latency of the website? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up an Amazon CloudFront distribution to cache the static content with Amazon S3 configured as the origin</strong></p>\n\n<p><strong>Transfer the application’s static content hosted on EC2 instances to Amazon S3</strong></p>\n\n<p>Amazon CloudFront is a web service that speeds up distribution of your static and dynamic web content, such as .html, .css, .js, and image files, to your users. CloudFront delivers your content through a worldwide network of data centers called edge locations. When a user requests content that you're serving with CloudFront, the request is routed to the edge location that provides the lowest latency (time delay), so that content is delivered with the best possible performance.</p>\n\n<p>For the given use case, you can transfer the static content from EC2 instances to Amazon S3. Then, you can specify the origin as the Amazon S3 bucket from which CloudFront gets your files which will then be distributed from CloudFront edge locations all over the world. An origin stores the original, definitive version of your objects. If you're serving content over HTTP, your origin is either an Amazon S3 bucket or an HTTP server, such as a web server.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/images/AmazonCloudFront/latest/DeveloperGuide/images/how-you-configure-cf.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Upgrade the CPU and RAM available to the EC2 instances</strong> - Since the static content takes too long to load even outside of busy periods, this implies that the underlying root cause is the high end-to-end network latency rather than the hardware of the EC2 instance.</p>\n\n<p><strong>Double the Auto Scaling group’s desired capacity</strong> - The desired capacity represents the initial capacity of the Auto Scaling group at the time of creation. An Auto Scaling group attempts to maintain the desired capacity. It starts by launching the number of instances that are specified for the desired capacity, and maintains this number of instances as long as there are no scaling policies or scheduled actions attached to the Auto Scaling group. Since the static content takes too long to load even outside of busy periods, so doubling the desired capacity would still not address the underlying root cause of high end-to-end network latency.</p>\n\n<p><strong>Migrate the application to AWS Lambda</strong> - You cannot store static content on AWS Lambda, so this option just serves as a distractor.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/GettingStarted.SimpleDistribution.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/GettingStarted.SimpleDistribution.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html</a></p>\n","answers":["<p>Set up an Amazon CloudFront distribution to cache the static content with Amazon S3 configured as the origin</p>","<p>Transfer the application’s static content hosted on EC2 instances to Amazon S3</p>","<p>Upgrade the CPU and RAM available to the EC2 instances</p>","<p>Double the Auto Scaling group’s desired capacity</p>","<p>Migrate the application to AWS Lambda</p>"]},"correct_response":["a","b"],"section":"Troubleshooting and Optimization","question_plain":"A business hosts its website on Amazon EC2 instances and employs Auto Scaling to adjust its resources according to traffic spikes. However, users globally report slow loading times because static content hosted on the EC2 instances takes too long to load, even outside of busy periods.\n\nWhat pair of actions should be taken to improve the latency of the website? (Select two)","related_lectures":[]},{"_class":"assessment","id":129582301,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Use Amazon Simple Queue Service (Amazon SQS) queue to pass information from order management to inventory tracking workflow</p>","<p>Configure Amazon EventBridge to track the flow of work from order management to inventory tracking systems</p>","<p>Use Amazon SNS to develop event-driven applications that can share information</p>","<p>Use AWS Step Functions to coordinate and manage the components of order management and inventory tracking workflow</p>"],"question":"<p>A company wants to automate its order fulfillment and inventory tracking workflow. Starting from order creation to updating inventory to shipment, the entire process has to be tracked, managed and updated automatically.</p>\n\n<p>Which of the following would you recommend as the most optimal solution for this requirement?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Step Functions to coordinate and manage the components of order management and inventory tracking workflow</strong></p>\n\n<p>AWS Step Functions is a serverless function orchestrator that makes it easy to sequence AWS Lambda functions and multiple AWS services into business-critical applications. Through its visual interface, you can create and run a series of checkpointed and event-driven workflows that maintain the application state. The output of one step acts as an input to the next. Each step in your application executes in order, as defined by your business logic.</p>\n\n<p>AWS Step Functions enables you to implement a business process as a series of steps that make up a workflow. The individual steps in the workflow can invoke a Lambda function or a container that has some business logic, update a database such as DynamoDB or publish a message to a queue once that step or the entire workflow completes execution.</p>\n\n<p>Benefits of Step Functions:</p>\n\n<p>Build and update apps quickly: AWS Step Functions lets you build visual workflows that enable the fast translation of business requirements into technical requirements. You can build applications in a matter of minutes, and when needs change, you can swap or reorganize components without customizing any code.</p>\n\n<p>Improve resiliency: AWS Step Functions manages state, checkpoints and restarts for you to make sure that your application executes in order and as expected. Built-in try/catch, retry and rollback capabilities deal with errors and exceptions automatically.</p>\n\n<p>Write less code: AWS Step Functions manages the logic of your application for you and implements basic primitives such as branching, parallel execution, and timeouts. This removes extra code that may be repeated in your microservices and functions.</p>\n\n<p>How Step Functions work:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt6-q19-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/step-functions/\">https://aws.amazon.com/step-functions/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Simple Queue Service (Amazon SQS) queue to pass information from order management to inventory tracking workflow</strong> - You should consider AWS Step Functions when you need to coordinate service components in the development of highly scalable and auditable applications. You should consider using Amazon Simple Queue Service (Amazon SQS), when you need a reliable, highly scalable, hosted queue for sending, storing, and receiving messages between services. Step Functions keeps track of all tasks and events in an application. Amazon SQS requires you to implement your own application-level tracking, especially if your application uses multiple queues.</p>\n\n<p><strong>Configure Amazon EventBridge to track the flow of work from order management to inventory tracking systems</strong> - Both Amazon EventBridge and Amazon SNS can be used to develop event-driven applications, and your choice will depend on your specific needs. Amazon EventBridge is recommended when you want to build an application that reacts to events from SaaS applications and/or AWS services. Amazon EventBridge is the only event-based service that integrates directly with third-party SaaS partners.</p>\n\n<p><strong>Use Amazon SNS to develop event-driven applications that can share information</strong> - Amazon SNS is recommended when you want to build an application that reacts to high throughput or low latency messages published by other applications or microservices (as Amazon SNS provides nearly unlimited throughput), or for applications that need very high fan-out (thousands or millions of endpoints).</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/step-functions/faqs/\">https://aws.amazon.com/step-functions/faqs/</a></p>\n\n<p><a href=\"https://aws.amazon.com/eventbridge/faqs/\">https://aws.amazon.com/eventbridge/faqs/</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"A company wants to automate its order fulfillment and inventory tracking workflow. Starting from order creation to updating inventory to shipment, the entire process has to be tracked, managed and updated automatically.\n\nWhich of the following would you recommend as the most optimal solution for this requirement?","related_lectures":[]},{"_class":"assessment","id":129582357,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<pre><code>\"HelloWorld\": {\n  \"Type\": \"Task\",\n  \"Resource\": \"arn:aws:lambda:us-east-1:123456789012:function:HelloFunction\",\n  \"Next\": \"AfterHelloWorldState\",\n  \"Comment\": \"Run the HelloWorld Lambda function\"\n}\n</code></pre>","<pre><code>\"wait_until\" : {\n  \"Type\": \"Wait\",\n  \"Timestamp\": \"2016-03-14T01:59:00Z\",\n  \"Next\": \"NextState\"\n}\n</code></pre>","<pre><code>\"No-op\": {\n  \"Type\": \"Task\",\n  \"Result\": {\n    \"x-datum\": 0.381018,\n    \"y-datum\": 622.2269926397355\n  },\n  \"ResultPath\": \"$.coords\",\n  \"Next\": \"End\"\n}\n</code></pre>","<pre><code>\"FailState\": {\n  \"Type\": \"Fail\",\n  \"Cause\": \"Invalid response.\",\n  \"Error\": \"ErrorA\"\n}\n</code></pre>"],"question":"<p>While defining a business workflow as state machine on AWS Step Functions, a developer has configured several states.</p>\n\n<p>Which of the following would you identify as the state that represents a single unit of work performed by a state machine?</p>\n","explanation":"<p>Correct option:</p>\n\n<pre><code>\"HelloWorld\": {\n  \"Type\": \"Task\",\n  \"Resource\": \"arn:aws:lambda:us-east-1:123456789012:function:HelloFunction\",\n  \"Next\": \"AfterHelloWorldState\",\n  \"Comment\": \"Run the HelloWorld Lambda function\"\n}\n</code></pre>\n\n<p>A Task state (\"Type\": \"Task\") represents a single unit of work performed by a state machine.</p>\n\n<p>All work in your state machine is done by tasks. A task performs work by using an activity or an AWS Lambda function, or by passing parameters to the API actions of other services.</p>\n\n<p>AWS Step Functions can invoke Lambda functions directly from a task state. A Lambda function is a cloud-native task that runs on AWS Lambda. You can write Lambda functions in a variety of programming languages, using the AWS Management Console or by uploading code to Lambda.</p>\n\n<p>Incorrect options:</p>\n\n<pre><code>\"wait_until\" : {\n  \"Type\": \"Wait\",\n  \"Timestamp\": \"2016-03-14T01:59:00Z\",\n  \"Next\": \"NextState\"\n}\n</code></pre>\n\n<ul>\n<li>A Wait state (\"Type\": \"Wait\") delays the state machine from continuing for a specified time.</li>\n</ul>\n\n<pre><code>\"No-op\": {\n  \"Type\": \"Task\",\n  \"Result\": {\n    \"x-datum\": 0.381018,\n    \"y-datum\": 622.2269926397355\n  },\n  \"ResultPath\": \"$.coords\",\n  \"Next\": \"End\"\n}\n</code></pre>\n\n<ul>\n<li><code>Resource</code> field is a required parameter for <code>Task</code> state. This definition is not of a <code>Task</code> but of type <code>Pass</code>.</li>\n</ul>\n\n<pre><code>\"FailState\": {\n  \"Type\": \"Fail\",\n  \"Cause\": \"Invalid response.\",\n  \"Error\": \"ErrorA\"\n}\n</code></pre>\n\n<ul>\n<li>A Fail state (\"Type\": \"Fail\") stops the execution of the state machine and marks it as a failure unless it is caught by a Catch block. Because Fail states always exit the state machine, they have no Next field and don't require an End field.</li>\n</ul>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/amazon-states-language-task-state.html\">https://docs.aws.amazon.com/step-functions/latest/dg/amazon-states-language-task-state.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["a"],"section":"Development with AWS Services","question_plain":"While defining a business workflow as state machine on AWS Step Functions, a developer has configured several states.\n\nWhich of the following would you identify as the state that represents a single unit of work performed by a state machine?","related_lectures":[]},{"_class":"assessment","id":129582345,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Amazon EC2 Auto Scaling adds 3 instances to the group</p>","<p>Amazon EC2 Auto Scaling adds 3 instances to the group and scales down 2 of those instances eventually</p>","<p>Amazon EC2 Auto Scaling adds only 1 instance to the group</p>","<p>Amazon EC2 Auto Scaling does not add any instances to the group, but suggests changing the scaling policy to add one instance</p>"],"question":"<p>An Auto Scaling group has a maximum capacity of 3, a current capacity of 2, and a scaling policy that adds 3 instances.</p>\n\n<p>When executing this scaling policy, what is the expected outcome?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>A scaling policy instructs Amazon EC2 Auto Scaling to track a specific CloudWatch metric, and it defines what action to take when the associated CloudWatch alarm is in ALARM.</p>\n\n<p>When a scaling policy is executed, if the capacity calculation produces a number outside of the minimum and maximum size range of the group, Amazon EC2 Auto Scaling ensures that the new capacity never goes outside of the minimum and maximum size limits.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q21-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scale-based-on-demand.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scale-based-on-demand.html</a></p>\n\n<p><strong>Amazon EC2 Auto Scaling adds only 1 instance to the group</strong></p>\n\n<p>For the given use-case, Amazon EC2 Auto Scaling adds only 1 instance to the group to prevent the group from exceeding its maximum size.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon EC2 Auto Scaling adds 3 instances to the group</strong> - This is an incorrect statement. Auto Scaling ensures that the new capacity never goes outside of the minimum and maximum size limits.</p>\n\n<p><strong>Amazon EC2 Auto Scaling adds 3 instances to the group and scales down 2 of those instances eventually</strong> - This is an incorrect statement. Adding the instances initially and immediately downsizing them is impractical.</p>\n\n<p><strong>Amazon EC2 Auto Scaling does not add any instances to the group, but suggests changing the scaling policy to add one instance</strong> - This option has been added as a distractor.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scale-based-on-demand.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scale-based-on-demand.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Development with AWS Services","question_plain":"An Auto Scaling group has a maximum capacity of 3, a current capacity of 2, and a scaling policy that adds 3 instances.\n\nWhen executing this scaling policy, what is the expected outcome?","related_lectures":[]},{"_class":"assessment","id":129582315,"assessment_type":"multiple-choice","prompt":{"question":"<p>A junior developer has been asked to configure access to an Amazon EC2 instance hosting a web application. The developer has configured a new security group to permit incoming HTTP traffic from 0.0.0.0/0 and retained any default outbound rules. A custom Network Access Control List (NACL) connected with the instance's subnet is configured to permit incoming HTTP traffic from 0.0.0.0/0 and retained any default outbound rules.</p>\n\n<p>Which of the following solutions would you suggest if the EC2 instance needs to accept and respond to requests from the internet?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>An outbound rule must be added to the Network ACL (NACL) to allow the response to be sent to the client on the ephemeral port range</strong></p>\n\n<p>Security groups are stateful, so allowing inbound traffic to the necessary ports enables the connection. Network ACLs are stateless, so you must allow both inbound and outbound traffic. By default, each custom Network ACL denies all inbound and outbound traffic until you add rules.</p>\n\n<p>To enable the connection to a service running on an instance, the associated network ACL must allow both:\n1. Inbound traffic on the port that the service is listening on\n2. Outbound traffic to ephemeral ports</p>\n\n<p>When a client connects to a server, a random port from the ephemeral port range (1024-65535) becomes the client's source port.</p>\n\n<p>The designated ephemeral port becomes the destination port for return traffic from the service. Outbound traffic to the ephemeral port must be allowed in the network ACL.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The configuration is complete on the EC2 instance for accepting and responding to requests</strong> - As explained above, this is an incorrect statement.</p>\n\n<p><strong>An outbound rule on the security group has to be configured, to allow the response to be sent to the client on the HTTP port</strong> - Security groups are stateful. Therefore you don't need a rule that allows responses to inbound traffic.</p>\n\n<p><em>Outbound rules need to be configured both on the security group and on the NACL for sending responses to the Internet Gateway</em>* - Security Groups are stateful. Hence, return traffic is automatically allowed, so there is no need to configure an outbound rule on the security group.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/resolve-connection-sg-acl-inbound/\">https://aws.amazon.com/premiumsupport/knowledge-center/resolve-connection-sg-acl-inbound/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html#nacl-ephemeral-ports\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html#nacl-ephemeral-ports</a></p>\n","answers":["<p>The configuration is complete on the EC2 instance for accepting and responding to requests</p>","<p>An outbound rule must be added to the Network ACL (NACL) to allow the response to be sent to the client on the ephemeral port range</p>","<p>An outbound rule on the security group has to be configured, to allow the response to be sent to the client on the HTTP port</p>","<p>Outbound rules need to be configured both on the security group and on the NACL for sending responses to the Internet Gateway</p>"]},"correct_response":["b"],"section":"Troubleshooting and Optimization","question_plain":"A junior developer has been asked to configure access to an Amazon EC2 instance hosting a web application. The developer has configured a new security group to permit incoming HTTP traffic from 0.0.0.0/0 and retained any default outbound rules. A custom Network Access Control List (NACL) connected with the instance's subnet is configured to permit incoming HTTP traffic from 0.0.0.0/0 and retained any default outbound rules.\n\nWhich of the following solutions would you suggest if the EC2 instance needs to accept and respond to requests from the internet?","related_lectures":[]},{"_class":"assessment","id":129582411,"assessment_type":"multiple-choice","prompt":{"question":"<p>As an AWS certified developer associate, you are working on an AWS CloudFormation template that will create resources for a company's cloud infrastructure. Your template is composed of three stacks which are Stack-A, Stack-B, and Stack-C. Stack-A will provision a VPC, a security group, and subnets for public web applications that will be referenced in Stack-B and Stack-C.</p>\n\n<p>After running the stacks you decide to delete them, in which order should you do it?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p>AWS CloudFormation gives developers and businesses an easy way to create a collection of related AWS and third-party resources and provision them in an orderly and predictable fashion.</p>\n\n<p>How CloudFormation Works:\n<img src=\"https://d1.awsstatic.com/Products/product-name/diagrams/product-page-diagram_CloudFormation.ad3a4c93b4fdd3366da3da0de4fb084d89a5d761.png\">\nvia - <a href=\"https://aws.amazon.com/cloudformation/\">https://aws.amazon.com/cloudformation/</a></p>\n\n<p><strong>Stack B, then Stack C, then Stack A</strong></p>\n\n<p>All of the imports must be removed before you can delete the exporting stack or modify the output value. In this case, you must delete Stack B as well as Stack C, before you delete Stack A.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q23-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html\">https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Stack A, then Stack B, then Stack C</strong> - All of the imports must be removed before you can delete the exporting stack or modify the output value. In this case, you cannot delete Stack A first because that's being referenced in the other Stacks.</p>\n\n<p><strong>Stack A, Stack C then Stack B</strong> - All of the imports must be removed before you can delete the exporting stack or modify the output value. In this case, you cannot delete Stack A first because that's being referenced in the other Stacks.</p>\n\n<p><strong>Stack C then Stack A then Stack B</strong> - Stack C is fine but you should delete Stack B before Stack A because all of the imports must be removed before you can delete the exporting stack or modify the output value.</p>\n\n<p>Reference:\n<a href=\"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html\">https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/using-cfn-stack-exports.html</a></p>\n","answers":["<p>Stack B, then Stack C, then Stack A</p>","<p>Stack A, then Stack B, then Stack C</p>","<p>Stack A, Stack C then Stack B</p>","<p>Stack C then Stack A then Stack B</p>"]},"correct_response":["a"],"section":"Development with AWS Services","question_plain":"As an AWS certified developer associate, you are working on an AWS CloudFormation template that will create resources for a company's cloud infrastructure. Your template is composed of three stacks which are Stack-A, Stack-B, and Stack-C. Stack-A will provision a VPC, a security group, and subnets for public web applications that will be referenced in Stack-B and Stack-C.\n\nAfter running the stacks you decide to delete them, in which order should you do it?","related_lectures":[]},{"_class":"assessment","id":129582385,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Application Load Balancer + ECS</p>","<p>Classic Load Balancer + Beanstalk</p>","<p>Application Load Balancer + Beanstalk</p>","<p>Classic Load Balancer + ECS</p>"],"question":"<p>Your company has embraced cloud-native microservices architectures. New applications must be dockerized and stored in a registry service offered by AWS. The architecture should support dynamic port mapping and support multiple tasks from a single service on the same container instance. All services should run on the same EC2 instance.</p>\n\n<p>Which of the following options offers the best-fit solution for the given use-case?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Application Load Balancer + ECS</strong></p>\n\n<p>Amazon Elastic Container Service (Amazon ECS) is a highly scalable, fast, container management service that makes it easy to run, stop, and manage Docker containers on a cluster. You can host your cluster on a serverless infrastructure that is managed by Amazon ECS by launching your services or tasks using the Fargate launch type. For more control over your infrastructure, you can host your tasks on a cluster of Amazon Elastic Compute Cloud (Amazon EC2) instances that you manage by using the EC2 launch type.</p>\n\n<p><img src=\"https://d1.awsstatic.com/diagrams/product-page-diagrams/product-page-diagram_ECS_1.86ebd8c223ec8b55aa1903c423fbe4e672f3daf7.png\">\nvia - <a href=\"https://aws.amazon.com/ecs/\">https://aws.amazon.com/ecs/</a></p>\n\n<p>An Application load balancer distributes incoming application traffic across multiple targets, such as EC2 instances, in multiple Availability Zones. A listener checks for connection requests from clients, using the protocol and port that you configure. The rules that you define for a listener determine how the load balancer routes requests to its registered targets. Each rule consists of a priority, one or more actions, and one or more conditions.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/images/component_architecture.png\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n\n<p>When you deploy your services using Amazon Elastic Container Service (Amazon ECS), you can use dynamic port mapping to support multiple tasks from a single service on the same container instance. Amazon ECS manages updates to your services by automatically registering and deregistering containers with your target group using the instance ID and port for each container.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q24-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/dynamic-port-mapping-ecs\">https://aws.amazon.com/premiumsupport/knowledge-center/dynamic-port-mapping-ecs</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Classic Load Balancer + Beanstalk</strong> - The Classic Load Balancer doesn't allow you to run multiple copies of a task on the same instance. Instead, with the Classic Load Balancer, you must statically map port numbers on a container instance. So this option is ruled out.</p>\n\n<p><strong>Application Load Balancer + Beanstalk</strong> - You can create docker environments that support multiple containers per Amazon EC2 instance with a multi-container Docker platform for Elastic Beanstalk. However, ECS gives you finer control.</p>\n\n<p><strong>Classic Load Balancer + ECS</strong> - The Classic Load Balancer doesn't allow you to run multiple copies of a task in the same instance. Instead, with the Classic Load Balancer, you must statically map port numbers on a container instance. So this option is ruled out.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/dynamic-port-mapping-ecs\">https://aws.amazon.com/premiumsupport/knowledge-center/dynamic-port-mapping-ecs</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/tutorial-target-ecs-containers.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/tutorial-target-ecs-containers.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/create_deploy_docker_ecs.html\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/create_deploy_docker_ecs.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["a"],"section":"Deployment","question_plain":"Your company has embraced cloud-native microservices architectures. New applications must be dockerized and stored in a registry service offered by AWS. The architecture should support dynamic port mapping and support multiple tasks from a single service on the same container instance. All services should run on the same EC2 instance.\n\nWhich of the following options offers the best-fit solution for the given use-case?","related_lectures":[]},{"_class":"assessment","id":129582349,"assessment_type":"multiple-choice","prompt":{"question":"<p>What steps can a developer take to optimize the performance of a CPU-bound AWS Lambda function and ensure fast response time?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Increase the function's memory</strong></p>\n\n<p>Memory is the principal lever available to Lambda developers for controlling the performance of a function. You can configure the amount of memory allocated to a Lambda function, between 128 MB and 10,240 MB. The Lambda console defaults new functions to the smallest setting and many developers also choose 128 MB for their functions.</p>\n\n<p>The amount of memory also determines the amount of virtual CPU available to a function. Adding more memory proportionally increases the amount of CPU, increasing the overall computational power available. If a function is CPU-, network- or memory-bound, then changing the memory setting can dramatically improve its performance.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Increase the function's provisioned concurrency</strong></p>\n\n<p><strong>Increase the function's reserved concurrency</strong></p>\n\n<p>In Lambda, concurrency is the number of requests your function can handle at the same time. There are two types of concurrency controls available:</p>\n\n<p>Reserved concurrency – Reserved concurrency guarantees the maximum number of concurrent instances for the function. When a function has reserved concurrency, no other function can use that concurrency. There is no charge for configuring reserved concurrency for a function.</p>\n\n<p>Provisioned concurrency – Provisioned concurrency initializes a requested number of execution environments so that they are prepared to respond immediately to your function's invocations. Note that configuring provisioned concurrency incurs charges to your AWS account.</p>\n\n<p>Neither reserved concurrency nor provisioned concurrency has any impact on the CPU available to a function, so both these options are incorrect</p>\n\n<p><strong>Increase the function's CPU</strong> - This is a distractor as you cannot directly increase the CPU available to a function.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/operatorguide/computing-power.html\">https://docs.aws.amazon.com/lambda/latest/operatorguide/computing-power.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html\">https://docs.aws.amazon.com/lambda/latest/dg/provisioned-concurrency.html</a></p>\n","answers":["<p>Increase the function's provisioned concurrency</p>","<p>Increase the function's timeout</p>","<p>Increase the function's CPU</p>","<p>Increase the function's memory</p>"]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"What steps can a developer take to optimize the performance of a CPU-bound AWS Lambda function and ensure fast response time?","related_lectures":[]},{"_class":"assessment","id":129582317,"assessment_type":"multiple-choice","prompt":{"question":"<p>A Developer is configuring Amazon EC2 Auto Scaling group to scale dynamically.</p>\n\n<p>Which metric below is NOT part of Target Tracking Scaling Policy?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>ApproximateNumberOfMessagesVisible</strong> - This is a CloudWatch Amazon SQS queue metric. The number of messages in a queue might not change proportionally to the size of the Auto Scaling group that processes messages from the queue. Hence, this metric does not work for target tracking.</p>\n\n<p>Incorrect options:</p>\n\n<p>With target tracking scaling policies, you select a scaling metric and set a target value. Amazon EC2 Auto Scaling creates and manages the CloudWatch alarms that trigger the scaling policy and calculates the scaling adjustment based on the metric and the target value.</p>\n\n<p>It is important to note that a target tracking scaling policy assumes that it should scale out your Auto Scaling group when the specified metric is above the target value. You cannot use a target tracking scaling policy to scale out your Auto Scaling group when the specified metric is below the target value.</p>\n\n<p><strong>ASGAverageCPUUtilization</strong> - This is a predefined metric for target tracking scaling policy. This represents the Average CPU utilization of the Auto Scaling group.</p>\n\n<p><strong>ASGAverageNetworkOut</strong> - This is a predefined metric for target tracking scaling policy. This represents the Average number of bytes sent out on all network interfaces by the Auto Scaling group.</p>\n\n<p><strong>ALBRequestCountPerTarget</strong> - This is a predefined metric for target tracking scaling policy. This represents the Number of requests completed per target in an Application Load Balancer target group.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html</a></p>\n","answers":["<p>ASGAverageCPUUtilization</p>","<p>ApproximateNumberOfMessagesVisible</p>","<p>ASGAverageNetworkOut</p>","<p>ALBRequestCountPerTarget</p>"]},"correct_response":["b"],"section":"Troubleshooting and Optimization","question_plain":"A Developer is configuring Amazon EC2 Auto Scaling group to scale dynamically.\n\nWhich metric below is NOT part of Target Tracking Scaling Policy?","related_lectures":[]},{"_class":"assessment","id":129582417,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Use SSM parameter store as an input to your Elastic Beanstalk Configurations</p>","<p>Deploy a CloudFormation wrapper</p>","<p>Include config files in .ebextensions/ at the root of your source code</p>","<p>Use an AWS Lambda hook</p>"],"question":"<p>You are a developer working on a web application written in Java and would like to use AWS Elastic Beanstalk for deployment because it would handle deployment, capacity provisioning, load balancing, auto-scaling, and application health monitoring. In the past, you connected to your provisioned instances through SSH to issue configuration commands. Now, you would like a configuration mechanism that automatically applies settings for you.</p>\n\n<p>Which of the following options would help do this?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Include config files in .ebextensions/ at the root of your source code</strong></p>\n\n<p>The option_settings section of a configuration file defines values for configuration options. Configuration options let you configure your Elastic Beanstalk environment, the AWS resources in it, and the software that runs your application. Configuration files are only one of several ways to set configuration options.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q27-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions.html\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy a CloudFormation wrapper</strong> - This is a made-up option. This has been added as a distractor.</p>\n\n<p><strong>Use SSM parameter store as an input to your Elastic Beanstalk Configurations</strong> - SSM parameter is still not supported for Elastic Beanstalk. So this option is incorrect.</p>\n\n<p><strong>Use an AWS Lambda hook</strong> - Lambda functions are not the best-fit to trigger these configuration changes as it would involve significant development effort.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions.html\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions-optionsettings.html\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/ebextensions-optionsettings.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Deployment","question_plain":"You are a developer working on a web application written in Java and would like to use AWS Elastic Beanstalk for deployment because it would handle deployment, capacity provisioning, load balancing, auto-scaling, and application health monitoring. In the past, you connected to your provisioned instances through SSH to issue configuration commands. Now, you would like a configuration mechanism that automatically applies settings for you.\n\nWhich of the following options would help do this?","related_lectures":[]},{"_class":"assessment","id":129582289,"assessment_type":"multiple-choice","prompt":{"question":"<p>An e-commerce company manages a microservices application that receives orders from various partners through a customized API for each partner exposed via Amazon API Gateway. The orders are processed by a shared Lambda function.</p>\n\n<p>How can the company notify each partner regarding the status of their respective orders in the most efficient manner, without affecting other partners' orders? Also, the solution should be scalable to accommodate new partners with minimal code changes required.</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up an SNS topic and subscribe each partner to the SNS topic. Modify the Lambda function to publish messages with specific attributes to the SNS topic and apply the appropriate filter policy to the topic subscriptions</strong></p>\n\n<p>An Amazon SNS topic is a logical access point that acts as a communication channel. A topic lets you group multiple endpoints (such as AWS Lambda, Amazon SQS, HTTP/S, or an email address). For example, to broadcast the messages of a message-producer system (such as, an e-commerce website) working with multiple other services that require its messages (for example, checkout and fulfillment systems), you can create a topic for your producer system.</p>\n\n<p>By default, an Amazon SNS topic subscriber receives every message that's published to the topic. To receive only a subset of the messages, a subscriber must assign a filter policy to the topic subscription. A filter policy is a JSON object containing properties that define which messages the subscriber receives. Amazon SNS supports policies that act on the message attributes or the message body, according to the filter policy scope that you set for the subscription. Filter policies for the message body assume that the message payload is a well-formed JSON object.</p>\n\n<p>For the given use case, you can change the Lambda function to publish messages with specific attributes to the single SNS topic and apply the appropriate filter policy to the topic subscriptions for each of the partners. This is also easily scalable for new partners since only the filter policy needs to be set up for the new partner.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a separate SNS topic for each partner. Modify the Lambda function to publish messages for each partner to the partner's SNS topic</strong></p>\n\n<p><strong>Set up a separate SNS topic for each partner and subscribe each partner to the respective SNS topic. Modify the Lambda function to publish messages with specific attributes to the partner's SNS topic and apply the appropriate filter policy to the topic subscriptions</strong></p>\n\n<p>Both of these options represent an inefficient solution as there is no need to segregate each partner's updates into a separate SNS topic. A single SNS topic with distinct filter policies is sufficient.</p>\n\n<p><strong>Set up a separate Lambda function for each partner. Set up an SNS topic and subscribe each partner to the SNS topic. Modify each partner's Lambda function to publish messages with specific attributes to the SNS topic and apply the appropriate filter policy to the topic subscriptions</strong> - This is again an inefficient solution as there is no need to create a separate Lambda function for each partner as just a shared Lambda function is sufficient to process the orders and send an update to the single SNS topic with distinct filter policies.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-create-topic.html\">https://docs.aws.amazon.com/sns/latest/dg/sns-create-topic.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html\">https://docs.aws.amazon.com/sns/latest/dg/sns-message-filtering.html</a></p>\n","answers":["<p>Set up a separate SNS topic for each partner. Modify the Lambda function to publish messages for each partner to the partner's SNS topic</p>","<p>Set up a separate Lambda function for each partner. Set up an SNS topic and subscribe each partner to the SNS topic. Modify each partner's Lambda function to publish messages with specific attributes to the SNS topic and apply the appropriate filter policy to the topic subscriptions</p>","<p>Set up a separate SNS topic for each partner and subscribe each partner to the respective SNS topic. Modify the Lambda function to publish messages with specific attributes to the partner's SNS topic and apply the appropriate filter policy to the topic subscriptions</p>","<p>Set up an SNS topic and subscribe each partner to the SNS topic. Modify the Lambda function to publish messages with specific attributes to the SNS topic and apply the appropriate filter policy to the topic subscriptions</p>"]},"correct_response":["d"],"section":"Deployment","question_plain":"An e-commerce company manages a microservices application that receives orders from various partners through a customized API for each partner exposed via Amazon API Gateway. The orders are processed by a shared Lambda function.\n\nHow can the company notify each partner regarding the status of their respective orders in the most efficient manner, without affecting other partners' orders? Also, the solution should be scalable to accommodate new partners with minimal code changes required.","related_lectures":[]},{"_class":"assessment","id":129582303,"assessment_type":"multiple-choice","prompt":{"question":"<p>Consider an application that enables users to store their mobile phone images in the cloud and supports tens of thousands of users. The application should utilize an Amazon API Gateway REST API that leverages AWS Lambda functions for photo processing while storing photo details in Amazon DynamoDB. The application should allow users to create an account, upload images, and retrieve previously uploaded images, with images ranging in size from 500 KB to 5 MB.</p>\n\n<p>How will you design the application with the least operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Leverage Cognito user pools to manage user accounts and set up an Amazon Cognito user pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</strong></p>\n\n<p>A user pool is a user directory in Amazon Cognito. With a user pool, your users can sign in to your web or mobile app through Amazon Cognito. Your users can also sign in through social identity providers like Google, Facebook, Amazon, or Apple, and SAML identity providers. Whether your users sign in directly or through a third party, all members of the user pool have a directory profile that you can access through a Software Development Kit (SDK).</p>\n\n<p>User pools provide:</p>\n\n<p>Sign-up and sign-in services.</p>\n\n<p>A built-in, customizable web UI to sign in users.</p>\n\n<p>Social sign-in with Facebook, Google, Login with Amazon, and Sign in with Apple, as well as sign-in with SAML identity providers from your user pool.</p>\n\n<p>User directory management and user profiles.</p>\n\n<p>Security features such as multi-factor authentication (MFA), checks for compromised credentials, account takeover protection, and phone and email verification.</p>\n\n<p>Customized workflows and user migration through AWS Lambda triggers.</p>\n\n<p>To use an Amazon Cognito user pool with your Amazon API Gateway API, you must first create an authorizer of the COGNITO_USER_POOLS type and then configure an API method to use that authorizer. After the API is deployed, the client must first sign the user into the user pool, obtain an identity or access token for the user, and then call the API method with one of the tokens, which are typically set to the request's Authorization header.</p>\n\n<p>For the given use case, you can use a Cognito user pool to manage user accounts and configure an Amazon Cognito user pool authorizer in API Gateway to control access to the API. You should use a Lambda function to store the actual images on S3 and the image metadata on DynamoDB. Finally, you can get the images using the Lambda function that leverages the metadata stored in DynamoDB.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Cognito identity pools to manage user accounts and set up an Amazon Cognito identity pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</strong></p>\n\n<p><strong>Use Cognito identity pools to create an IAM user for each user of the application during the sign-up process. Leverage IAM authentication in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</strong></p>\n\n<p>Amazon Cognito identity pools (federated identities) enable you to create unique identities for your users and federate them with identity providers. With an identity pool, you can obtain temporary, limited-privilege AWS credentials to access other AWS services. You cannot use identity pools to manage users or to create IAM users. So both of these options are incorrect.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q29-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/cognito-user-pools-identity-pools/\">https://aws.amazon.com/premiumsupport/knowledge-center/cognito-user-pools-identity-pools/</a></p>\n\n<p><strong>Leverage Cognito user pools to manage user accounts and set up an Amazon Cognito user pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images as well as the image metadata in a DynamoDB table. Have the Lambda function retrieve previously uploaded images from DynamoDB</strong> - You cannot use DynamoDB to store images as the maximum allowed item size is 400KB and the images range in size from 500KB to 5MB. You should also note that storing images on DynamoDB is an anti-pattern. So this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-user-identity-pools.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/cognito-identity.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-integrate-with-cognito.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-integrate-with-cognito.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/cognito-user-pools-identity-pools/\">https://aws.amazon.com/premiumsupport/knowledge-center/cognito-user-pools-identity-pools/</a></p>\n","answers":["<p>Leverage Cognito user pools to manage user accounts and set up an Amazon Cognito user pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</p>","<p>Leverage Cognito user pools to manage user accounts and set up an Amazon Cognito user pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images as well as the image metadata in a DynamoDB table. Have the Lambda function retrieve previously uploaded images from DynamoDB</p>","<p>Use Cognito identity pools to manage user accounts and set up an Amazon Cognito identity pool authorizer in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</p>","<p>Use Cognito identity pools to create an IAM user for each user of the application during the sign-up process. Leverage IAM authentication in API Gateway to control access to the API. Set up a Lambda function to store the images in Amazon S3 and save the image object's S3 key as part of the photo details in a DynamoDB table. Have the Lambda function retrieve previously uploaded images by querying DynamoDB for the S3 key</p>"]},"correct_response":["a"],"section":"Security","question_plain":"Consider an application that enables users to store their mobile phone images in the cloud and supports tens of thousands of users. The application should utilize an Amazon API Gateway REST API that leverages AWS Lambda functions for photo processing while storing photo details in Amazon DynamoDB. The application should allow users to create an account, upload images, and retrieve previously uploaded images, with images ranging in size from 500 KB to 5 MB.\n\nHow will you design the application with the least operational overhead?","related_lectures":[]},{"_class":"assessment","id":129582321,"assessment_type":"multiple-choice","prompt":{"question":"<p>A developer wants to securely store and retrieve various types of variables, such as remote API authentication information, API URL, and related credentials across different environments of an application deployed on Amazon Elastic Container Service (Amazon ECS).</p>\n\n<p>What would be the best approach that needs minimal modifications in the application code?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure the application to fetch the variables and credentials from AWS Systems Manager Parameter Store by leveraging hierarchical unique paths in Parameter Store for each variable in each environment</strong></p>\n\n<p>Parameter Stores is a capability of AWS Systems Manager that provides secure, hierarchical storage for configuration data management and secrets management. You can store data such as passwords, database strings, Amazon Machine Image (AMI) IDs, and license codes as parameter values. You can store values as plain text or encrypted data. You can reference Systems Manager parameters in your scripts, commands, SSM documents, and configuration and automation workflows by using the unique name that you specified when you created the parameter.</p>\n\n<p>Managing dozens or hundreds of parameters as a flat list is time-consuming and prone to errors. It can also be difficult to identify the correct parameter for a task. This means you might accidentally use the wrong parameter, or you might create multiple parameters that use the same configuration data.</p>\n\n<p>You can use parameter hierarchies to help you organize and manage parameters. A hierarchy is a parameter name that includes a path that you define by using forward slashes (/).</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q30-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure the application to fetch the variables from AWS KMS by storing the API URL and credentials as unique keys in KMS for each environment</strong> - AWS KMS lets you create, manage, and control cryptographic keys across your applications and AWS services. KMS is not a key-value service that can be used for the given use case.</p>\n\n<p><strong>Configure the application to fetch the variables from an encrypted file that is stored with the application by storing the API URL and credentials in unique files for each environment</strong> - It is not considered a security best practice to store sensitive data and credentials in an encrypted file with the application. So this option is incorrect.</p>\n\n<p><strong>Configure the application to fetch the variables from each of the deployed environments by defining the authentication information and API URL in the ECS task definition as unique names during the deployment process</strong> - ECS task definition can be thought of as a blueprint for your application. Task definitions specify various parameters for your application. Examples of task definition parameters are which containers to use, which launch type to use, which ports should be opened for your application, and what data volumes should be used with the containers in the task. The specific parameters available for the task definition depend on which launch type you are using. The task definition is a text file, in JSON format, that describes one or more containers, up to a maximum of ten, that form your application. A task is the instantiation of a task definition within a cluster. After you create a task definition for your application within Amazon ECS, you can specify the number of tasks to run on your cluster.</p>\n\n<p>AWS recommends storing your sensitive data in either AWS Secrets Manager secrets or AWS Systems Manager Parameter Store parameters. Environment variables specified in the task definition are readable by all users and roles that are allowed the DescribeTaskDefinition action for the task definition. So this option is incorrect.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q30-i3.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/taskdef-envfiles.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/taskdef-envfiles.html</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html\">https://docs.aws.amazon.com/systems-manager/latest/userguide/sysman-paramstore-hierarchies.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/kms/\">https://aws.amazon.com/kms/</a></p>\n\n<p><a href=\"https://ecsworkshop.com/introduction/ecs_basics/task_definition/\">https://ecsworkshop.com/introduction/ecs_basics/task_definition/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/taskdef-envfiles.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/taskdef-envfiles.html</a></p>\n","answers":["<p>Configure the application to fetch the variables from AWS KMS by storing the API URL and credentials as unique keys in KMS for each environment</p>","<p>Configure the application to fetch the variables and credentials from AWS Systems Manager Parameter Store by leveraging hierarchical unique paths in Parameter Store for each variable in each environment</p>","<p>Configure the application to fetch the variables from an encrypted file that is stored with the application by storing the API URL and credentials in unique files for each environment</p>","<p>Configure the application to fetch the variables from each of the deployed environments by defining the authentication information and API URL in the ECS task definition as unique names during the deployment process</p>"]},"correct_response":["b"],"section":"Security","question_plain":"A developer wants to securely store and retrieve various types of variables, such as remote API authentication information, API URL, and related credentials across different environments of an application deployed on Amazon Elastic Container Service (Amazon ECS).\n\nWhat would be the best approach that needs minimal modifications in the application code?","related_lectures":[]},{"_class":"assessment","id":129582367,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Regional Reserved Instances</p>","<p>Both Regional Reserved Instances and Zonal Reserved Instances</p>","<p>Neither Regional Reserved Instances nor Zonal Reserved Instances</p>","<p>Zonal Reserved Instances</p>"],"question":"<p>A media publishing company is using Amazon EC2 instances for running their business-critical applications. Their IT team is looking at reserving capacity apart from savings plans for the critical instances.</p>\n\n<p>As a Developer Associate, which of the following reserved instance types you would select to provide capacity reservations?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>When you purchase a Reserved Instance for a specific Availability Zone, it's referred to as a Zonal Reserved Instance. Zonal Reserved Instances provide capacity reservations as well as discounts.</p>\n\n<p><strong>Zonal Reserved Instances</strong> - A zonal Reserved Instance provides a capacity reservation in the specified Availability Zone. Capacity Reservations enable you to reserve capacity for your Amazon EC2 instances in a specific Availability Zone for any duration. This gives you the ability to create and manage Capacity Reservations independently from the billing discounts offered by Savings Plans or regional Reserved Instances.</p>\n\n<p>Regional and Zonal Reserved Instances:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q31-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html</a></p>\n\n<p>High Level Overview of EC2 Instance Purchase Options:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q31-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Regional Reserved Instances</strong> - When you purchase a Reserved Instance for a Region, it's referred to as a regional Reserved Instance. A regional Reserved Instance does not provide a capacity reservation.</p>\n\n<p><strong>Both Regional Reserved Instances and Zonal Reserved Instances</strong> - As discussed above, only Zonal Reserved Instances provide capacity reservation.</p>\n\n<p><strong>Neither Regional Reserved Instances nor Zonal Reserved Instances</strong> - As discussed above, Zonal Reserved Instances provide capacity reservation.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-scope.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"A media publishing company is using Amazon EC2 instances for running their business-critical applications. Their IT team is looking at reserving capacity apart from savings plans for the critical instances.\n\nAs a Developer Associate, which of the following reserved instance types you would select to provide capacity reservations?","related_lectures":[]},{"_class":"assessment","id":129582399,"assessment_type":"multiple-choice","prompt":{"question":"<p>Recently in your organization, the AWS X-Ray SDK was bundled into each Lambda function to record outgoing calls for tracing purposes. When your team leader goes to the X-Ray service in the AWS Management Console to get an overview of the information collected, they discover that no data is available.</p>\n\n<p>What is the most likely reason for this issue?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p>AWS X-Ray helps developers analyze and debug production, distributed applications, such as those built using a microservices architecture. With X-Ray, you can understand how your application and its underlying services are performing to identify and troubleshoot the root cause of performance issues and errors. X-Ray provides an end-to-end view of requests as they travel through your application, and shows a map of your application’s underlying components.</p>\n\n<p>How X-Ray Works:\n<img src=\"https://d1.awsstatic.com/Products/product-name/Images/product-page-diagram_AWS-X-Ray_how-it-works.2922edd4bfe011e997dbf32fdf8bd520bcbc85fb.png\">\nvia - <a href=\"https://aws.amazon.com/xray/\">https://aws.amazon.com/xray/</a></p>\n\n<p><strong>Fix the IAM Role</strong></p>\n\n<p>Create an IAM role with write permissions and assign it to the resources running your application. You can use AWS Identity and Access Management (IAM) to grant X-Ray permissions to users and compute resources in your account. This should be one of the first places you start by checking that your permissions are properly configured before exploring other troubleshooting options.</p>\n\n<p>Here is an example of X-Ray Read-Only permissions via an IAM policy:</p>\n\n<pre><code>{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n                \"xray:GetSamplingRules\",\n                \"xray:GetSamplingTargets\",\n                \"xray:GetSamplingStatisticSummaries\",\n                \"xray:BatchGetTraces\",\n                \"xray:GetServiceGraph\",\n                \"xray:GetTraceGraph\",\n                \"xray:GetTraceSummaries\",\n                \"xray:GetGroups\",\n                \"xray:GetGroup\"\n            ],\n            \"Resource\": [\n                \"*\"\n            ]\n        }\n    ]\n}\n</code></pre>\n\n<p>Another example of write permissions for using X-Ray via an IAM policy:</p>\n\n<pre><code>{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Effect\": \"Allow\",\n            \"Action\": [\n                \"xray:PutTraceSegments\",\n                \"xray:PutTelemetryRecords\",\n                \"xray:GetSamplingRules\",\n                \"xray:GetSamplingTargets\",\n                \"xray:GetSamplingStatisticSummaries\"\n            ],\n            \"Resource\": [\n                \"*\"\n            ]\n        }\n    ]\n}\n</code></pre>\n\n<p>Incorrect options:</p>\n\n<p><strong>Enable X-Ray sampling</strong> - If permissions are not configured correctly sampling will not work, so this option is not correct.</p>\n\n<p><strong>X-Ray only works with AWS Lambda aliases</strong> - This is not true, aliases are pointers to specific Lambda function versions. To use the X-Ray SDK on Lambda, bundle it with your function code each time you create a new version.</p>\n\n<p><strong>Change the security group rules</strong> - You grant permissions to your Lambda function to access other resources using an IAM role and not via security groups.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/xray/latest/devguide/security_iam_troubleshoot.html\">https://docs.aws.amazon.com/xray/latest/devguide/security_iam_troubleshoot.html</a></p>\n","answers":["<p>X-Ray only works with AWS Lambda aliases</p>","<p>Enable X-Ray sampling</p>","<p>Fix the IAM Role</p>","<p>Change the security group rules</p>"]},"correct_response":["c"],"section":"Troubleshooting and Optimization","question_plain":"Recently in your organization, the AWS X-Ray SDK was bundled into each Lambda function to record outgoing calls for tracing purposes. When your team leader goes to the X-Ray service in the AWS Management Console to get an overview of the information collected, they discover that no data is available.\n\nWhat is the most likely reason for this issue?","related_lectures":[]},{"_class":"assessment","id":129582409,"assessment_type":"multiple-choice","prompt":{"question":"<p>You are a development team lead setting permissions for other IAM users with limited permissions. On the AWS Management Console, you created a dev group where new developers will be added, and on your workstation, you configured a developer profile. You would like to test that this user cannot terminate instances.</p>\n\n<p>Which of the following options would you execute?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use the AWS CLI --dry-run option</strong>: The --dry-run option checks whether you have the required permissions for the action, without actually making the request, and provides an error response. If you have the required permissions, the error response is DryRunOperation, otherwise, it is UnauthorizedOperation.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use the AWS CLI --test option</strong> - This is a made-up option and has been added as a distractor.</p>\n\n<p><strong>Retrieve the policy using the EC2 metadata service and use the IAM policy simulator</strong> - EC2 metadata service is used to retrieve dynamic information such as instance-id, local-hostname, public-hostname. This cannot be used to check whether you have the required permissions for the action.</p>\n\n<p><strong>Using the CLI, create a dummy EC2 and delete it using another CLI call</strong> - That would not work as the current EC2 may have permissions that the dummy instance does not have. If permissions were the same it can work but it's not as elegant as using the dry-run option.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_RunInstances.html\">https://docs.aws.amazon.com/AWSEC2/latest/APIReference/API_RunInstances.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cli/latest/reference/ec2/terminate-instances.html\">https://docs.aws.amazon.com/cli/latest/reference/ec2/terminate-instances.html</a></p>\n","answers":["<p>Using the CLI, create a dummy EC2 and delete it using another CLI call</p>","<p>Use the AWS CLI --test option</p>","<p>Retrieve the policy using the EC2 metadata service and use the IAM policy simulator</p>","<p>Use the AWS CLI --dry-run option</p>"]},"correct_response":["d"],"section":"Troubleshooting and Optimization","question_plain":"You are a development team lead setting permissions for other IAM users with limited permissions. On the AWS Management Console, you created a dev group where new developers will be added, and on your workstation, you configured a developer profile. You would like to test that this user cannot terminate instances.\n\nWhich of the following options would you execute?","related_lectures":[]},{"_class":"assessment","id":129582313,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>One instance is charged at one hour of Reserved Instance usage and the other two instances are charged at two hours of On-Demand usage</p>","<p>All instances are charged at one hour of Reserved Instance usage</p>","<p>All instances are charged at one hour of On-Demand Instance usage</p>","<p>One instance is charged at one hour of On-Demand usage and the other two instances are charged at two hours of Reserved Instance usage</p>"],"question":"<p>A business has purchased one m4.xlarge Reserved Instance but it has used three m4.xlarge instances concurrently for an hour.</p>\n\n<p>As a Developer, explain how the instances are charged?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>All Reserved Instances provide you with a discount compared to On-Demand pricing.</p>\n\n<p><strong>One instance is charged at one hour of Reserved Instance usage and the other two instances are charged at two hours of On-Demand usage</strong></p>\n\n<p>A Reserved Instance billing benefit can apply to a maximum of 3600 seconds (one hour) of instance usage per clock-hour. You can run multiple instances concurrently, but can only receive the benefit of the Reserved Instance discount for a total of 3600 seconds per clock-hour; instance usage that exceeds 3600 seconds in a clock-hour is billed at the On-Demand rate.</p>\n\n<p>Please review this note on the EC2 Reserved Instance types:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q34-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-types.html</a></p>\n\n<p>High Level Overview of EC2 Instance Purchase Options:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q34-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>All instances are charged at one hour of Reserved Instance usage</strong> - This is incorrect.</p>\n\n<p><strong>All instances are charged at one hour of On-Demand Instance usage</strong> - This is incorrect.</p>\n\n<p><strong>One instance is charged at one hour of On-Demand usage and the other two instances are charged at two hours of Reserved Instance usage</strong> - This is incorrect. If multiple eligible instances are running concurrently, the Reserved Instance billing benefit is applied to all the instances at the same time up to a maximum of 3600 seconds in a clock-hour; thereafter, On-Demand rates apply.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts-reserved-instances-application.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts-reserved-instances-application.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["a"],"section":"Development with AWS Services","question_plain":"A business has purchased one m4.xlarge Reserved Instance but it has used three m4.xlarge instances concurrently for an hour.\n\nAs a Developer, explain how the instances are charged?","related_lectures":[]},{"_class":"assessment","id":129582333,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>10.6 TiB</p>","<p>5.3 TiB</p>","<p>16 TiB</p>","<p>2.7 TiB</p>"],"question":"<p>A business has their test environment built on Amazon EC2 configured on General purpose SSD volume.</p>\n\n<p>At which gp2 volume size will their test environment hit the max IOPS?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>The performance of gp2 volumes is tied to volume size, which determines the baseline performance level of the volume and how quickly it accumulates I/O credits; larger volumes have higher baseline performance levels and accumulate I/O credits faster.</p>\n\n<p><strong>5.3 TiB</strong> - General Purpose SSD (gp2) volumes offer cost-effective storage that is ideal for a broad range of workloads. These volumes deliver single-digit millisecond latencies and the ability to burst to 3,000 IOPS for extended periods of time. Between a minimum of 100 IOPS (at 33.33 GiB and below) and a maximum of 16,000 IOPS (at 5,334 GiB and above), baseline performance scales linearly at 3 IOPS per GiB of volume size.</p>\n\n<p>Maximum IOPS vs Volume Size for General Purpose SSD (gp2) volumes:\n<img src=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/images/gp2_iops_1.png\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>10.6 TiB</strong> - As explained above, this is an incorrect option.</p>\n\n<p><strong>16 TiB</strong> - As explained above, this is an incorrect option.</p>\n\n<p><strong>2.7 TiB</strong> - As explained above, this is an incorrect option.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["b"],"section":"Development with AWS Services","question_plain":"A business has their test environment built on Amazon EC2 configured on General purpose SSD volume.\n\nAt which gp2 volume size will their test environment hit the max IOPS?","related_lectures":[]},{"_class":"assessment","id":129582353,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answer
