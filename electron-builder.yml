appId: com.ismalearn.app
productName: IGLAcademy
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # Signing and exe metadata (rcedit) need the winCodeSign tools, which can't
  # be extracted without Windows symlink privileges (admin or Developer Mode).
  # Local builds skip them and brand the exe afterwards (scripts/brand-exe.mjs).
  # The release workflow turns this on (CI runners have the privileges) and
  # signs when a certificate is configured; see README "Releasing".
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: IGLAcademy
  uninstallDisplayName: IGLAcademy
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  # No spaces: the name is used as-is in latest.yml and as the GitHub asset name.
  artifactName: ${productName}-Setup-${version}.${ext}
# Where installed copies look for updates (written into the app as
# app-update.yml). Releases are uploaded by .github/workflows/release.yml.
publish:
  provider: github
  owner: IsmailMechkene
  repo: IGLAcademy
  releaseType: release
