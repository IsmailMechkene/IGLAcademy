<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz</title>
    <style>
      * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu,
          Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-size: 16px;
      }

      main {
        padding-top: 48px;
      }

      :root {
        --large-device-width: 850px;
        --primary-color: #0f172a;
        --secondary-color: #020617;
        --primary-text-color: #c7d1dd;
        --secondary-text-color: #061602;
        --success-background: hsl(159, 82%, 24%);
        --success-foreground: hsl(164, 86%, 16%);
        --success: hsl(160, 84%, 39%);
        --danger: #ef4444;
        --warning: #f59e0b;
        --info-background: hsl(218, 81%, 8%);
        --info-foreground: hsl(217, 91%, 85%);
        --border-color: #d1d7dc;
        --check-box-size: 20px;
        /* control the size */
        --check-box-color: var(--info-foreground);
        /* the active color */
      }

      body {
        position: relative;
        background-color: #020617;
        color: var(--primary-text-color);
      }

      #score-stats-container {
        position: fixed;
        z-index: 10;
        top: 0;
        height: 40px;
        width: 100%;
        background-color: var(--info-background);

        padding: 0px 16px;
        color: var(--info-foreground);
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      #quiz-container {
        border-radius: 8px;
        display: flex;
        gap: 16px;
        flex-direction: column;
      }

      input[type='radio'] {
        height: var(--check-box-size);
        aspect-ratio: 1;
        border: calc(var(--check-box-size) / 8) solid #939393;
        padding: calc(var(--check-box-size) / 8);
        background: radial-gradient(farthest-side, var(--check-box-color) 94%, #0000) 50%/0 0 no-repeat
          content-box;
        border-radius: 50%;
        outline-offset: calc(var(--check-box-size) / 10);
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        cursor: pointer;
        font-size: inherit;
        transition: 0.3s;
      }

      input[type='radio']:checked {
        border-color: var(--check-box-color);
        background-size: 100% 100%;
      }

      input[type='radio']:disabled {
        background: linear-gradient(#939393 0 0) 50%/100% 20% no-repeat content-box;
        opacity: 0.5;
        cursor: not-allowed;
      }

      label {
        /* display: inline-flex; */
        align-items: center;
        gap: 10px;
        cursor: pointer;
        padding: 4px 6px;
        border-radius: 4px;
      }

      @media (max-width: 767px) {
        input[type='radio'],
        label {
          cursor: default;
        }

        #quiz-container {
          margin-left: 8px;
          margin-right: 8px;
        }
      }

      /* PC (Desktop devices) */
      @media (min-width: 768px) {
        body {
          display: flex;
          justify-content: center;
        }

        main {
          max-width: var(--large-device-width);
        }

        #score-stats-container {
          max-width: var(--large-device-width);
        }

        dialog {
          max-width: var(--large-device-width);
        }
      }

      @media print {
        input[type='radio'] {
          background: none !important;
          border-color: #939393 !important;
        }

        input[type='radio']:checked {
          border-color: #939393 !important;
        }
      }

      .question-lable {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      button {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        outline: none;
        position: relative;
        overflow: hidden;
        cursor: pointer;
      }

      .button {
        background-color: var(--success-background);
        border: none;
        color: #f4f5f7;
        opacity: 0.8;
        font-size: 18px;
        flex-grow: 1;
        padding: 8px 16px;
        border-radius: 8px;
      }

      .button:hover {
        opacity: 1;
      }

      .explanation-btn {
        border: none;
        color: var(--success);
        background-color: transparent;
      }

      #submit-button:active::after {
        background-color: #ef4444;
      }

      .single-question-container {
        background-color: var(--primary-color);
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px;
        border-radius: 8px;
      }

      #modal-content {
        padding: 16px;
        line-height: 24px;
      }

      dialog::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }

      dialog {
        position: fixed;
        border: 1px solid var(--border-color);
        background-color: var(--primary-color);
        color: rgb(240, 241, 248);
        padding: 16px;
        border-radius: 8px;
        width: 80vw;
        max-height: 80vh;
        overflow: auto;
        top: 50%;
        left: 50%;
        -webkit-transform: translateX(-50%) translateY(-50%);
        -moz-transform: translateX(-50%) translateY(-50%);
        -ms-transform: translateX(-50%) translateY(-50%);
        transform: translateX(-50%) translateY(-50%);
      }

      #close-modal-btn {
        position: absolute;
        top: 4px;
        right: 4px;
        padding: 2px 8px;
        border-radius: 2px;
        border: none;
        background-color: var(--danger);
      }

      .correct-answer label {
        border: 2px solid var(--success);
        width: 100%;
      }

      .incorrect-answer label {
        border: 2px solid var(--danger);
        width: 100%;
      }

      .options-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      #quiz-meta-container {
        border-radius: 8px;
        background-color: var(--primary-color);
        margin-bottom: 12px;
        padding: 8px;
      }

      #quiz-title {
        text-align: center;
        font-size: 24px;
        margin-bottom: 8px;
      }

      #quiz-description {
        line-height: 1.5;
        padding: 2px 6px;
      }
      img {
        width: 100%;
      }
      input.blank {
        border: 1px solid #333;
        padding: 5px;
        width: 150px;
      }
    </style>
  </head>

  <body onload="main()">
    <main>
      <section id="quiz-meta-container">
        <h1 id="quiz-title"></h1>
        <p id="quiz-description"></p>
      </section>
      <section id="score-stats-container">
        <div id="score-card">
          Score: <span id="current-score">999</span> of
          <span id="pass-percent">999%</span>
        </div>
        <div>Correct: <span id="correct-answers">999</span></div>
        <div>Incorrect: <span id="wrong-answers">999</span></div>
      </section>

      <section id="quiz-container"></section>

      <dialog id="modal" class="modal-container">
        <div id="modal-content">
          <p id="modal-text"></p>
        </div>
      </dialog>
    </main>

    <script>
      const quizData = {"quiz_id":5077342,"quiz_title":"Practice Test #5 - AWS Certified Solutions Architect Associate","questions":[{"_class":"assessment","id":156638801,"assessment_type":"multiple-choice","prompt":{"question":"<p>A streaming solutions company is building a video streaming product by using an Application Load Balancer (ALB) that routes the requests to the underlying Amazon EC2 instances. The engineering team has noticed a peculiar pattern. The Application Load Balancer removes an instance from its pool of healthy instances whenever it is detected as unhealthy but the Auto Scaling group fails to kick-in and provision the replacement instance.</p>\n\n<p>What could explain this anomaly?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>The Auto Scaling group is using Amazon EC2 based health check and the Application Load Balancer is using ALB based health check</strong></p>\n\n<p>An Auto Scaling group contains a collection of Amazon EC2 instances that are treated as a logical grouping for automatic scaling and management.</p>\n\n<p>Auto Scaling Group Overview:\n<img src=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/images/as-basic-diagram.png\">\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p>Application Load Balancer automatically distributes incoming application traffic across multiple targets, such as Amazon EC2 instances, containers, and AWS Lambda functions. It can handle the varying load of your application traffic in a single Availability Zone or across multiple Availability Zones.</p>\n\n<p>If the Auto Scaling group (ASG) is using EC2 as the health check type and the Application Load Balancer (ALB) is using its in-built health check, there may be a situation where the ALB health check fails because the health check pings fail to receive a response from the instance. At the same time, ASG health check can come back as successful because it is based on EC2 based health check.\nTherefore, in this scenario, the ALB will remove the instance from its inventory, however, the Auto Scaling Group will fail to provide the replacement instance. This can lead to the scaling issues mentioned in the problem statement.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The Auto Scaling group is using ALB based health check and the Application Load Balancer is using Amazon EC2 based health check</strong> - Application Load Balancer cannot use EC2 based health checks, so this option is incorrect.</p>\n\n<p><strong>Both the Auto Scaling group and Application Load Balancer are using ALB based health check</strong> - It is recommended to use ALB based health checks for both Auto Scaling group and Application Load Balancer. If both the Auto Scaling group and Application Load Balancer use ALB based health checks, then you will be able to avoid the scenario mentioned in the question.</p>\n\n<p><strong>Both the Auto Scaling group and Application Load Balancer are using Amazon EC2 based health check</strong> - Application Load Balancer cannot use EC2 based health checks, so this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-health-checks.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-checks-overview.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/health-checks-overview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-elb-healthcheck.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-add-elb-healthcheck.html</a></p>\n","answers":["<p>The Auto Scaling group is using Amazon EC2 based health check and the Application Load Balancer is using ALB based health check</p>","<p>The Auto Scaling group is using ALB based health check and the Application Load Balancer is using Amazon EC2 based health check</p>","<p>Both the Auto Scaling group and Application Load Balancer are using ALB based health check</p>","<p>Both the Auto Scaling group and Application Load Balancer are using Amazon EC2 based health check</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A streaming solutions company is building a video streaming product by using an Application Load Balancer (ALB) that routes the requests to the underlying Amazon EC2 instances. The engineering team has noticed a peculiar pattern. The Application Load Balancer removes an instance from its pool of healthy instances whenever it is detected as unhealthy but the Auto Scaling group fails to kick-in and provision the replacement instance.\n\nWhat could explain this anomaly?","related_lectures":[]},{"_class":"assessment","id":156638775,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail company maintains an AWS Direct Connect connection to AWS and has recently migrated its data warehouse to AWS. The data analysts at the company query the data warehouse using a visualization tool. The average size of a query returned by the data warehouse is 60 megabytes and the query responses returned by the data warehouse are not cached in the visualization tool. Each webpage returned by the visualization tool is approximately 600 kilobytes.</p>\n\n<p>Which of the following options offers the LOWEST data transfer egress cost for the company?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over a Direct Connect connection at a location in the same region</strong></p>\n\n<p>AWS Direct Connect is a networking service that provides an alternative to using the internet to connect to AWS. Using AWS Direct Connect, data that would have previously been transported over the internet is delivered through a private network connection between your on-premises data center and AWS.</p>\n\n<p>For the given use case, the main pricing parameter while using the AWS Direct Connect connection is the Data Transfer Out (DTO) from AWS to the on-premises data center. DTO refers to the cumulative network traffic that is sent through AWS Direct Connect to destinations outside of AWS. This is charged per gigabyte (GB), and unlike capacity measurements, DTO refers to the amount of data transferred, not the speed.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q2-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/directconnect/pricing/\">https://aws.amazon.com/directconnect/pricing/</a></p>\n\n<p>Each query response is 60 megabytes in size and each webpage for the visualization tool is 600 kilobytes in size. If you deploy the visualization tool in the same AWS region as the data warehouse, then you only need to pay for the 600 kilobytes of DTO charges for the webpage. Therefore this option is correct.</p>\n\n<p>However, if you deploy the visualization tool on-premises, then you need to pay for the 60 MB of DTO charges for the query response from the data warehouse to the visualization tool.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over the internet at a location in the same region</strong></p>\n\n<p><strong>Deploy the visualization tool on-premises. Query the data warehouse over the internet at a location in the same AWS region</strong></p>\n\n<p>Data transfer pricing over AWS Direct Connect is lower than data transfer pricing over the internet, so both of these options are incorrect.</p>\n\n<p><strong>Deploy the visualization tool on-premises. Query the data warehouse directly over an AWS Direct Connect connection at a location in the same AWS region</strong> - As mentioned in the explanation above, if you deploy the visualization tool on-premises, then you need to pay for the 60 megabytes of DTO charges for the query response from the data warehouse to the visualization tool. So this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/directconnect/pricing/\">https://aws.amazon.com/directconnect/pricing/</a></p>\n\n<p><a href=\"https://aws.amazon.com/getting-started/hands-on/connect-data-center-to-aws/services-costs/\">https://aws.amazon.com/getting-started/hands-on/connect-data-center-to-aws/services-costs/</a></p>\n\n<p><a href=\"https://aws.amazon.com/directconnect/faqs/\">https://aws.amazon.com/directconnect/faqs/</a></p>\n","answers":["<p>Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over the internet at a location in the same region</p>","<p>Deploy the visualization tool on-premises. Query the data warehouse directly over an AWS Direct Connect connection at a location in the same AWS region</p>","<p>Deploy the visualization tool in the same AWS region as the data warehouse. Access the visualization tool over a Direct Connect connection at a location in the same region</p>","<p>Deploy the visualization tool on-premises. Query the data warehouse over the internet at a location in the same AWS region</p>"]},"correct_response":["c"],"section":"Design Cost-Optimized Architectures","question_plain":"A retail company maintains an AWS Direct Connect connection to AWS and has recently migrated its data warehouse to AWS. The data analysts at the company query the data warehouse using a visualization tool. The average size of a query returned by the data warehouse is 60 megabytes and the query responses returned by the data warehouse are not cached in the visualization tool. Each webpage returned by the visualization tool is approximately 600 kilobytes.\n\nWhich of the following options offers the LOWEST data transfer egress cost for the company?","related_lectures":[]},{"_class":"assessment","id":156638777,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at an e-commerce company uses an AWS Lambda function to write the order data into a single DB instance Amazon Aurora cluster. The team has noticed that many order- writes to its Aurora cluster are getting missed during peak load times. The diagnostics data has revealed that the database is experiencing high CPU and memory consumption during traffic spikes. The team also wants to enhance the availability of the Aurora DB.</p>\n\n<p>Which of the following steps would you combine to address the given scenario? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Handle all read operations for your application by connecting to the reader endpoint of the Amazon Aurora cluster so that Aurora can spread the load for read-only connections across the Aurora replica</strong></p>\n\n<p>When you create a second, third, and so on DB instance in an Aurora-provisioned DB cluster, Aurora automatically sets up replication from the writer DB instance to all the other DB instances. These other DB instances are read-only and are known as Aurora Replicas.</p>\n\n<p>Aurora Replicas have two main purposes. You can issue queries to them to scale the read operations for your application. You typically do so by connecting to the reader endpoint of the cluster. That way, Aurora can spread the load for read-only connections across as many Aurora Replicas as you have in the cluster. Aurora Replicas also help to increase availability. If the writer instance in a cluster becomes unavailable, Aurora automatically promotes one of the reader instances to take its place as the new writer.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q3-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html</a></p>\n\n<p><strong>Create a replica Aurora instance in another Availability Zone to improve the availability as the replica can serve as a failover target</strong></p>\n\n<p>If the primary instance in a DB cluster using single-master replication fails, Aurora automatically fails over to a new primary instance in one of two ways:</p>\n\n<p>By promoting an existing Aurora Replica to the new primary instance\nBy creating a new primary instance</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q3-i3.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a standby Aurora instance in another Availability Zone to improve the availability as the standby can serve as a failover target</strong> - There are no standby instances in Aurora. Aurora performs an automatic failover to a read replica when a problem is detected. So this option is incorrect.</p>\n\n<p>Read replicas, Multi-AZ deployments, and multi-region deployments:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q3-i4.jpg\">\nvia - <a href=\"https://aws.amazon.com/rds/features/read-replicas/\">https://aws.amazon.com/rds/features/read-replicas/</a></p>\n\n<p><strong>Increase the concurrency of the AWS Lambda function so that the order-writes do not get missed during traffic spikes</strong> - Increasing the concurrency of the AWS Lambda function would not resolve the issue since the bottleneck is at the database layer, as exhibited by the high CPU and memory consumption for the Aurora instance. This option has been added as a distractor.</p>\n\n<p><strong>Use Amazon EC2 instances behind an Application Load Balancer to write the order data into Amazon Aurora cluster</strong> - Using Amazon EC2 instances behind an Application Load Balancer would not resolve the issue since the bottleneck is at the database layer, as exhibited by the high CPU and memory consumption for the Aurora instance. This option has been added as a distractor.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Concepts.AuroraHighAvailability.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/read-replicas/\">https://aws.amazon.com/rds/features/read-replicas/</a></p>\n","answers":["<p>Increase the concurrency of the AWS Lambda function so that the order-writes do not get missed during traffic spikes</p>","<p>Handle all read operations for your application by connecting to the reader endpoint of the Amazon Aurora cluster so that Aurora can spread the load for read-only connections across the Aurora replica</p>","<p>Create a standby Aurora instance in another Availability Zone to improve the availability as the standby can serve as a failover target</p>","<p>Create a replica Aurora instance in another Availability Zone to improve the availability as the replica can serve as a failover target</p>","<p>Use Amazon EC2 instances behind an Application Load Balancer to write the order data into Amazon Aurora cluster</p>"]},"correct_response":["b","d"],"section":"Design Resilient Architectures","question_plain":"The engineering team at an e-commerce company uses an AWS Lambda function to write the order data into a single DB instance Amazon Aurora cluster. The team has noticed that many order- writes to its Aurora cluster are getting missed during peak load times. The diagnostics data has revealed that the database is experiencing high CPU and memory consumption during traffic spikes. The team also wants to enhance the availability of the Aurora DB.\n\nWhich of the following steps would you combine to address the given scenario? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638779,"assessment_type":"multi-select","prompt":{"question":"<p>A global enterprise is modernizing its hybrid IT infrastructure to improve both availability and network performance. The company operates a TCP-based application hosted on Amazon EC2 instances that are deployed across multiple AWS Regions, while a secondary UDP-based component of the application is hosted in its on-premises data centers. These application components must be accessed by customers around the world with minimal latency and consistent uptime.</p>\n\n<p>Which combination of options should a solutions architect implement for the given use case? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Configure an AWS Global Accelerator standard accelerator, and register the TCP-based EC2 workloads behind the load balancers</strong></p>\n\n<p>AWS Global Accelerator supports improving the availability and performance of global applications with TCP-based traffic. It routes users to the closest healthy endpoint in multiple Regions via the AWS global network and supports automatic failover. Registering load balancers as endpoints ensures that the TCP workload hosted on EC2 instances benefits from low-latency access and high availability.</p>\n\n<p><strong>Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure NLBs in each Region to route to the on-premises endpoints via IP-based target groups</strong></p>\n\n<p>Network Load Balancers support both TCP and UDP traffic. By creating NLBs in each Region, the architecture allows load balancing for EC2 workloads and can forward UDP traffic to IP-based targets in on-premises networks. This setup ensures that both stateful TCP and stateless UDP workloads are accessible and scalable from AWS.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q4-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html</a></p>\n\n<p>Incorrect Options:</p>\n\n<p><strong>Set up AWS Direct Connect connections to route all TCP and UDP traffic through a single Region, using static routes and BGP failover</strong> - AWS Direct Connect enhances dedicated network performance between AWS and on-premises infrastructure but does not inherently provide intelligent global routing, failover, or multi-region resilience. It is not optimal for distributing traffic across Regions or managing global availability.</p>\n\n<p><strong>Deploy AWS PrivateLink to connect each on-premises UDP workload to the AWS Regions through interface endpoints exposed by the Network Load Balancers</strong> - AWS PrivateLink enables secure connectivity to AWS services via VPC endpoints but supports only TCP-based traffic. It cannot be used to route or expose UDP-based services, making it unsuitable for the on-premises UDP workload.</p>\n\n<p><strong>Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure Application Load Balancers in each Region to route to the on-premises endpoints via IP-based target groups</strong> - While the first part of the option is valid — using NLBs to handle EC2-based TCP traffic is appropriate because NLBs support TCP connections and can scale efficiently across Regions. The second part of the option is flawed. The issue lies in attempting to use Application Load Balancers (ALBs) for UDP-based traffic. ALBs only support HTTP/HTTPS (Layer 7) and WebSocket protocols. They do not support Layer 4 protocols such as TCP or UDP.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q4-i3.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n","answers":["<p>Configure an AWS Global Accelerator standard accelerator, and register the TCP-based EC2 workloads behind the load balancers</p>","<p>Set up AWS Direct Connect connections to route all TCP and UDP traffic through a single Region, using static routes and BGP failover</p>","<p>Deploy AWS PrivateLink to connect each on-premises UDP workload to the AWS Regions through interface endpoints exposed by the Network Load Balancers</p>","<p>Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure NLBs in each Region to route to the on-premises endpoints via IP-based target groups</p>","<p>Create a Network Load Balancer (NLB) in each Region to handle the EC2-based TCP traffic. For the UDP-based on-premises workload, configure Application Load Balancers in each Region to route to the on-premises endpoints via IP-based target groups</p>"]},"correct_response":["a","d"],"section":"Design High-Performing Architectures","question_plain":"A global enterprise is modernizing its hybrid IT infrastructure to improve both availability and network performance. The company operates a TCP-based application hosted on Amazon EC2 instances that are deployed across multiple AWS Regions, while a secondary UDP-based component of the application is hosted in its on-premises data centers. These application components must be accessed by customers around the world with minimal latency and consistent uptime.\n\nWhich combination of options should a solutions architect implement for the given use case? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638781,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media company wants to get out of the business of owning and maintaining its own IT infrastructure. As part of this digital transformation, the media company wants to archive about 5 petabytes of data in its on-premises data center to durable long term storage.</p>\n\n<p>As a solutions architect, what is your recommendation to migrate this data in the MOST cost-optimal way?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 and create a lifecycle policy to transition the data into Amazon S3 Glacier</strong></p>\n\n<p>AWS Snowball Edge Storage Optimized is the optimal choice if you need to securely and quickly transfer dozens of terabytes to petabytes of data to AWS. It provides up to 80 TB of usable HDD storage, 40 vCPUs, 1 TB of SATA SSD storage, and up to 40 Gb network connectivity to address large scale data transfer and pre-processing use cases.\nThe data stored on AWS Snowball Edge device can be copied into Amazon S3 bucket and later transitioned into Amazon S3 Glacier via a lifecycle policy. You can't directly copy data from AWS Snowball Edge devices into Amazon S3 Glacier.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 Glacier</strong> - As mentioned earlier, you can't directly copy data from AWS Snowball Edge devices into Amazon S3 Glacier. Hence, this option is incorrect.</p>\n\n<p><strong>Setup AWS direct connect between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier</strong> - AWS Direct Connect lets you establish a dedicated network connection between your network and one of the AWS Direct Connect locations. Using industry-standard 802.1q VLANs, this dedicated connection can be partitioned into multiple virtual interfaces. Direct Connect involves significant monetary investment and takes more than a month to set up, therefore it's not the correct fit for this use-case where just a one-time data transfer has to be done.</p>\n\n<p><strong>Setup AWS Site-to-Site VPN connection between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier</strong> - AWS Site-to-Site VPN enables you to securely connect your on-premises network or branch office site to your Amazon Virtual Private Cloud (Amazon VPC). VPN Connections are a good solution if you have an immediate need, and have low to modest bandwidth requirements. Because of the high data volume for the given use-case, Site-to-Site VPN is not the correct choice.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/snowball/\">https://aws.amazon.com/snowball/</a></p>\n","answers":["<p>Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 Glacier</p>","<p>Setup AWS direct connect between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier</p>","<p>Setup AWS Site-to-Site VPN connection between the on-premises data center and AWS Cloud. Use this connection to transfer the data into Amazon S3 Glacier</p>","<p>Transfer the on-premises data into multiple AWS Snowball Edge Storage Optimized devices. Copy the AWS Snowball Edge data into Amazon S3 and create a lifecycle policy to transition the data into Amazon S3 Glacier</p>"]},"correct_response":["d"],"section":"Design Cost-Optimized Architectures","question_plain":"A media company wants to get out of the business of owning and maintaining its own IT infrastructure. As part of this digital transformation, the media company wants to archive about 5 petabytes of data in its on-premises data center to durable long term storage.\n\nAs a solutions architect, what is your recommendation to migrate this data in the MOST cost-optimal way?","related_lectures":[]},{"_class":"assessment","id":156638783,"assessment_type":"multiple-choice","prompt":{"question":"<p>A fintech company currently operates a real-time search and analytics platform on-premises. This platform ingests streaming data from multiple data-producing systems and provides immediate search capabilities and interactive visualizations for end users. As part of its cloud migration strategy, the company wants to rearchitect the solution using AWS-native services.</p>\n\n<p>Which of the following represents the most efficient solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Ingest and process the streaming data using Amazon Kinesis Data Streams, then index the data with Amazon OpenSearch Service for real-time search capabilities. Use Amazon QuickSight to build interactive dashboards and visualizations based on the indexed data</strong></p>\n\n<p>This solution leverages Amazon Kinesis Data Streams for high-throughput, low-latency stream ingestion, and Amazon OpenSearch Service for full-text indexing and real-time search. OpenSearch is purpose-built for search and analytics workloads. For visualization, Amazon QuickSight can be connected to OpenSearch or other data sources to build rich dashboards. This architecture provides a scalable, fully managed, real-time search and analytics platform using AWS-native services.</p>\n\n<p><img src=\"https://docs.aws.amazon.com/images/opensearch-service/latest/developerguide/images/whatis.png\">\nvia - <a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html\">https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy Amazon EC2 instances to handle the ingestion and processing of streaming data, storing the results in Amazon S3. Utilize Amazon Athena to search the stored data, and use Amazon Managed Grafana to generate dashboards and visual insights</strong> - While this solution uses serverless analytics via Amazon Athena and integrates with visualization tools like Amazon Managed Grafana, the use of Amazon EC2 to ingest and process real-time streaming data adds unnecessary operational overhead. Additionally, Athena is optimized for querying data on Amazon S3 rather than low-latency, real-time search requirements. So, this architecture lacks the responsiveness and indexing performance needed for real-time search applications.</p>\n\n<p><strong>Use AWS Glue streaming ETL to process data streams and load the data into Amazon Redshift. Use Amazon Redshift’s full-text search capabilities for querying. Use Amazon QuickSight for data visualizations</strong> - Although AWS Glue streaming ETL can handle data ingestion and Redshift supports powerful analytics, Redshift is primarily a data warehouse and not optimized for low-latency, full-text search. Redshift’s search capabilities are limited compared to dedicated search engines like OpenSearch. Furthermore, the combination of Glue and Redshift adds complexity and may introduce latency for real-time applications.</p>\n\n<p><strong>Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate to ingest the data into Amazon DynamoDB to facilitate full text search. Use Amazon CloudWatch to create dashboards and query the data</strong> - DynamoDB is a NoSQL database optimized for key-value access, not full-text search. Additionally, Amazon CloudWatch is designed for infrastructure and application monitoring, not advanced search or visualization of dynamic user data. This setup lacks the native indexing and real-time query capabilities required for a robust search experience.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/streams/latest/dev/introduction.html\">https://docs.aws.amazon.com/streams/latest/dev/introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html\">https://docs.aws.amazon.com/opensearch-service/latest/developerguide/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/quicksight/latest/user/welcome.html\">https://docs.aws.amazon.com/quicksight/latest/user/welcome.html</a></p>\n","answers":["<p>Deploy Amazon EC2 instances to handle the ingestion and processing of streaming data, storing the results in Amazon S3. Utilize Amazon Athena to search the stored data, and use Amazon Managed Grafana to generate dashboards and visual insights</p>","<p>Ingest and process the streaming data using Amazon Kinesis Data Streams, then index the data with Amazon OpenSearch Service for real-time search capabilities. Use Amazon QuickSight to build interactive dashboards and visualizations based on the indexed data</p>","<p>Use AWS Glue streaming ETL to process data streams and load the data into Amazon Redshift. Use Amazon Redshift’s full-text search capabilities for querying. Use Amazon QuickSight for data visualizations</p>","<p>Use Amazon Elastic Container Service (Amazon ECS) with AWS Fargate to ingest the data into Amazon DynamoDB to facilitate full text search. Use Amazon CloudWatch to create dashboards and query the data</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A fintech company currently operates a real-time search and analytics platform on-premises. This platform ingests streaming data from multiple data-producing systems and provides immediate search capabilities and interactive visualizations for end users. As part of its cloud migration strategy, the company wants to rearchitect the solution using AWS-native services.\n\nWhich of the following represents the most efficient solution?","related_lectures":[]},{"_class":"assessment","id":156638785,"assessment_type":"multi-select","prompt":{"question":"<p>An enterprise SaaS provider is currently operating a legacy web application hosted on a single Amazon EC2 instance within a public subnet. The same instance also hosts a MySQL database. DNS records for the application are configured through Amazon Route 53. As part of a modernization initiative, the company wants to rearchitect this application for high availability and scalability. In addition, the company wants to improve read performance on the database layer to handle increasing user traffic.</p>\n\n<p>Which combination of solutions will meet these requirements? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones within a single Region. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly</strong></p>\n\n<p>This option enhances scalability and high availability of the web application. Deploying EC2 instances across multiple Availability Zones ensures that the application remains available even if one Availability Zone experiences an outage. The Application Load Balancer (ALB) evenly distributes incoming web traffic across all healthy instances in the target group, improving performance and fault tolerance. The Auto Scaling group automatically adjusts the number of EC2 instances in response to changing traffic, reducing operational burden and costs while ensuring optimal performance.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q7-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p><strong>Migrate the existing MySQL database to an Amazon Aurora MySQL cluster. Deploy the primary DB instance and one or more read replicas in different Availability Zones</strong></p>\n\n<p>This option addresses the need to reduce read latency and improve database availability. Amazon Aurora is a fully managed, MySQL-compatible relational database engine designed for high performance and availability. By deploying a writer (primary) instance and at least one reader instance in different Availability Zones, the application can offload read-heavy workloads to the reader instance, improving throughput and reducing response times. Aurora’s automatic failover capabilities also help ensure continued operation in the event of a failure of the primary instance. Aurora further supports features like replication, automatic backups, and storage autoscaling, reducing operational overhead.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy an additional EC2 instance in a different AWS Region, and configure Amazon Route 53 with a failover routing policy to direct traffic to the secondary instance during primary Region outages</strong> - This setup lacks auto scaling capabilities. If traffic spikes in either Region, the architecture would require manual intervention or additional setup to scale.\nNo Application Load Balancer (ALB) or Auto Scaling group is used in this option — which are best practices for horizontally scaling stateless workloads.</p>\n\n<p><strong>Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones in two AWS Regions. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly</strong> - An Application Load Balancer operates only within a single AWS Region and can route traffic to targets in multiple Availability Zones within that Region, but not across Regions. So, this option is incorrect.</p>\n\n<p><strong>Use Amazon CloudFront with Lambda@Edge to serve dynamic content from EC2 instances located in different Regions</strong> - CloudFront is ideal for caching static content, but it’s not designed for dynamic database-driven applications hosted on EC2. Using Lambda@Edge for a database-backed application introduces architectural mismatches and increases complexity.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/CHAP_AuroraOverview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.Replication.html</a></p>\n","answers":["<p>Deploy an additional EC2 instance in a different AWS Region, and configure Amazon Route 53 with a failover routing policy to direct traffic to the secondary instance during primary Region outages</p>","<p>Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones within a single Region. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly</p>","<p>Migrate the existing MySQL database to an Amazon Aurora MySQL cluster. Deploy the primary DB instance and one or more read replicas in different Availability Zones</p>","<p>Use an Auto Scaling group to deploy EC2 instances across multiple Availability Zones in two AWS Regions. Register the instances in a target group behind an Application Load Balancer to distribute web traffic evenly</p>","<p>Use Amazon CloudFront with Lambda@Edge to serve dynamic content from EC2 instances located in different Regions</p>"]},"correct_response":["b","c"],"section":"Design Resilient Architectures","question_plain":"An enterprise SaaS provider is currently operating a legacy web application hosted on a single Amazon EC2 instance within a public subnet. The same instance also hosts a MySQL database. DNS records for the application are configured through Amazon Route 53. As part of a modernization initiative, the company wants to rearchitect this application for high availability and scalability. In addition, the company wants to improve read performance on the database layer to handle increasing user traffic.\n\nWhich combination of solutions will meet these requirements? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638787,"assessment_type":"multiple-choice","prompt":{"question":"<p>An enterprise runs a critical Oracle database workload in its on-premises environment. The company now plans to replicate both existing records and continuous transactional changes to a managed Oracle environment in AWS. The target database will run on Amazon RDS for Oracle. Data transfer volume is expected to fluctuate throughout the day, and the team wants the solution to provision compute resources automatically based on actual workload requirements.</p>\n\n<p>Which solution will meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Configure an AWS DMS Serverless replication task to synchronize historical and ongoing changes between the on-premises Oracle database and Amazon RDS for Oracle</strong></p>\n\n<p>AWS DMS Serverless is designed specifically for scenarios like this — where data replication workloads vary and automation is required. AWS DMS Serverless automatically provisions and scales compute resources based on workload demand. It supports ongoing replication, including change data capture (CDC), and is fully managed, reducing operational complexity. This solution avoids the need to guess capacity requirements or manually adjust instance sizes.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q8-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Serverless.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Serverless.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Glue to extract data from the on-premises Oracle database and write the output to Amazon RDS for Oracle. Configure Glue to run on demand when changes are detected</strong> - AWS Glue is an ETL service, not designed for real-time or change data capture (CDC) replication from transactional databases. It works well for batch processing and data transformation pipelines, but not for continuously syncing ongoing changes from an Oracle source. Using it in this context would lead to inconsistent data and increased latency.</p>\n\n<p><strong>Deploy the AWS DMS replication instance on Amazon EC2. Configure the instance with custom scripts that monitor CPU usage and resize the instance using EC2 Auto Scaling policies.</strong> - Deploying DMS on EC2 and building custom Auto Scaling logic introduces unnecessary operational burden. EC2 Auto Scaling is not natively integrated with DMS replication tasks and cannot scale based on replication task load. This approach defeats the goal of minimizing management and may introduce performance instability due to lag in scaling triggers.</p>\n\n<p><strong>Use AWS Lambda to capture change data from the on-premises Oracle database. Trigger Lambda functions to write the updates to Amazon RDS for Oracle in real time.</strong> - AWS Lambda is not designed to process high-volume, stateful, transactional replication workloads from an Oracle database. Oracle does not natively trigger Lambda functions, and capturing CDC via Lambda would require complex, non-scalable workarounds. This option also lacks support for maintaining transactional consistency.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Serverless.html\">https://docs.aws.amazon.com/dms/latest/userguide/CHAP_Serverless.html</a></p>\n","answers":["<p>Use AWS Glue to extract data from the on-premises Oracle database and write the output to Amazon RDS for Oracle. Configure Glue to run on demand when changes are detected</p>","<p>Deploy the AWS DMS replication instance on Amazon EC2. Configure the instance with custom scripts that monitor CPU usage and resize the instance using EC2 Auto Scaling policies.</p>","<p>Configure an AWS DMS Serverless replication task to synchronize historical and ongoing changes between the on-premises Oracle database and Amazon RDS for Oracle</p>","<p>Use AWS Lambda to capture change data from the on-premises Oracle database. Trigger Lambda functions to write the updates to Amazon RDS for Oracle in real time.</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"An enterprise runs a critical Oracle database workload in its on-premises environment. The company now plans to replicate both existing records and continuous transactional changes to a managed Oracle environment in AWS. The target database will run on Amazon RDS for Oracle. Data transfer volume is expected to fluctuate throughout the day, and the team wants the solution to provision compute resources automatically based on actual workload requirements.\n\nWhich solution will meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638789,"assessment_type":"multiple-choice","prompt":{"question":"<p>A tech company runs a web application that includes multiple internal services deployed across Amazon EC2 instances within a VPC. These services require communication with a third-party SaaS provider's API for analytics and billing, which is also hosted on the AWS infrastructure. The company is concerned about minimizing public internet exposure while maintaining secure and reliable connectivity. The solution must ensure private access without allowing unsolicited incoming traffic from the SaaS provider.</p>\n\n<p>Which solution will best meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS PrivateLink to create a private endpoint within the application’s VPC that connects securely to the SaaS provider’s VPC</strong></p>\n\n<p>AWS PrivateLink is a fully managed service that enables private connectivity between Virtual Private Clouds (VPCs), AWS services, and supported third-party SaaS applications over the AWS network, without exposing traffic to the public internet. In this case, the internal service components of the application can securely access the third-party SaaS APIs by creating an interface VPC endpoint for the SaaS provider's service.</p>\n\n<p>This endpoint appears as an elastic network interface (ENI) in the application’s VPC, allowing internal services to communicate with the SaaS API using private IP addresses. Importantly, the traffic never leaves the Amazon network, which significantly reduces the risk of data exposure or interception. Additionally, the SaaS provider cannot initiate connections to the application’s services because PrivateLink is inherently unidirectional from the service consumer (the company's VPC) to the service provider (the SaaS provider’s VPC). This architecture helps meet strict security and compliance requirements, such as zero-trust networking and least privilege access.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q9-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-privatelink.html\">https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-privatelink.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Establish a VPN connection using AWS Site-to-Site VPN to create a secure tunnel between the internal services and the third-party SaaS provider</strong> - While Site-to-Site VPN can establish a secure connection, it typically requires IPsec-compatible devices and may route traffic over the internet, depending on the SaaS provider's setup. It also introduces more operational complexity and latency compared to AWS-native private connectivity options.</p>\n\n<p><strong>Set up VPC peering between the application VPC and the SaaS provider’s VPC to allow direct communication</strong> - VPC peering enables direct network connectivity between VPCs; however, it lacks the granular access controls that AWS PrivateLink provides. Unlike PrivateLink, VPC peering allows broader network-level access, which can potentially permit unsolicited inbound traffic from the SaaS provider. Additionally, due to limitations in scalability and security management, SaaS providers typically do not support peering with individual customer VPCs.</p>\n\n<p><strong>Use AWS CloudFront to route requests from the application’s internal services to the SaaS provider through edge locations</strong> - CloudFront is designed for content distribution and caching at edge locations. It does not establish private or secure backend connectivity between internal services and SaaS APIs, and traffic still traverses the public internet.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/what-is-privatelink.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-privatelink.html\">https://docs.aws.amazon.com/whitepapers/latest/building-scalable-secure-multi-vpc-network-infrastructure/aws-privatelink.html</a></p>\n","answers":["<p>Establish a VPN connection using AWS Site-to-Site VPN to create a secure tunnel between the internal services and the third-party SaaS provider</p>","<p>Use AWS PrivateLink to create a private endpoint within the application’s VPC that connects securely to the SaaS provider’s VPC</p>","<p>Set up VPC peering between the application VPC and the SaaS provider’s VPC to allow direct communication</p>","<p>Use AWS CloudFront to route requests from the application’s internal services to the SaaS provider through edge locations</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A tech company runs a web application that includes multiple internal services deployed across Amazon EC2 instances within a VPC. These services require communication with a third-party SaaS provider's API for analytics and billing, which is also hosted on the AWS infrastructure. The company is concerned about minimizing public internet exposure while maintaining secure and reliable connectivity. The solution must ensure private access without allowing unsolicited incoming traffic from the SaaS provider.\n\nWhich solution will best meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638791,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail enterprise is expanding its hybrid IT infrastructure and plans to securely connect its on-premises corporate network to its AWS environment. The company wants to ensure that all data exchanged between on-premises systems and AWS is encrypted at both the network and session layers. Additionally, the solution must incorporate granular security controls that restrict unnecessary or unauthorized access between the cloud and on-premises environments. A solutions architect must recommend a scalable and secure approach that supports these goals.</p>\n\n<p>Which solution best meets these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Set up AWS Site-to-Site VPN to connect the on-premises network to the AWS VPC. Use route tables to manage traffic flow and configure security groups and network ACLs to allow only authorized communication between systems</strong></p>\n\n<p>AWS Site-to-Site VPN uses IPsec tunnels, which provide encryption at the network layer, ensuring that traffic is securely transmitted between the on-premises network and the VPC. By applying security groups and network ACLs, fine-grained traffic control is possible. Additionally, session-layer encryption (e.g., HTTPS, TLS) can be layered on top, satisfying both encryption requirements with minimal overhead. This is the most cost-effective and secure solution for the given requirements.</p>\n\n<p>Incorrect Options:</p>\n\n<p><strong>Establish a dedicated AWS Direct Connect connection between the corporate network and AWS. Configure VPC route tables to control traffic flow and use security groups and network ACLs to restrict access as needed</strong> - While AWS Direct Connect provides a dedicated private connection with high bandwidth and low latency, it does not encrypt traffic at the network layer by default. Additional technologies (e.g., MACsec or an overlay VPN) are needed to secure the connection. Furthermore, session-layer encryption is not inherently addressed by Direct Connect. Without additional configuration, this approach does not meet the encryption requirements.</p>\n\n<p><strong>Use AWS Client VPN to allow corporate users to connect to the VPC individually. Manage access controls with security groups and IAM policies</strong> - While AWS Client VPN does provide encrypted connectivity over the internet and can enable individual client devices to access AWS resources securely, it is not designed for network-to-network connectivity. This solution fails to meet the requirement of establishing a site-to-site connection between the corporate network and the VPC for seamless hybrid access. It also introduces operational complexity and does not scale well for scenarios where full internal network routing and access controls are required between entire corporate networks and AWS.</p>\n\n<p><strong>Set up a bastion host in a public subnet of the VPC to provide SSH-based access to AWS resources from the corporate network. Use security groups to control access</strong> - A bastion host provides access at the individual server level, typically over SSH or RDP, and is useful for administrative tasks. However, it does not establish a full network-layer or session-layer encrypted connection between the corporate network and AWS resources. It also does not scale for use cases requiring broad application or service access between on-premises and AWS. This solution lacks centralized routing and traffic control, making it insufficient for secure, scalable hybrid connectivity.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/VPC_VPN.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html\">https://docs.aws.amazon.com/vpn/latest/clientvpn-admin/what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html\">https://docs.aws.amazon.com/directconnect/latest/UserGuide/encryption-in-transit.html</a></p>\n","answers":["<p>Establish a dedicated AWS Direct Connect connection between the corporate network and AWS. Configure VPC route tables to control traffic flow and use security groups and network ACLs to restrict access as needed</p>","<p>Use AWS Client VPN to allow corporate users to connect to the VPC individually. Manage access controls with security groups and IAM policies</p>","<p>Set up AWS Site-to-Site VPN to connect the on-premises network to the AWS VPC. Use route tables to manage traffic flow and configure security groups and network ACLs to allow only authorized communication between systems</p>","<p>Set up a bastion host in a public subnet of the VPC to provide SSH-based access to AWS resources from the corporate network. Use security groups to control access</p>"]},"correct_response":["c"],"section":"Design Secure Architectures","question_plain":"A retail enterprise is expanding its hybrid IT infrastructure and plans to securely connect its on-premises corporate network to its AWS environment. The company wants to ensure that all data exchanged between on-premises systems and AWS is encrypted at both the network and session layers. Additionally, the solution must incorporate granular security controls that restrict unnecessary or unauthorized access between the cloud and on-premises environments. A solutions architect must recommend a scalable and secure approach that supports these goals.\n\nWhich solution best meets these requirements?","related_lectures":[]},{"_class":"assessment","id":156638793,"assessment_type":"multiple-choice","prompt":{"question":"<p>A data analytics team at a global media firm is building a new analytics platform to process large volumes of both historical and real-time data. This data is stored in Amazon S3. The team wants to implement a serverless solution that allows them to query the data directly using SQL. Additionally, the solution must ensure that all data is encrypted at rest and automatically replicated to another AWS Region to support business continuity.</p>\n\n<p>Which solution will meet these requirements with the LEAST operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an Amazon S3 bucket configured with server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Athena to run SQL queries on the data</strong></p>\n\n<p>This option is the most efficient and serverless approach that meets all of the stated requirements. Amazon S3 supports server-side encryption using AWS KMS multi-Region keys, which allows secure data storage and supports automatic replication to a secondary Region via CRR. Amazon Athena is a serverless query service that can run SQL queries directly against S3 data without requiring a database engine or managing infrastructure. This solution supports encryption at rest, regional redundancy, and SQL-based querying with minimal overhead.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q11-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\">https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using Amazon S3 managed keys (SSE-S3). Use Amazon Athena to run SQL queries on the replicated data</strong></p>\n\n<p><strong>Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Use Amazon Athena to run SQL queries on the replicated data</strong></p>\n\n<p>Both of these options skip the step of creating a new bucket in the target AWS Region. You cannot enable CRR on a bucket without specifying the target bucket for replication in another Region. So, these options are incorrect.</p>\n\n<p><strong>Create an Amazon S3 bucket configured with server-side encryption using Amazon S3 managed keys (SSE-S3). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Redshift Spectrum to query the S3 data using SQL</strong> - While Redshift Spectrum can query data stored in S3 using SQL, this solution introduces unnecessary operational complexity because Amazon Redshift requires cluster management. It is not entirely serverless. Although Redshift Spectrum itself is serverless, it still depends on a provisioned Redshift cluster backend, which contradicts the requirement to minimize operational overhead.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html\">https://docs.aws.amazon.com/kms/latest/developerguide/multi-region-keys-overview.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/replication.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/athena/latest/ug/what-is.html\">https://docs.aws.amazon.com/athena/latest/ug/what-is.html</a></p>\n","answers":["<p>Create an Amazon S3 bucket configured with server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Athena to run SQL queries on the data</p>","<p>Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using Amazon S3 managed keys (SSE-S3). Use Amazon Athena to run SQL queries on the replicated data</p>","<p>Create an Amazon S3 bucket configured with server-side encryption using Amazon S3 managed keys (SSE-S3). Enable cross-Region replication (CRR) on the source bucket. Use Amazon Redshift Spectrum to query the S3 data using SQL</p>","<p>Enable Cross-Region Replication (CRR) on the existing Amazon S3 bucket. Apply server-side encryption using AWS KMS multi-Region keys (SSE-KMS). Use Amazon Athena to run SQL queries on the replicated data</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A data analytics team at a global media firm is building a new analytics platform to process large volumes of both historical and real-time data. This data is stored in Amazon S3. The team wants to implement a serverless solution that allows them to query the data directly using SQL. Additionally, the solution must ensure that all data is encrypted at rest and automatically replicated to another AWS Region to support business continuity.\n\nWhich solution will meet these requirements with the LEAST operational overhead?","related_lectures":[]},{"_class":"assessment","id":156638795,"assessment_type":"multiple-choice","prompt":{"question":"<p>The data engineering team at an e-commerce company has set up a workflow to ingest the clickstream data into the raw zone of the Amazon S3 data lake. The team wants to run some SQL based data sanity checks on the raw zone of the data lake.</p>\n\n<p>What AWS services would you recommend for this use-case such that the solution is cost-effective and easy to maintain?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon Athena to run SQL based analytics against Amazon S3 data</strong></p>\n\n<p>Amazon Athena is an interactive query service that makes it easy to analyze data directly in Amazon S3 using standard SQL. Amazon Athena is serverless, so there is no infrastructure to set up or manage, and customers pay only for the queries they run. You can use Athena to process logs, perform ad-hoc analysis, and run interactive queries.</p>\n\n<p>Amazon Athena Benefits:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q12-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/athena/\">https://aws.amazon.com/athena/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Load the incremental raw zone data into Amazon Redshift on an hourly basis and run the SQL based sanity checks</strong> - Amazon Redshift is a fully-managed petabyte-scale cloud-based data warehouse product designed for large scale data set storage and analysis.\nAs the development team would have to maintain and monitor the Amazon Redshift cluster size and would require significant development time to set up the processes to consume the data periodically, so this option is ruled out.</p>\n\n<p><strong>Load the incremental raw zone data into an Amazon EMR based Spark Cluster on an hourly basis and use SparkSQL to run the SQL based sanity checks</strong> - Amazon EMR is the industry-leading cloud big data platform for processing vast amounts of data using open source tools such as Apache Spark, Apache Hive, Apache HBase, Apache Flink, Apache Hudi, and Presto. Amazon EMR uses Hadoop, an open-source framework, to distribute your data and processing across a resizable cluster of Amazon EC2 instances.\nUsing an Amazon EMR cluster would imply managing the underlying infrastructure so it’s ruled out because the correct solution for the given use-case should require the least amount of development effort and ongoing maintenance.</p>\n\n<p><strong>Load the incremental raw zone data into Amazon RDS on an hourly basis and run the SQL based sanity checks</strong> - Loading the incremental data into Amazon RDS implies data migration jobs will have to be written via a AWS Lambda function or an Amazon EC2 based process. This goes against the requirement that the solution should involve the least amount of development effort and ongoing maintenance. Hence this option is not correct.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/athena/\">https://aws.amazon.com/athena/</a></p>\n","answers":["<p>Load the incremental raw zone data into Amazon Redshift on an hourly basis and run the SQL based sanity checks</p>","<p>Load the incremental raw zone data into Amazon RDS on an hourly basis and run the SQL based sanity checks</p>","<p>Load the incremental raw zone data into an Amazon EMR based Spark Cluster on an hourly basis and use SparkSQL to run the SQL based sanity checks</p>","<p>Use Amazon Athena to run SQL based analytics against Amazon S3 data</p>"]},"correct_response":["d"],"section":"Design Cost-Optimized Architectures","question_plain":"The data engineering team at an e-commerce company has set up a workflow to ingest the clickstream data into the raw zone of the Amazon S3 data lake. The team wants to run some SQL based data sanity checks on the raw zone of the data lake.\n\nWhat AWS services would you recommend for this use-case such that the solution is cost-effective and easy to maintain?","related_lectures":[]},{"_class":"assessment","id":156638797,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global media company uses a fleet of Amazon EC2 instances (behind an Application Load Balancer) to power its video streaming application. To improve the performance of the application, the engineering team has also created an Amazon CloudFront distribution with the Application Load Balancer as the custom origin. The security team at the company has noticed a spike in the number and types of SQL injection and cross-site scripting attack vectors on the application.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend as the MOST effective in countering these malicious attacks?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution</strong></p>\n\n<p>AWS WAF is a web application firewall that helps protect your web applications or APIs against common web exploits that may affect availability, compromise security, or consume excessive resources. AWS WAF gives you control over how traffic reaches your applications by enabling you to create security rules that block common attack patterns, such as SQL injection or cross-site scripting, and rules that filter out specific traffic patterns you define.</p>\n\n<p>How AWS WAF Works:\n<img src=\"https://d1.awsstatic.com/products/WAF/product-page-diagram_AWS-WAF_How-it-Works@2x.452efa12b06cb5c87f07550286a771e20ca430b9.png\">\nvia - <a href=\"https://aws.amazon.com/waf/\">https://aws.amazon.com/waf/</a></p>\n\n<p>A web access control list (web ACL) gives you fine-grained control over the web requests that your Amazon CloudFront distribution, Amazon API Gateway API, or Application Load Balancer responds to.</p>\n\n<p>When you create a web ACL, you can specify one or more Amazon CloudFront distributions that you want AWS WAF to inspect. AWS WAF starts to allow, block, or count web requests for those distributions based on the conditions that you identify in the web ACL. Therefore, combining AWS WAF with Amazon CloudFront can prevent SQL injection and cross-site scripting attacks. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Route 53 with Amazon CloudFront distribution</strong> - Amazon Route 53 is a highly available and scalable cloud Domain Name System (DNS) web service. You cannot use Route 53 to prevent SQL injection and cross-site scripting attacks. So this option is incorrect.</p>\n\n<p><strong>Use AWS Security Hub with Amazon CloudFront distribution</strong> - AWS Security Hub gives you a comprehensive view of your high-priority security alerts and security posture across your AWS accounts. With Security Hub, you have a single place that aggregates, organizes, and prioritizes your security alerts, or findings, from multiple AWS services, such as Amazon GuardDuty, Amazon Inspector, Amazon Macie, AWS Identity and Access Management (IAM) Access Analyzer, and AWS Firewall Manager, as well as from AWS Partner solutions. You cannot use Security Hub to prevent SQL injection and cross-site scripting attacks. So this option is incorrect.</p>\n\n<p><strong>Use AWS Firewall Manager with CloudFront distribution</strong> - AWS Firewall Manager is a security management service that allows you to centrally configure and manage firewall rules across your accounts and applications in AWS Organization. You cannot use AWS Firewall Manager to prevent SQL injection and cross-site scripting attacks. So this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/waf/features/\">https://aws.amazon.com/waf/features/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/web-acl.html\">https://docs.aws.amazon.com/waf/latest/developerguide/web-acl.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/cloudfront-features.html\">https://docs.aws.amazon.com/waf/latest/developerguide/cloudfront-features.html</a></p>\n","answers":["<p>Use Amazon Route 53 with Amazon CloudFront distribution</p>","<p>Use AWS Firewall Manager with CloudFront distribution</p>","<p>Use AWS Security Hub with Amazon CloudFront distribution</p>","<p>Use AWS Web Application Firewall (AWS WAF) with Amazon CloudFront distribution</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A global media company uses a fleet of Amazon EC2 instances (behind an Application Load Balancer) to power its video streaming application. To improve the performance of the application, the engineering team has also created an Amazon CloudFront distribution with the Application Load Balancer as the custom origin. The security team at the company has noticed a spike in the number and types of SQL injection and cross-site scripting attack vectors on the application.\n\nAs a solutions architect, which of the following solutions would you recommend as the MOST effective in countering these malicious attacks?","related_lectures":[]},{"_class":"assessment","id":156638799,"assessment_type":"multiple-choice","prompt":{"question":"<p>The infrastructure team at a company maintains 5 different VPCs (let's call these VPCs A, B, C, D, E) for resource isolation. Due to the changed organizational structure, the team wants to interconnect all VPCs together. To facilitate this, the team has set up VPC peering connection between VPC A and all other VPCs in a hub and spoke model with VPC A at the center. However, the team has still failed to establish connectivity between all VPCs.</p>\n\n<p>As a solutions architect, which of the following would you recommend as the MOST resource-efficient and scalable solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS transit gateway to interconnect the VPCs</strong></p>\n\n<p>An AWS transit gateway is a network transit hub that you can use to interconnect your virtual private clouds (VPC) and on-premises networks.</p>\n\n<p>AWS Transit Gateway Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q14-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html\">https://docs.aws.amazon.com/vpc/latest/tgw/what-is-transit-gateway.html</a></p>\n\n<p>A VPC peering connection is a networking connection between two VPCs that enables you to route traffic between them using private IPv4 addresses or IPv6 addresses. Transitive Peering does not work for VPC peering connections. So, if you have a VPC peering connection between VPC A and VPC B (pcx-aaaabbbb), and between VPC A and VPC C (pcx-aaaacccc). Then, there is no VPC peering connection between VPC B and VPC C. Instead of using VPC peering, you can use an AWS Transit Gateway that acts as a network transit hub, to interconnect your VPCs or connect your VPCs with on-premises networks. Therefore this is the correct option.</p>\n\n<p>VPC Peering Connections Overview:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q14-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html\">https://docs.aws.amazon.com/vpc/latest/peering/vpc-peering-basics.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use an internet gateway to interconnect the VPCs</strong> - An internet gateway is a horizontally scaled, redundant, and highly available V
