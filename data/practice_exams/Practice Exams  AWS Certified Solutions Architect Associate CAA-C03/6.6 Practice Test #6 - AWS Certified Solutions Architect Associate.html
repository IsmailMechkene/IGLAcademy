ly re-create the VMs in AWS by launching replacement instances with matching configurations</p>","<p>Use AWS Application Migration Service (MGN). Install the AWS Replication Agent on the source VMs</p>","<p>Shut down the source virtual machines and immediately provision EC2 replacement instances using manual AMI creation</p>","<p>Perform the initial replication. Launch test instances in AWS to validate the migrated VMs before final cutover</p>","<p>Launch a cutover instance after completing testing and confirming that replication is up-to-date</p>"]},"correct_response":["c","e","f"],"section":"Design High-Performing Architectures","question_plain":"A global logistics provider operates several legacy applications on virtual machines (VMs) within a private data center. Due to accelerated business growth and limited capacity in its existing infrastructure, the provider decides to migrate select applications to AWS. The company opts for a lift-and-shift strategy for its non-mission-critical systems to meet tight migration deadlines. The solution must support rapid migration without requiring extensive application refactoring.\n\nWhich combination of actions will best support this migration approach? (Select three)","related_lectures":[]},{"_class":"assessment","id":130168921,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at a retail company is planning to migrate to AWS Cloud from the on-premises data center. The team is evaluating Amazon Relational Database Service (Amazon RDS) as the database tier for its flagship application. The team has hired you as an AWS Certified Solutions Architect Associate to advise on Amazon RDS Multi-AZ capabilities.</p>\n\n<p>Which of the following would you identify as correct for Amazon RDS Multi-AZ? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Amazon RDS applies operating system updates by performing maintenance on the standby, then promoting the standby to primary and finally performing maintenance on the old primary, which becomes the new standby</strong></p>\n\n<p>Running a DB instance as a Multi-AZ deployment can further reduce the impact of a maintenance event because Amazon RDS applies operating system updates by following these steps:</p>\n\n<p>Perform maintenance on the standby.</p>\n\n<p>Promote the standby to primary.</p>\n\n<p>Perform maintenance on the old primary, which becomes the new standby.</p>\n\n<p>When you modify the database engine for your DB instance in a Multi-AZ deployment, then Amazon RDS upgrades both the primary and secondary DB instances at the same time. In this case, the database engine for the entire Multi-AZ deployment is shut down during the upgrade.</p>\n\n<p><strong>Amazon RDS automatically initiates a failover to the standby, in case primary database fails for any reason</strong></p>\n\n<p>You also benefit from enhanced database availability when running your DB instance as a Multi-AZ deployment. If an Availability Zone failure or DB instance failure occurs, your availability impact is limited to the time automatic failover takes to complete.</p>\n\n<p>Another implied benefit of running your DB instance as a Multi-AZ deployment is that DB instance failover is automatic and requires no administration. In an Amazon RDS context, this means you are not required to monitor DB instance events and initiate manual DB instance recovery in the event of an Availability Zone failure or DB instance failure.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>For automated backups, I/O activity is suspended on your primary database since backups are not taken from standby database</strong> - The availability benefits of Multi-AZ also extend to planned maintenance. For example, with automated backups, I/O activity is no longer suspended on your primary during your preferred backup window, since backups are taken from the standby.</p>\n\n<p><strong>To enhance read scalability, a Multi-AZ standby instance can be used to serve read requests</strong> - A Multi-AZ standby cannot serve read requests. Multi-AZ deployments are designed to provide enhanced database availability and durability, rather than read scaling benefits. As such, the feature uses synchronous replication between primary and standby. AWS implementation makes sure the primary and the standby are constantly in sync, but precludes using the standby for read or write operations.</p>\n\n<p><strong>Updates to your database Instance are asynchronously replicated across the Availability Zone to the standby in order to keep both in sync</strong> - When you create your DB instance to run as a Multi-AZ deployment, Amazon RDS automatically provisions and maintains a synchronous “standby” replica in a different Availability Zone. Updates to your DB Instance are synchronously replicated across the Availability Zone to the standby in order to keep both in sync and protect your latest database updates against DB instance failure.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/faqs/\">https://aws.amazon.com/rds/faqs/</a></p>\n","answers":["<p>To enhance read scalability, a Multi-AZ standby instance can be used to serve read requests</p>","<p>Amazon RDS applies operating system updates by performing maintenance on the standby, then promoting the standby to primary and finally performing maintenance on the old primary, which becomes the new standby</p>","<p>Amazon RDS automatically initiates a failover to the standby, in case primary database fails for any reason</p>","<p>For automated backups, I/O activity is suspended on your primary database since backups are not taken from standby database</p>","<p>Updates to your database Instance are asynchronously replicated across the Availability Zone to the standby in order to keep both in sync</p>"]},"correct_response":["b","c"],"section":"Design Resilient Architectures","question_plain":"The engineering team at a retail company is planning to migrate to AWS Cloud from the on-premises data center. The team is evaluating Amazon Relational Database Service (Amazon RDS) as the database tier for its flagship application. The team has hired you as an AWS Certified Solutions Architect Associate to advise on Amazon RDS Multi-AZ capabilities.\n\nWhich of the following would you identify as correct for Amazon RDS Multi-AZ? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168923,"assessment_type":"multi-select","prompt":{"question":"<p>An edtech startup runs its course-management platform inside a private subnet in a VPC on AWS. The application uses Amazon Cognito user pools for authentication. Now, the team wants to extend the application so that authenticated users can upload and access personal course-related documents in Amazon S3. The solution must ensure scalable, fine-grained and secure access control to the S3 bucket and maintain private network architecture for the application.</p>\n\n<p>Which combination of steps will enable secure S3 integration for this workload? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Create an Amazon Cognito identity pool to allow federated identities. Use it to generate temporary AWS credentials that grant S3 access when users successfully authenticate</strong></p>\n\n<p>This option represents the standard and secure pattern for enabling Amazon Cognito–authenticated users to access AWS services like Amazon S3. While the Cognito user pool handles user authentication (e.g., verifying usernames and passwords), it cannot itself issue AWS credentials for service access. For this, a Cognito identity pool is required. The identity pool integrates with the user pool and generates temporary AWS credentials. These credentials can then be scoped using IAM roles and policies to allow secure, fine-grained access to S3—such as granting users permission to upload documents only to specific S3 prefixes based on their identity. This approach adheres to the principle of least privilege and avoids long-lived credentials.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q50-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html</a></p>\n\n<p><strong>Create an Amazon S3 VPC endpoint in the VPC where the application is hosted to enable private connectivity between the application and S3</strong></p>\n\n<p>The application is running in a private subnet, which lacks internet access. Without internet access or a NAT gateway, the application cannot reach public AWS services like Amazon S3 unless an alternative route is provided. A VPC Gateway Endpoint for S3 enables private, secure communication between the VPC and S3 over the AWS backbone, without requiring internet access or exposing traffic to the public internet. This also ensures lower latency and enhances security by avoiding traversal through external networks. It is a highly recommended practice when workloads in private subnets need access to S3, especially in regulated or production environments.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use the existing Amazon Cognito user pool to directly grant users permission to upload and download objects in the S3 bucket</strong> - Amazon Cognito user pools provide authentication, not authorization for AWS resources like S3. You cannot directly assign S3 permissions using user pools alone. You must integrate the user pool with an identity pool, which generates temporary AWS credentials mapped to IAM roles with S3 access. This option omits a critical step and would not allow secure access to S3.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q50-i3.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html</a></p>\n\n<p><strong>Configure an AWS Lambda function that proxies user uploads to S3. Invoke the Lambda function after each user login to isolate the S3 access</strong> - While technically possible, using a Lambda function as a proxy for every upload or download introduces unnecessary latency, cost, and operational complexity. It also doesn't leverage native Cognito + IAM integration for scalable, fine-grained access control. This pattern may be used in tightly controlled environments but is not ideal or scalable for typical user-based S3 access patterns.</p>\n\n<p><strong>Attach an S3 bucket policy that allows access only if requests include a custom HTTP header containing a valid Cognito user ID</strong> - While adding conditional logic to S3 bucket policies using request headers might sound like a custom access control strategy, Amazon S3 bucket policies do not natively support evaluating Cognito user IDs via custom headers for authorization. S3 supports conditions based on IAM policy context keys, such as aws:userid or aws:username, but those must be passed via authenticated requests with IAM credentials, not manually crafted headers. Trusting user-provided headers introduces security risks and does not securely validate identity. Proper integration relies on IAM roles tied to Cognito identity pools, not custom header logic.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazon-s3-policy-keys.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/amazon-s3-policy-keys.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html#amazons3-policy-keys\">https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazons3.html#amazons3-policy-keys</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/vpc-endpoints-s3.html</a></p>\n","answers":["<p>Create an Amazon Cognito identity pool to allow federated identities. Use it to generate temporary AWS credentials that grant S3 access when users successfully authenticate</p>","<p>Use the existing Amazon Cognito user pool to directly grant users permission to upload and download objects in the S3 bucket</p>","<p>Create an Amazon S3 VPC endpoint in the VPC where the application is hosted to enable private connectivity between the application and S3</p>","<p>Configure an AWS Lambda function that proxies user uploads to S3. Invoke the Lambda function after each user login to isolate the S3 access</p>","<p>Attach an S3 bucket policy that allows access only if requests include a custom HTTP header containing a valid Cognito user ID</p>"]},"correct_response":["a","c"],"section":"Design Secure Architectures","question_plain":"An edtech startup runs its course-management platform inside a private subnet in a VPC on AWS. The application uses Amazon Cognito user pools for authentication. Now, the team wants to extend the application so that authenticated users can upload and access personal course-related documents in Amazon S3. The solution must ensure scalable, fine-grained and secure access control to the S3 bucket and maintain private network architecture for the application.\n\nWhich combination of steps will enable secure S3 integration for this workload? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168925,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company helps its customers legally sign highly confidential contracts. To meet the strong industry requirements, the company must ensure that the signed contracts are encrypted using the company's proprietary algorithm. The company is now migrating to AWS Cloud using Amazon Simple Storage Service (Amazon S3) and would like you, the solution architect, to advise them on the encryption scheme to adopt.</p>\n\n<p>What do you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Client Side Encryption</strong></p>\n\n<p>Client-side encryption is the act of encrypting your data locally to help ensure its security in transit and at rest. To encrypt your objects before you send them to Amazon S3, use the Amazon S3 Encryption Client. When your objects are encrypted in this manner, your objects aren't exposed to any third party, including AWS. Amazon S3 receives your objects already encrypted; Amazon S3 does not play a role in encrypting or decrypting your objects. You can use both the Amazon S3 Encryption Client and server-side encryption to encrypt your data. When you send encrypted objects to Amazon S3, Amazon S3 doesn't recognize the objects as being encrypted, it only detects typical objects.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Server-side encryption with AWS KMS keys (SSE-KMS)</strong> - AWS Key Management Service (AWS KMS) is a service that combines secure, highly available hardware and software to provide a key management system scaled for the cloud. When you use server-side encryption with AWS KMS (SSE-KMS), you can specify a customer-managed CMK that you have already created. SSE-KMS provides you with an audit trail that shows when your CMK was used and by whom.</p>\n\n<p><strong>Server-side encryption with Amazon S3 managed keys (SSE-S3)</strong> - When you use Server-Side Encryption with Amazon S3-Managed Keys (SSE-S3), each object is encrypted with a unique key.</p>\n\n<p><strong>Server-side encryption with customer-provided keys (SSE-C)</strong> - With Server-Side Encryption with Customer-Provided Keys (SSE-C), you manage the encryption keys and Amazon S3 manages the encryption, as it writes to disks, and decryption when you access your objects.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingKMSEncryption.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingKMSEncryption.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingClientSideEncryption.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/UsingClientSideEncryption.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/serv-side-encryption.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/serv-side-encryption.html</a></p>\n","answers":["<p>Server-side encryption with Amazon S3 managed keys (SSE-S3)</p>","<p>Server-side encryption with AWS KMS keys (SSE-KMS)</p>","<p>Server-side encryption with customer-provided keys (SSE-C)</p>","<p>Client Side Encryption</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A company helps its customers legally sign highly confidential contracts. To meet the strong industry requirements, the company must ensure that the signed contracts are encrypted using the company's proprietary algorithm. The company is now migrating to AWS Cloud using Amazon Simple Storage Service (Amazon S3) and would like you, the solution architect, to advise them on the encryption scheme to adopt.\n\nWhat do you recommend?","related_lectures":[]},{"_class":"assessment","id":130168927,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail startup runs a high-traffic order processing system on AWS. The architecture includes a frontend web tier using EC2 instances behind an Application Load Balancer, a processing tier powered by EC2 instances, and a data layer using Amazon DynamoDB. The frontend and processing tiers are decoupled using Amazon SQS. Recently, the engineering team observed that during unpredictable traffic surges, order processing slows down significantly, SQS queue depth increases rapidly, and the processing-tier EC2 instances hit 100% CPU usage.</p>\n\n<p>Which solution will help improve the application’s responsiveness and scalability during peak load periods?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use an EC2 Auto Scaling group with a target tracking policy to automatically scale the processing tier. Configure the policy to monitor the ApproximateNumberOfMessages in the SQS queue</strong></p>\n\n<p>This option directly addresses the root cause of the performance issue - CPU saturation in the processing tier and message backlog in the SQS queue - while aligning with best practices for decoupled architectures on AWS. In this design, Amazon EC2 Auto Scaling uses a target tracking policy to dynamically adjust the number of EC2 instances based on the ApproximateNumberOfMessages metric from the SQS queue. As the queue depth grows due to surging customer activity, Auto Scaling automatically launches additional worker instances to handle the increased load, ensuring that the backlog is processed quickly and efficiently. This approach is ideal for workloads with unpredictable or bursty traffic patterns, and it removes the need for manual intervention or fixed scaling schedules. It ensures better responsiveness, system resilience, and cost efficiency.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon EventBridge to schedule batch processing jobs for the queue. Configure the event rule to invoke EC2-based workers every 10 minutes to process messages in the SQS queue</strong> - While Amazon EventBridge can trigger actions on a schedule, this design is incompatible with real-time, high-volume message processing requirements. Using a fixed interval batch model (e.g., every 10 minutes) delays response time and fails to handle variable or sudden traffic spikes effectively. SQS is built for near-real-time decoupling, and EC2 workers should be automatically scaled based on queue depth, not on static time-based triggers. This method would cause inconsistent latency and accumulation of unprocessed messages under load.</p>\n\n<p><strong>Add Amazon Kinesis Data Streams to buffer order events from the web tier. Configure the processing tier to consume records from the stream and use enhanced fan-out for high throughput</strong> - Although Amazon Kinesis Data Streams is a powerful solution for high-throughput event ingestion, this approach changes the core architecture and introduces unnecessary complexity for a system that already uses Amazon SQS for decoupling. The challenge in the scenario is not the ingestion layer but the under-provisioned EC2 processing tier that fails to scale during unpredictable peak traffic. Migrating to Kinesis requires new consumers, partitioning logic, and data retention management, which is not justified when the existing queue-based design can be easily scaled using Auto Scaling policies tied to the SQS queue depth. Therefore, switching to Kinesis adds operational burden without solving the root cause: CPU bottlenecks in the processing tier.</p>\n\n<p><strong>Use scheduled Auto Scaling for the processing tier based on past peak periods. Use average CPU utilization to define scaling thresholds</strong> - Scheduled scaling assumes that peak times are predictable, but the scenario explicitly states they are variable and unpredictable. While CPU utilization is a valid metric, it lags behind and only reflects stress once it occurs, not proactively. Also, scheduled scaling doesn’t adapt in real-time, making it ineffective for responding to dynamic queue growth.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-using-sqs-queue.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-scheduled-scaling.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html\">https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/streams/latest/dev/introduction.html\">https://docs.aws.amazon.com/streams/latest/dev/introduction.html</a></p>\n","answers":["<p>Use Amazon EventBridge to schedule batch processing jobs for the queue. Configure the event rule to invoke EC2-based workers every 10 minutes to process messages in the SQS queue</p>","<p>Add Amazon Kinesis Data Streams to buffer order events from the web tier. Configure the processing tier to consume records from the stream and use enhanced fan-out for high throughput</p>","<p>Use an EC2 Auto Scaling group with a target tracking policy to automatically scale the processing tier. Configure the policy to monitor the ApproximateNumberOfMessages in the SQS queue</p>","<p>Use scheduled Auto Scaling for the processing tier based on past peak periods. Use average CPU utilization to define scaling thresholds</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A retail startup runs a high-traffic order processing system on AWS. The architecture includes a frontend web tier using EC2 instances behind an Application Load Balancer, a processing tier powered by EC2 instances, and a data layer using Amazon DynamoDB. The frontend and processing tiers are decoupled using Amazon SQS. Recently, the engineering team observed that during unpredictable traffic surges, order processing slows down significantly, SQS queue depth increases rapidly, and the processing-tier EC2 instances hit 100% CPU usage.\n\nWhich solution will help improve the application’s responsiveness and scalability during peak load periods?","related_lectures":[]},{"_class":"assessment","id":130168929,"assessment_type":"multiple-choice","prompt":{"question":"<p>A startup wants to create a highly available architecture for its multi-tier application. Currently, the startup manages a single Amazon EC2 instance along with a single Amazon RDS MySQL DB instance. The startup has hired you as an AWS Certified Solutions Architect - Associate to build a solution that meets these requirements while minimizing the underlying infrastructure maintenance effort.</p>\n\n<p>What will you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration</strong></p>\n\n<p>Amazon EC2 Auto Scaling is a fully managed service designed to launch or terminate Amazon EC2 instances automatically to help ensure you have the correct number of Amazon EC2 instances available to handle the load for your application.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q53-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p>Application Load Balancer automatically distributes your incoming traffic across multiple targets, such as Amazon EC2 instances, containers, and IP addresses, in one or more Availability Zones. It monitors the health of its registered targets, and routes traffic only to the healthy targets.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q53-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n\n<p>In a multi-AZ deployment, Amazon RDS automatically provisions and maintains a synchronous “standby” replica in a different Availability Zone. Updates to your DB Instance are synchronously replicated across Availability Zones to the standby to keep both in sync and protect your latest database updates against DB instance failure.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q53-i3.jpg\">\nvia - <a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n\n<p>To create a highly available architecture for the given use case, you need to set up an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones and then point the Application Load Balancer to the target group having the Amazon EC2 instances.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up a read replica of the Amazon RDS MySQL DB in another Availability Zone</strong> - A read replica cannot be used to enhance the availability of an Amazon RDS MySQL DB. You must use the multi-AZ configuration of Amazon RDS MySQL for this use case.</p>\n\n<p><strong>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances in a single Availability Zone. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration</strong> - Having the Amazon EC2 instances in a single Availability Zone will not create a highly available solution. In the case of an outage for the entire Availability Zone, the Amazon EC2 instances would be unreachable. Hence this option is incorrect.</p>\n\n<p><strong>Provision a second Amazon EC2 instance in another Availability Zone. Provision a second Amazon RDS MySQL DB in another Availabililty Zone. Leverage Amazon Route 53 for equal distribution of incoming traffic to the Amazon EC2 instances. Use a custom script to sync data across the two MySQL DBs</strong> - This option has been added as a distractor. It requires significant monitoring and development effort to keep the Amazon EC2 instances highly available as well as keep the MySQL DBs in sync.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n","answers":["<p>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up a read replica of the Amazon RDS MySQL DB in another Availability Zone</p>","<p>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances across two Availability Zones. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration</p>","<p>Create an Auto-Scaling group with a desired capacity of a total of two Amazon EC2 instances in a single Availability Zone. Configure an Application Load Balancer having a target group of these Amazon EC2 instances. Set up Amazon RDS MySQL DB in a multi-AZ configuration</p>","<p>Provision a second Amazon EC2 instance in another Availability Zone. Provision a second Amazon RDS MySQL DB in another Availabililty Zone. Leverage Amazon Route 53 for equal distribution of incoming traffic to the Amazon EC2 instances. Use a custom script to sync data across the two MySQL DBs</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A startup wants to create a highly available architecture for its multi-tier application. Currently, the startup manages a single Amazon EC2 instance along with a single Amazon RDS MySQL DB instance. The startup has hired you as an AWS Certified Solutions Architect - Associate to build a solution that meets these requirements while minimizing the underlying infrastructure maintenance effort.\n\nWhat will you recommend?","related_lectures":[]},{"_class":"assessment","id":130168931,"assessment_type":"multiple-choice","prompt":{"question":"<p>As a Solutions Architect, you would like to completely secure the communications between your Amazon CloudFront distribution and your Amazon S3 bucket which contains the static files for your website. Users should only be able to access the Amazon S3 bucket through Amazon CloudFront and not directly.</p>\n\n<p>What do you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an origin access identity (OAI) and update the Amazon S3 Bucket Policy</strong></p>\n\n<p>To restrict access to content that you serve from Amazon S3 buckets, you need to follow the following steps:</p>\n\n<ol>\n<li>Create a special Amazon CloudFront user called an origin access identity (OAI) and associate it with your distribution.</li>\n<li>Configure your Amazon S3 bucket permissions so that Amazon CloudFront can use the OAI to access the files in your bucket and serve them to your users. Make sure that users can’t use a direct URL to the Amazon S3 bucket to access a file there.</li>\n</ol>\n\n<p>After you take these steps, users can only access your files through Amazon CloudFront, not directly from the Amazon S3 bucket.</p>\n\n<p>In general, if you’re using an Amazon S3 bucket as the origin for a Amazon CloudFront distribution, you can either allow everyone to have access to the files there, or you can restrict access. If you restrict access by using, for example, Amazon CloudFront signed URLs or signed cookies, you also won’t want people to be able to view files by simply using the direct Amazon S3 URL for the file. Instead, you want them to only access the files by using the Amazon CloudFront URL, so your content remains protected.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Update the Amazon S3 bucket security groups to only allow traffic from the Amazon CloudFront security group</strong> - Amazon S3 buckets don't have security groups, hence this is an incorrect option.</p>\n\n<p><strong>Make the Amazon S3 bucket public</strong> - If the Amazon S3 bucket is made public, it can be accessed by anyone directly. This is not the requirement.</p>\n\n<p><strong>Create a bucket policy to only authorize the IAM role attached to the Amazon CloudFront distribution</strong> -  You cannot attach IAM roles to the Amazon CloudFront distribution. Here you need to use an OAI.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-restricting-access-to-s3.html</a></p>\n","answers":["<p>Create a bucket policy to only authorize the IAM role attached to the Amazon CloudFront distribution</p>","<p>Update the Amazon S3 bucket security groups to only allow traffic from the Amazon CloudFront security group</p>","<p>Make the Amazon S3 bucket public</p>","<p>Create an origin access identity (OAI) and update the Amazon S3 Bucket Policy</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"As a Solutions Architect, you would like to completely secure the communications between your Amazon CloudFront distribution and your Amazon S3 bucket which contains the static files for your website. Users should only be able to access the Amazon S3 bucket through Amazon CloudFront and not directly.\n\nWhat do you recommend?","related_lectures":[]},{"_class":"assessment","id":130168933,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media company is modernizing its legacy image processing application by migrating it from an on-premises environment to AWS. The application handles a high volume of image transformation jobs, generating large output files. To support rapid growth, the company wants a cloud-native solution that automatically scales, minimizes manual intervention, and avoids managing servers or infrastructure. The team also wants to improve workflow automation to handle task sequencing and job state transitions.</p>\n\n<p>Which solution best meets these requirements while ensuring the least operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Batch to process image jobs. Orchestrate the workflow using AWS Step Functions and store output files in Amazon S3</strong></p>\n\n<p>This solution offers the least operational overhead and fully leverages AWS-managed services. AWS Batch automatically provisions and scales compute resources for job execution without requiring infrastructure management. Step Functions provides a visual, serverless way to orchestrate complex workflows with built-in state management and retries. Amazon S3 is ideal for storing large output files due to its durability, scalability, and integration with Batch and Step Functions. This stack meets all requirements: scalable, automated, and infrastructure-free.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy Amazon Elastic Kubernetes Service (Amazon EKS) with self-managed EC2 worker nodes for image processing. Use Amazon SQS to queue jobs and store processed outputs in Amazon EBS volumes</strong> - While Amazon EKS offers powerful orchestration for containerized workloads, self-managed EC2 nodes introduce significant infrastructure management burden—contradicting the company's goal of minimal operational overhead. This setup requires patching, capacity planning, and node lifecycle management. Additionally, using Amazon EBS for storing large shared outputs is not optimal for distributed processing scenarios. The operational complexity of EKS with EC2 makes this solution less desirable for a serverless-first use case.</p>\n\n<p><strong>Use a combination of AWS Lambda functions and EC2 Spot Instances for processing. Store processed images in Amazon FSx</strong> - Although AWS Lambda is great for lightweight processing, it's not designed for compute-heavy or long-running image processing workloads - especially those involving large file sizes. EC2 Spot Instances are cost-effective but can be interrupted at any time, making them risky for non-idempotent or large processing jobs. Additionally, Amazon FSx is better suited for Windows-based or high-performance POSIX-compliant file systems, which adds complexity unless strictly required. This hybrid setup also requires managing Spot capacity and lifecycle.</p>\n\n<p><strong>Use Amazon EC2 Auto Scaling groups with a static fleet of instances for image processing. Trigger each job through Step Functions and store results on attached EBS volumes</strong> - Even though EC2 Auto Scaling automates instance launch and termination, it still requires manual management of instance images, EBS volume provisioning, software patching, and monitoring. The need to orchestrate instance behavior and EBS lifecycle management increases operational effort. EBS is not a good fit for scalable or concurrent access to processed files, and managing storage at the instance level introduces complexity. This architecture contradicts the requirement to avoid infrastructure management.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html\">https://docs.aws.amazon.com/batch/latest/userguide/what-is-batch.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html\">https://docs.aws.amazon.com/step-functions/latest/dg/welcome.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html\">https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html</a></p>\n","answers":["<p>Deploy Amazon Elastic Kubernetes Service (Amazon EKS) with self-managed EC2 worker nodes for image processing. Use Amazon SQS to queue jobs and store processed outputs in Amazon EBS volumes</p>","<p>Use AWS Batch to process image jobs. Orchestrate the workflow using AWS Step Functions and store output files in Amazon S3</p>","<p>Use a combination of AWS Lambda functions and EC2 Spot Instances for processing. Store processed images in Amazon FSx</p>","<p>Use Amazon EC2 Auto Scaling groups with a static fleet of instances for image processing. Trigger each job through Step Functions and store results on attached EBS volumes</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"A media company is modernizing its legacy image processing application by migrating it from an on-premises environment to AWS. The application handles a high volume of image transformation jobs, generating large output files. To support rapid growth, the company wants a cloud-native solution that automatically scales, minimizes manual intervention, and avoids managing servers or infrastructure. The team also wants to improve workflow automation to handle task sequencing and job state transitions.\n\nWhich solution best meets these requirements while ensuring the least operational overhead?","related_lectures":[]},{"_class":"assessment","id":130168955,"assessment_type":"multiple-choice","prompt":{"question":"<p>The systems administrator at a company wants to set up a highly available architecture for a bastion host solution.</p>\n\n<p>As a solutions architect, which of the following options would you recommend as the solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a public Network Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</strong></p>\n\n<p>Network Load Balancer is best suited for use-cases involving low latency and high throughput workloads that involve scaling to millions of requests per second. Network Load Balancer operates at the connection level (Layer 4), routing connections to targets - Amazon EC2 instances, microservices, and containers – within Amazon Virtual Private Cloud (Amazon VPC) based on IP protocol data.</p>\n\n<p>Including bastion hosts in your VPC environment enables you to securely connect to your Linux instances without exposing your environment to the Internet. After you set up your bastion hosts, you can access the other instances in your VPC through Secure Shell (SSH) connections on Linux. Bastion hosts are also configured with security groups to provide fine-grained ingress control.</p>\n\n<p>You need to remember that Bastion Hosts are using the SSH protocol, which is a TCP based protocol on port 22. They must be publicly accessible.</p>\n\n<p>Here, the correct answer is to use a Network Load Balancer, which supports TCP traffic, and will automatically allow you to connect to the Amazon EC2 instance in the backend.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an elastic IP address (EIP) and assign it to all Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</strong> - An elastic IP address (EIP) can only be attached to one Amazon EC2 instance at a time, so it won't provide you a highly available setup on its own. Note that if we had two Elastic IPs and two Bastion Hosts, this would work.</p>\n\n<p><strong>Create a VPC Endpoint for a fleet of Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</strong> - A VPC endpoint enables you to privately connect your VPC to supported AWS services and VPC endpoint services powered by AWS PrivateLink without requiring an internet gateway, NAT device, VPN connection, or AWS Direct Connect connection. Instances in your VPC do not require public IP addresses to communicate with resources in the service. Traffic between your VPC and the other service does not leave the Amazon network.</p>\n\n<p>VPC Endpoints are not used on top of Amazon EC2 instances. They're a way to access AWS services privately within your VPC (without using the public internet). This is a distractor.</p>\n\n<p><strong>Create a public Application Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</strong> - Application Load Balancer (ALB) operates at the request level (layer 7), routing traffic to targets – Amazon EC2 instances, containers, IP addresses and AWS Lambda functions based on the content of the request. Ideal for advanced load balancing of HTTP and HTTPS traffic, Application Load Balancer provides advanced request routing targeted at delivery of modern application architectures, including microservices and container-based applications.</p>\n\n<p>An Application Load Balancer only supports HTTP traffic, which is layer 7, while the SSH protocol is based on TCP and is layer 4. So, the Application Load Balancer doesn't work.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/quickstart/latest/linux-bastion/architecture.html\">https://docs.aws.amazon.com/quickstart/latest/linux-bastion/architecture.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html\">https://docs.aws.amazon.com/vpc/latest/userguide/vpc-endpoints.html</a></p>\n","answers":["<p>Create a public Network Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</p>","<p>Create a public Application Load Balancer that links to Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</p>","<p>Create a VPC Endpoint for a fleet of Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</p>","<p>Create an elastic IP address (EIP) and assign it to all Amazon EC2 instances that are bastion hosts managed by an Auto Scaling Group</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"The systems administrator at a company wants to set up a highly available architecture for a bastion host solution.\n\nAs a solutions architect, which of the following options would you recommend as the solution?","related_lectures":[]},{"_class":"assessment","id":130168937,"assessment_type":"multi-select","prompt":{"question":"<p>You are deploying a critical monolith application that must be deployed on a single web server, as it hasn't been created to work in distributed mode. Still, you want to make sure your setup can automatically recover from the failure of an Availability Zone (AZ).</p>\n\n<p>Which of the following options should be combined to form the MOST cost-efficient solution? (Select three)</p>\n","relatedLectureIds":"","feedbacks":["","","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=1, desired=1</strong></p>\n\n<p>Amazon EC2 Auto Scaling helps you ensure that you have the correct number of Amazon EC2 instances available to handle the load for your application. You create collections of EC2 instances, called Auto Scaling groups. You can specify the minimum number of instances in each Auto Scaling group, and Amazon EC2 Auto Scaling ensures that your group never goes below this size.</p>\n\n<p>So we have an Auto Scaling Group with desired=1, across two AZ, so that if an instance goes down, it is automatically recreated in another AZ. So this option is correct.</p>\n\n<p><strong>Create an elastic IP address (EIP) and use the Amazon EC2 user-data script to attach it</strong></p>\n\n<p>Application Load Balancer (ALB) operates at the request level (layer 7), routing traffic to targets – Amazon EC2 instances, containers, IP addresses, and Lambda functions based on the content of the request. Ideal for advanced load balancing of HTTP and HTTPS traffic, Application Load Balancer provides advanced request routing targeted at delivery of modern application architectures, including microservices and container-based applications.</p>\n\n<p>An Elastic IP address is a static IPv4 address designed for dynamic cloud computing. An Elastic IP address is associated with your AWS account. With an Elastic IP address, you can mask the failure of an instance or software by rapidly remapping the address to another instance in your account.</p>\n\n<p>Now, between the ALB and the Elastic IP. If we use an ALB, things will still work, but we will have to pay for the provisioned ALB which sends traffic to only one Amazon EC2 instance. Instead, to minimize costs, we must use an Elastic IP.</p>\n\n<p><strong>Assign an Amazon EC2 Instance Role to perform the necessary API calls</strong></p>\n\n<p>For that Elastic IP to be attached to our Amazon EC2 instance, we must use an EC2 user data script, and our Amazon EC2 instance must have the correct IAM permissions to perform the API call, so we need an Amazon EC2 instance role.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create a Spot Fleet request</strong> - A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price. Because Spot Instances enable you to request unused EC2 instances at steep discounts, you can lower your Amazon EC2 costs significantly. The hourly price for a Spot Instance is called a Spot price.</p>\n\n<p>The Spot Fleet selects the Spot Instance pools that meet your needs and launches Spot Instances to meet the target capacity for the fleet. By default, Spot Fleets are set to maintain target capacity by launching replacement instances after Spot Instances in the fleet are terminated.</p>\n\n<p>Spot Fleets requests would not fit our purpose as we are looking at a critical application. Spot instances can be terminated. So this option is incorrect.</p>\n\n<p><strong>Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=2, desired=2</strong> - An Auto Scaling Group with desired=2 would create two instances, and this won't work for us as our monolith application is not made to work with two instances as per the given use-case.</p>\n\n<p><strong>Create an Application Load Balancer and a target group with the instance(s) of the Auto Scaling Group</strong> - If we use an Application Load Balancer (ALB), things will still work, but we will have to pay for the provisioned ALB which sends traffic to only one Amazon EC2 instance. So this option is not correct.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/elastic-ip-addresses-eip.html</a></p>\n","answers":["<p>Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=1, desired=1</p>","<p>Assign an Amazon EC2 Instance Role to perform the necessary API calls</p>","<p>Create an elastic IP address (EIP) and use the Amazon EC2 user-data script to attach it</p>","<p>Create a Spot Fleet request</p>","<p>Create an Application Load Balancer and a target group with the instance(s) of the Auto Scaling Group</p>","<p>Create an auto-scaling group that spans across 2 Availability Zones, which min=1, max=2, desired=2</p>"]},"correct_response":["a","b","c"],"section":"Design Resilient Architectures","question_plain":"You are deploying a critical monolith application that must be deployed on a single web server, as it hasn't been created to work in distributed mode. Still, you want to make sure your setup can automatically recover from the failure of an Availability Zone (AZ).\n\nWhich of the following options should be combined to form the MOST cost-efficient solution? (Select three)","related_lectures":[]},{"_class":"assessment","id":130168939,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global photography startup hosts a static image-sharing site on an Amazon S3 bucket. The website allows users from different parts of the world to upload, view, and download photos through their mobile devices. As the platform has gained popularity, users have started experiencing latency issues, especially when uploading and downloading images. The team needs a solution to enhance global performance but wants to implement it with minimal development effort and without redesigning the application.</p>\n\n<p>Which solution will most effectively address the performance issues with the least operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Deploy an Amazon CloudFront distribution with the S3 bucket as the origin to improve download speeds. Enable S3 Transfer Acceleration to reduce upload latency for global users</strong></p>\n\n<p>This solution provides a low-effort, AWS-native solution that significantly improves the performance of both downloads and uploads for a global user base—without requiring changes to the application architecture. By configuring Amazon CloudFront, a content delivery network (CDN), the company ensures that image downloads are served from edge locations close to the users, reducing latency and improving load times. To address upload performance, enabling S3 Transfer Acceleration allows users to upload images via AWS edge locations, which then route data over optimized AWS backbone networks to the S3 bucket. This minimizes latency for uploads, especially from distant regions. Both features are simple to enable, require no infrastructure provisioning, and are specifically designed for S3-based static sites—making this solution the most effective and efficient choice.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Migrate the website from S3 to Amazon EC2 instances in multiple Regions. Use an Application Load Balancer with AWS Global Accelerator to distribute global traffic and reduce latency</strong> - While technically feasible, this approach involves significant infrastructure changes, including deploying and managing EC2 instances, setting up web servers, maintaining application code, and configuring load balancing. It also deviates from the static website model hosted in S3, increasing operational complexity and cost. This option is over-engineered for the problem and does not meet the requirement for minimal implementation effort.</p>\n\n<p><strong>Create multiple S3 buckets in different Regions and replicate image data based on user location. Configure CloudFront to upload and download from the nearest bucket</strong> - This approach attempts to manually geo-distribute data using cross-Region replication and routing logic. However, it introduces significant configuration complexity, including replication management, custom logic to determine upload destinations, and download redirection. Additionally, CloudFront is designed for read-only access, not for direct uploads. Uploads via CloudFront require advanced signed URLs and are not recommended for typical user-submitted content. This option fails the simplicity requirement.</p>\n\n<p><strong>Enable AWS Global Accelerator on the S3 bucket to accelerate both uploads and downloads. Reconfigure the website to route requests through the accelerator</strong> - AWS Global Accelerator does not support S3 buckets as direct endpoints. It’s designed for improving performance for global applications deployed on EC2, ALB, or NLB, not for S3 static websites. There’s no direct integration between Global Accelerator and S3 unless the S3 bucket is fronted by another service like CloudFront or ALB. Therefore, this option is not technically valid and doesn’t meet the stated requirements.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistS3AndCustomOrigins.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/DownloadDistS3AndCustomOrigins.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoints.html\">https://docs.aws.amazon.com/global-accelerator/latest/dg/about-endpoints.html</a></p>\n","answers":["<p>Deploy an Amazon CloudFront distribution with the S3 bucket as the origin to improve download speeds. Enable S3 Transfer Acceleration to reduce upload latency for global users</p>","<p>Migrate the website from S3 to Amazon EC2 instances in multiple Regions. Use an Application Load Balancer with AWS Global Accelerator to distribute global traffic and reduce latency</p>","<p>Create multiple S3 buckets in different Regions and replicate image data based on user location. Configure CloudFront to upload and download from the nearest bucket</p>","<p>Enable AWS Global Accelerator on the S3 bucket to accelerate both uploads and downloads. Reconfigure the website to route requests through the accelerator</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A global photography startup hosts a static image-sharing site on an Amazon S3 bucket. The website allows users from different parts of the world to upload, view, and download photos through their mobile devices. As the platform has gained popularity, users have started experiencing latency issues, especially when uploading and downloading images. The team needs a solution to enhance global performance but wants to implement it with minimal development effort and without redesigning the application.\n\nWhich solution will most effectively address the performance issues with the least operational overhead?","related_lectures":[]},{"_class":"assessment","id":130168941,"assessment_type":"multiple-choice","prompt":{"question":"<p>You have deployed a database technology that has a synchronous replication mode to survive disasters in data centers. The database is therefore deployed on two Amazon EC2 instances in two Availability Zones (AZs). The database must be publicly available so you have deployed the Amazon EC2 instances in public subnets. The replication protocol currently uses the Amazon EC2 public IP addresses.</p>\n\n<p>What can you do to decrease the replication cost?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use the Amazon EC2 instances private IP for the replication</strong></p>\n\n<p>The source of the cost is that traffic between two EC2 instances is going over the public internet, thus incurring high costs. Here, the correct answer is to use Private IP, so that the network remains private, for a minimal cost.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Assign elastic IP address (EIP) to the Amazon EC2 instances and use them for the replication</strong> - Using Elastic IPs will not solve the problem as the traffic will still be going over the public internet.</p>\n\n<p><strong>Create a Private Link between the two Amazon EC2 instances</strong> - AWS PrivateLink simplifies the security of data shared with cloud-based applications by eliminating the exposure of data to the public Internet. AWS PrivateLink provides private connectivity between VPCs, AWS services, and on-premises applications, securely on the Amazon network.</p>\n\n<p>Private Link is a distractor in this question. Private Link is leveraged to create a private connection between an application that is fronted by an NLB in an account, and an Elastic Network Interface (ENI) in another account, without the need of VPC peering and allowing the connections between the two to remain within the AWS network.</p>\n\n<p><strong>Use an Elastic Fabric Adapter (EFA)</strong> - The Elastic Fabric Adapter (EFA) is a network interface for Amazon EC2 instances that enables customers to run HPC applications requiring high levels of inter-instance communications, like computational fluid dynamics, weather modeling, and reservoir simulation, at scale on AWS. This option is not relevant to the given use-case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/privatelink/\">https://aws.amazon.com/privatelink/</a></p>\n\n<p><a href=\"https://aws.amazon.com/hpc/efa/\">https://aws.amazon.com/hpc/efa/</a></p>\n","answers":["<p>Use the Amazon EC2 instances private IP for the replication</p>","<p>Assign elastic IP address (EIP) to the Amazon EC2 instances and use them for the replication</p>","<p>Create a Private Link between the two Amazon EC2 instances</p>","<p>Use an Elastic Fabric Adapter (EFA)</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"You have deployed a database technology that has a synchronous replication mode to survive disasters in data centers. The database is therefore deployed on two Amazon EC2 instances in two Availability Zones (AZs). The database must be publicly available so you have deployed the Amazon EC2 instances in public subnets. The replication protocol currently uses the Amazon EC2 public IP addresses.\n\nWhat can you do to decrease the replication cost?","related_lectures":[]},{"_class":"assessment","id":130168943,"assessment_type":"multiple-choice","prompt":{"question":"<p>Your application is deployed on Amazon EC2 instances fronted by an Application Load Balancer. Recently, your infrastructure has come under attack. Attackers perform over 100 requests per second, while your normal users only make about 5 requests per second.</p>\n\n<p>How can you efficiently prevent attackers from overwhelming your application?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use an AWS Web Application Firewall (AWS WAF) and setup a rate-based rule</strong></p>\n\n<p>AWS Web Application Firewall (AWS WAF) is a web application firewall that helps protect your web applications or APIs against common web exploits that may affect availability, compromise security, or consume excessive resources. AWS WAF gives you control over how traffic reaches your applications by enabling you to create security rules that block common attack patterns, such as SQL injection or cross-site scripting, and rules that filter out specific traffic patterns you define.</p>\n\n<p>The correct answer is to use WAF (which has integration on top of your ALB) and define a rate-based rule.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure Sticky Sessions on the Application Load Balancer</strong> - Application Load Balancer (ALB) operates at the request level (layer 7), routing traffic to targets – Amazon EC2 instances, containers, IP addresses and Lambda functions based on the content of the request. Ideal for advanced load balancing of HTTP and HTTPS traffic, Application Load Balancer provides advanced request routing targeted at delivery of modern application architectures, including microservices and container-based applications.</p>\n\n<p>Sticky Sessions on your Application Load Balancer is a distractor here. Sticky sessions are a mechanism to route requests from the same client to the same target. Application Load Balancer supports sticky sessions using load balancer generated cookies. If you enable sticky sessions, the same target receives the request and can use the cookie to recover the session context.</p>\n\n<p><strong>Define a network access control list (network ACL) on your Application Load Balancer</strong> - A network access control list (network ACL) does not work, as this only helps to block specific IPs. On top of things, network access control list (network ACL) is defined at the subnet level, and not for an Application Load Balancer.</p>\n\n<p><strong>Use AWS Shield Advanced and setup a rate-based rule</strong> - AWS Shield is a managed Distributed Denial of Service (DDoS) protection service that safeguards applications running on AWS. AWS Shield provides always-on detection and automatic inline mitigations that minimize application downtime and latency, so there is no need to engage AWS Support to benefit from DDoS protection. There are two tiers of AWS Shield - Standard and Advanced.</p>\n\n<p>AWS Shield Advanced provides enhanced resource-specific detection and employs advanced mitigation and routing techniques for sophisticated or larger attacks.</p>\n\n<p>AWS Shield Advanced will give you DDoS protection overall, and you cannot set up rate-based rules in Shield.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/waf/\">https://aws.amazon.com/waf/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html\">https://docs.aws.amazon.com/waf/latest/developerguide/waf-rule-statement-type-rate-based.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/shield/\">https://aws.amazon.com/shield/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html#sticky-sessions\">https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-target-groups.html#sticky-sessions</a></p>\n","answers":["<p>Use an AWS Web Application Firewall (AWS WAF) and setup a rate-based rule</p>","<p>Use AWS Shield Advanced and setup a rate-based rule</p>","<p>Define a network access control list (network ACL) on your Application Load Balancer</p>","<p>Configure Sticky Sessions on the Application Load Balancer</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"Your application is deployed on Amazon EC2 instances fronted by an Application Load Balancer. Recently, your infrastructure has come under attack. Attackers perform over 100 requests per second, while your normal users only make about 5 requests per second.\n\nHow can you efficiently prevent attackers from overwhelming your application?","related_lectures":[]},{"_class":"assessment","id":130168945,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company is experiencing stability issues with their cluster of self-managed RabbitMQ message brokers and the company now wants to explore an alternate solution on AWS.</p>\n\n<p>As a solutions architect, which of the following AWS services would you recommend that can provide support for quick and easy migration from RabbitMQ?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon MQ</strong></p>\n\n<p>Amazon MQ is a managed message broker service for Apache ActiveMQ that makes it easy to set up and operate message brokers in the cloud. Message brokers allow different software systems–often using different programming languages, and on different platforms–to communicate and exchange information. If an organization is using messaging with existing applications and wants to move the messaging service to the cloud quickly and easily, AWS recommends Amazon MQ for such a use case. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Simple Notification Service (Amazon SNS)</strong> - Amazon Simple Notification Service (Amazon SNS) is a highly available, durable, secure, fully managed pub/sub messaging service that enables you to decouple microservices, distributed systems, and serverless applications. Amazon SNS provides topics for high-throughput, push-based, many-to-many messaging. SNS does not provide support for migration from RabbitMQ as its a fully managed pub/sub messaging service. Hence this option is incorrect.</p>\n\n<p><strong>Amazon Simple Queue Service (Amazon SQS) Standard</strong> - Amazon SQS Standard offers a reliable, highly scalable hosted queue for storing messages as they travel between computers. Amazon SQS lets you easily move data between distributed application components and helps you build applications in which messages are processed independently (with message-level ack/fail semantics), such as automated workflows. SQS Standard does not provide support for migration from RabbitMQ. Hence this option is incorrect.</p>\n\n<p><strong>Amazon SQS FIFO (First-In-First-Out)</strong> - Amazon SQS FIFO (First-In-First-Out) has all the capabilities of the standard queue. They are used when the order of operations and events is critical, or where duplicates can't be tolerated. SQS FIFO does not provide support for migration from RabbitMQ. Hence this option is incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/amazon-mq/\">https://aws.amazon.com/amazon-mq/</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/compute/migrating-from-rabbitmq-to-amazon-mq/\">https://aws.amazon.com/blogs/compute/migrating-from-rabbitmq-to-amazon-mq/</a></p>\n","answers":["<p>Amazon Simple Notification Service (Amazon SNS)</p>","<p>Amazon Simple Queue Service (Amazon SQS) Standard</p>","<p>Amazon MQ</p>","<p>Amazon SQS FIFO (First-In-First-Out)</p>"]},"correct_response":["c"],"section":"Design Resilient Architectures","question_plain":"A company is experiencing stability issues with their cluster of self-managed RabbitMQ message brokers and the company now wants to explore an alternate solution on AWS.\n\nAs a solutions architect, which of the following AWS services would you recommend that can provide support for quick and easy migration from RabbitMQ?","related_lectures":[]},{"_class":"assessment","id":130168947,"assessment_type":"multi-select","prompt":{"question":"<p>A digital media streaming company wants to use Amazon CloudFront to distribute its content only to its service subscribers. As a solutions architect, which of the following solutions would you suggest to deliver restricted content to the bona fide end users? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Use Amazon CloudFront signed URLs</strong></p>\n\n<p>Many companies that distribute content over the internet want to restrict access to documents, business data, media streams, or content that is intended for selected users, for example, users who have paid a fee.</p>\n\n<p>To securely serve this private content by using Amazon CloudFront, you can do the following:</p>\n\n<p>Require that your users access your private content by using special Amazon CloudFront signed URLs or signed cookies.</p>\n\n<p>A signed URL includes additional information, for example, expiration date and time, that gives you more control over access to your content. So this is a correct option.</p>\n\n<p><strong>Use Amazon CloudFront signed cookies</strong></p>\n\n<p>Amazon CloudFront signed cookies allow you to control who can access your content when you don't want to change your current URLs or when you want to provide access to multiple restricted files, for example, all of the files in the subscribers' area of a website. So this is also a correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Require HTTPS for communication between Amazon CloudFront and your custom origin</strong></p>\n\n<p><strong>Require HTTPS for communication between Amazon CloudFront and your S3 origin</strong></p>\n\n<p>Requiring HTTPS for communication between Amazon CloudFront and your custom origin (or S3 origin) only enables secure access to the underlying content. You cannot use HTTPS to restrict access to your private content. So both these options are incorrect.</p>\n\n<p><strong>Forward HTTPS requests to the origin server by using the ECDSA or RSA ciphers</strong> - This option is just added as a distractor. You cannot use HTTPS to restrict access to your private content.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-urls.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html\">https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/private-content-signed-cookies.html</a></p>\n","answers":["<p>Use Amazon CloudFront signed URLs</p>","<p>Require HTTPS for communication between Amazon CloudFront and your custom origin</p>","<p>Require HTTPS for communication between Amazon CloudFront and your S3 origin</p>","<p>Forward HTTPS requests to the origin server by using the ECDSA or RSA ciphers</p>","<p>Use Amazon CloudFront signed cookies</p>"]},"correct_response":["a","e"],"section":"Design Resilient Architectures","question_plain":"A digital media streaming company wants to use Amazon CloudFront to distribute its content only to its service subscribers. As a solutions architect, which of the following solutions would you suggest to deliver restricted content to the bona fide end users? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168949,"assessment_type":"multi-select","prompt":{"question":"<p>The engineering team at an e-commerce company wants to set up a custom domain for internal usage such as internaldomainexample.com. The team wants to use the private hosted zones feature of Amazon Route 53 to accomplish this.</p>\n\n<p>Which of the following settings of the VPC need to be enabled? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>enableDnsHostnames</strong></p>\n\n<p><strong>enableDnsSupport</strong></p>\n\n<p>A private hosted zone is a container for records for a domain that you host in one or more Amazon virtual private clouds (VPCs). You create a hosted zone for a domain (such as example.com), and then you create records to tell Amazon Route 53 how you want traffic to be routed for that domain within and among your VPCs.</p>\n\n<p>For each VPC that you want to associate with the Route 53 hosted zone, change the following VPC settings to true:</p>\n\n<p>enableDnsHostnames</p>\n\n<p>enableDnsSupport</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>enableVpcSupport</strong></p>\n\n<p><strong>enableVpcHostnames</strong></p>\n\n<p><strong>enableDnsDomain</strong></p>\n\n<p>The options enableVpcSupport, enableVpcHostnames and enableDnsDomain have been added as distractors.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-creating.html\">https://docs.aws.amazon.com/Route53/latest/DeveloperGuide/hosted-zone-private-creating.html</a></p>\n","answers":["<p>enableVpcSupport</p>","<p>enableVpcHostnames</p>","<p>enableDnsHostnames</p>","<p>enableDnsDomain</p>","<p>enableDnsSupport</p>"]},"correct_response":["c","e"],"section":"Design Resilient Architectures","question_plain":"The engineering team at an e-commerce company wants to set up a custom domain for internal usage such as internaldomainexample.com. The team wants to use the private hosted zones feature of Amazon Route 53 to accomplish this.\n\nWhich of the following settings of the VPC need to be enabled? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168951,"assessment_type":"multiple-choice","prompt":{"question":"<p>A healthcare analytics firm operates a backend application within a private subnet of its VPC. The application is fronted by an Application Load Balancer (ALB) and accesses Amazon S3 to store medical reports. The VPC includes both a NAT gateway and an internet gateway, but the company's strict compliance policy prohibits any data traffic from traversing the internet. The team must redesign the architecture to comply with the security policy and improve cost-efficiency.</p>\n\n<p>Which solution best satisfies these requirements in the most cost-effective manner?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Create a gateway VPC endpoint for Amazon S3 and update the route table for the private subnet to direct S3 traffic through the endpoint</strong></p>\n\n<p>This solution provides a secure and cost-effective method for private workloads in a VPC to access Amazon S3 without routing traffic over the internet. A gateway VPC endpoint for S3 integrates directly with the VPC route tables, enabling communication between EC2 instances and S3 over the AWS private network. This eliminates the need for a NAT gateway or internet gateway for S3 API calls, aligning with the company's security policy that prohibits internet-based traffic. Moreover, gateway endpoints are free of hourly and per-GB data processing charges, making them more cost-efficient than interface endpoints or NAT-based solutions. This solution offers high scalability, no operational complexity, and strong compliance with security requirements.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q64-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create an S3 interface VPC endpoint and modify the security group to allow access from the application’s private subnet. Route all S3 traffic through the interface endpoint</strong> - While an interface VPC endpoint (powered by AWS PrivateLink) is valid for many AWS services, it is not the most cost-effective or appropriate choice for accessing Amazon S3. For S3, AWS recommends using a gateway VPC endpoint, which is purpose-built, incurs no hourly data processing charges, and integrates directly with route tables. In contrast, interface endpoints for S3 introduce per-hour and per-GB data processing fees and are more commonly used when you need fine-grained control with security groups, and not for high-volume object storage access. Choosing an interface endpoint here violates both the cost-efficiency and minimal overhead goals of the question.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q64-i3.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html#types-of-vpc-endpoints-for-s3\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html#types-of-vpc-endpoints-for-s3</a></p>\n\n<p><strong>Modify the S3 bucket policy to allow requests only from the Elastic IP address associated with the NAT gateway</strong> - While this restricts access from specific IPs, it still causes S3 API calls to traverse the public internet via the NAT gateway, violating the security policy that prohibits internet-based traffic. Furthermore, it incurs additional NAT gateway data processing costs. This approach may restrict access, but does not solve the core compliance issue.</p>\n\n<p><strong>Create a VPC peering connection with another VPC that has direct access to S3. Forward the S3 API requests through the peered VPC using proxy EC2 instances</strong> - This approach is overly complex and expensive. VPC peering does not support transitive routing or S3-specific integration. Proxying S3 traffic through EC2 instances introduces unnecessary latency, potential bottlenecks, and violates AWS's best practice of using native integration points like VPC endpoints for accessing S3. Additionally, it involves managing EC2 proxy infrastructure, which increases cost and operational burden.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/gateway-endpoints.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html#types-of-vpc-endpoints-for-s3\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/privatelink-interface-endpoints.html#types-of-vpc-endpoints-for-s3</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html\">https://docs.aws.amazon.com/vpc/latest/privatelink/concepts.html</a></p>\n","answers":["<p>Create an S3 interface VPC endpoint and modify the security group to allow access from the application’s private subnet. Route all S3 traffic through the interface endpoint</p>","<p>Modify the S3 bucket policy to allow requests only from the Elastic IP address associated with the NAT gateway</p>","<p>Create a gateway VPC endpoint for Amazon S3 and update the route table for the private subnet to direct S3 traffic through the endpoint</p>","<p>Create a VPC peering connection with another VPC that has direct access to S3. Forward the S3 API requests through the peered VPC using proxy EC2 instances</p>"]},"correct_response":["c"],"section":"Design Cost-Optimized Architectures","question_plain":"A healthcare analytics firm operates a backend application within a private subnet of its VPC. The application is fronted by an Application Load Balancer (ALB) and accesses Amazon S3 to store medical reports. The VPC includes both a NAT gateway and an internet gateway, but the company's strict compliance policy prohibits any data traffic from traversing the internet. The team must redesign the architecture to comply with the security policy and improve cost-efficiency.\n\nWhich solution best satisfies these requirements in the most cost-effective manner?","related_
