et/1b6453892473a467d07372d45eb05abc2031647a/2019/07/26/Selection_015.png\">\nvia - <a href=\"https://aws.amazon.com/blogs/compute/simple-two-way-messaging-using-the-amazon-sqs-temporary-queue-client/\">https://aws.amazon.com/blogs/compute/simple-two-way-messaging-using-the-amazon-sqs-temporary-queue-client/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Simple Queue Service (Amazon SQS) dead-letter queues</strong> - Amazon SQS supports dead-letter queues, which other queues (source queues) can target for messages that can't be processed (consumed) successfully. Dead-letter queues are useful for debugging your application or messaging system because they let you isolate problematic messages to determine why their processing doesn't succeed. Amazon SQS does not create the dead-letter queue automatically. You must first create the queue before using it as a dead-letter queue.</p>\n\n<p><strong>Amazon Simple Queue Service (Amazon SQS) FIFO queues</strong> - Amazon SQS FIFO (First-In-First-Out) queues are designed to enhance messaging between applications when the order of operations and events is critical, or where duplicates can't be tolerated. FIFO queues also provide exactly-once processing but have a limited number of transactions per second (TPS).</p>\n\n<p><strong>Amazon Simple Queue Service (Amazon SQS) delay queues</strong> - Delay queues let you postpone the delivery of new messages to a queue for a number of seconds, for example, when your consumer application needs additional time to process messages. If you create a delay queue, any messages that you send to the queue remain invisible to consumers for the duration of the delay period. The default (minimum) delay for a queue is 0 seconds. The maximum is 15 minutes.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-temporary-queues.html\">https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-temporary-queues.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/compute/simple-two-way-messaging-using-the-amazon-sqs-temporary-queue-client/\">https://aws.amazon.com/blogs/compute/simple-two-way-messaging-using-the-amazon-sqs-temporary-queue-client/</a></p>\n","answers":["<p>Amazon Simple Queue Service (Amazon SQS) dead-letter queues</p>","<p>Amazon Simple Queue Service (Amazon SQS) FIFO queues</p>","<p>Amazon Simple Queue Service (Amazon SQS) temporary queues</p>","<p>Amazon Simple Queue Service (Amazon SQS) delay queues</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A development team is looking for a solution that saves development time and deployment costs for an application that uses a high-throughput request-response message pattern.\n\nWhich of the following Amazon SQS queue types is the best fit to meet this requirement?","related_lectures":[]},{"_class":"assessment","id":130168877,"assessment_type":"multiple-choice","prompt":{"question":"<p>The engineering team at an IT company is deploying an Online Transactional Processing (OLTP) application that needs to support relational queries. The application will have unpredictable spikes of usage that the team does not know in advance.</p>\n\n<p>Which database would you recommend using?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Amazon Aurora Serverless</strong></p>\n\n<p>Amazon Aurora Serverless is an on-demand, auto-scaling configuration for Amazon Aurora (MySQL-compatible and PostgreSQL-compatible editions), where the database will automatically start up, shut down, and scale capacity up or down based on your application's needs. It enables you to run your database in the cloud without managing any database instances. It's a simple, cost-effective option for infrequent, intermittent, or unpredictable workloads. The database design for an OLTP application fits the relational model, therefore you can infer an OLTP system as a Relational Database.</p>\n\n<p>Amazon Aurora Serverless is the perfect way to create a database that can scale down to 0 servers, and scale up to many servers, as an OLTP database. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon DynamoDB with Provisioned Capacity and Auto Scaling</strong></p>\n\n<p><strong>Amazon DynamoDB with On-Demand Capacity</strong></p>\n\n<p>Amazon DynamoDB is a key-value and document database that delivers single-digit millisecond performance at any scale. It's a fully managed, multi-region, multi-master, durable database with built-in security, backup and restore, and in-memory caching for internet-scale applications.</p>\n\n<p>Amazon DynamoDB is a NoSQL database and doesn't do relational queries, therefore it's a choice we have to eliminate, even though the two modes proposed here help us cope with an unpredictable amount of usage. So both these options are incorrect.</p>\n\n<p><strong>Amazon ElastiCache</strong> - Amazon ElastiCache allows you to seamlessly set up, run, and scale popular open-Source compatible in-memory data stores in the cloud. Build data-intensive apps or boost the performance of your existing databases by retrieving data from high throughput and low latency in-memory data stores. Amazon ElastiCache is a popular choice for real-time use cases like Caching, Session Stores, Gaming, Geospatial Services, Real-Time Analytics, and Queuing. Amazon Elasticache is used as a caching layer in front of relational databases. Amazon ElastiCache is a NoSQL database and doesn't facilitate relational queries, so this option is ruled out.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/aurora/serverless/\">https://aws.amazon.com/rds/aurora/serverless/</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/\">https://aws.amazon.com/rds/</a></p>\n","answers":["<p>Amazon Aurora Serverless</p>","<p>Amazon ElastiCache</p>","<p>Amazon DynamoDB with Provisioned Capacity and Auto Scaling</p>","<p>Amazon DynamoDB with On-Demand Capacity</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"The engineering team at an IT company is deploying an Online Transactional Processing (OLTP) application that needs to support relational queries. The application will have unpredictable spikes of usage that the team does not know in advance.\n\nWhich database would you recommend using?","related_lectures":[]},{"_class":"assessment","id":130168879,"assessment_type":"multiple-choice","prompt":{"question":"<p>The development team at a company manages a Python based nightly process with a runtime of 30 minutes. The process can withstand any interruptions in its execution and start over again. The process currently runs on the on-premises infrastructure and it needs to be migrated to AWS.</p>\n\n<p>Which of the following options do you recommend as the MOST cost-effective solution?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Run on a Spot Instance with a persistent request type</strong></p>\n\n<p>A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price. Because Spot Instances enable you to request unused Amazon EC2 instances at steep discounts, you can lower your Amazon EC2 costs significantly. The hourly price for a Spot Instance is called a Spot price. The request type (one-time or persistent) determines whether the request is opened again when Amazon EC2 interrupts a Spot Instance or if you stop a Spot Instance. If the request is persistent, the request is opened again after your Spot Instance is interrupted. If the request is persistent and you stop your Spot Instance, the request only opens after you start your Spot Instance.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Run on an Application Load Balancer</strong> - Application Load Balancer operates at the request level (layer 7), routing traffic to targets – Amazon EC2 instances, containers, IP addresses, and AWS Lambda functions based on the content of the request. Ideal for advanced load balancing of HTTP and HTTPS traffic, Application Load Balancer provides advanced request routing targeted at delivery of modern application architectures, including microservices and container-based applications.</p>\n\n<p>Application Load Balancer helps distribute load for HTTP(S) requests. This option has been added as a distractor.</p>\n\n<p><strong>Run on Amazon EMR</strong> - Amazon EMR is the industry-leading cloud big data platform for processing vast amounts of data using open source tools such as Apache Spark, Apache Hive, Apache HBase, Apache Flink, Apache Hudi, and Presto. Amazon EMR uses Hadoop, an open-source framework, to distribute your data and processing across a resizable cluster of Amazon EC2 instances.</p>\n\n<p>Amazon EMR is to run Big Data load that is meant to be run on Hadoop, this is also a distractor.</p>\n\n<p><strong>Run on AWS Lambda</strong> - AWS Lambda lets you run code without provisioning or managing servers. You pay only for the compute time you consume.</p>\n\n<p>AWS Lambda would be the perfect fit if our script could run in less than 15 minutes, as this is the maximum timeout for AWS Lambda.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-requests.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-requests.html</a></p>\n","answers":["<p>Run on a Spot Instance with a persistent request type</p>","<p>Run on Amazon EMR</p>","<p>Run on AWS Lambda</p>","<p>Run on an Application Load Balancer</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"The development team at a company manages a Python based nightly process with a runtime of 30 minutes. The process can withstand any interruptions in its execution and start over again. The process currently runs on the on-premises infrastructure and it needs to be migrated to AWS.\n\nWhich of the following options do you recommend as the MOST cost-effective solution?","related_lectures":[]},{"_class":"assessment","id":130168881,"assessment_type":"multiple-choice","prompt":{"question":"<p>Your e-commerce application is using an Amazon RDS PostgreSQL database and an analytics workload also runs on the same database. When the analytics workload is run, your e-commerce application slows down which further affects your sales.</p>\n\n<p>Which of the following is the MOST cost-optimal solution to fix this issue?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a Read Replica in the same Region as the Master database and point the analytics workload there</strong></p>\n\n<p>Amazon RDS Read Replicas provide enhanced performance and durability for RDS database (DB) instances. They make it easy to elastically scale out beyond the capacity constraints of a single DB instance for read-heavy database workloads. For the MySQL, MariaDB, PostgreSQL, Oracle, and SQL Server database engines, Amazon RDS creates a second DB instance using a snapshot of the source DB instance. It then uses the engines' native asynchronous replication to update the read replica whenever there is a change to the source database instance. Read replicas can be within an Availability Zone, Cross-AZ, or Cross-Region.</p>\n\n<p>Creating a Read Replica is the answer. As we want to minimize the costs, we need to launch the Read Replica in the same Region as you are not charged for the data transfer incurred in replicating data between your source database instance and read replica within the same AWS Region.</p>\n\n<p>Exam Alert:</p>\n\n<p>Please review this comparison vis-a-vis Multi-AZ vs Read Replica for Amazon RDS:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q19-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Enable Multi-AZ for the Amazon RDS database and run the analytics workload on the standby database</strong> - Amazon RDS Multi-AZ deployments provide enhanced availability and durability for RDS database (DB) instances, making them a natural fit for production database workloads. When you provision a Multi-AZ DB Instance, Amazon RDS automatically creates a primary DB Instance and synchronously replicates the data to a standby instance in a different Availability Zone (AZ). Multi-AZ spans at least two Availability Zones within a single region.</p>\n\n<p>Enabling Multi-AZ helps make our database highly-available, but the standby database is not accessible and cannot be used for reads or write. It's just a database that will become primary when the other database encounters a failure. So this option is not correct.</p>\n\n<p><strong>Migrate the analytics application to AWS Lambda</strong>- AWS Lambda lets you run code without provisioning or managing servers. You pay only for the compute time you consume.</p>\n\n<p>Running the application on AWS Lambda will not help, as it will still run against the main database and slow down our e-commerce application.</p>\n\n<p><strong>Create a Read Replica in another Region as the Master database and point the analytics workload there</strong> - This is incorrect because we have to pay for inter-Region data replication charges for the Read Replica, whereas the replication of data within a single Region is free.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/multi-az/\">https://aws.amazon.com/rds/features/multi-az/</a></p>\n\n<p><a href=\"https://aws.amazon.com/rds/features/read-replicas/\">https://aws.amazon.com/rds/features/read-replicas/</a></p>\n","answers":["<p>Create a Read Replica in the same Region as the Master database and point the analytics workload there</p>","<p>Migrate the analytics application to AWS Lambda</p>","<p>Enable Multi-AZ for the Amazon RDS database and run the analytics workload on the standby database</p>","<p>Create a Read Replica in another Region as the Master database and point the analytics workload there</p>"]},"correct_response":["a"],"section":"Design Cost-Optimized Architectures","question_plain":"Your e-commerce application is using an Amazon RDS PostgreSQL database and an analytics workload also runs on the same database. When the analytics workload is run, your e-commerce application slows down which further affects your sales.\n\nWhich of the following is the MOST cost-optimal solution to fix this issue?","related_lectures":[]},{"_class":"assessment","id":130168883,"assessment_type":"multiple-choice","prompt":{"question":"<p>You are looking to build an index of your files in Amazon S3, using Amazon RDS PostgreSQL. To build this index, it is necessary to read the first 250 bytes of each object in Amazon S3, which contains some metadata about the content of the file itself. There are over 100,000 files in your S3 bucket, amounting to 50 terabytes of data.</p>\n\n<p>How can you build this index efficiently?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create an application that will traverse the S3 bucket, issue a Byte Range Fetch for the first 250 bytes, and store that information in Amazon RDS</strong></p>\n\n<p>Amazon Simple Storage Service (Amazon S3) is an object storage service that offers industry-leading scalability, data availability, security, and performance.</p>\n\n<p>Using the Range HTTP header in a GET Object request, you can fetch a byte-range from an object, transferring only the specified portion. You can use concurrent connections to Amazon S3 to fetch different byte ranges from within the same object. This helps you achieve higher aggregate throughput versus a single whole-object request. Fetching smaller ranges of a large object also allows your application to improve retry times when requests are interrupted.</p>\n\n<p>A byte-range request is a perfect way to get the beginning of a file and ensuring we remain efficient during our scan of our Amazon S3 bucket. So this is the correct option.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use the Amazon RDS Import feature to load the data from Amazon S3 to PostgreSQL, and run a SQL query to build the index</strong> - You cannot import data from Amazon S3 into Amazon RDS, so this option is incorrect.</p>\n\n<p><strong>Create an application that will traverse the Amazon S3 bucket, read all the files one by one, extract the first 250 bytes, and store that information in Amazon RDS</strong> - If you build an application that loads all the files from Amazon S3, that would work, but you would read 50TB of data and that may be very expensive and slow. So this option is incorrect.</p>\n\n<p><strong>Create an application that will traverse the Amazon S3 bucket, then use S3 Select Byte Range Fetch parameter to get the first 250 bytes, and store that information in Amazon RDS</strong> - Amazon S3 Select is a new Amazon S3 capability designed to pull out only the data you need from an object, which can dramatically improve the performance and reduce the cost of applications that need to access data in Amazon S3. You cannot use Byte Range Fetch parameter with S3 Select to traverse the Amazon S3 bucket and get the first bytes of a file. So this option is incorrect.</p>\n\n<p>Exam Alert:</p>\n\n<p>Please note that with Amazon S3 Select, you can scan a subset of an object by specifying a range of bytes to query using the ScanRange parameter. This capability lets you parallelize scanning the whole object by splitting the work into separate Amazon S3 Select requests for a series of non-overlapping scan ranges. Use the Amazon S3 Select ScanRange parameter and Start at (Byte) and End at (Byte).</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q20-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/selecting-content-from-objects.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/selecting-content-from-objects.html</a></p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance-guidelines.html#optimizing-performance-guidelines-get-range\">https://docs.aws.amazon.com/AmazonS3/latest/dev/optimizing-performance-guidelines.html#optimizing-performance-guidelines-get-range</a></p>\n","answers":["<p>Create an application that will traverse the S3 bucket, issue a Byte Range Fetch for the first 250 bytes, and store that information in Amazon RDS</p>","<p>Use the Amazon RDS Import feature to load the data from Amazon S3 to PostgreSQL, and run a SQL query to build the index</p>","<p>Create an application that will traverse the Amazon S3 bucket, read all the files one by one, extract the first 250 bytes, and store that information in Amazon RDS</p>","<p>Create an application that will traverse the Amazon S3 bucket, then use S3 Select Byte Range Fetch parameter to get the first 250 bytes, and store that information in Amazon RDS</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"You are looking to build an index of your files in Amazon S3, using Amazon RDS PostgreSQL. To build this index, it is necessary to read the first 250 bytes of each object in Amazon S3, which contains some metadata about the content of the file itself. There are over 100,000 files in your S3 bucket, amounting to 50 terabytes of data.\n\nHow can you build this index efficiently?","related_lectures":[]},{"_class":"assessment","id":130168885,"assessment_type":"multiple-choice","prompt":{"question":"<p>A healthcare company wants to run its applications on single-tenant hardware to meet compliance guidelines.</p>\n\n<p>Which of the following is the MOST cost-effective way of isolating the Amazon EC2 instances to a single tenant?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Dedicated Instances</strong></p>\n\n<p>Dedicated Instances are Amazon EC2 instances that run in a virtual private cloud (VPC) on hardware that's dedicated to a single customer. Dedicated Instances that belong to different AWS accounts are physically isolated at a hardware level, even if those accounts are linked to a single-payer account. However, Dedicated Instances may share hardware with other instances from the same AWS account that are not Dedicated Instances.</p>\n\n<p>A Dedicated Host is also a physical server that's dedicated for your use. With a Dedicated Host, you have visibility and control over how instances are placed on the server.</p>\n\n<p>Differences between Dedicated Hosts and Dedicated Instances:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q21-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html#dedicated-hosts-dedicated-instances\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html#dedicated-hosts-dedicated-instances</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Spot Instances</strong> -  A Spot Instance is an unused Amazon EC2 instance that is available for less than the On-Demand price.  Your Spot Instance runs whenever capacity is available and the maximum price per hour for your request exceeds the Spot price. Any instance present with unused capacity will be allocated. Even though this is cost-effective, it does not fulfill the single-tenant hardware requirement of the client and hence is not the correct option.</p>\n\n<p><strong>Dedicated Hosts</strong> - An Amazon EC2 Dedicated Host is a physical server with Amazon EC2 instance capacity fully dedicated to your use. Dedicated Hosts allow you to use your existing software licenses on Amazon EC2 instances. With a Dedicated Host, you have visibility and control over how instances are placed on the server. This option is costlier than the Dedicated Instance and hence is not the right choice for the current requirement.</p>\n\n<p><strong>On-Demand Instances</strong> - With On-Demand Instances, you pay for the compute capacity by the second with no long-term commitments. You have full control over its lifecycle—you decide when to launch, stop, hibernate, start, reboot, or terminate it. Hardware isolation is not possible and on-demand has one of the costliest instance charges and hence is not the correct answer for current requirements.</p>\n\n<p>High Level Overview of Amazon EC2 Instance Purchase Options:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q21-i2.jpg\">\nvia - <a href=\"https://aws.amazon.com/ec2/pricing/\">https://aws.amazon.com/ec2/pricing/</a></p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html</a></p>\n","answers":["<p>Dedicated Instances</p>","<p>Spot Instances</p>","<p>Dedicated Hosts</p>","<p>On-Demand Instances</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A healthcare company wants to run its applications on single-tenant hardware to meet compliance guidelines.\n\nWhich of the following is the MOST cost-effective way of isolating the Amazon EC2 instances to a single tenant?","related_lectures":[]},{"_class":"assessment","id":130168887,"assessment_type":"multiple-choice","prompt":{"question":"<p>An organization has rolled out a multi-account architecture using AWS Control Tower to isolate development environments. Each developer has their own dedicated AWS account to provision and test workloads. However, the company is concerned about unexpected spikes in resource usage and AWS spending from individual developer accounts. The leadership team wants to implement a cost control mechanism that can proactively enforce budget limits, ensure automatic responses to overspending, and require minimal ongoing administrative effort.</p>\n\n<p>What is the most efficient solution to meet this goal with the least operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use AWS Budgets to define spending thresholds for each developer’s account. Configure budget alerts to notify developers when actual or forecasted usage exceeds the set limit. Attach Budgets actions to automatically apply a restrictive DenyAll IAM policy to the developer’s primary IAM role when the budget threshold is crossed</strong></p>\n\n<p>This solution is optimal because it combines cost visibility, real-time notifications, and automated enforcement in a single, low-maintenance workflow. AWS Budgets allows administrators to define both actual and forecasted budget thresholds at the account level and set up alerts that are automatically triggered when spending exceeds defined limits. By attaching Budgets actions, administrators can enforce access control dynamically — for example, by attaching a DenyAll IAM policy to a user or role when their budget is breached. This ensures that developers cannot launch new costly resources beyond their allocation, providing a proactive and automated way to control costs. Since the setup is centralized and integrated with AWS Organizations and Control Tower, it minimizes operational overhead while maintaining governance.</p>\n\n<p>This option combines budget tracking, notification, and enforcement using native AWS Budgets capabilities. With Budgets actions, administrators can define automated responses (e.g., applying a DenyAll policy) when a user’s spend exceeds the defined budget. This solution is fully serverless, scalable, and low maintenance — ideal for controlling developer costs without requiring daily manual intervention.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Deploy an AWS Lambda function to run daily in each developer’s account. Use the function to analyze cost usage reports via the Cost Explorer API. If costs exceed a predefined threshold, the function invokes an AWS Config remediation rule</strong> - This approach is operationally intensive and not scalable. It relies on building and maintaining custom Lambda logic in each account and introduces complexity with parsing cost data via API. AWS Budgets provides a better way to control cost thresholds and actions using native automation.</p>\n\n<p><strong>Use AWS Service Catalog to restrict developers to predefined resource templates with pricing limits. In each developer account, create a scheduled Lambda function that stops all running resources at the end of the day and and restart these resources at the start of next business day</strong> - Although Service Catalog can enforce standardized deployments, it doesn't prevent developers from incurring costs outside the template constraints. Scheduled resource stoppage helps reduce idle costs but does not prevent overspending due to resource scaling or intensive workloads. Also, maintaining separate Lambda functions per account adds operational complexity.</p>\n\n<p><strong>Use AWS Cost Explorer to enable detailed usage and cost reports for each developer account. Configure daily usage reports to be emailed to developers. Create dashboards for each developer in Cost Explorer, and require them to monitor their resource consumption and take action if they approach spending thresholds</strong> - While AWS Cost Explorer is useful for visualizing and analyzing cost data, it is a passive monitoring tool — it does not provide enforcement capabilities. There is no built-in way to automatically restrict or deny actions when budgets are exceeded. Requiring developers to monitor their own spending is also not scalable and introduces high operational risk. This approach violates the requirement for automated budget enforcement with minimal overhead.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws-cloud-financial-management/get-started-with-aws-budgets-actions/\">https://aws.amazon.com/blogs/aws-cloud-financial-management/get-started-with-aws-budgets-actions/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html\">https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html</a></p>\n","answers":["<p>Deploy an AWS Lambda function to run daily in each developer’s account. Use the function to analyze cost usage reports via the Cost Explorer API. If costs exceed a predefined threshold, the function invokes an AWS Config remediation rule</p>","<p>Use AWS Budgets to define spending thresholds for each developer’s account. Configure budget alerts to notify developers when actual or forecasted usage exceeds the set limit. Attach Budgets actions to automatically apply a restrictive DenyAll IAM policy to the developer’s primary IAM role when the budget threshold is crossed</p>","<p>Use AWS Service Catalog to restrict developers to predefined resource templates with pricing limits. In each developer account, create a scheduled Lambda function that stops all running resources at the end of the day and and restart these resources at the start of next business day</p>","<p>Use AWS Cost Explorer to enable detailed usage and cost reports for each developer account. Configure daily usage reports to be emailed to developers. Create dashboards for each developer in Cost Explorer, and require them to monitor their resource consumption and take action if they approach spending thresholds</p>"]},"correct_response":["b"],"section":"Design Cost-Optimized Architectures","question_plain":"An organization has rolled out a multi-account architecture using AWS Control Tower to isolate development environments. Each developer has their own dedicated AWS account to provision and test workloads. However, the company is concerned about unexpected spikes in resource usage and AWS spending from individual developer accounts. The leadership team wants to implement a cost control mechanism that can proactively enforce budget limits, ensure automatic responses to overspending, and require minimal ongoing administrative effort.\n\nWhat is the most efficient solution to meet this goal with the least operational overhead?","related_lectures":[]},{"_class":"assessment","id":130168889,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial services firm operates a mission-critical transaction processing platform hosted in the AWS us-east-2 Region. The backend is powered by a MySQL-compatible Amazon Aurora cluster, with high transaction volumes throughout the day. As part of its business continuity planning, the firm has selected us-west-2 as its designated disaster recovery (DR) Region.</p>\n\n<p>The firm has defined strict DR objectives:</p>\n\n<p>Recovery Point Objective (RPO): ≤ 5 minutes</p>\n\n<p>Recovery Time Objective (RTO): ≤ 15 minutes</p>\n\n<p>Leadership has asked for a DR solution that ensures fast cross-regional failover with minimal operational overhead and configuration effort. What do you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Convert the Aurora cluster to an Aurora global database, with the secondary cluster deployed in us-west-2. Rely on Aurora global database managed failover to meet RTO and RPO objectives</strong></p>\n\n<p>This solution is the most operationally efficient and fully meets the company’s disaster recovery (DR) objectives. Aurora global databases are specifically designed for cross-Region deployments that require low-latency replication and high availability. By converting the existing Aurora MySQL cluster to a global database, the primary Region (us-east-2) replicates data to a secondary Aurora cluster in the DR Region (us-west-2) with typically less than 1 second of replication lag, ensuring the company’s RPO of 5 minutes is comfortably met. Additionally, managed failover capabilities allow for a fast, coordinated promotion of the secondary cluster to primary with minimal downtime, satisfying the RTO of 15 minutes. This approach requires minimal configuration changes and automates much of the failover process, significantly reducing operational burden while maintaining data consistency and business continuity.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q23-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/blogs/storage/protecting-data-with-amazon-s3-object-lock/\">https://aws.amazon.com/blogs/storage/protecting-data-with-amazon-s3-object-lock/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Provision a separate Aurora MySQL-compatible cluster in us-west-2, and configure AWS Database Migration Service (AWS DMS) to replicate data from the primary database to the DR cluster continuously. Perform manual failover during DR events</strong> - While DMS supports near-real-time replication, it does not guarantee low-latency replication suitable for a 5-minute RPO, especially during high loads. DMS also introduces additional operational complexity and lacks native Aurora integration for seamless failover. AWS Database Migration Service (AWS DMS) is generally designed for database migrations or light-weight replication tasks, not for high-throughput, low-latency disaster recovery needs. While DMS can perform ongoing replication, it does not guarantee latency under 5 minutes, especially during peak traffic or write-heavy workloads. Moreover, DMS lacks the tight native integration with Amazon Aurora that global databases offer — meaning failover must be manually orchestrated, increasing operational complexity and potentially pushing the RTO beyond 15 minutes. Additionally, managing DMS tasks at scale (monitoring, restarting, troubleshooting) requires more administrative effort compared to the managed, built-in replication and failover mechanisms of Aurora global databases.</p>\n\n<p><strong>Create an Aurora read replica in us-west-2 with equivalent capacity to the primary cluster's writer node in us-east-2. Monitor replication health and configure a manual promotion process for failover</strong> - Aurora cross-Region read replicas do not offer managed failover and require manual intervention and additional orchestration during a disaster. Although replication latency is low, managing failover manually adds operational burden and increases risk of human error, affecting RTO.</p>\n\n<p><strong>Deploy a separate Aurora cluster in us-west-2, and use scheduled AWS Lambda functions with custom scripts to export and import snapshots from us-east-2 every 5 minutes</strong> - Snapshot export/import is not near real-time, and even with scripting, this method cannot guarantee a 5-minute RPO. Snapshot-based DR also requires manual failover orchestration, violating both the RPO and RTO requirements.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html\">https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/aurora-global-database.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/implement-cross-region-disaster-recovery-with-aws-dms-and-amazon-aurora.html\">https://docs.aws.amazon.com/prescriptive-guidance/latest/patterns/implement-cross-region-disaster-recovery-with-aws-dms-and-amazon-aurora.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html\">https://docs.aws.amazon.com/dms/latest/userguide/Welcome.html</a></p>\n","answers":["<p>Convert the Aurora cluster to an Aurora global database, with the secondary cluster deployed in us-west-2. Rely on Aurora global database managed failover to meet RTO and RPO objectives</p>","<p>Provision a separate Aurora MySQL-compatible cluster in us-west-2, and configure AWS Database Migration Service (AWS DMS) to replicate data from the primary database to the DR cluster continuously. Perform manual failover during DR events</p>","<p>Create an Aurora read replica in us-west-2 with equivalent capacity to the primary cluster's writer node in us-east-2. Monitor replication health and configure a manual promotion process for failover</p>","<p>Deploy a separate Aurora cluster in us-west-2, and use scheduled AWS Lambda functions with custom scripts to export and import snapshots from us-east-2 every 5 minutes</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A financial services firm operates a mission-critical transaction processing platform hosted in the AWS us-east-2 Region. The backend is powered by a MySQL-compatible Amazon Aurora cluster, with high transaction volumes throughout the day. As part of its business continuity planning, the firm has selected us-west-2 as its designated disaster recovery (DR) Region.\n\nThe firm has defined strict DR objectives:\n\nRecovery Point Objective (RPO): ≤ 5 minutes\n\nRecovery Time Objective (RTO): ≤ 15 minutes\n\nLeadership has asked for a DR solution that ensures fast cross-regional failover with minimal operational overhead and configuration effort. What do you recommend?","related_lectures":[]},{"_class":"assessment","id":130168957,"assessment_type":"multiple-choice","prompt":{"question":"<p>An application is hosted on multiple Amazon EC2 instances in the same Availability Zone (AZ). The engineering team wants to set up shared data access for these Amazon EC2 instances using Amazon EBS Multi-Attach volumes.</p>\n\n<p>Which Amazon EBS volume type is the correct choice for these Amazon EC2 instances?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Provisioned IOPS SSD Amazon EBS volumes</strong></p>\n\n<p>Amazon EBS Multi-Attach enables you to attach a single Provisioned IOPS SSD (io1 or io2) volume to multiple instances that are in the same Availability Zone. You can attach multiple Multi-Attach enabled volumes to an instance or set of instances. Each instance to which the volume is attached has full read and write permission to the shared volume. Multi-Attach makes it easier for you to achieve higher application availability in clustered Linux applications that manage concurrent write operations.</p>\n\n<p>Multi-Attach is supported exclusively on Provisioned IOPS SSD volumes.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>General-purpose SSD-based Amazon EBS volumes</strong> - These SSD-backed Amazon EBS volumes provide a balance of price and performance. AWS recommends these volumes for most workloads. These volume types are not supported for Multi-Attach functionality.</p>\n\n<p><strong>Throughput Optimized HDD Amazon EBS volumes</strong> - These HDD-backed volumes provide a low-cost HDD designed for frequently accessed, throughput-intensive workloads. These volume types are not supported for Multi-Attach functionality.</p>\n\n<p><strong>Cold HDD Amazon EBS volumes</strong> - These HDD-backed volumes provide a lowest-cost HDD design for less frequently accessed workloads. These volume types are not supported for Multi-Attach functionality.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volumes-multi.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volumes-multi.html</a></p>\n","answers":["<p>Provisioned IOPS SSD Amazon EBS volumes</p>","<p>General-purpose SSD-based Amazon EBS volumes</p>","<p>Throughput Optimized HDD Amazon EBS volumes</p>","<p>Cold HDD Amazon EBS volumes</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"An application is hosted on multiple Amazon EC2 instances in the same Availability Zone (AZ). The engineering team wants to set up shared data access for these Amazon EC2 instances using Amazon EBS Multi-Attach volumes.\n\nWhich Amazon EBS volume type is the correct choice for these Amazon EC2 instances?","related_lectures":[]},{"_class":"assessment","id":130168959,"assessment_type":"multiple-choice","prompt":{"question":"<p>A retail company needs a secure connection between its on-premises data center and AWS Cloud. This connection does not need high bandwidth and will handle a small amount of traffic. The company wants a quick turnaround time to set up the connection.</p>\n\n<p>What is the MOST cost-effective way to establish such a connection?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Set up an AWS Site-to-Site VPN connection</strong></p>\n\n<p>By default, instances that you launch into an Amazon VPC can't communicate with your own (remote) network. You can enable access to your remote network from your VPC by creating an AWS Site-to-Site VPN (Site-to-Site VPN) connection, and configuring routing to pass traffic through the connection. A VPN connection refers to the connection between your VPC and your own on-premises network.</p>\n\n<p>An AWS Site-to-Site VPN connection offers two VPN tunnels between a virtual private gateway or a transit gateway on the AWS side, and a customer gateway (which represents a VPN device) on the remote (on-premises) side.</p>\n\n<p>A virtual private gateway (VGW) is the VPN concentrator on the Amazon side of the AWS Site-to-Site VPN connection. You create a virtual private gateway and attach it to the VPC from which you want to create the AWS Site-to-Site VPN connection.</p>\n\n<p>How virtual private gateway works:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q25-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html</a></p>\n\n<p>An AWS transit gateway is a transit hub that you can use to interconnect your virtual private clouds (VPC) and on-premises networks. For more information, see Amazon VPC Transit Gateways. You can create a Site-to-Site VPN connection as an attachment on a transit gateway.</p>\n\n<p>How AWS transit gateway works:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q25-i2.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Set up a bastion host on Amazon EC2</strong> - A bastion host is a server whose purpose is to provide access to a private network from an external network, such as the Internet. The bastion host runs on an Amazon EC2 instance that is typically in a public subnet of your Amazon VPC. Other Amazon EC2 instances can be in a subnet that is not publicly accessible, and they are set up with a security group that allows SSH access from the security group attached to the underlying Amazon EC2 instance running the bastion host. A bastion host cannot be used to set up a connection between its on-premises data center and AWS Cloud.</p>\n\n<p><strong>Set up AWS Direct Connect</strong> - AWS Direct Connect is a network service that provides an alternative to using the Internet to utilize AWS cloud services. AWS Direct Connect enables customers to have low latency, secure and private connections to AWS for workloads that require higher speed or lower latency than the internet. A Dedicated Connection is made through a 1 Gbps, 10 Gbps, or 100 Gbps Ethernet port dedicated to a single customer. AWS Direct Connect takes about a month to provision the connection, so this option is ruled out for the given use case.</p>\n\n<p><strong>Set up an Internet Gateway between the on-premises data center and AWS cloud</strong> - An Internet Gateway is a horizontally scaled, redundant, and highly available VPC component that allows communication between your VPC and the internet. An Internet Gateway cannot be used to set up a connection between its on-premises data center and AWS Cloud.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html\">https://docs.aws.amazon.com/vpn/latest/s2svpn/how_it_works.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html\">https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html</a></p>\n","answers":["<p>Set up a bastion host on Amazon EC2</p>","<p>Set up AWS Direct Connect</p>","<p>Set up an AWS Site-to-Site VPN connection</p>","<p>Set up an Internet Gateway between the on-premises data center and AWS cloud</p>"]},"correct_response":["c"],"section":"Design Secure Architectures","question_plain":"A retail company needs a secure connection between its on-premises data center and AWS Cloud. This connection does not need high bandwidth and will handle a small amount of traffic. The company wants a quick turnaround time to set up the connection.\n\nWhat is the MOST cost-effective way to establish such a connection?","related_lectures":[]},{"_class":"assessment","id":130168961,"assessment_type":"multi-select","prompt":{"question":"<p>Your company has created a data warehouse using Amazon Redshift that is used to analyze data from Amazon S3. From the usage pattern, you have detected that after 30 days, the data is rarely queried in Amazon Redshift and it's not \"hot data\" anymore. You would like to preserve the SQL querying capability on your data and get the queries started immediately. Also, you want to adopt a pricing model that allows you to save the maximum amount of cost on Amazon Redshift.</p>\n\n<p>What do you recommend? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>Move the data to Amazon S3 Standard IA after 30 days</strong></p>\n\n<p>Amazon S3 Standard-IA is for data that is accessed less frequently but requires rapid access when needed. Amazon S3 Standard-IA offers high durability, high throughput, and low latency of S3 Standard, with a low per GB storage price and per GB retrieval fee. This combination of low cost and high performance makes S3 Standard-IA ideal for long-term storage, backups, and as a data store for disaster recovery files. The minimum storage duration charge is 30 days.</p>\n\n<p><strong>Analyze the cold data with Amazon Athena</strong></p>\n\n<p>Amazon Athena is an interactive query service that makes it easy to analyze data directly in Amazon S3 using standard SQL. Athena is serverless, so there is no infrastructure to set up or manage, and customers pay only for the queries they run. You can use Amazon Athena to process logs, perform ad-hoc analysis, and run interactive queries.</p>\n\n<p>Moving the data to Amazon S3 glacier will prevent us from being able to query it.  Therefore, we should migrate the data to Amazon S3 Standard IA and use Amazon Athena to analyze the cold data.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Migrate the Amazon Redshift underlying storage to Amazon S3 IA</strong> - Amazon Redshift is a fully-managed petabyte-scale cloud-based data warehouse product designed for large scale data set storage and analysis. An Amazon Redshift data warehouse is a collection of computing resources called nodes, which are organized into a group called a cluster. Each cluster runs an Amazon Redshift engine and contains one or more databases. An Amazon Redshift cluster consists of nodes. Each cluster has a leader node and one or more compute nodes. The leader node receives queries from client applications, parses the queries, and develops query execution plans. The leader node then coordinates the parallel execution of these plans with the compute nodes and aggregates the intermediate results from these nodes. It then finally returns the results to the client applications.</p>\n\n<p>Redshift's internal storage does not have \"tiers\" of storage classes like Amazon S3, so this option is also ruled out.</p>\n\n<p><strong>Create a smaller Amazon Redshift Cluster with the cold data</strong> - Creating a smaller cluster with the cold data would not decrease the storage cost of Amazon Redshift, which will only increase with time as we keep on creating data. Therefore this option is ruled out.</p>\n\n<p><strong>Move the data to Amazon S3 Glacier Deep Archive after 30 days</strong> - Amazon S3 Glacier Deep Archive (GDA) is a secure, durable, and extremely low-cost Amazon S3 cloud storage class for data archiving and long-term backup. It is designed to deliver 99.999999999% durability, and provide comprehensive security and compliance capabilities that can help meet even the most stringent regulatory requirements. GDA has a first-byte latency of several hours, so this option is incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/athena/\">https://aws.amazon.com/athena/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html\">https://docs.aws.amazon.com/redshift/latest/mgmt/working-with-clusters.html</a></p>\n","answers":["<p>Migrate the Amazon Redshift underlying storage to Amazon S3 IA</p>","<p>Create a smaller Amazon Redshift Cluster with the cold data</p>","<p>Move the data to Amazon S3 Glacier Deep Archive after 30 days</p>","<p>Move the data to Amazon S3 Standard IA after 30 days</p>","<p>Analyze the cold data with Amazon Athena</p>"]},"correct_response":["d","e"],"section":"Design Cost-Optimized Architectures","question_plain":"Your company has created a data warehouse using Amazon Redshift that is used to analyze data from Amazon S3. From the usage pattern, you have detected that after 30 days, the data is rarely queried in Amazon Redshift and it's not \"hot data\" anymore. You would like to preserve the SQL querying capability on your data and get the queries started immediately. Also, you want to adopt a pricing model that allows you to save the maximum amount of cost on Amazon Redshift.\n\nWhat do you recommend? (Select two)","related_lectures":[]},{"_class":"assessment","id":130168963,"assessment_type":"multiple-choice","prompt":{"question":"<p>A media company is relocating its legacy infrastructure to AWS. The on-premises environment consists of multiple virtualized workloads that are tightly coupled to their host operating systems and cannot be containerized or re-architected due to software constraints. Each workload currently runs on a standalone virtual machine. The engineering team plans to run these workloads on Amazon EC2 instances without modifying their core design. The company needs a solution that ensures high availability and fault tolerance in the AWS Cloud.</p>\n\n<p>Which solution will meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Generate an Amazon Machine Image (AMI) for each legacy server. Launch two EC2 instances from this AMI, placing one instance in each of two different Availability Zones. Set up a Network Load Balancer (NLB) to route traffic to the instances and to monitor instance health for automatic traffic redirection in case of failure</strong></p>\n\n<p>This option is correct as it recommends creating an Amazon Machine Image (AMI) of each legacy application server and launching two EC2 instances from that AMI, each in a different Availability Zone. This setup ensures high availability and fault tolerance by distributing the workload across multiple fault-isolated zones. A Network Load Balancer (NLB) is configured to route incoming traffic to the healthy instances based on real-time health checks, providing seamless failover in case one instance becomes unavailable. This solution is ideal for legacy applications that cannot be re-architected, and it complies with the requirement to run on EC2 while minimizing disruption and ensuring resiliency in a cost-effective and operationally efficient manner.</p>\n\n<p>Incorrect option:</p>\n\n<p><strong>Create Amazon Machine Images (AMIs) for each legacy workload. Use the AMIs to launch Auto Scaling groups with a minimum and maximum capacity of 1 EC2 instance. Place an Application Load Balancer (ALB) in front of the Auto Scaling group to provide routing and health check-based failover.</strong> - This option is incorrect because it configures only one EC2 instance in the Auto Scaling group, which does not provide multi-AZ fault tolerance. If the Availability Zone fails, the application becomes unavailable, violating the requirement for high availability.</p>\n\n<p><strong>Use AWS Backup to schedule hourly backups of each EC2 instance to Amazon S3 in a separate Availability Zone. Create a recovery plan that includes manual restoration of instances from backup in the event of a failure</strong> - While this solution offers point-in-time recovery, it does not provide fault tolerance or high availability. Restoration from backup is a manual and time-consuming process that can lead to significant downtime — violating the requirement for reliable, resilient operation.</p>\n\n<p><strong>Containerize the legacy applications and deploy them to Amazon ECS using the Fargate launch type. Define a task for each workload, and use an Application Load Balancer to route traffic across multiple Fargate tasks running in separate Availability Zones</strong> - This option proposes containerizing the legacy applications and running them on ECS with the Fargate launch type, which is a serverless compute engine for containers. However, the question explicitly states that the legacy applications must run on EC2 instances and cannot be modified. Fargate requires applications to be containerized, which involves re-architecting or packaging the workloads into Docker containers — a process not feasible in this case due to application constraints. Furthermore, Fargate does not provide direct control over EC2 instances, which violates the architectural requirement. This makes the option technically inappropriate for the scenario.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html\">https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html\">https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html</a></p>\n","answers":["<p>Create Amazon Machine Images (AMIs) for each legacy workload. Use the AMIs to launch Auto Scaling groups with a minimum and maximum capacity of 1 EC2 instance. Place an Application Load Balancer (ALB) in front of the Auto Scaling group to provide routing and health check-based failover.</p>","<p>Generate an Amazon Machine Image (AMI) for each legacy server. Launch two EC2 instances from this AMI, placing one instance in each of two different Availability Zones. Set up a Network Load Balancer (NLB) to route traffic to the instances and to monitor instance health for automatic traffic redirection in case of failure</p>","<p>Use AWS Backup to schedule hourly backups of each EC2 instance to Amazon S3 in a separate Availability Zone. Create a recovery plan that includes manual restoration of instances from backup in the event of a failure</p>","<p>Containerize the legacy applications and deploy them to Amazon ECS using the Fargate launch type. Define a task for each workload, and use an Application Load Balancer to route traffic across multiple Fargate tasks running in separate Availability Zones</p>"]},"correct_response":["b"],"section":"Design Resilient Architectures","question_plain":"A media company is relocating its legacy infrastructure to AWS. The on-premises environment consists of multiple virtualized workloads that are tightly coupled to their host operating systems and cannot be containerized or re-architected due to software constraints. Each workload currently runs on a standalone virtual machine. The engineering team plans to run these workloads on Amazon EC2 instances without modifying their core design. The company needs a solution that ensures high availability and fault tolerance in the AWS Cloud.\n\nWhich solution will meet these requirements?","related_lectures":[]},{"_class":"assessment","id":130168965,"assessment_type":"multiple-choice","prompt":{"question":"<p>A research firm archives experimental datasets generated by automated laboratory equipment. Each dataset is about 10 MB in size and is initially accessed frequently for analysis within the first month. After this period, the access rate drops significantly, but the data must remain immediately retrievable if needed. Due to compliance policies, each dataset must be retained in AWS storage for exactly 4 years before deletion. The firm currently stores the data in Amazon S3 Standard storage and wants to minimize costs without compromising data availability or retrieval speed.</p>\n\n<p>Which solution meets these requirements most cost-effectively?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Define an S3 Lifecycle policy that transitions datasets to S3 Standard-Infrequent Access (S3 Standard-IA) 30 days after creation and schedules the deletion of each object exactly 4 years after its creation</strong></p>\n\n<p>This solution provides a balanced cost-saving strategy and meets all business requirements. S3 Standard-IA offers significantly lower storage costs than S3 Standard for objects that are infrequently accessed but still need to be retrieved instantly. Since the files are accessed frequently only in the first 30 days and must remain available thereafter, moving them to S3 Standard-IA after 30 days is appropriate. Deleting the files after 4 years using a lifecycle rule ensures compliance and cost efficiency.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Define an S3 Lifecycle policy that transitions datasets to S3 Glacier Instant Retrieval 30 days after creation and schedules the deletion of each object exactly 4 years after its creation</strong> - Though S3 Glacier Instant Retrieval (GIR) allows instant access, it is more expensive per GB than S3 Standard-IA for infrequent access. It is typically used for archival data that needs occasional but instant access, not as a substitute for IA. S3 Glacier Instant Retrieval offers significantly lower storage costs at $0.004 per GB per month, compared to $0.0125 per GB per month for S3 Standard-IA—making it about 68% cheaper for storage. However, Glacier Instant Retrieval charges $0.03 per GB retrieved and $0.01 per 1,000 GET requests, while Standard-IA charges only $0.01 per GB retrieved and $0.001 per 1,000 GETs. So, retrieving 100 GB with 10,000 GET requests would cost just $1.01 with Standard-IA, but $3.10 with Glacier Instant Retrieval. Therefore, while GIR is cheaper to store, Standard-IA is more cost-effective when data is accessed even occasionally.</p>\n\n<p><strong>Configure an S3 Lifecycle policy to migrate datasets to S3 Glacier Flexible Retrieval after 30 days and delete them automatically 4 years after creation</strong> - S3 Glacier Flexible Retrieval is designed for archiving data that does not require instant access. Although it is low-cost, its retrieval latency is not immediate and can take minutes to hours depending on the retrieval tier. The requirement clearly states that files must be immediately accessible throughout the 4-year retention period, making this storage class unsuitable.</p>\n\n<p><strong>Set up an S3 Lifecycle configuration to transfer all datasets to S3 One Zone-Infrequent Access (S3 One Zone-IA) after 30 days, and permanently delete them 4 years after creation</strong> - Although One Zone-IA offers a lower storage price than S3 Standard-IA, it stores data in only one Availability Zone. This poses a data durability risk, especially since the datasets cannot be recreated. The scenario requires resilience and immediate retrieval, which One Zone-IA may not reliably provide if an AZ failure occurs.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/s3/pricing/\">https://aws.amazon.com/s3/pricing/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html#sc-infreq-data-access\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/storage-class-intro.html#sc-infreq-data-access</a></p>\n","answers":["<p>Define an S3 Lifecycle policy that transitions datasets to S3 Glacier Instant Retrieval 30 days after creation and schedules the deletion of each object exactly 4 years after its creation</p>","<p>Define an S3 Lifecycle policy that transitions datasets to S3 Standard-Infrequent Access (S3 Standard-IA) 30 days after creation and schedules the deletion of each object exactly 4 years after its creation</p>","<p>Configure an S3 Lifecycle policy to migrate datasets to S3 Glacier Flexible Retrieval after 30 days and delete them automatically 4 years after creation</p>","<p>Set up an S3 Lifecycle configuration to transfer all datasets to S3 One Zone-Infrequent Access (S3 One Zone-IA) after 30 days, and permanently delete them 4 years after creation</p>"]},"correct_response":["b"],"section":"Design Cost-Optimized Architectures","question_plain":"A research firm archives experimental datasets generated by automated laboratory equipment. Each dataset is about 10 MB in size and is initially accessed frequently for analysis within the first month. After this period, the access rate drops significantly, but the data must remain immediately retrievable if needed. Due to compliance policies, each dataset must be retained in AWS storage for exactly 4 years before deletion. The firm currently stores the data in Amazon S3 Standard storage and wants to minimize costs without compromising data availability or retrieval speed.\n\nWhich solution meets these requirements most cost-effectively?","related_lectures":[]},{"_class":"assessment","id":130168967,"assessment_type":"multiple-choice","prompt":{"question":"<p>A team has around 200 users, each of these having an IAM user account in AWS. Currently, they all have read access to an Amazon S3 bucket. The team wants 50 among them to have write and read access to the buckets.</p>\n\n<p>How can you provide these users access in the least possible time, with minimal changes?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create a group, attach the policy to the group and place the users in the group</strong></p>\n\n<p>An IAM group is a collection of IAM users. You can use groups to specify permissions for a collection of users, which can make those permissions easier to manage for those users. For example, you could have a group called Admins and give that group the types of permissions that administrators typically need. Any user in that group automatically has the permissions that are assigned to the group. If a new user joins your organization and should have administrator privileges, you can assign the appropriate permissions by adding the user to that group.</p>\n\n<p>Here creating a group, assigning users to that group and attaching policies to that group is the best way.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Update the Amazon S3 bucket policy</strong> - Updating the Amazon S3 bucket policy could work but would not scale, as the size of the S3 bucket policy is limited (Bucket policies are limited to 20 KB in size).</p>\n\n<p><strong>Create a policy and assign it manually to the 50 users</strong> - An IAM user is an entity that you create in AWS. The IAM user represents the person or service who uses the IAM user to interact with AWS. Primary use for IAM users is to give people the ability to sign in to the AWS Management Console for interactive tasks and to make programmatic requests to AWS services using the API or CLI. A user in AWS consists of a name, a password to sign in to the AWS Management Console, and up to two access keys that can be used with the API or CLI.</p>\n\n<p>A policy is an object in AWS that, when associated with an identity or resource, defines their permissions. AWS evaluates these policies when an IAM principal (user or role) makes a request. Permissions in the policies determine whether the request is allowed or denied.</p>\n\n<p>Identity-based policies – Attach managed and inline policies to IAM identities (users, groups to which users belong, or roles). Identity-based policies grant permissions to an identity.</p>\n\n<p>Resource-based policies – Attach inline policies to resources. The most common examples of resource-based policies are Amazon S3 bucket policies and IAM role trust policies. Resource-based policies grant permissions to the principal that is specified in the policy. Principals can be in the same account as the resource or in other accounts.</p>\n\n<p>Creating a policy and assigning it manually to users would work but would be hard to scale and manage.</p>\n\n<p><strong>Create an AWS Multi-Factor Authentication (AWS MFA) user with read / write access and link 50 IAM with AWS MFA</strong> - AWS MFA adds extra security because it requires users to provide unique authentication from an AWS supported MFA mechanism in addition to their regular sign-in credentials when they access AWS websites or services. AWS MFA cannot help in terms of granting read/write access to only 50 of the IAM users.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/id.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html\">https://docs.aws.amazon.com/IAM/latest/UserGuide/access_policies.html</a></p>\n","answers":["<p>Update the Amazon S3 bucket policy</p>","<p>Create a group, attach the policy to the group and place the users in the group</p>","<p>Create a policy and assign it manually to the 50 users</p>","<p>Create an AWS Multi-Factor Authentication (AWS MFA) user with read / write access and link 50 IAM with AWS MFA</p>"]},"correct_response":["b"],"section":"Design Secure Architectures","question_plain":"A team has around 200 users, each of these having an IAM user account in AWS. Currently, they all have read access to an Amazon S3 bucket. The team wants 50 among them to have write and read access to the buckets.\n\nHow can you provide these users access in the least possible time, with minimal changes?","related_lectures":[]},{"_class":"assessment","id":130168969,"assessment_type":"multiple-choice","prompt":{"question":"<p>A global financial services provider operates data analytics workloads across multiple AWS Regions. The company stores regulated datasets in Amazon S3 buckets and requires visibility into security and compliance configurations. As part of a new audit initiative, the compliance team must identify all S3 buckets across the environment that do not have versioning enabled. The solution must scale across all Regions and accounts with minimal manual intervention.</p>\n\n<p>Which solution will meet these requirements with the LEAST operational overhead?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Enable Amazon S3 Storage Lens with advanced metrics and recommendations. Use the per-bucket dashboard to filter and view versioning status across Regions and identify all buckets that do not have versioning enabled</strong></p>\n\n<p>S3 Storage Lens provides a centralized, organization-wide view of storage usage and activity metrics, including versioning status. When advanced metrics are enabled, the dashboard offers per-bucket insights that allow users to filter and identify buckets where versioning is not turned on. This capability spans all Regions and accounts within an organization, making it highly scalable and efficient. The visual dashboard and downloadable CSV reports simplify compliance and operational reviews, helping teams detect misconfigured buckets quickly without needing to manually inspect each one. This solution offers minimal operational overhead and aligns well with the requirement to monitor versioning across a large-scale, distributed S3 environment.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Configure an AWS CloudTrail trail across all Regions. Create an Amazon EventBridge rule that filters for <code>PutBucketVersioning</code> and <code>DeleteBucketVersioning</code> API calls. Trigger an AWS Lambda function to analyze the bucket configurations and generate a report of unversioned buckets</strong> - CloudTrail logs only capture changes and API activity. It does not continuously monitor or provide a current-state overview of versioning settings across all buckets. This approach requires custom scripting and does not scale well across accounts and Regions.</p>\n\n<p><strong>Enable IAM Access Analyzer for all Regions. Review the analyzer reports to identify S3 buckets without versioning enabled and configure IAM policies to restrict access to such buckets</strong> - IAM Access Analyzer is used to evaluate resource sharing and access configurations. It does not check for or report on bucket-level settings such as versioning.</p>\n\n<p><strong>Create a centralized Amazon S3 Multi-Region Access Point for all buckets. Use this access point to perform versioning checks programmatically by inspecting objects' metadata from each bucket</strong> - S3 Multi-Region Access Points simplify cross-Region data access but do not provide visibility into bucket configuration or versioning status. It is not designed for compliance checks.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html\">https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/s3/storage-lens/\">https://aws.amazon.com/s3/storage-lens/</a></p>\n","answers":["<p>Configure an AWS CloudTrail trail across all Regions. Create an Amazon EventBridge rule that filters for <code>PutBucketVersioning</code> and <code>DeleteBucketVersioning</code> API calls. Trigger an AWS Lambda function to analyze the bucket configurations and generate a report of unversioned buckets</p>","<p>Enable IAM Access Analyzer for all Regions. Review the analyzer reports to identify S3 buckets without versioning enabled and configure IAM policies to restrict access to such buckets</p>","<p>Create a centralized Amazon S3 Multi-Region Access Point for all buckets. Use this access point to perform versioning checks programmatically by inspecting objects' metadata from each bucket</p>","<p>Enable Amazon S3 Storage Lens with advanced metrics and recommendations. Use the per-bucket dashboard to filter and view versioning status across Regions and identify all buckets that do not have versioning enabled</p>"]},"correct_response":["d"],"section":"Design Secure Architectures","question_plain":"A global financial services provider operates data analytics workloads across multiple AWS Regions. The company stores regulated datasets in Amazon S3 buckets and requires visibility into security and compliance configurations. As part of a new audit initiative, the compliance team must identify all S3 buckets across the environment that do not have versioning enabled. The solution must scale across all Regions and accounts with minimal manual intervention.\n\nWhich solution will meet these requirements with the LEAST operational overhead?","related_lectures":[]},{"_class":"assessment","id":130168971,"assessment_type":"multiple-choice","prompt":{"question":"<p>A digital media company wants to track user engagement across its streaming platform by capturing events such as video starts, pauses, and search queries. These events must be ingested and analyzed in real time to improve user experience and optimize recommendations. The platform experiences unpredictable spikes in traffic during popular content releases. The company needs a highly scalable and serverless solution that can seamlessly adjust to changing workloads without manual provisioning.</p>\n\n<p>Which solution will meet these requirements in the MOST efficient and scalable way?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use an Amazon Kinesis Data Streams stream in on-demand capacity mode to ingest user engagement data. Configure an AWS Lambda function as a consumer to process the events in real time</strong></p>\n\n<p>Amazon Kinesis Data Streams with on-demand capacity mode is ideal for workloads with unpredictable or spiky traffic. It automatically provisions and manages the capacity needed to handle varying ingestion volumes without manual intervention. Paired with AWS Lambda as a consumer, it enables real-time processing of clickstream data in a serverless fashion. This combination ensures low-latency ingestion and processing with minimal operational overhead, making it highly suitable for real-time analytics use cases with fluctuating traffic.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon Kinesis Data Firehose to ingest user events. Set the destination as Amazon S3. Use Amazon Athena with scheduled queries to analyze the data periodically</strong> - Amazon Kinesis Data Firehose is a fully managed service for delivering streaming data to destinations like Amazon S3 and Amazon Redshift. However, it does not support real-time event processing directly; it buffers data before delivery. Furthermore, AWS Glue is not optimized for low-latency, real-time processing of streaming events. This approach introduces delays and does not meet the requirement for real-time analysis.</p>\n\n<p><strong>Use Amazon Simple Notification Service (Amazon SNS) to publish clickstream events. Subscribe an Amazon SQS standard queue to receive the events. Process the events in batches with AWS Glue jobs scheduled at fixed intervals</strong> - This approach uses Amazon SNS and SQS for message delivery and AWS Glue for batch processing. While SNS and SQS can distribute messages, they are not ideal for high-throughput real-time ingestion of clickstream data. AWS Glue is primarily suited for batch ETL jobs, not for low-latency real-time processing. This solution does not provide the scalability and responsiveness required for real-time analytics on fluctuating clickstream traffic.</p>\n\n<p><strong>Deploy a fleet of Amazon EC2 instances running Apache Kafka to ingest clickstream data. Set up custom scripts to manually scale the Kafka cluster based on CPU usage. Use Amazon Athena to run periodic queries on stored clickstream logs</strong> - Using self-managed Apache Kafka on EC2 introduces significant operational overhead and manual scaling challenges, especially under unpredictable traffic spikes. While Kafka is a capable ingestion tool, managing EC2-based clusters lacks the elasticity and serverless benefits provided by managed AWS services like Kinesis. Additionally, Athena is designed for querying static data stored in Amazon S3, not for real-time streaming analytics.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/streams/latest/dev/introduction.html\">https://docs.aws.amazon.com/streams/latest/dev/introduction.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/aws/amazon-kinesis-data-streams-on-demand-stream-data-at-scale-without-managing-capacity/\">https://aws.amazon.com/blogs/aws/amazon-kinesis-data-streams-on-demand-stream-data-at-scale-without-managing-capacity/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html\">https://docs.aws.amazon.com/msk/latest/developerguide/what-is-msk.html</a></p>\n","answers":["<p>Use an Amazon Kinesis Data Streams stream in on-demand capacity mode to ingest user engagement data. Configure an AWS Lambda function as a consumer to process the events in real time</p>","<p>Use Amazon Kinesis Data Firehose to ingest user events. Set the destination as Amazon S3. Use Amazon Athena with scheduled queries to analyze the data periodically</p>","<p>Use Amazon Simple Notification Service (Amazon SNS) to publish clickstream events. Subscribe an Amazon SQS standard queue to receive the events. Process the events in batches with AWS Glue jobs scheduled at fixed intervals</p>","<p>Deploy a fleet of Amazon EC2 instances running Apache Kafka to ingest clickstream data. Set up custom scripts to manually scale the Kafka cluster based on CPU usage. Use Amazon Athena to run periodic queries on stored clickstream logs</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A digital media company wants to track user engagement across its streaming platform by capturing events such as video starts, pauses, and search queries. These events must be ingested and analyzed in real time to improve user experience and optimize recommendations. The platform experiences unpredictable spikes in traffic during popular content releases. The company needs a highly scalable and serverless solution that can seamlessly adjust to changing workloads without manual provisioning.\n\nWhich solution will meet these requirements in the MOST efficient and scalable way?","related_lectures":[]},{"_class":"assessment","id":130168973,"assessment_type":"multiple-choice","prompt":{"question":"<p>A social media application lets users upload photos and perform image editing operations. The application offers two classes of service: pro and lite. The product team wants the photos submitted by pro users to be processed before those submitted by lite users. Photos are uploaded to Amazon S3 and the job information is sent to Amazon SQS.</p>\n\n<p>As a solutions architect, which of the following solutions would you recommend?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Create two Amazon SQS standard queues: one for pro and one for lite. Set up Amazon EC2 instances to prioritize polling for the pro queue over the lite queue</strong></p>\n\n<p>AWS recommends using separate queues to provide prioritization of work. Therefore, for the given use case, you need to create an Amazon SQS standard queue for processing pro users' photos and another Amazon SQS standard queue for processing lite users' photos. Then you can configure Amazon EC2 instances to prioritize polling for the pro queue over the lite queue.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt6-q32-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/sqs/features/\">https://aws.amazon.com/sqs/features/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create two Amazon SQS standard queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling</strong></p>\n\n<p><strong>Create two Amazon SQS FIFO queues: one for pro and one for lite. Set the lite queue to use short polling and the pro queue to use long polling</strong></p>\n\n<p>Amazon SQS long polling is a way to retrieve messages from your Amazon SQS queues. While the regular short polling returns immediately, even if the message queue being polled is empty, long-polling doesn’t return a response until a message arrives in the message queue, or the long poll times out. Since long polling or short polling cannot impact the priority of processing for the two queues, so both these opti
