s":["<p>200 GiB size volume with 2000 IOPS</p>","<p>200 GiB size volume with 10000 IOPS</p>","<p>200 GiB size volume with 15000 IOPS</p>","<p>200 GiB size volume with 5000 IOPS</p>"],"question":"<p>A pharmaceutical company runs their database workloads on Provisioned IOPS SSD (io1) volumes.</p>\n\n<p>As a Developer Associate, which of the following options would you identify as an <strong>INVALID</strong> configuration for io1 EBS volume types?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>200 GiB size volume with 15000 IOPS</strong> - This is an invalid configuration. The maximum ratio of provisioned IOPS to requested volume size (in GiB) is 50:1. So, for a 200 GiB volume size, max IOPS possible is 200*50 = 10000 IOPS.</p>\n\n<p>Overview of Provisioned IOPS SSD (io1) volumes:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q36-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p>Provisioned IOPS SSD (io1) volumes allow you to specify a consistent IOPS rate when you create the volume, and Amazon EBS delivers the provisioned performance 99.9 percent of the time. An io1 volume can range in size from 4 GiB to 16 TiB. The maximum ratio of provisioned IOPS to the requested volume size (in GiB) is 50:1. For example, a 100 GiB volume can be provisioned with up to 5,000 IOPS.</p>\n\n<p><strong>200 GiB size volume with 2000 IOPS</strong> - As explained above, up to 10000 IOPS is a valid configuration for the given use-case.</p>\n\n<p><strong>200 GiB size volume with 10000 IOPS</strong> - As explained above, up to 10000 IOPS is a valid configuration for the given use-case.</p>\n\n<p><strong>200 GiB size volume with 5000 IOPS</strong> - As explained above, up to 10000 IOPS is a valid configuration for the given use-case.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Development with AWS Services","question_plain":"A pharmaceutical company runs their database workloads on Provisioned IOPS SSD (io1) volumes.\n\nAs a Developer Associate, which of the following options would you identify as an INVALID configuration for io1 EBS volume types?","related_lectures":[]},{"_class":"assessment","id":129582375,"assessment_type":"multiple-choice","prompt":{"question":"<p>An Accounting firm extensively uses Amazon EBS volumes for persistent storage of application data of Amazon EC2 instances. The volumes are encrypted to protect the critical data of the clients. As part of managing the security credentials, the project manager has come across a policy snippet that looks like the following:</p>\n\n<pre><code>{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Sid\": \"Allow for use of this Key\",\n            \"Effect\": \"Allow\",\n            \"Principal\": {\n                \"AWS\": \"arn:aws:iam::111122223333:role/UserRole\"\n            },\n            \"Action\": [\n                \"kms:GenerateDataKeyWithoutPlaintext\",\n                \"kms:Decrypt\"\n            ],\n            \"Resource\": \"*\"\n        },\n        {\n            \"Sid\": \"Allow for EC2 Use\",\n            \"Effect\": \"Allow\",\n            \"Principal\": {\n                \"AWS\": \"arn:aws:iam::111122223333:role/UserRole\"\n            },\n            \"Action\": [\n                \"kms:CreateGrant\",\n                \"kms:ListGrants\",\n                \"kms:RevokeGrant\"\n            ],\n            \"Resource\": \"*\",\n            \"Condition\": {\n                \"StringEquals\": {\n                \"kms:ViaService\": \"ec2.us-west-2.amazonaws.com\"\n            }\n        }\n    ]\n}\n</code></pre>\n\n<p>Which of the following options are correct regarding the policy?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>The first statement provides a specified IAM principal the ability to generate a data key and decrypt that data key from the CMK when necessary</strong> - To create and use an encrypted Amazon Elastic Block Store (EBS) volume, you need permissions to use Amazon EBS. The key policy associated with the CMK would need to include these. The above policy is an example of one such policy.</p>\n\n<p>In this CMK policy, the first statement provides a specified IAM principal the ability to generate a data key and decrypt that data key from the CMK when necessary. These two APIs are necessary to encrypt the EBS volume while it’s attached to an Amazon Elastic Compute Cloud (EC2) instance.</p>\n\n<p>The second statement in this policy provides the specified IAM principal the ability to create, list, and revoke grants for Amazon EC2. Grants are used to delegate a subset of permissions to AWS services, or other principals, so that they can use your keys on your behalf. In this case, the condition policy explicitly ensures that only Amazon EC2 can use the grants. Amazon EC2 will use them to re-attach an encrypted EBS volume back to an instance if the volume gets detached due to a planned or unplanned outage. These events will be recorded within AWS CloudTrail when, and if, they do occur for your\nauditing.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The first statement provides the security group the ability to generate a data key and decrypt that data key from the CMK when necessary</strong></p>\n\n<p><strong>The second statement in this policy provides the security group (mentioned in the first statement of the policy), the ability to create, list, and revoke grants for Amazon EC2</strong></p>\n\n<p><strong>The second statement in the policy mentions that all the resources stated in the first statement can take the specified role which will provide the ability to create, list, and revoke grants for Amazon EC2</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://d0.awsstatic.com/whitepapers/aws-kms-best-practices.pdf\">https://d0.awsstatic.com/whitepapers/aws-kms-best-practices.pdf</a></p>\n","answers":["<p>The first statement provides the security group the ability to generate a data key and decrypt that data key from the CMK when necessary</p>","<p>The second statement in this policy provides the security group (mentioned in first statement of the policy), the ability to create, list, and revoke grants for Amazon EC2</p>","<p>The first statement provides a specified IAM principal the ability to generate a data key and decrypt that data key from the CMK when necessary</p>","<p>The second statement in the policy mentions that all the resources stated in the first statement can take the specified role which will provide the ability to create, list, and revoke grants for Amazon EC2</p>"]},"correct_response":["c"],"section":"Troubleshooting and Optimization","question_plain":"An Accounting firm extensively uses Amazon EBS volumes for persistent storage of application data of Amazon EC2 instances. The volumes are encrypted to protect the critical data of the clients. As part of managing the security credentials, the project manager has come across a policy snippet that looks like the following:\n\n{\n    \"Version\": \"2012-10-17\",\n    \"Statement\": [\n        {\n            \"Sid\": \"Allow for use of this Key\",\n            \"Effect\": \"Allow\",\n            \"Principal\": {\n                \"AWS\": \"arn:aws:iam::111122223333:role/UserRole\"\n            },\n            \"Action\": [\n                \"kms:GenerateDataKeyWithoutPlaintext\",\n                \"kms:Decrypt\"\n            ],\n            \"Resource\": \"*\"\n        },\n        {\n            \"Sid\": \"Allow for EC2 Use\",\n            \"Effect\": \"Allow\",\n            \"Principal\": {\n                \"AWS\": \"arn:aws:iam::111122223333:role/UserRole\"\n            },\n            \"Action\": [\n                \"kms:CreateGrant\",\n                \"kms:ListGrants\",\n                \"kms:RevokeGrant\"\n            ],\n            \"Resource\": \"*\",\n            \"Condition\": {\n                \"StringEquals\": {\n                \"kms:ViaService\": \"ec2.us-west-2.amazonaws.com\"\n            }\n        }\n    ]\n}\n\n\nWhich of the following options are correct regarding the policy?","related_lectures":[]},{"_class":"assessment","id":129582387,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company wants to share information with a third party via an HTTP API endpoint managed by the third party. The company has the necessary API key to access the endpoint and the integration of the API key with the company's application code must not impact the application's performance.</p>\n\n<p>What is the most secure approach?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Keep the API credentials in AWS Secrets Manager and use the credentials to make the API call by fetching the API credentials at runtime by using the AWS SDK</strong></p>\n\n<p>Secrets Manager enables you to replace hardcoded credentials in your code, including passwords, with an API call to Secrets Manager to retrieve the secret programmatically. This helps ensure the secret can't be compromised by someone examining your code, because the secret no longer exists in the code. Also, you can configure Secrets Manager to automatically rotate the secret for you according to a specified schedule. This enables you to replace long-term secrets with short-term ones, significantly reducing the risk of compromise.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q38-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html\">https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html</a></p>\n\n<p>In the past, when you created a custom application to retrieve information from a database, you typically embedded the credentials, the secret, for accessing the database directly in the application. When the time came to rotate the credentials, you had to do more than just create new credentials. You had to invest time to update the application to use the new credentials. Then you distributed the updated application. If you had multiple applications with shared credentials and you missed updating one of them, the application failed. Because of this risk, many customers choose not to regularly rotate credentials, which effectively substitutes one risk for another. You can also use caching with Secrets Manager to significantly improve the availability and latency of applications.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Keep the API credentials in an encrypted table in MySQL RDS and use the credentials to make the API call by fetching the API credentials from RDS at runtime by using the AWS SDK</strong></p>\n\n<p><strong>Keep the API credentials in an encrypted file in S3 and use the credentials to make the API call by fetching the API credentials from S3 at runtime by using the AWS SDK</strong></p>\n\n<p><strong>Keep the API credentials in a local code variable and use the local code variable at runtime to make the API call</strong></p>\n\n<p>It is considered a security bad practice to keep sensitive access credentials in code, database, or a flat file on a file system or object storage. Therefore, all three options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html\">https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/blogs/security/improve-availability-and-latency-of-applications-by-using-aws-secret-managers-python-client-side-caching-library/\">https://aws.amazon.com/blogs/security/improve-availability-and-latency-of-applications-by-using-aws-secret-managers-python-client-side-caching-library/</a></p>\n","answers":["<p>Keep the API credentials in an encrypted table in MySQL RDS and use the credentials to make the API call by fetching the API credentials from RDS at runtime by using the AWS SDK</p>","<p>Keep the API credentials in an encrypted file in S3 and use the credentials to make the API call by fetching the API credentials from S3 at runtime by using the AWS SDK</p>","<p>Keep the API credentials in a local code variable and use the local code variable at runtime to make the API call</p>","<p>Keep the API credentials in AWS Secrets Manager and use the credentials to make the API call by fetching the API credentials at runtime by using the AWS SDK</p>"]},"correct_response":["d"],"section":"Security","question_plain":"A company wants to share information with a third party via an HTTP API endpoint managed by the third party. The company has the necessary API key to access the endpoint and the integration of the API key with the company's application code must not impact the application's performance.\n\nWhat is the most secure approach?","related_lectures":[]},{"_class":"assessment","id":129582329,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Define an <code>appspec.yml</code> file in the codebuild/ directory</p>","<p>Define a <code>buildspec.yml</code> file in the root directory</p>","<p>Define a <code>buildspec.yml</code> file in the codebuild/ directory</p>","<p>Define an <code>appspec.yml</code> file in the root directory</p>"],"question":"<p>A developer in your company was just promoted to Team Lead and will be in charge of code deployment on EC2 instances via AWS CodeCommit and AWS CodeDeploy. Per the new requirements, the deployment process should be able to change permissions for deployed files as well as verify the deployment success.</p>\n\n<p>Which of the following actions should the new Developer take?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Define an <code>appspec.yml</code> file in the root directory</strong>: An AppSpec file must be a YAML-formatted file named appspec.yml and it must be placed in the root of the directory structure of an application's source code.</p>\n\n<p>The AppSpec file is used to:</p>\n\n<p>Map the source files in your application revision to their destinations on the instance.</p>\n\n<p>Specify custom permissions for deployed files.</p>\n\n<p>Specify scripts to be run on each instance at various stages of the deployment process.</p>\n\n<p>During deployment, the CodeDeploy agent looks up the name of the current event in the hooks section of the AppSpec file. If the event is not found, the CodeDeploy agent moves on to the next step. If the event is found, the CodeDeploy agent retrieves the list of scripts to execute. The scripts are run sequentially, in the order in which they appear in the file. The status of each script is logged in the CodeDeploy agent log file on the instance.</p>\n\n<p>If a script runs successfully, it returns an exit code of 0 (zero). If the CodeDeploy agent installed on the operating system doesn't match what's listed in the AppSpec file, the deployment fails.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Define a <code>buildspec.yml</code> file in the root directory</strong> - This is a file used by AWS CodeBuild to run a build. This is not relevant to the given use case.</p>\n\n<p><strong>Define a <code>buildspec.yml</code> file in the codebuild/ directory</strong> - This is a file used by AWS CodeBuild to run a build. This is not relevant to the given use case.</p>\n\n<p><strong>Define an <code>appspec.yml</code> file in the codebuild/ directory</strong> - This file is for AWS CodeDeploy and must be placed in the root of the directory structure of an application's source code.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/codedeploy/latest/userguide/application-specification-files.html\">https://docs.aws.amazon.com/codedeploy/latest/userguide/application-specification-files.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Deployment","question_plain":"A developer in your company was just promoted to Team Lead and will be in charge of code deployment on EC2 instances via AWS CodeCommit and AWS CodeDeploy. Per the new requirements, the deployment process should be able to change permissions for deployed files as well as verify the deployment success.\n\nWhich of the following actions should the new Developer take?","related_lectures":[]},{"_class":"assessment","id":129582383,"assessment_type":"multiple-choice","prompt":{"question":"<p>A university has created a student portal that is accessible through a smartphone app and web application. The smartphone app is available in both Android and IOS and the web application works on most major browsers. Students will be able to do group study online and create forum questions. All changes made via smartphone devices should be available even when offline and should synchronize with other devices.</p>\n\n<p>Which of the following AWS services will meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>AWS AppSync</strong></p>\n\n<p>AWS AppSync is a managed GraphQL service designed for building real-time, collaborative applications with features like offline data access, conflict resolution, and device synchronization. With AppSync, mobile apps can continue to work offline, queue changes locally, and then sync seamlessly across users and devices when connectivity returns. It also integrates with Cognito for authentication and DynamoDB or Aurora for storage, making it ideal for the portal’s real-time group study and Q&amp;A features.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Cognito Identity Pools</strong> - You can use Identity pools to grant your users access to other AWS services. With an identity pool, your users can obtain temporary AWS credentials to access AWS services, such as Amazon S3 and DynamoDB. Identity pools support anonymous guest users, as well as the specific identity providers that you can use to authenticate users for identity pools.</p>\n\n<p><strong>Cognito User Pools</strong> - A Cognito user pool is a user directory in Amazon Cognito. With a user pool, your users can sign in to your web or mobile app through Amazon Cognito, or federate through a third-party identity provider (IdP). Whether your users sign-in directly or through a third party, all members of the user pool have a directory profile that you can access through an SDK.</p>\n\n<p>Exam Alert:</p>\n\n<p>Please review the following note to understand the differences between Cognito User Pools and Cognito Identity Pools:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q40-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html\">https://docs.aws.amazon.com/cognito/latest/developerguide/what-is-amazon-cognito.html</a></p>\n\n<p><strong>Beanstalk</strong> - With Elastic Beanstalk, you can quickly deploy and manage applications in the AWS Cloud without having to learn about the infrastructure that runs those applications. Elastic Beanstalk reduces management complexity without restricting choice or control. You simply upload your application, and Elastic Beanstalk automatically handles the details of capacity provisioning, load balancing, scaling, and application health monitoring.</p>\n\n<p>How Elastic BeanStalk Works:\n<img src=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/images/clearbox-flow-00.png\">\nvia - <a href=\"https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html\">https://docs.aws.amazon.com/elasticbeanstalk/latest/dg/Welcome.html</a></p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/appsync/\">https://aws.amazon.com/appsync/</a></p>\n","answers":["<p>BeanStalk</p>","<p>Cognito Identity Pools</p>","<p>AWS AppSync</p>","<p>Cognito User Pools</p>"]},"correct_response":["c"],"section":"Security","question_plain":"A university has created a student portal that is accessible through a smartphone app and web application. The smartphone app is available in both Android and IOS and the web application works on most major browsers. Students will be able to do group study online and create forum questions. All changes made via smartphone devices should be available even when offline and should synchronize with other devices.\n\nWhich of the following AWS services will meet these requirements?","related_lectures":[]},{"_class":"assessment","id":129582381,"assessment_type":"multiple-choice","prompt":{"question":"<p>As an AWS Certified Developer Associate, you have been hired to work with the development team at a company to create a REST API using the serverless architecture.</p>\n\n<p>Which of the following solutions will you choose to move the company to the serverless architecture paradigm?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>API Gateway exposing Lambda Functionality</strong></p>\n\n<p>Amazon API Gateway is a fully managed service that makes it easy for developers to create, publish, maintain, monitor, and secure APIs at any scale. APIs act as the \"front door\" for applications to access data, business logic, or functionality from your backend services.</p>\n\n<p>How API Gateway Works:\n<img src=\"https://d1.awsstatic.com/serverless/New-API-GW-Diagram.c9fc9835d2a9aa00ef90d0ddc4c6402a2536de0d.png\">\nvia - <a href=\"https://aws.amazon.com/api-gateway/\">https://aws.amazon.com/api-gateway/</a></p>\n\n<p>AWS Lambda lets you run code without provisioning or managing servers. You pay only for the compute time you consume.</p>\n\n<p>How Lambda function works:\n<img src=\"https://d1.awsstatic.com/product-marketing/Lambda/Diagrams/product-page-diagram_Lambda-HowItWorks.68a0bcacfcf46fccf04b97f16b686ea44494303f.png\">\nvia - <a href=\"https://aws.amazon.com/lambda/\">https://aws.amazon.com/lambda/</a></p>\n\n<p>API Gateway can expose Lambda functionality through RESTful APIs. Both are serverless options offered by AWS and hence the right choice for this scenario, considering all the functionality they offer.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Fargate with Lambda at the front</strong> - Lambda cannot directly handle RESTful API requests. You can invoke a Lambda function over HTTPS by defining a custom RESTful API using Amazon API Gateway. So, Fargate with Lambda as the front-facing service is a wrong combination, though both Fargate and Lambda are serverless.</p>\n\n<p><strong>Public-facing Application Load Balancer with ECS on Amazon EC2</strong> - ECS on Amazon EC2 does not come under serverless and hence cannot be considered for this use case.</p>\n\n<p><strong>Route 53 with EC2 as backend</strong> - Amazon EC2 is not a serverless service and hence cannot be considered for this use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/serverless/\">https://aws.amazon.com/serverless/</a></p>\n\n<p><a href=\"https://aws.amazon.com/api-gateway/\">https://aws.amazon.com/api-gateway/</a></p>\n","answers":["<p>API Gateway exposing Lambda Functionality</p>","<p>Fargate with Lambda at the front</p>","<p>Public-facing Application Load Balancer with ECS on Amazon EC2</p>","<p>Route 53 with EC2 as backend</p>"]},"correct_response":["a"],"section":"Troubleshooting and Optimization","question_plain":"As an AWS Certified Developer Associate, you have been hired to work with the development team at a company to create a REST API using the serverless architecture.\n\nWhich of the following solutions will you choose to move the company to the serverless architecture paradigm?","related_lectures":[]},{"_class":"assessment","id":129582403,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>AWS CodePipeline</p>","<p>AWS CodeBuild</p>","<p>AWS Elastic Beanstalk</p>","<p>AWS CodeDeploy</p>"],"question":"<p>A developer needs to automate software package deployment to both Amazon EC2 instances and virtual servers running on-premises, as part of continuous integration and delivery that the business has adopted.</p>\n\n<p>Which AWS service should he use to accomplish this task?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>Continuous integration is a DevOps software development practice where developers regularly merge their code changes into a central repository, after which automated builds and tests are run.</p>\n\n<p>Continuous delivery is a software development practice where code changes are automatically prepared for a release to production. A pillar of modern application development, continuous delivery expands upon continuous integration by deploying all code changes to a testing environment and/or a production environment after the build stage.</p>\n\n<p><strong>AWS CodeDeploy</strong> - AWS CodeDeploy is a fully managed \"deployment\" service that automates software deployments to a variety of compute services such as Amazon EC2, AWS Fargate, AWS Lambda, and your on-premises servers. AWS CodeDeploy makes it easier for you to rapidly release new features, helps you avoid downtime during application deployment, and handles the complexity of updating your applications. This is the right choice for the current use case.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>AWS CodePipeline</strong> - AWS CodePipeline is a fully managed \"continuous delivery\" service that helps you automate your release pipelines for fast and reliable application and infrastructure updates. CodePipeline automates the build, test, and deploy phases of your release process every time there is a code change, based on the release model you define. This enables you to rapidly and reliably deliver features and updates. Whereas CodeDeploy is a deployment service, CodePipeline is a continuous delivery service. For our current scenario, CodeDeploy is the correct choice.</p>\n\n<p><strong>AWS CodeBuild</strong> - AWS CodeBuild is a fully managed continuous integration service that compiles source code, runs tests, and produces software packages that are ready to deploy. With CodeBuild, you don’t need to provision, manage, and scale your own build servers. CodeBuild scales continuously and processes multiple builds concurrently, so your builds are not left waiting in a queue.</p>\n\n<p><strong>AWS Elastic Beanstalk</strong> - AWS Elastic Beanstalk is an easy-to-use service for deploying and scaling web applications and services developed with Java, .NET, PHP, Node.js, Python, Ruby, Go, and Docker on familiar servers such as Apache, Nginx, Passenger, and IIS. You can simply upload your code and Elastic Beanstalk automatically handles the deployment, from capacity provisioning, load balancing, auto-scaling to application health monitoring. At the same time, you retain full control over the AWS resources powering your application and can access the underlying resources at any time.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/codedeploy/\">https://aws.amazon.com/codedeploy/</a></p>\n\n<p><a href=\"https://aws.amazon.com/codepipeline/\">https://aws.amazon.com/codepipeline/</a></p>\n\n<p><a href=\"https://aws.amazon.com/codebuild/\">https://aws.amazon.com/codebuild/</a></p>\n\n<p><a href=\"https://aws.amazon.com/elasticbeanstalk/\">https://aws.amazon.com/elasticbeanstalk/</a></p>\n\n<p><a href=\"https://aws.amazon.com/devops/continuous-delivery/\">https://aws.amazon.com/devops/continuous-delivery/</a></p>\n\n<p><a href=\"https://aws.amazon.com/devops/continuous-integration/\">https://aws.amazon.com/devops/continuous-integration/</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Deployment","question_plain":"A developer needs to automate software package deployment to both Amazon EC2 instances and virtual servers running on-premises, as part of continuous integration and delivery that the business has adopted.\n\nWhich AWS service should he use to accomplish this task?","related_lectures":[]},{"_class":"assessment","id":129582325,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>AWS CodePipeline</p>","<p>Amazon Versioned S3 Bucket</p>","<p>AWS CodeCommit</p>","<p>AWS CodeBuild</p>"],"question":"<p>A company needs a version control system for their fast development lifecycle with incremental changes, version control, and support to existing Git tools.</p>\n\n<p>Which AWS service will meet these requirements?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>AWS CodeCommit</strong> - AWS CodeCommit is a fully-managed Source Control service that hosts secure Git-based repositories. It makes it easy for teams to collaborate on code in a secure and highly scalable ecosystem. AWS CodeCommit helps you collaborate on code with teammates via pull requests, branching and merging. AWS CodeCommit keeps your repositories close to your build, staging, and production environments in the AWS cloud. You can transfer incremental changes instead of the entire application.\nAWS CodeCommit supports all Git commands and works with your existing Git tools. You can keep using your preferred development environment plugins, continuous integration/continuous delivery systems, and graphical clients with CodeCommit.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Versioned S3 Bucket</strong> - AWS CodeCommit is designed for collaborative software development. It manages batches of changes across multiple files, offers parallel branching, and includes version differencing (\"diffing\"). In comparison, Amazon S3 versioning supports recovering past versions of individual files but doesn’t support tracking batched changes that span multiple files or other features needed for collaborative software development.</p>\n\n<p><strong>AWS CodePipeline</strong> - AWS CodePipeline is a fully managed \"continuous delivery\" service that helps you automate your release pipelines for fast and reliable application and infrastructure updates. CodePipeline automates the build, test, and deploy phases of your release process every time there is a code change, based on the release model you define.</p>\n\n<p><strong>AWS CodeBuild</strong> - AWS CodeBuild is a fully managed continuous integration service that compiles source code, runs tests, and produces software packages that are ready to deploy. With CodeBuild, you don’t need to provision, manage, and scale your own build servers. CodeBuild scales continuously and processes multiple builds concurrently, so your builds are not left waiting in a queue.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://aws.amazon.com/codecommit/\">https://aws.amazon.com/codecommit/</a></p>\n\n<p><a href=\"https://aws.amazon.com/codepipeline/\">https://aws.amazon.com/codepipeline/</a></p>\n\n<p><a href=\"https://aws.amazon.com/codebuild/\">https://aws.amazon.com/codebuild/</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/Versioning.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Deployment","question_plain":"A company needs a version control system for their fast development lifecycle with incremental changes, version control, and support to existing Git tools.\n\nWhich AWS service will meet these requirements?","related_lectures":[]},{"_class":"assessment","id":129582365,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>10</p>","<p>60</p>","<p>30</p>","<p>20</p>"],"question":"<p>As a senior architect, you are responsible for the development, support, maintenance, and implementation of all database applications written using NoSQL technology. A new project demands a throughput requirement of 10 strongly consistent reads per second of 6KB in size each.</p>\n\n<p>How many read capacity units will you need when configuring your DynamoDB table?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>Before proceeding with the calculations, please review the following:</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q44-i1.jpg\"></p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q44-i2.jpg\"></p>\n\n<p>via - <a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProvisionedThroughput.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProvisionedThroughput.html</a></p>\n\n<p><strong>20</strong></p>\n\n<p>One read capacity unit represents one strongly consistent read per second for an item up to 4 KB in size. If you need to read an item that is larger than 4 KB, DynamoDB will need to consume additional read capacity units.</p>\n\n<p>1) Item Size / 4KB, rounding to the nearest whole number.</p>\n\n<p>So, in the above case, 6KB / 4 KB = 1.5 or 2 read capacity units.</p>\n\n<p>2) 1 read capacity unit per item (since strongly consistent read) × No of reads per second</p>\n\n<p>So, in the above case, 2 x 10 = 20 read capacity units.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>60</strong></p>\n\n<p><strong>30</strong></p>\n\n<p><strong>10</strong></p>\n\n<p>These three options contradict the details provided in the explanation above, so these are incorrect.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProvisionedThroughput.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ProvisionedThroughput.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"As a senior architect, you are responsible for the development, support, maintenance, and implementation of all database applications written using NoSQL technology. A new project demands a throughput requirement of 10 strongly consistent reads per second of 6KB in size each.\n\nHow many read capacity units will you need when configuring your DynamoDB table?","related_lectures":[]},{"_class":"assessment","id":129582355,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Developers need IAM permissions on API execution component of API Gateway</p>","<p>Enable Lambda authorizer to access API</p>","<p>Use Stage Variables for development state of API</p>","<p>Redeploy the API to an existing stage or to a new stage</p>"],"question":"<p>As a Senior Developer, you are tasked with creating several API Gateway powered APIs along with your team of developers. The developers are working on the API in the development environment, but they find the changes made to the APIs are not reflected when the API is called.</p>\n\n<p>As a Developer Associate, which of the following solutions would you recommend for this use-case?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Redeploy the API to an existing stage or to a new stage</strong></p>\n\n<p>After creating your API, you must deploy it to make it callable by your users. To deploy an API, you create an API deployment and associate it with a stage. A stage is a logical reference to a lifecycle state of your API (for example, dev, prod, beta, v2). API stages are identified by the API ID and stage name. Every time you update an API, you must redeploy the API to an existing stage or to a new stage. Updating an API includes modifying routes, methods, integrations, authorizers, and anything else other than stage settings.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Developers need IAM permissions on API execution component of API Gateway</strong> - Access control access to Amazon API Gateway APIs is done with IAM permissions. To call a deployed API or to refresh the API caching, you must grant the API caller permissions to perform required IAM actions supported by the API execution component of API Gateway. In the current scenario, developers do not need permissions on \"execution components\" but on \"management components\" of API Gateway that help them to create, deploy, and manage an API. Hence, this statement is an incorrect option.</p>\n\n<p><strong>Enable Lambda authorizer to access API</strong> - A Lambda authorizer (formerly known as a custom authorizer) is an API Gateway feature that uses a Lambda function to control access to your API. So, this feature too helps in access control, but in the current scenario its the developers and not the users who are facing the issue. So, this statement is an incorrect option.</p>\n\n<p><strong>Use Stage Variables for development state of API</strong> - Stage variables are name-value pairs that you can define as configuration attributes associated with a deployment stage of a REST API. They act like environment variables and can be used in your API setup and mapping templates. Stage variables are not connected to the scenario described in the current use case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-deploy-api.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/how-to-deploy-api.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/permissions.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/permissions.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/stage-variables.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"As a Senior Developer, you are tasked with creating several API Gateway powered APIs along with your team of developers. The developers are working on the API in the development environment, but they find the changes made to the APIs are not reflected when the API is called.\n\nAs a Developer Associate, which of the following solutions would you recommend for this use-case?","related_lectures":[]},{"_class":"assessment","id":129582377,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Amazon Elasticsearch Service (Amazon ES) with optionally backing up data to Amazon S3</p>","<p>Amazon Simple Storage Service (Amazon S3) as a direct Firehose destination</p>","<p>Amazon Redshift with Amazon S3</p>","<p>Amazon ElastiCache with Amazon S3 as backup</p>"],"question":"<p>A developer working with EC2 Windows instance has installed Kinesis Agent for Windows to stream JSON-formatted log files to Amazon Simple Storage Service (S3) via Amazon Kinesis Data Firehose. The developer wants to understand the sink type capabilities of Kinesis Firehose.</p>\n\n<p>Which of the following sink types is NOT supported by Kinesis Firehose.</p>\n","explanation":"<p>Correct option:</p>\n\n<p>Amazon Kinesis Data Firehose is a fully managed service for delivering real-time streaming data to destinations such as Amazon Simple Storage Service (Amazon S3), Amazon Redshift, Amazon Elasticsearch Service (Amazon ES), and Splunk. With Kinesis Data Firehose, you don't need to write applications or manage resources. You configure your data producers to send data to Kinesis Data Firehose, and it automatically delivers the data to the destination that you specified.</p>\n\n<p><strong>Amazon ElastiCache with Amazon S3 as backup</strong> - Amazon ElastiCache is a fully managed in-memory data store, compatible with Redis or Memcached. ElastiCache is NOT a supported destination for Amazon Kinesis Data Firehose.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Amazon Elasticsearch Service (Amazon ES) with optionally backing up data to Amazon S3</strong> - Amazon ES is a supported destination type for Kinesis Firehose. Streaming data is delivered to your Amazon ES cluster, and can optionally be backed up to your S3 bucket concurrently.</p>\n\n<p>Data Flow for ES:\n<img src=\"https://docs.aws.amazon.com/firehose/latest/dev/images/fh-flow-es.png\">\nvia - <a href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\">https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html</a></p>\n\n<p><strong>Amazon Simple Storage Service (Amazon S3) as a direct Firehose destination</strong> - For Amazon S3 destinations, streaming data is delivered to your S3 bucket. If data transformation is enabled, you can optionally back up source data to another Amazon S3 bucket.</p>\n\n<p>Data Flow for S3:\n<img src=\"https://docs.aws.amazon.com/firehose/latest/dev/images/fh-flow-s3.png\">\nvia - <a href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\">https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html</a></p>\n\n<p><strong>Amazon Redshift with Amazon S3</strong> - For Amazon Redshift destinations, streaming data is delivered to your S3 bucket first. Kinesis Data Firehose then issues an Amazon Redshift COPY command to load data from your S3 bucket to your Amazon Redshift cluster. If data transformation is enabled, you can optionally back up source data to another Amazon S3 bucket.</p>\n\n<p>Data Flow for Redshift:\n<img src=\"https://docs.aws.amazon.com/firehose/latest/dev/images/fh-flow-rs.png\">\nvia - <a href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\">https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html</a></p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html\">https://docs.aws.amazon.com/firehose/latest/dev/what-is-this-service.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["d"],"section":"Development with AWS Services","question_plain":"A developer working with EC2 Windows instance has installed Kinesis Agent for Windows to stream JSON-formatted log files to Amazon Simple Storage Service (S3) via Amazon Kinesis Data Firehose. The developer wants to understand the sink type capabilities of Kinesis Firehose.\n\nWhich of the following sink types is NOT supported by Kinesis Firehose.","related_lectures":[]},{"_class":"assessment","id":129582369,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Batch writes</p>","<p>Conditional writes</p>","<p>Atomic Counters</p>","<p>Use Scan operation</p>"],"question":"<p>A startup has been experimenting with DynamoDB in its new test environment. The development team has discovered that some of the write operations have been overwriting existing items that have the specified primary key. This has messed up their data, leading to data discrepancies.</p>\n\n<p>Which DynamoDB write option should be selected to prevent this kind of overwriting?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Conditional writes</strong> - DynamoDB optionally supports conditional writes for write operations (PutItem, UpdateItem, DeleteItem). A conditional write succeeds only if the item attributes meet one or more expected conditions. Otherwise, it returns an error.</p>\n\n<p>For example, you might want a PutItem operation to succeed only if there is not already an item with the same primary key. Or you could prevent an UpdateItem operation from modifying an item if one of its attributes has a certain value. Conditional writes are helpful in cases where multiple users attempt to modify the same item. This is the right choice for the current scenario.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Batch writes</strong> - Bath operations (read and write) help reduce the number of network round trips from your application to DynamoDB. In addition, DynamoDB performs the individual read or write operations in parallel. Applications benefit from this parallelism without having to manage concurrency or threading. But, this is of no use in the current scenario of overwriting changes.</p>\n\n<p><strong>Atomic Counters</strong> - Atomic Counters is a numeric attribute that is incremented, unconditionally, without interfering with other write requests. You might use an atomic counter to track the number of visitors to a website. This functionality is not useful for the current scenario.</p>\n\n<p><strong>Use Scan operation</strong> - A Scan operation in Amazon DynamoDB reads every item in a table or a secondary index. By default, a Scan operation returns all of the data attributes for every item in the table or index. This is given as a distractor and not related to DynamoDB item updates.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html#WorkingWithItems.ConditionalUpdate\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/WorkingWithItems.html#WorkingWithItems.ConditionalUpdate</a></p>\n","feedbacks":["","","",""]},"correct_response":["b"],"section":"Development with AWS Services","question_plain":"A startup has been experimenting with DynamoDB in its new test environment. The development team has discovered that some of the write operations have been overwriting existing items that have the specified primary key. This has messed up their data, leading to data discrepancies.\n\nWhich DynamoDB write option should be selected to prevent this kind of overwriting?","related_lectures":[]},{"_class":"assessment","id":129582363,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>dynamodb:AddItem, dynamodb:GetItem</p>","<p>dynamodb:UpdateItem, dynamodb:GetItem</p>","<p>dynamodb:GetRecords, dynamodb:PutItem, dynamodb:UpdateTable</p>","<p>dynamodb:UpdateItem, dynamodb:GetItem, dynamodb:PutItem</p>"],"feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>dynamodb:UpdateItem, dynamodb:GetItem</strong> - With Amazon DynamoDB transactions, you can group multiple actions together and submit them as a single all-or-nothing TransactWriteItems or TransactGetItems operation.</p>\n\n<p>You can use AWS Identity and Access Management (IAM) to restrict the actions that transactional operations can perform in Amazon DynamoDB. Permissions for Put, Update, Delete, and Get actions are governed by the permissions used for the underlying PutItem, UpdateItem, DeleteItem, and GetItem operations. For the ConditionCheck action, you can use the <code>dynamodb:ConditionCheck</code> permission in IAM policies.</p>\n\n<p><code>UpdateItem</code> action of DynamoDB APIs, edits an existing item's attributes or adds a new item to the table if it does not already exist. You can put, delete, or add attribute values. You can also perform a conditional update on an existing item (insert a new attribute name-value pair if it doesn't exist, or replace an existing name-value pair if it has certain expected attribute values).</p>\n\n<p>There is no need to inlcude the <code>dynamodb:PutItem</code> action for the given use-case.</p>\n\n<p>So, the IAM policy must include permissions to get and update the item in the DynamoDB table.</p>\n\n<p>Actions defined by DynamoDB:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt6-q48-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html\">https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>dynamodb:AddItem, dynamodb:GetItem</strong></p>\n\n<p><strong>dynamodb:GetRecords, dynamodb:PutItem, dynamodb:UpdateTable</strong></p>\n\n<p><strong>dynamodb:UpdateItem, dynamodb:GetItem, dynamodb:PutItem</strong></p>\n\n<p>These three options contradict the explanation provided above, so these options are incorrect.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html\">https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html</a></p>\n\n<p><a href=\"https://docs.amazonaws.cn/en_us/amazondynamodb/latest/developerguide/transaction-apis-iam.html\">https://docs.amazonaws.cn/en_us/amazondynamodb/latest/developerguide/transaction-apis-iam.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html\">https://docs.aws.amazon.com/service-authorization/latest/reference/list_amazondynamodb.html</a></p>\n","question":"<p>A development team is working on an AWS Lambda function that accesses DynamoDB. The Lambda function must do an upsert, that is, it must retrieve an item and update some of its attributes or create the item if it does not exist.</p>\n\n<p>Which of the following represents the solution with MINIMUM IAM permissions that can be used for the Lambda function to achieve this functionality?</p>\n"},"correct_response":["b"],"section":"Development with AWS Services","question_plain":"A development team is working on an AWS Lambda function that accesses DynamoDB. The Lambda function must do an upsert, that is, it must retrieve an item and update some of its attributes or create the item if it does not exist.\n\nWhich of the following represents the solution with MINIMUM IAM permissions that can be used for the Lambda function to achieve this functionality?","related_lectures":[]},{"_class":"assessment","id":129582407,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company is using a Border Gateway Protocol (BGP) based AWS VPN connection to connect from its on-premises data center to Amazon EC2 instances in the company’s account. The development team can access an EC2 instance in subnet A but is unable to access an EC2 instance in subnet B in the same VPC.</p>\n\n<p>Which logs can be used to verify whether the traffic is reaching subnet B?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>VPC Flow Logs</strong> - VPC Flow Logs is a feature that enables you to capture information about the IP traffic going to and from network interfaces in your VPC. Flow log data can be published to Amazon CloudWatch Logs or Amazon S3. After you've created a flow log, you can retrieve and view its data in the chosen destination.</p>\n\n<p>You can create a flow log for a VPC, a subnet, or a network interface. If you create a flow log for a subnet or VPC, each network interface in that subnet or VPC is monitored.</p>\n\n<p>Flow log data for a monitored network interface is recorded as flow log records, which are log events consisting of fields that describe the traffic flow.</p>\n\n<p>To create a flow log, you specify:</p>\n\n<ol>\n<li><p>The resource for which to create the flow log</p></li>\n<li><p>The type of traffic to capture (accepted traffic, rejected traffic, or all traffic)</p></li>\n<li><p>The destinations to which you want to publish the flow log data</p></li>\n</ol>\n\n<p>Incorrect options:</p>\n\n<p><strong>VPN logs</strong></p>\n\n<p><strong>Subnet logs</strong></p>\n\n<p><strong>BGP logs</strong></p>\n\n<p>These three options are incorrect and have been added as distractors.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html\">https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html</a></p>\n","answers":["<p>VPN logs</p>","<p>Subnet logs</p>","<p>VPC Flow Logs</p>","<p>BGP logs</p>"]},"correct_response":["c"],"section":"Troubleshooting and Optimization","question_plain":"A company is using a Border Gateway Protocol (BGP) based AWS VPN connection to connect from its on-premises data center to Amazon EC2 instances in the company’s account. The development team can access an EC2 instance in subnet A but is unable to access an EC2 instance in subnet B in the same VPC.\n\nWhich logs can be used to verify whether the traffic is reaching subnet B?","related_lectures":[]},{"_class":"assessment","id":129582311,"assessment_type":"multiple-choice","prompt":{"question":"<p>Your team lead has asked you to learn AWS CloudFormation to create a collection of related AWS resources and provision them in an orderly fashion. You decide to provide AWS-specific parameter types to catch invalid values.</p>\n\n<p>When specifying parameters which of the following is not a valid Parameter type?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p>AWS CloudFormation gives developers and businesses an easy way to create a collection of related AWS and third-party resources and provision them in an orderly and predictable fashion.</p>\n\n<p>How CloudFormation Works:\n<img src=\"https://d1.awsstatic.com/Products/product-name/diagrams/product-page-diagram_CloudFormation.ad3a4c93b4fdd3366da3da0de4fb084d89a5d761.png\">\nvia - <a href=\"https://aws.amazon.com/cloudformation/\">https://aws.amazon.com/cloudformation/</a></p>\n\n<p>Parameter types enable CloudFormation to validate inputs earlier in the stack creation process.</p>\n\n<p>CloudFormation currently supports the following parameter types:</p>\n\n<pre><code>String – A literal string\nNumber – An integer or float\nList&lt;Number&gt; – An array of integers or floats\nCommaDelimitedList – An array of literal strings that are separated by commas\nAWS::EC2::KeyPair::KeyName – An Amazon EC2 key pair name\nAWS::EC2::SecurityGroup::Id – A security group ID\nAWS::EC2::Subnet::Id – A subnet ID\nAWS::EC2::VPC::Id – A VPC ID\nList&lt;AWS::EC2::VPC::Id&gt; – An array of VPC IDs\nList&lt;AWS::EC2::SecurityGroup::Id&gt; – An array of security group IDs\nList&lt;AWS::EC2::Subnet::Id&gt; – An array of subnet IDs\n</code></pre>\n\n<p><strong>DependentParameter</strong></p>\n\n<p>In CloudFormation, parameters are all independent and cannot depend on each other. Therefore, this is an invalid parameter type.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>String</strong></p>\n\n<p><strong>CommaDelimitedList</strong></p>\n\n<p><strong>AWS::EC2::KeyPair::KeyName</strong></p>\n\n<p>As mentioned in the explanation above, these are valid parameter types.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/blogs/devops/using-the-new-cloudformation-parameter-types/\">https://aws.amazon.com/blogs/devops/using-the-new-cloudformation-parameter-types/</a></p>\n","answers":["<p>String</p>","<p>DependentParameter</p>","<p>CommaDelimitedList</p>","<p>AWS::EC2::KeyPair::KeyName</p>"]},"correct_response":["b"],"section":"Troubleshooting and Optimization","question_plain":"Your team lead has asked you to learn AWS CloudFormation to create a collection of related AWS resources and provision them in an orderly fashion. You decide to provide AWS-specific parameter types to catch invalid values.\n\nWhen specifying parameters which of the following is not a valid Parameter type?","related_lectures":[]},{"_class":"assessment","id":129582335,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>It is not possible to reuse SSH key pairs across AWS Regions</p>","<p>Store the public and private SSH key pair in AWS Trusted Advisor and access it across AWS Regions</p>","<p>Generate a public SSH key from a private SSH key. Then, import the key into each of your AWS Regions</p>","<p>Encrypt the private SSH key and store it in the S3 bucket to be accessed from any AWS Region</p>"],"question":"<p>A company runs its flagship application on a fleet of Amazon EC2 instances. After misplacing a couple of private keys from the SSH key pairs, they have decided to re-use their SSH key pairs for the different instances across AWS Regions.</p>\n\n<p>As a Developer Associate, which of the following would you recommend to address this use-case?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Generate a public SSH key from a private SSH key. Then, import the key into each of your AWS Regions</strong></p>\n\n<p>Here is the correct way of reusing SSH keys in your AWS Regions:</p>\n\n<ol>\n<li><p>Generate a public SSH key (.pub) file from the private SSH key (.pem) file.</p></li>\n<li><p>Set the AWS Region you wish to import to.</p></li>\n<li><p>Import the public SSH key into the new Region.</p></li>\n</ol>\n\n<p>Incorrect options:</p>\n\n<p><strong>It is not possible to reuse SSH key pairs across AWS Regions</strong> - As explained above, it is possible to reuse with manual import.</p>\n\n<p><strong>Store the public and private SSH key pair in AWS Trusted Advisor and access it across AWS Regions</strong> - AWS Trusted Advisor is an application that draws upon best practices learned from AWS' aggregated operational history of serving hundreds of thousands of AWS customers. Trusted Advisor inspects your AWS environment and makes recommendations for saving money, improving system performance, or closing security gaps. It does not store key pair credentials.</p>\n\n<p><strong>Encrypt the private SSH key and store it in the S3 bucket to be accessed from any AWS Region</strong> - Storing private key to Amazon S3 is possible. But, this will not make the key accessible for all AWS Regions, as is the need in the current use case.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-key-pairs.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-key-pairs.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["c"],"section":"Security","question_plain":"A company runs its flagship application on a fleet of Amazon EC2 instances. After misplacing a couple of private keys from the SSH key pairs, they have decided to re-use their SSH key pairs for the different instances across AWS Regions.\n\nAs a Developer Associate, which of the following would you recommend to address this use-case?","related_lectures":[]},{"_class":"assessment","id":129582373,"assessment_type":"multi-select","prompt":{"question":"<p>While troubleshooting, a developer realized that the Amazon EC2 instance is unable to connect to the Internet using the Internet Gateway.</p>\n\n<p>Which conditions should be met for Internet connectivity to be established? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>The network ACLs associated with the subnet must have rules to allow inbound and outbound traffic</strong> - The network access control lists (ACLs) that are associated with the subnet must have rules to allow inbound and outbound traffic on port 80 (for HTTP traffic) and port 443 (for HTTPs traffic). This is a necessary condition for Internet Gateway connectivity</p>\n\n<p><strong>The route table in the instance’s subnet should have a route to an Internet Gateway</strong> - A route table contains a set of rules, called routes, that are used to determine where network traffic from your subnet or gateway is directed. The route table in the instance’s subnet should have a route defined to the Internet Gateway.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The instance's subnet is not associated with any route table</strong> - This is an incorrect statement. A subnet is implicitly associated with the main route table if it is not explicitly associated with a particular route table. So, a subnet is always associated with some route table.</p>\n\n<p><strong>The instance's subnet is associated with multiple route tables with conflicting configurations</strong> - This is an incorrect statement. A subnet can only be associated with one route table at a time.</p>\n\n<p><strong>The subnet has been configured to be Public and has no access to internet</strong> - This is an incorrect statement. Public subnets have access to the internet via Internet Gateway.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html\">https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html</a></p>\n","answers":["<p>The instance's subnet is not associated with any route table</p>","<p>The network ACLs associated with the subnet must have rules to allow inbound and outbound traffic</p>","<p>The instance's subnet is associated with multiple route tables with conflicting configurations</p>","<p>The route table in the instance’s subnet should have a route to an Internet Gateway</p>","<p>The subnet has been configured to be Public and has no access to the internet</p>"]},"correct_response":["b","d"],"section":"Troubleshooting and Optimization","question_plain":"While troubleshooting, a developer realized that the Amazon EC2 instance is unable to connect to the Internet using the Internet Gateway.\n\nWhich conditions should be met for Internet connectivity to be established? (Select two)","related_lectures":[]},{"_class":"assessment","id":129582361,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Use KMS direct encryption and store as file</p>","<p>Use Envelope Encryption and reference the data as file within the code</p>","<p>Use Envelope Encryption and store as environment variable</p>","<p>Use KMS Encryption and store as environment variable</p>"],"question":"<p>You have launched several AWS Lambda functions written in Java. A new requirement was given that over 1MB of data should be passed to the functions and should be encrypted and decrypted at runtime.</p>\n\n<p>Which of the following methods is suitable to address the given use-case?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Use Envelope Encryption and reference the data as file within the code</strong></p>\n\n<p>While AWS KMS does support sending data up to 4 KB to be encrypted directly, envelope encryption can offer significant performance benefits. When you encrypt data directly with AWS KMS it must be transferred over the network. Envelope encryption reduces the network load since only the request and delivery of the much smaller data key go over the network. The data key is used locally in your application or encrypting AWS service, avoiding the need to send the entire block of data to AWS KMS and suffer network latency.</p>\n\n<p>AWS Lambda environment variables can have a maximum size of 4 KB. Additionally, the direct 'Encrypt' API of KMS also has an upper limit of 4 KB for the data payload. To encrypt 1 MB, you need to use the Encryption SDK and pack the encrypted file with the lambda function.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use KMS direct encryption and store as file</strong> - You can only encrypt up to 4 kilobytes (4096 bytes) of arbitrary data such as an RSA key, a database password, or other sensitive information, so this option is not correct for the given use-case.</p>\n\n<p><strong>Use Envelope Encryption and store as an environment variable</strong> - Environment variables must not exceed 4 KB, so this option is not correct for the given use-case.</p>\n\n<p><strong>Use KMS Encryption and store as an environment variable</strong> - You can encrypt up to 4 kilobytes (4096 bytes) of arbitrary data such as an RSA key, a database password, or other sensitive information. Lambda Environment variables must not exceed 4 KB. So this option is not correct for the given use-case.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html\">https://docs.aws.amazon.com/lambda/latest/dg/gettingstarted-limits.html</a></p>\n\n<p><a href=\"https://aws.amazon.com/kms/faqs/\">https://aws.amazon.com/kms/faqs/</a></p>\n","feedbacks":["","","",""]},"correct_response":["b"],"section":"Security","question_plain":"You have launched several AWS Lambda functions written in Java. A new requirement was given that over 1MB of data should be passed to the functions and should be encrypted and decrypted at runtime.\n\nWhich of the following methods is suitable to address the given use-case?","related_lectures":[]},{"_class":"assessment","id":129582413,"assessment_type":"multiple-choice","prompt":{"question":"<p>A developer is building a serverless application on AWS and wants to establish an accelerated development workflow. The workflow must allow the developer to deploy incremental changes for testing without deploying the entire application for every code commit. The developer wants to streamline the process while minimizing deployment time.</p>\n\n<p>What should the developer do to meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use the <code>sam sync</code> command from the AWS Serverless Application Model (AWS SAM) to deploy incremental changes</strong></p>\n\n<p>The <code>sam sync</code> command is specifically designed to enable rapid iteration by synchronizing local changes with the deployed serverless application on AWS. This allows developers to quickly test incremental changes without the overhead of redeploying the entire stack, aligning perfectly with the developer's requirements.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use the <code>cdk deploy</code> command from the AWS Cloud Development Kit (AWS CDK) to deploy incremental changes to AWS for testing</strong> - The <code>cdk deploy</code> command is a general-purpose deployment tool for AWS CDK stacks. While it can deploy changes, it does not offer the same level of optimization for incremental changes as sam sync for serverless applications. This command is more suitable for CDK projects rather than SAM-based serverless applications.</p>\n\n<p><strong>Use the <code>sam deploy</code> command from the AWS Serverless Application Model (AWS SAM) to deploy incremental changes</strong> - The <code>sam deploy</code> command performs a full deployment of the application or updated resources, even for small changes. It does not specifically optimize for incremental deployments, which results in longer deployment times.</p>\n\n<p><strong>Use the <code>cdk diff</code> command from the AWS Cloud Development Kit (AWS CDK) to deploy incremental changes to AWS for testing</strong> - The <code>cdk diff</code> command is not a deployment command. It is used to generate a difference report between the deployed and local stacks. It does not synchronize or deploy incremental changes, making it irrelevant for this requirement.use-case.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-sync.html\">https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/using-sam-cli-sync.html</a></p>\n","answers":["<p>Use the <code>cdk deploy</code> command from the AWS Cloud Development Kit (AWS CDK) to deploy incremental changes to AWS for testing</p>","<p>Use the <code>sam deploy</code> command from the AWS Serverless Application Model (AWS SAM) to deploy incremental changes</p>","<p>Use the <code>sam sync</code> command from the AWS Serverless Application Model (AWS SAM) to deploy incremental changes</p>","<p>Use the <code>cdk diff</code> command from the AWS Cloud Development Kit (AWS CDK) to deploy incremental changes to AWS for testing</p>"]},"correct_response":["c"],"section":"Troubleshooting and Optimization","question_plain":"A developer is building a serverless application on AWS and wants to establish an accelerated development workflow. The workflow must allow the developer to deploy incremental changes for testing without deploying the entire application for every code commit. The developer wants to streamline the process while minimizing deployment time.\n\nWhat should the developer do to meet these requirements?","related_lectures":[]},{"_class":"assessment","id":129582393,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Standard AWS IAM roles and policies</p>","<p>AWS Security Token Service (STS)</p>","<p>Lambda Authorizer</p>","<p>Cognito User Pools</p>"],"question":"<p>A developer is looking at establishing access control for an API that connects to a Lambda function downstream.</p>\n\n<p>Which of the following represents a mechanism that CANNOT be used for authenticating with the API Gateway?</p>\n","explanation":"<p>Correct option:</p>\n\n<p>Amazon API Gateway is an AWS service for creating, publishing, maintaining, monitoring, and securing REST, HTTP, and WebSocket APIs at any scale. API developers can create APIs that access AWS or other web services, as well as data stored in the AWS Cloud.</p>\n\n<p>How API Gateway Works:\n<img src=\"https://d1.awsstatic.com/serverless/New-API-GW-Diagram.c9fc9835d2a9aa00ef90d0ddc4c6402a2536de0d.png\">\nvia - <a href=\"https://aws.amazon.com/api-gateway/\">https://aws.amazon.com/api-gateway/</a></p>\n\n<p><strong>AWS Security Token Service (STS)</strong> - AWS Security Token Service (AWS STS) is a web service that enables you to request temporary, limited-privilege credentials for AWS Identity and Access Management (IAM) users or for users that you authenticate (federated users). However, it is not supported by API Gateway.</p>\n\n<p>API Gateway supports the following mechanisms for authentication and authorization:\n<img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q55-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Standard AWS IAM roles and policies</strong> - Standard AWS IAM roles and policies offer flexible and robust access controls that can be applied to an entire API or individual methods. IAM roles and policies can be used for controlling who can create and manage your APIs, as well as who can invoke them.</p>\n\n<p><strong>Lambda Authorizer</strong> - Lambda authorizers are Lambda functions that control access to REST API methods using bearer token authentication—as well as information described by headers, paths, query strings, stage variables, or context variables request parameters. Lambda authorizers are used to control who can invoke REST API methods.</p>\n\n<p><strong>Cognito User Pools</strong> - Amazon Cognito user pools let you create customizable authentication and authorization solutions for your REST APIs. Amazon Cognito user pools are used to control who can invoke REST API methods.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html\">https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-control-access-to-api.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/STS/latest/APIReference/welcome.html\">https://docs.aws.amazon.com/STS/latest/APIReference/welcome.html</a></p>\n","feedbacks":["","","",""]},"correct_response":["b"],"section":"Security","question_plain":"A developer is looking at establishing access control for an API that connects to a Lambda function downstream.\n\nWhich of the following represents a mechanism that CANNOT be used for authenticating with the API Gateway?","related_lectures":[]},{"_class":"assessment","id":129582389,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company uses AWS CodeDeploy to deploy applications from GitHub to EC2 instances running Amazon Linux. The deployment process uses a file called appspec.yml for specifying deployment hooks. A final lifecycle event should be specified to verify the deployment success.</p>\n\n<p>Which of the following hook events should be used to verify the success of the deployment?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p>AWS CodeDeploy is a fully managed deployment service that automates software deployments to a variety of compute services such as Amazon EC2, AWS Fargate, AWS Lambda, and your on-premises servers. AWS CodeDeploy makes it easier for you to rapidly release new features, helps you avoid downtime during application deployment, and handles the complexity of updating your applications.</p>\n\n<p>An EC2/On-Premises deployment hook is executed once per deployment to an instance. You can specify one or more scripts to run in a hook.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q56-i1.jpg\">\nvia - <a href=\"https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html#reference-appspec-file-structure-hooks-run-order\">https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html#reference-appspec-file-structure-hooks-run-order</a></p>\n\n<p><strong>ValidateService</strong>: ValidateService is the last deployment lifecycle event. It is used to verify the deployment was completed successfully.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>AfterInstall</strong> - You can use this deployment lifecycle event for tasks such as configuring your application or changing file permissions</p>\n\n<p><strong>ApplicationStart</strong> - You typically use this deployment lifecycle event to restart services that were stopped during ApplicationStop</p>\n\n<p><strong>AllowTraffic</strong> - During this deployment lifecycle event, internet traffic is allowed to access instances after a deployment. This event is reserved for the AWS CodeDeploy agent and cannot be used to run scripts</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html#reference-appspec-file-structure-hooks-run-order\">https://docs.aws.amazon.com/codedeploy/latest/userguide/reference-appspec-file-structure-hooks.html#reference-appspec-file-structure-hooks-run-order</a></p>\n","answers":["<p>ValidateService</p>","<p>AfterInstall</p>","<p>ApplicationStart</p>","<p>AllowTraffic</p>"]},"correct_response":["a"],"section":"Troubleshooting and Optimization","question_plain":"A company uses AWS CodeDeploy to deploy applications from GitHub to EC2 instances running Amazon Linux. The deployment process uses a file called appspec.yml for specifying deployment hooks. A final lifecycle event should be specified to verify the deployment success.\n\nWhich of the following hook events should be used to verify the success of the deployment?","related_lectures":[]},{"_class":"assessment","id":129582395,"assessment_type":"multiple-choice","prompt":{"question":"<p>A company has created an Amazon S3 bucket that holds customer data. The team lead has just enabled access logging to this bucket. The bucket size has grown substantially after starting access logging. Since no new files have been added to the bucket, the perplexed team lead is looking for an answer.</p>\n\n<p>Which of the following reasons explains this behavior?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>S3 access logging is pointing to the same bucket and is responsible for the substantial growth of bucket size</strong> - When your source bucket and target bucket are the same bucket, additional logs are created for the logs that are written to the bucket. The extra logs about logs might make it harder to find the log that you are looking for. This configuration would drastically increase the size of the S3 bucket.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q57-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/s3-server-access-logs-same-bucket/\">https://aws.amazon.com/premiumsupport/knowledge-center/s3-server-access-logs-same-bucket/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Erroneous Bucket policies for batch uploads can sometimes be responsible for the exponential growth of S3 Bucket size</strong> - This is an incorrect statement. A bucket policy is a resource-based AWS Identity and Access Management (IAM) policy. You add a bucket policy to a bucket to grant other AWS accounts or IAM users access permissions for the bucket and the objects in it. A bucket policy, for batch processes or normal processes, will not increase the size of the bucket or the objects in it.</p>\n\n<p><strong>A DDOS attack on your S3 bucket can potentially blow up the size of data in the bucket if the bucket security is compromised during the attack</strong> - This is an incorrect statement. AWS handles DDoS attacks on all of its managed services. However, a DDoS attack will not increase the size of the bucket.</p>\n\n<p><strong>Object Encryption has been enabled and each object is stored twice as part of this configuration</strong> - Encryption does not increase a bucket's size, that too, on daily basis, as if the case in the current scenario</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/dev/ServerLogs.html\">https://docs.aws.amazon.com/AmazonS3/latest/dev/ServerLogs.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonS3/latest/user-guide/set-permissions.html\">https://docs.aws.amazon.com/AmazonS3/latest/user-guide/set-permissions.html</a></p>\n","answers":["<p>Erroneous Bucket policies for batch uploads can sometimes be responsible for the exponential growth of S3 Bucket size</p>","<p>A DDoS attack on your S3 bucket can potentially blow up the size of data in the bucket if the bucket security is compromised during the attack</p>","<p>Object Encryption has been enabled and each object is stored twice as part of this configuration</p>","<p>S3 access logging is pointing to the same bucket and is responsible for the substantial growth of bucket size</p>"]},"correct_response":["d"],"section":"Troubleshooting and Optimization","question_plain":"A company has created an Amazon S3 bucket that holds customer data. The team lead has just enabled access logging to this bucket. The bucket size has grown substantially after starting access logging. Since no new files have been added to the bucket, the perplexed team lead is looking for an answer.\n\nWhich of the following reasons explains this behavior?","related_lectures":[]},{"_class":"assessment","id":129582351,"assessment_type":"multiple-choice","prompt":{"relatedLectureIds":"","answers":["<p>Use AWS Data Pipeline to export your table to an S3 bucket in the account of your choice and download locally</p>","<p>Use Hive with Amazon EMR to export your data to an S3 bucket and download locally</p>","<p>Use AWS Glue to copy your table to Amazon S3 and download locally</p>","<p>Use the DynamoDB on-demand backup capability to write to Amazon S3 and download locally</p>"],"question":"<p>A diagnostic lab stores its data on DynamoDB. The lab wants to backup a particular DynamoDB table data on Amazon S3, so it can download the S3 backup locally for some operational use.</p>\n\n<p>Which of the following options is NOT feasible?</p>\n","explanation":"<p>Correct option:</p>\n\n<p><strong>Use the DynamoDB on-demand backup capability to write to Amazon S3 and download locally</strong> - This option is not feasible for the given use-case. DynamoDB has two built-in backup methods (On-demand, Point-in-time recovery) that write to Amazon S3, but you will not have access to the S3 buckets that are used for these backups.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-dva-pt/assets/pt2-q58-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/premiumsupport/knowledge-center/back-up-dynamodb-s3/\">https://aws.amazon.com/premiumsupport/knowledge-center/back-up-dynamodb-s3/</a></p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use AWS Data Pipeline to export your table to an S3 bucket in the account of your choice and download locally</strong> - This is the easiest method. This meth
