dbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Migrate the order data to Amazon DynamoDB and create a global table. Deploy the application in each Region and connect to the local DynamoDB replica for low-latency access</strong></p>\n\n<p>Amazon DynamoDB global tables are a fully managed, multi-Region, multi-writer database solution designed to deliver low-latency performance and high availability for globally distributed applications. In this architecture, a DynamoDB table is created in one Region and replicated automatically to other specified AWS Regions. Each replica behaves as a fully functional table, capable of handling both reads and writes locally. This setup allows regional deployments of the application to interact with the local replica of the database, minimizing cross-Region latency and avoiding the need to route write requests to a single centralized Region. Updates made to any Region’s table are asynchronously propagated to all other Regions with typical replication latency under 1 second, satisfying the application's performance requirement.</p>\n\n<p>This solution also eliminates the need to manage complex replication logic, ensures high resilience against Regional failures, and provides seamless multi-active availability—allowing each Region to continue operating independently even if another Region experiences disruption.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon RDS for MySQL with a cross-Region read replica. Route all writes to the primary Region and use read replicas for local access in other Regions</strong> - Using RDS MySQL with read replicas in different Regions allows users to perform read queries from geographically closer endpoints. However, all write operations must be handled by the single primary instance located in the original Region, which violates the latency requirement for updates. Furthermore, replication across Regions is asynchronous, which introduces delay and potential data consistency issues. This approach does not fulfill the global consistency and low-latency write requirement.</p>\n\n<p><strong>Use Amazon Neptune to store tracking updates as graph data. Deploy clusters in each Region and replicate changes using custom-built Lambda functions and Amazon SQS.</strong> - Amazon Neptune is a managed graph database, suitable for highly connected datasets such as social graphs or fraud detection. It does not support multi-Region deployment out of the box, and using custom replication via Lambda and SQS introduces complexity, increased latency, and potential consistency issues. This solution would not meet the company’s needs for a low-latency, replicated write path across Regions.</p>\n\n<p><strong>Use Amazon Aurora database with MySQL engine, and configure read-only nodes in other Regions to handle local traffic while routing all write operations to the central Region</strong> - This architecture enables low-latency reads from secondary Regions by using Aurora Global Database read-only replicas. However, it restricts write operations to the primary Region only, meaning any update to the order database must still be processed in the central Region. This introduces latency for global users and fails to meet the requirement for sub-second update performance from all Regions. Additionally, the system doesn't support multi-Region active-active writes or built-in conflict resolution.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html\">https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/GlobalTables.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.XRgn.html\">https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/USER_ReadRepl.XRgn.html</a></p>\n","answers":["<p>Migrate the order data to Amazon DynamoDB and create a global table. Deploy the application in each Region and connect to the local DynamoDB replica for low-latency access</p>","<p>Use Amazon RDS for MySQL with a cross-Region read replica. Route all writes to the primary Region and use read replicas for local access in other Regions</p>","<p>Use Amazon Neptune to store tracking updates as graph data. Deploy clusters in each Region and replicate changes using custom-built Lambda functions and Amazon SQS.</p>","<p>Use Amazon Aurora database with MySQL engine, and configure read-only nodes in other Regions to handle local traffic while routing all write operations to the central Region</p>"]},"correct_response":["a"],"section":"Design High-Performing Architectures","question_plain":"A global e-commerce platform currently operates its order processing system in a single on-premises data center located in Europe. As the company grows its customer base across Asia and North America, it plans to deploy the application across multiple AWS Regions to improve availability and reduce latency. The company requires that updates to the central order database be completed in under one second with global consistency. The application layer will be deployed separately in each Region, but the order management data must remain centrally managed and globally synchronized.\n\nWhich solution should a solutions architect recommend to meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638835,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial data processing company runs a workload on Amazon EC2 instances that fetch and process real-time transaction batches from an Amazon SQS queue. The application needs to scale based on unpredictable message volume, which fluctuates significantly throughout the day. The system must process messages with minimal delay and no downtime, even during peak spikes. The company is seeking a solution that balances cost-efficiency with availability and elasticity.</p>\n\n<p>Which EC2 purchasing strategy best meets these requirements in the most cost-effective manner?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Reserved Instances for the baseline level of traffic and configure EC2 Auto Scaling with Spot Instances to handle spikes in message volume</strong></p>\n\n<p>This blended approach is ideal for workloads that are partially predictable and partially variable. Reserved Instances ensure cost-efficient baseline capacity for steady message ingestion, while Spot Instances are used to handle unpredictable surges in traffic, significantly reducing costs compared to On-Demand. If Spot capacity is unavailable, Auto Scaling can be configured with fallback instance types or prioritized mixed instance policies. This model maximizes cost savings without compromising on availability.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Purchase EC2 Reserved Instances to match peak capacity and assign all message processing tasks to these instances regardless of load variations</strong> - While Reserved Instances (RIs) offer significant cost savings compared to On-Demand pricing, they are best suited for predictable, steady-state workloads. Using RIs to provision maximum capacity at all times, regardless of actual load, results in over-provisioning and wasted cost during low-traffic periods. This approach lacks elasticity and is not suitable for workloads with unpredictable and bursty traffic patterns.</p>\n\n<p><strong>Use EC2 Spot Instances exclusively with Auto Scaling enabled to match message volume fluctuations and save on compute costs</strong> - Spot Instances provide deep cost savings, but they can be interrupted by AWS with only two minutes of warning if capacity is reclaimed. Using them exclusively for a mission-critical workload with real-time, parallel processing introduces risk of downtime and message loss, especially if traffic spikes coincide with Spot interruptions. For fault-tolerant or batch jobs, this could work—but not for always-on processing with strict uptime requirements.</p>\n\n<p><strong>Use EC2 Reserved Instances for the baseline workload and configure EC2 Auto Scaling to launch On-Demand Instances for all traffic spikes</strong> - While combining Reserved Instances for baseline capacity with On-Demand Instances for additional traffic is a functional and reliable solution, it is not the most cost-effective choice for a workload with unpredictable, intermittent spikes like real-time message processing. On-Demand Instances are priced at a premium and can lead to significantly higher costs when scaling frequently. A blended model using Reserved + Spot Instances would better balance availability and cost.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-mixed-instances-groups.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/ec2-auto-scaling-mixed-instances-groups.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html\">https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html\">https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html</a></p>\n","answers":["<p>Purchase EC2 Reserved Instances to match peak capacity and assign all message processing tasks to these instances regardless of load variations</p>","<p>Use EC2 Spot Instances exclusively with Auto Scaling enabled to match message volume fluctuations and save on compute costs</p>","<p>Use Reserved Instances for the baseline level of traffic and configure EC2 Auto Scaling with Spot Instances to handle spikes in message volume</p>","<p>Use EC2 Reserved Instances for the baseline workload and configure EC2 Auto Scaling to launch On-Demand Instances for all traffic spikes</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A financial data processing company runs a workload on Amazon EC2 instances that fetch and process real-time transaction batches from an Amazon SQS queue. The application needs to scale based on unpredictable message volume, which fluctuates significantly throughout the day. The system must process messages with minimal delay and no downtime, even during peak spikes. The company is seeking a solution that balances cost-efficiency with availability and elasticity.\n\nWhich EC2 purchasing strategy best meets these requirements in the most cost-effective manner?","related_lectures":[]},{"_class":"assessment","id":156638837,"assessment_type":"multiple-choice","prompt":{"question":"<p>A health-care company manages its web application on Amazon EC2 instances running behind Auto Scaling group (ASG). The company provides ambulances for critical patients and needs the application to be reliable. The workload of the company can be managed on 2 Amazon EC2 instances and can peak up to 6 instances when traffic increases.</p>\n\n<p>As a Solutions Architect, which of the following configurations would you select as the best fit for these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6</strong></p>\n\n<p>You configure the size of your Auto Scaling group by setting the minimum, maximum, and desired capacity. The minimum and maximum capacity are required to create an Auto Scaling group, while the desired capacity is optional. If you do not define your desired capacity upfront, it defaults to your minimum capacity.</p>\n\n<p>Amazon EC2 Auto Scaling enables you to take advantage of the safety and reliability of geographic redundancy by spanning Auto Scaling groups across multiple Availability Zones within a Region. When one Availability Zone becomes unhealthy or unavailable, Auto Scaling launches new instances in an unaffected Availability Zone. When the unhealthy Availability Zone returns to a healthy state, Auto Scaling automatically redistributes the application instances evenly across all of the designated Availability Zones. Since the application is extremely critical and needs to have a reliable architecture to support it, the Amazon EC2 instances should be maintained in at least two Availability Zones (AZs) for uninterrupted service.</p>\n\n<p>Amazon EC2 Auto Scaling attempts to distribute instances evenly between the Availability Zones that are enabled for your Auto Scaling group. This is why the minimum capacity should be 4 instances and not 2. Auto Scaling group will launch 2 instances each in both the AZs and this redundancy is needed to keep the service available always.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The Auto Scaling group should be configured with the minimum capacity set to 2, with 1 instance each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6</strong></p>\n\n<p><strong>The Auto Scaling group should be configured with the minimum capacity set to 2 and the maximum capacity set to 6 in a single Availability Zone</strong></p>\n\n<p>The explanation above gives the correct rationale for minimum capacity as well as the instance distribution across AZs, so both these options are incorrect.</p>\n\n<p><strong>The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different AWS Regions. The maximum capacity of the Auto Scaling group should be set to 6</strong> - An Auto Scaling group can contain Amazon EC2 instances in one or more Availability Zones within the same region. However, Auto Scaling groups cannot span multiple Regions.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html\">https://docs.aws.amazon.com/autoscaling/ec2/userguide/auto-scaling-benefits.html</a></p>\n","answers":["<p>The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6</p>","<p>The Auto Scaling group should be configured with the minimum capacity set to 2, with 1 instance each in two different Availability Zones. The maximum capacity of the Auto Scaling group should be set to 6</p>","<p>The Auto Scaling group should be configured with the minimum capacity set to 2 and the maximum capacity set to 6 in a single Availability Zone</p>","<p>The Auto Scaling group should be configured with the minimum capacity set to 4, with 2 instances each in two different AWS Regions. The maximum capacity of the Auto Scaling group should be set to 6</p>"]},"correct_response":["a"],"section":"Design Resilient Architectures","question_plain":"A health-care company manages its web application on Amazon EC2 instances running behind Auto Scaling group (ASG). The company provides ambulances for critical patients and needs the application to be reliable. The workload of the company can be managed on 2 Amazon EC2 instances and can peak up to 6 instances when traffic increases.\n\nAs a Solutions Architect, which of the following configurations would you select as the best fit for these requirements?","related_lectures":[]},{"_class":"assessment","id":156638839,"assessment_type":"multiple-choice","prompt":{"question":"<p>A biomedical research firm operates a file exchange system for external research partners to upload and download experimental data. Currently, the system runs on two Amazon EC2 Linux instances, each configured with Elastic IP addresses to allow access from trusted IPs. File transfers use the SFTP protocol, and Linux user accounts are manually provisioned to enforce file-level access control. Data is stored on a shared file system mounted to both EC2 instances. The firm wants to modernize the solution to a fully managed, serverless model with high IOPS, fine-grained user permission control, and strict IP-based access restrictions. They also want to reduce operational overhead without sacrificing performance or security.</p>\n\n<p>Which solution best meets these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon EFS with encryption enabled. Create an AWS Transfer Family SFTP endpoint in a VPC with Elastic IP addresses. Restrict access using a security group that allows traffic only from known IPs. Manage user access using POSIX identity mappings and IAM policies</strong></p>\n\n<p>This solution uses Amazon EFS, which is natively supported by AWS Transfer Family and provides shared, low-latency, and scalable file storage, ideal for high IOPS use cases. Creating the SFTP endpoint within a VPC with Elastic IP addresses allows secure, internet-facing access. Using IAM policies and POSIX user ID mappings, administrators can enforce per-user access control, similar to Linux user permissions. The security group restricts SFTP access to trusted IP addresses. This configuration satisfies all the company’s performance, security, and manageability goals in a serverless architecture.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon FSx for Lustre as the backend storage. Create an AWS Transfer Family SFTP service with a public endpoint. Configure IAM policies to manage user access and attach a security group that restricts access to trusted IP addresses</strong> - While Amazon FSx for Lustre offers high-performance, POSIX-compliant storage, it is not natively integrated with AWS Transfer Family as a backend for SFTP services. Transfer Family only supports Amazon S3 and Amazon EFS as data stores. This option would require complex, unsupported workarounds to integrate FSx, making it operationally risky and unsupported.</p>\n\n<p><strong>Use AWS Storage Gateway in file gateway mode to expose an NFS file share. Deploy AWS Transfer Family with a public endpoint and map user identities using IAM roles. Configure IP allow lists using AWS WAF</strong> - AWS Storage Gateway (file gateway mode) allows access to S3 via NFS or SMB but is not natively integrated with AWS Transfer Family. Although it supports on-premises caching and hybrid workloads, using it in this context introduces unnecessary complexity and cannot meet the requirement for native SFTP integration with a serverless backend. AWS WAF is also not applicable for SFTP traffic, as it operates on Layer 7 HTTP(S) protocols.</p>\n\n<p><strong>Use Amazon S3 with server-side encryption enabled. Create an AWS Transfer Family SFTP endpoint with a VPC endpoint in a private subnet. Restrict access to known IPs using security group rules. Manage user-level permissions using IAM role-based access mappings</strong> - While Amazon S3 is a supported backend for AWS Transfer Family and offers excellent scalability and durability, it does not offer file system semantics or the high IOPS required by workloads involving frequent reads/writes like SFTP-based workflows. S3 performance is sufficient for bulk transfer or archiving, but EFS is a better choice for interactive file exchange with low latency and high throughput. This solution satisfies access control requirements but falls short on performance.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html\">https://docs.aws.amazon.com/transfer/latest/userguide/what-is-aws-transfer-family.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html\">https://docs.aws.amazon.com/filegateway/latest/files3/what-is-file-s3.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html\">https://docs.aws.amazon.com/fsx/latest/LustreGuide/what-is.html</a></p>\n","answers":["<p>Use Amazon EFS with encryption enabled. Create an AWS Transfer Family SFTP endpoint in a VPC with Elastic IP addresses. Restrict access using a security group that allows traffic only from known IPs. Manage user access using POSIX identity mappings and IAM policies</p>","<p>Use Amazon FSx for Lustre as the backend storage. Create an AWS Transfer Family SFTP service with a public endpoint. Configure IAM policies to manage user access and attach a security group that restricts access to trusted IP addresses</p>","<p>Use AWS Storage Gateway in file gateway mode to expose an NFS file share. Deploy AWS Transfer Family with a public endpoint and map user identities using IAM roles. Configure IP allow lists using AWS WAF</p>","<p>Use Amazon S3 with server-side encryption enabled. Create an AWS Transfer Family SFTP endpoint with a VPC endpoint in a private subnet. Restrict access to known IPs using security group rules. Manage user-level permissions using IAM role-based access mappings</p>"]},"correct_response":["a"],"section":"Design Secure Architectures","question_plain":"A biomedical research firm operates a file exchange system for external research partners to upload and download experimental data. Currently, the system runs on two Amazon EC2 Linux instances, each configured with Elastic IP addresses to allow access from trusted IPs. File transfers use the SFTP protocol, and Linux user accounts are manually provisioned to enforce file-level access control. Data is stored on a shared file system mounted to both EC2 instances. The firm wants to modernize the solution to a fully managed, serverless model with high IOPS, fine-grained user permission control, and strict IP-based access restrictions. They also want to reduce operational overhead without sacrificing performance or security.\n\nWhich solution best meets these requirements?","related_lectures":[]},{"_class":"assessment","id":156638841,"assessment_type":"multi-select","prompt":{"question":"<p>While troubleshooting, a cloud architect realized that the Amazon EC2 instance is unable to connect to the internet using the Internet Gateway.</p>\n\n<p>Which conditions should be met for internet connectivity to be established? (Select two)</p>\n","relatedLectureIds":"","feedbacks":["","","","",""],"explanation":"<p>Correct options:</p>\n\n<p><strong>The network access control list (network ACL) associated with the subnet must have rules to allow inbound and outbound traffic</strong></p>\n\n<p>The network access control list (network ACL) that is associated with the subnet must have rules to allow inbound and outbound traffic on port 80 (for HTTP traffic) and port 443 (for HTTPs traffic). This is a necessary condition for Internet Gateway connectivity.</p>\n\n<p><strong>The route table in the instance’s subnet should have a route to an Internet Gateway</strong></p>\n\n<p>A route table contains a set of rules, called routes, that are used to determine where network traffic from your subnet or gateway is directed. The route table in the instance’s subnet should have a route defined to the Internet Gateway.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>The instance's subnet is not associated with any route table</strong> - This is an incorrect statement. A subnet is implicitly associated with the main route table if it is not explicitly associated with a particular route table. So, a subnet is always associated with some route table.</p>\n\n<p><strong>The instance's subnet is associated with multiple route tables with conflicting configurations</strong> - This is an incorrect statement. A subnet can only be associated with one route table at a time.</p>\n\n<p><strong>The subnet has been configured to be public and has no access to the internet</strong> - This is an incorrect statement. Public subnets have access to the internet via Internet Gateway.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html\">https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html</a></p>\n","answers":["<p>The instance's subnet is not associated with any route table</p>","<p>The network access control list (network ACL) associated with the subnet must have rules to allow inbound and outbound traffic</p>","<p>The instance's subnet is associated with multiple route tables with conflicting configurations</p>","<p>The route table in the instance’s subnet should have a route to an Internet Gateway</p>","<p>The subnet has been configured to be public and has no access to the internet</p>"]},"correct_response":["b","d"],"section":"Design Secure Architectures","question_plain":"While troubleshooting, a cloud architect realized that the Amazon EC2 instance is unable to connect to the internet using the Internet Gateway.\n\nWhich conditions should be met for internet connectivity to be established? (Select two)","related_lectures":[]},{"_class":"assessment","id":156638843,"assessment_type":"multiple-choice","prompt":{"question":"<p>A financial analytics firm runs performance-intensive modeling software on Amazon EC2 instances backed by Amazon EBS volumes. The production data resides on EBS volumes attached to EC2 instances in the same AWS Region where the testing environment is hosted. To maintain data integrity, any changes made during testing must not affect production data. The development team needs to frequently create clones of this production data for simulations. The modeling software requires high and consistent I/O performance, and the firm wants to minimize the time required to provision test data.</p>\n\n<p>Which solution should a solutions architect recommend to meet these requirements?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Take snapshots of the production EBS volumes. Enable EBS fast snapshot restore on the snapshots. Create new EBS volumes from the snapshots and attach them to EC2 instances in the test environment</strong></p>\n\n<p>This solution uses EBS fast snapshot restore (FSR), which allows immediate, full-performance access to new EBS volumes created from snapshots—eliminating the usual initialization delay. Creating volumes from snapshots ensures that test data is logically cloned without impacting the source, and the FSR feature guarantees the I/O performance required by the analytics workloads. This method is efficient, scalable, and preserves isolation between test and production environments.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Create Amazon EBS-backed Amazon Machine Images (AMIs) from the production EC2 instances. Launch new EC2 instances in the test environment from the AMIs. Use Amazon EC2 instance store volumes for temporary simulation data</strong> - While AMIs do provide a fast way to clone EC2 instances, EBS-backed AMIs are optimized for instance bootstrapping, not large-scale data cloning or simulation. Additionally, using instance store volumes for high I/O operations is risky, as they are ephemeral and can be lost on stop/terminate. This setup doesn't offer the persistent high-performance storage required for consistent simulation workloads and would not scale well for repeated cloning needs.</p>\n\n<p><strong>Create new EBS volumes in the test environment and use AWS Backup to perform a backup job of the production volumes. Restore the backup directly to the test EBS volumes to begin simulations</strong> - While AWS Backup supports backing up and restoring EBS volumes, it is designed for data protection and compliance use cases, not for rapid, low-latency cloning. The process of creating a backup job and restoring to new volumes adds significant delay and operational overhead compared to using native EBS snapshots with fast snapshot restore. Additionally, AWS Backup does not provide the same flexibility or speed when initiating volume restoration, especially when frequent or automated cloning is required. This approach does not meet the goal of minimizing the time to clone data for performance-critical testing.</p>\n\n<p><strong>Use Amazon EBS io2 volumes with Multi-Attach enabled. Attach the same production EBS volumes to both the production and test EC2 instances simultaneously to avoid cloning delays and ensure high IOPS performance</strong> - While Amazon EBS Multi-Attach allows an io1 or io2 volume to be attached to multiple EC2 instances within the same Availability Zone, it is designed for use in clustered, coordinated applications (such as shared-disk file systems or clustered databases). Attaching the same production volume to both production and test environments introduces the risk of uncoordinated writes, data corruption, and unexpected state changes, especially since the requirement explicitly states that test modifications must not impact production data. Additionally, Multi-Attach does not eliminate the need for cloning, it merely provides concurrent access, which is unsuitable for isolated test simulations.</p>\n\n<p>References:</p>\n\n<p><a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html\">https://docs.aws.amazon.com/ebs/latest/userguide/ebs-fast-snapshot-restore.html</a></p>\n\n<p><a href=\"https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html\">https://docs.aws.amazon.com/ebs/latest/userguide/ebs-volumes-multi.html</a></p>\n","answers":["<p>Create Amazon EBS-backed Amazon Machine Images (AMIs) from the production EC2 instances. Launch new EC2 instances in the test environment from the AMIs. Use Amazon EC2 instance store volumes for temporary simulation data</p>","<p>Create new EBS volumes in the test environment and use AWS Backup to perform a backup job of the production volumes. Restore the backup directly to the test EBS volumes to begin simulations</p>","<p>Take snapshots of the production EBS volumes. Enable EBS fast snapshot restore on the snapshots. Create new EBS volumes from the snapshots and attach them to EC2 instances in the test environment</p>","<p>Use Amazon EBS io2 volumes with Multi-Attach enabled. Attach the same production EBS volumes to both the production and test EC2 instances simultaneously to avoid cloning delays and ensure high IOPS performance</p>"]},"correct_response":["c"],"section":"Design High-Performing Architectures","question_plain":"A financial analytics firm runs performance-intensive modeling software on Amazon EC2 instances backed by Amazon EBS volumes. The production data resides on EBS volumes attached to EC2 instances in the same AWS Region where the testing environment is hosted. To maintain data integrity, any changes made during testing must not affect production data. The development team needs to frequently create clones of this production data for simulations. The modeling software requires high and consistent I/O performance, and the firm wants to minimize the time required to provision test data.\n\nWhich solution should a solutions architect recommend to meet these requirements?","related_lectures":[]},{"_class":"assessment","id":156638845,"assessment_type":"multiple-choice","prompt":{"question":"<p>The engineering team at a weather tracking company wants to enhance the performance of its relational database and is looking for a caching solution that supports geospatial data.</p>\n\n<p>As a solutions architect, which of the following solutions will you suggest?</p>\n","relatedLectureIds":"","feedbacks":["","","",""],"explanation":"<p>Correct option:</p>\n\n<p><strong>Use Amazon ElastiCache for Redis</strong></p>\n\n<p>Amazon ElastiCache is a web service that makes it easy to set up, manage, and scale a distributed in-memory data store or cache environment in the cloud. Redis, which stands for Remote Dictionary Server, is a fast, open-source, in-memory key-value data store for use as a database, cache, message broker, and queue. Redis now delivers sub-millisecond response times enabling millions of requests per second for real-time applications in Gaming, Ad-Tech, Financial Services, Healthcare, and IoT. Redis is a popular choice for caching, session management, gaming, leaderboards, real-time analytics, geospatial, ride-hailing, chat/messaging, media streaming, and pub/sub apps.</p>\n\n<p>All Redis data resides in the server’s main memory, in contrast to databases such as PostgreSQL, Cassandra, MongoDB and others that store most data on disk or on SSDs. In comparison to traditional disk based databases where most operations require a roundtrip to disk, in-memory data stores such as Redis don’t suffer the same penalty. They can therefore support an order of magnitude more operations and faster response times. The result is – blazing fast performance with average read or write operations taking less than a millisecond and support for millions of operations per second.</p>\n\n<p>Redis has purpose-built commands for working with real-time geospatial data at scale. You can perform operations like finding the distance between two elements (for example people or places) and finding all elements within a given distance of a point.</p>\n\n<p>Incorrect options:</p>\n\n<p><strong>Use Amazon ElastiCache for Memcached</strong> - Both Redis and MemCached are in-memory, open-source data stores. Memcached, a high-performance distributed memory cache service, is designed for simplicity while Redis offers a rich set of features that make it effective for a wide range of use cases. Memcached does not offer support for geospatial data.</p>\n\n<p><img src=\"https://assets-pt.media.datacumulus.com/aws-saa-pt/assets/pt5-q65-i1.jpg\">\nvia - <a href=\"https://aws.amazon.com/elasticache/redis-vs-memcached/\">https://aws.amazon.com/elasticache/redis-vs-memcached/</a></p>\n\n<p><strong>Use Amazon DynamoDB Accelerator (DAX)</strong> - Amazon DynamoDB Accelerator (DAX) is a fully managed, highly available, in-memory cache for Amazon DynamoDB. DAX does not support relational databases.</p>\n\n<p><strong>Use AWS Global Accelerator</strong> - AWS Global Accelerator is a networking service that helps you improve the availability and performance of the applications that you offer to your global users. This option has been added as a distractor, it has nothing to do with database caching.</p>\n\n<p>Reference:</p>\n\n<p><a href=\"https://aws.amazon.com/elasticache/redis-vs-memcached/\">https://aws.amazon.com/elasticache/redis-vs-memcached/</a></p>\n","answers":["<p>Use Amazon ElastiCache for Memcached</p>","<p>Use Amazon ElastiCache for Redis</p>","<p>Use Amazon DynamoDB Accelerator (DAX)</p>","<p>Use AWS Global Accelerator</p>"]},"correct_response":["b"],"section":"Design High-Performing Architectures","question_plain":"The engineering team at a weather tracking company wants to enhance the performance of its relational database and is looking for a caching solution that supports geospatial data.\n\nAs a solutions architect, which of the following solutions will you suggest?","related_lectures":[]}]};
      let correct = new Set();
      let incorrect = new Set();
      let totalNumberOfQuestions = 0;
      const quizTitle = quizData.quiz_title;
      const quizDescription = quizData.quiz_description;
      const questionData = quizData.questions;
      const passPercent = quizData.pass_percent;
      const modalTextElement = document.getElementById('modal-text');
      const quizContainerElement = document.getElementById('quiz-container');

      const dialog = document.querySelector('dialog');
      const showButton = document.getElementById('view-explanatin');
      const closeButton = document.getElementById('close-modal-btn');
      const quizTitleElement = document.getElementById('quiz-title');
      const quizDescriptionElement = document.getElementById('quiz-description');

      function main() {
        // update quiz meta data
        document.title = quizTitle;
        quizTitleElement.innerHTML = quizTitle;
        quizDescriptionElement.innerHTML = quizDescription;

        const passPercentElement = document.getElementById('pass-percent');
        passPercentElement.innerHTML = passPercent + '%';
        totalNumberOfQuestions = questionData.length;
        // shuffle the questionData to randomize the order of the questions
        for (let i = questionData.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [questionData[i], questionData[j]] = [questionData[j], questionData[i]];
        }

        let formattedQuestions = questionData.map(formatSingleQuestionData);
        updateScore();
        // display the formattedQuestions
        formattedQuestions.forEach((question, idx) => {
          renderSingleQuestion(question, idx + 1);
        });
        // Find all <u-blank> tags
        document.querySelectorAll('u-blank').forEach(blank => {
          const order = blank.getAttribute('data-order');
          console.log({ blank });
          const input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank';
          input.dataset.order = order;
          input.placeholder = 'View Explanation';
          blank.replaceWith(input); // Replace <u-blank> with <input>
        });
      }

      /**
       * Formats the question data from the given QuizData object.
       *
       * @param {Object} singleQuizData - The singleQuizData object containing prompt and correct_response.
       * @return {Object} The formatted question object with the following properties:
       *   - id: The ID of the question.
       *   - question: The text of the question.
       *   - answers: The array of answer options.
       *   - correctAnswer: The text of the correct answer.
       *   - explanation: The explanation of the correct answer.
       */
      function formatSingleQuestionData(singleQuizData = null) {
        const { prompt, correct_response, id } = singleQuizData;
        const questionText = prompt.question;
        const answers = prompt.answers;
        const correctAnswer = correct_response[0];
        // const correctAnswerText = answers[correctAnswer.toLowerCase().charCodeAt(0) - 97];
        const questionObj = {
          id: id,
          question: questionText,
          answers: answers,
          correctAnswer,
          explanation: prompt?.explanation || '',
        };
        return questionObj;
      }

      /**
       * Renders a single question with its options and submit button.
       *
       * @param {Object} singleQuestionData - The data of the question to render.
       * @param {number} rootIndex - The index of the question in the quiz.
       * @return {void} return nothing.
       */

      const renderSingleQuestion = (singleQuestionData = {}, rootIndex = 1) => {
        const { id, explanation, answers, correctAnswer, question } = singleQuestionData;
        // shuffle the answers to randomize the order of the answers
        // for (let i = answers.length - 1; i > 0; i--) {
        //   const j = Math.floor(Math.random() * (i + 1));
        //   [answers[i], answers[j]] = [answers[j], answers[i]];
        // }
        const alphabet = 'abcdefghijklmnopqrstuvwxyz'.split('');
        const optionsHTML = answers
          ? answers
              .map((option, index) => {
                const optionId = `${id}_${index}`;

                return `
        <div class="question-lable">
          <input type="radio" id="${optionId}" name="${'answer'}" value="${alphabet[index]}" />
          <label for="${optionId}">${option}</label>
        </div>
      `;
              })

              .join('')
          : '';

        const container = document.createElement('div');
        container.innerHTML = `
        <form data-correct-answer="${correctAnswer}" data-question-id="${id}" class="single-question-container" onsubmit="submitButtonListener(event)">
          <div style="display: flex;justify-content: space-between;">
            <p style="font-weight: 600">Question ${rootIndex}:</p>
            <button type="button" onclick="renderExplanation(event)" id="${`explanation-${id}`}" data-explanation="${'tt'}" data-explanation-id=${id} class="explanation-btn">View Explanation</button>
          </div>
          <p style="margin-bottom: 8px;line-height: 1.5">${question}</p>
          <div class="options-container">
            ${optionsHTML}
          </div>
          <div style="display: flex; gap: 8px;">
            <button type="submit" id="submit-button" class="button">Submit</button>
          </div>
        </form>
      `;
        quizContainerElement.appendChild(container);
      };

      /**
       * Updates the score on the page based on the number of correct and incorrect answers.
       *
       * @return {void} This function does not return a value.
       */
      function updateScore() {
        const currentParcentageElement = document.getElementById('current-score');
        const correctAnswerElement = document.getElementById('correct-answers');
        const wrongAnswerElement = document.getElementById('wrong-answers');
        correctAnswerElement.innerHTML = correct.size;
        wrongAnswerElement.innerHTML = incorrect.size;
        const score = Number((correct.size / totalNumberOfQuestions) * 100).toFixed(2);
        currentParcentageElement.innerHTML = score;
      }

      /**
       * Handles the event when the submit button is clicked.
       *
       * @param {Event} e - The event object.
       * @return {void} This function does not return anything.
       */
      const submitButtonListener = e => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const form = e.target;
        const selectedOption = e.target.querySelector('input[type="radio"]:checked');
        if (!selectedOption) {
          alert('Please select an answer!');
          return;
        }

        let isCorrect = false;
        const { answer: userAnswer } = Object.fromEntries(formData.entries());
        const correctAnswer = e.target.dataset.correctAnswer;
        const questionId = e.target.dataset.questionId;
        if (userAnswer == correctAnswer) {
          correct.add(questionId);
          incorrect.delete(questionId);
          isCorrect = true;
        } else {
          incorrect.add(e.target.dataset.questionId);
          correct.delete(questionId);
        }
        updateScore();

        const resultClass = isCorrect ? 'correct-answer' : 'incorrect-answer';

        form.querySelectorAll('.question-lable').forEach(label => {
          label.classList.remove('correct-answer', 'incorrect-answer');
        });
        selectedOption.closest('.question-lable').classList.add(resultClass);
      };

      function renderExplanation(ev) {
        const dataid = ev.target.dataset.explanationId;
        const quiz = quizData.questions.find(q => q.id === Number(dataid));
        modalTextElement.innerHTML =
          quiz && quiz.prompt.explanation ? quiz.prompt.explanation : 'no explanation found';
        // modalTextElement.innerHTML = ev.target.dataset?.explanation || 'no explanation found';
        dialog.showModal();
        dialog.addEventListener('click', event => {
          if (event.target === dialog) {
            dialog.close();
          }
        });
      }
    </script>
  </body>
